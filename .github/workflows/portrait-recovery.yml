name: Portrait originals recovery
on:
  push:
    branches: [codex/blue-atlas-ui]
    paths: [.github/workflows/portrait-recovery.yml]
jobs:
  preserve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: portraits-20261004-originals
          path: atlas/assets/portraits/20261004/*.png
          retention-days: 3
          if-no-files-found: error
