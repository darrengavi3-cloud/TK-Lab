name: Recover verified portrait checkpoint
on:
  push:
    branches: [codex/frontal-portraits-20261004]
    paths: [.github/workflows/portrait-checkpoint-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            atlas/assets/portraits/20261004
            research/portrait-additions-20261004
      - name: Package only accepted assets
        run: |
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          p=json.loads(Path('research/portrait-additions-20261004/production-progress.json').read_text())
          rows=p['new']+[r for r in p['existing'] if r.get('productionMethod')=='independent-redraw']
          for part in range(7):
            with zipfile.ZipFile(f'verified-portrait-part-{part}.zip','w',zipfile.ZIP_STORED) as z:
              for r in rows[part*8:(part+1)*8]:
                path=Path(r['path'])
                assert hashlib.sha256(path.read_bytes()).hexdigest()==r['sha256']
                z.write(path,str(path))
          print('Verified accepted assets:',len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-portrait-part-0
          path: verified-portrait-part-0.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: verified-portrait-part-1
          path: verified-portrait-part-1.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: verified-portrait-part-2
          path: verified-portrait-part-2.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: verified-portrait-part-3
          path: verified-portrait-part-3.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: verified-portrait-part-4
          path: verified-portrait-part-4.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: verified-portrait-part-5
          path: verified-portrait-part-5.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: verified-portrait-part-6
          path: verified-portrait-part-6.zip
          retention-days: 1
