name: Verify and recover accepted portrait redraws
on:
  push:
    branches: [codex/frontal-portraits-20261004]
    paths: [.github/workflows/portrait-redraw-checkpoint.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            atlas/assets/portraits/20261004/frontal/portrait-asset-de688a2964451c72e17b-redraw.png
            atlas/assets/portraits/20261004/frontal/portrait-asset-008242744fad9253fdfb-redraw.png
            atlas/assets/portraits/20261004/frontal/portrait-asset-803dce489c98f4df95a1-redraw.png
            atlas/assets/portraits/20261004/frontal/portrait-asset-e257541289123b1f8b12-redraw.png
          sparse-checkout-cone-mode: false
      - name: Verify original bytes and PNG integrity
        run: |
          python - <<'PY'
          import hashlib, json, shutil, struct, zlib
          from pathlib import Path
          expected = {"portrait-asset-de688a2964451c72e17b-redraw.png":"c81e6ac8f3d54d06bd0faf71a1d0ae6abc67299d9b43b6390e475a1d5b38ea37","portrait-asset-008242744fad9253fdfb-redraw.png":"61bad608272eb8beba5eb4412b588b6327dcfeb6627573b8b1c2af29fac3cf08","portrait-asset-803dce489c98f4df95a1-redraw.png":"ef826e567c5448773aa8f2f3faf050a193815d6cdd84d812cfd3e7c1c52699d2","portrait-asset-e257541289123b1f8b12-redraw.png":"be8e1c1a07741a17632fd7534b08ffee725ce7a572df83817b8f2737855a0635"}
          out = Path('recovery')
          out.mkdir()
          records=[]
          for name, digest in expected.items():
              src=Path('atlas/assets/portraits/20261004/frontal')/name
              data=src.read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest, name
              assert data[:8]==b'\x89PNG\r\n\x1a\n', name
              width,height=struct.unpack('>II',data[16:24])
              assert width>=512 and abs(width/height-9/16)<=.03
              offset=8
              found_end=False
              while offset<len(data):
                  length=struct.unpack('>I',data[offset:offset+4])[0]
                  chunk=data[offset+4:offset+8+length]
                  checksum=struct.unpack('>I',data[offset+8+length:offset+12+length])[0]
                  assert zlib.crc32(chunk)&0xffffffff==checksum, name
                  offset+=12+length
                  if chunk[:4]==b'IEND':
                      found_end=True
                      break
              assert found_end and offset==len(data), name
              shutil.copy2(src,out/name)
              records.append(dict(name=name,width=width,height=height,bytes=len(data),sha256=digest))
          (out/'portrait-redraw-005-008.json').write_text(json.dumps(records,indent=2)+'\n')
          print(json.dumps(records))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portrait-redraw-005-008-verified
          path: recovery/
          retention-days: 3
          if-no-files-found: error
