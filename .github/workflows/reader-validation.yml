name: Reader validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
    steps:
      - name: Check out the reviewed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Validate canonical data and the reader build
        run: npm run release:offline
      - name: Require committed canonical projections
        run: git diff --exit-code --stat -- atlas README.md release-metadata/current-release.json release-metadata/reader-bundle.json release-metadata/canonical-sources.lock.json

# This workflow has no Sites credentials and cannot deploy or change access.
# A successful run does not replace the fresh owner-only release gate,
# browser visual acceptance, real-device checks, or a deployment receipt.
