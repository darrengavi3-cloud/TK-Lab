<!doctype html>
<html lang="zh-Hant" data-sgz-theme="laitai-day">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究案卷 · 觀史台</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/legacy/assets/vendor/element-plus/index.css">
<link rel="stylesheet" href="/legacy/assets/ui/tokens.css"><link rel="stylesheet" href="/legacy/assets/ui/base.css"><link rel="stylesheet" href="/legacy/assets/ui/components.css">
<link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/research.css">
<script defer src="/legacy/assets/vendor/vue/vue.global.min.js"></script><script defer src="/legacy/assets/vendor/element-plus/index.full.min.js"></script>
<script type="module" src="/research-client.mjs"></script>
</head>
<body><div id="research" v-cloak>
<header class="admin-header"><a class="wordmark" href="/admin">觀史台</a><span class="header-note">研究案卷</span><div class="header-actions"><el-select v-model="theme" aria-label="外觀主題" @change="setTheme"><el-option label="藍圖清晝" value="laitai-day"></el-option><el-option label="紫調對讀" value="review-paper"></el-option><el-option label="深藍夜讀" value="lamp-night"></el-option></el-select><a href="/admin">資料管理</a></div></header>
<main class="research-shell" :aria-busy="busy">
<div v-if="error" id="research-error" class="notice error" role="alert" tabindex="-1">{{error}}</div><div v-if="message" class="notice" role="status">{{message}}</div>
<p v-if="!ready&&!error" role="status">正在讀取研究工作台…</p>
<div v-if="ready" class="research-layout">
<aside class="people-index" aria-label="人物索引"><details open><summary>選擇人物 <span class="quiet">{{total}} 人</span></summary>
<form class="person-search" novalidate @submit.prevent="search()"><el-input v-model="query" aria-label="搜尋人物" placeholder="姓名或 ID" @compositionstart="composing=true" @compositionend="composing=false"></el-input><el-button native-type="submit" :disabled="composing||busy||loading">搜尋</el-button><el-button v-if="query" @click="clearSearch" :disabled="busy">清除</el-button></form>
<p v-if="loading" role="status">正在搜尋…</p><p v-else-if="!people.length" class="empty">沒有符合的人物，請更換關鍵字或清除搜尋。</p>
<div class="person-results"><button v-for="row in people" :key="row.id" class="person-row" :aria-current="person?.id===row.id?'true':null" :disabled="busy" @click="loadPerson(row)"><strong>{{row.data.name}}</strong><small>{{row.id}}</small></button></div>
<el-pagination v-if="total>40" v-model:current-page="page" :page-size="40" :total="total" layout="prev, next" :disabled="busy" @current-change="search(false)"></el-pagination><p class="quiet">第 {{page}} 頁 · 每頁 40 人</p>
</details></aside>
<div class="dossier">
<section v-if="!graph" class="research-empty"><p class="eyebrow">觀人 · 繫事 · 校證</p><h1>從一位人物開始</h1><p>並列仕宦事件與不同紀年，保留每條記載的出處。選擇人物後，可加入研究材料、保存案卷或匯出考證記錄。</p><a href="/admin">前往資料管理新增人物 →</a></section>
<template v-else>
<nav class="research-breadcrumb" aria-label="閱讀路徑"><el-button @click="returnToReader" :disabled="busy">← 返回人物閱讀</el-button><span>人物 / 私人研究</span></nav>
<div class="section-heading"><div><p class="eyebrow">人物誌 / 私人研究</p><h1>{{title}}</h1><p class="quiet">{{baseRevision?'修訂 '+baseRevision:'新案卷'}} · 資料快照 {{watermark}} <span class="draft-state">{{dirty?'有未保存修改':'與已讀取內容一致'}}</span></p></div></div>
<div class="research-save-summary"><span>{{busy?'正在處理…':conflict?'保存遇到版本衝突':dirty?'有未保存修改':baseRevision?'已保存研究修訂 '+baseRevision:'新案卷尚未保存'}}</span><el-button @click="focusSave" :disabled="busy">前往保存</el-button></div>
<div class="dossier-tools"><el-button :disabled="busy" @click="openFilePicker">載入材料或草稿</el-button><input id="research-file-input" type="file" accept=".json,application/json" hidden :disabled="busy" @change="chooseMaterial" aria-label="載入研究材料或草稿"><el-button :disabled="busy||advancedDirty" @click="exportFile('csv')">匯出編年表</el-button><el-button :disabled="busy||advancedDirty" @click="exportFile('html')">匯出完整案卷</el-button><el-button :disabled="busy||advancedDirty" @click="exportFile('json')">匯出草稿 JSON</el-button></div>
<section v-if="material" class="panel material-preview" aria-label="材料匯入預覽"><h2>{{material.title}}</h2><p>{{material.events.length}} 個事件 · {{material.sources.length}} 份原始材料。全部以「待核」狀態加入，不自動採定年份或連續任期。</p><p class="quiet">材料人物：{{material.subjectName}}。目前案卷：{{person.data.name}}（{{person.id}}）。</p><el-checkbox v-model="materialConfirmed" :disabled="busy">我已確認材料對應目前人物</el-checkbox><p class="field-help">加入後，原材料會保存至私有史料庫；案卷修改仍需另行保存。</p><el-button type="primary" :disabled="!materialConfirmed||busy||advancedDirty" :loading="importBusy" @click="importMaterial">加入案卷</el-button><el-button :disabled="busy" @click="material=null">取消</el-button></section>
<div class="research-workspace" :class="{'has-evidence':tab==='events'||tab==='tenures'}">
<el-tabs v-model="tab" @tab-change="syncUrl" class="dossier-tabs">
<el-tab-pane :label="'事件編年 · '+graph.events.length" name="events">
<div class="event-toolbar"><el-input v-model="eventFilter" aria-label="篩選案卷事件" placeholder="搜尋事件或原紀年" clearable></el-input><el-select v-model="eventKind" aria-label="事件性質篩選" clearable placeholder="所有性質"><el-option v-for="(label,key) in eventNames" :key="key" :value="key" :label="label"></el-option></el-select><el-button @click="addEvent" :disabled="busy||advancedDirty">新增事件</el-button></div>
<div class="research-split" :class="{'detail-open':mobileDetail}"><section class="event-list" aria-label="案卷事件"><p class="field-help">依記錄順序排列，未知紀年保留原文。</p><p v-if="!visibleEvents.length" class="empty">{{graph.events.length?'沒有符合的事件。請清除篩選。':'尚無事件。可以載入材料或新增事件。'}}</p><button v-for="event in visibleEvents" :key="event.id" :id="'event-'+event.id" class="event-row" :aria-current="selectedEvent===event.id?'true':null" :disabled="busy" @click="selectEvent(event)"><span class="event-year">{{eventDates(graph,event.id)}}</span><strong>{{event.original}}</strong><small>{{eventNames[event.type]}}</small></button></section>
<section class="research-editor" aria-label="事件詳情"><template v-if="currentEvent"><button class="mobile-back" @click="backToList">← 返回事件列表</button><h2 id="event-title" tabindex="-1">事件記錄</h2><el-form label-position="top" :disabled="busy||advancedDirty" @submit.prevent>
<el-form-item label="事項原文"><el-input type="textarea" v-model="currentEvent.original" :autosize="{minRows:2,maxRows:12}" aria-label="事項原文"></el-input></el-form-item>
<div class="field-grid"><el-form-item label="事件性質"><el-select v-model="currentEvent.type" aria-label="事件性質"><el-option v-for="(label,key) in eventNames" :key="key" :value="key" :label="label"></el-option></el-select></el-form-item><el-form-item label="關聯任職"><el-select v-model="currentEvent.tenureIds" multiple aria-label="關聯任職" placeholder="可以暫不關聯"><el-option v-for="t in graph.tenures" :key="t.id" :value="t.id" :label="t.officeNameOriginal+' · '+t.id"></el-option></el-select></el-form-item></div>
<div class="subheading"><h3>紀年說法</h3><el-button @click="addDate">增加異說</el-button></div><p class="field-help">每種紀年分開記錄。數字只用於檢索；原文、推定依據與史實狀態分別保留。</p>
<article v-for="(claim,index) in currentClaims" :key="claim.id" class="claim-editor"><template v-if="claim.content.type==='event-date'"><h3>記載 {{index+1}} <span class="assessment">{{assessmentNames[claim.assessment]}}</span></h3><el-form-item label="原始紀年"><el-input v-model="claim.content.value.original" :aria-label="'原始紀年 '+(index+1)"></el-input></el-form-item><div class="field-grid"><el-form-item label="最早可能年份"><el-input-number v-model="claim.content.value.earliestYear" :value-on-clear="null" :controls="false" :min="-5000" :max="5000" :precision="0" :aria-label="'最早可能年份 '+(index+1)" @change="dateChanged(claim)"></el-input-number></el-form-item><el-form-item label="最晚可能年份"><el-input-number v-model="claim.content.value.latestYear" :value-on-clear="null" :controls="false" :min="-5000" :max="5000" :precision="0" :aria-label="'最晚可能年份 '+(index+1)" @change="dateChanged(claim)"></el-input-number></el-form-item></div>
<div class="field-grid"><el-form-item label="紀年依據"><el-select v-model="claim.content.value.certainty" :aria-label="'紀年依據 '+(index+1)"><el-option label="未知" value="unknown"></el-option><el-option label="明載" value="explicit"></el-option><el-option label="推定" value="inferred"></el-option></el-select></el-form-item><el-form-item label="史實狀態"><el-select v-model="claim.assessment" :aria-label="'史實狀態 '+(index+1)"><el-option v-for="(label,key) in assessmentNames" :key="key" :value="key" :label="label"></el-option></el-select></el-form-item></div>
<el-form-item label="換算或推定依據"><el-input type="textarea" v-model="claim.content.value.basis" :autosize="{minRows:2,maxRows:8}" :aria-label="'換算或推定依據 '+(index+1)"></el-input></el-form-item><el-form-item label="說法性質"><el-select v-model="claim.derivation" :aria-label="'說法性質 '+(index+1)"><el-option label="材料直接記載" value="direct"></el-option><el-option label="研究推論" value="inferred"></el-option></el-select></el-form-item><el-form-item label="研究理由"><el-input type="textarea" v-model="claim.rationale" :autosize="{minRows:2,maxRows:12}" :aria-label="'研究理由 '+(index+1)"></el-input></el-form-item>
<el-form-item label="支持材料"><el-select multiple :model-value="evidenceKeys(claim)" @update:model-value="selectEvidence(claim,$event)" :aria-label="'支持材料 '+(index+1)" placeholder="選擇固定版本引文"><el-option v-for="source in sources" :key="sourceKey(source)" :value="sourceKey(source)" :label="source.data.title+' · '+source.data.locator+' · 修訂 '+source.pin.revision"></el-option></el-select></el-form-item><p v-for="ref in claimSources(claim).filter(ref=>ref.evidence.role!=='support')" :key="ref.evidence.id" class="field-help">{{ref.evidence.role==='counter'?'反證':'待分類異文'}}：{{ref.source?.data.title||ref.evidence.source.id}} · {{ref.evidence.note}}</p><el-button @click="compareClaim(claim)" :disabled="!evidenceKeys(claim).length">並讀支持材料</el-button></template></article>
<el-form-item label="採用紀年"><el-select v-model="currentEvent.dateClaimId" clearable :value-on-clear="null" aria-label="採用紀年" placeholder="保留異說，暫不採定"><el-option v-for="claim in currentClaims" :key="claim.id" :value="claim.id" :disabled="claim.assessment!=='verified'" :label="claimText(graph,claim.id)+' · '+assessmentNames[claim.assessment]"></el-option></el-select></el-form-item><p class="field-help">只有已核記載可被採用；未採用的說法繼續保留。</p>
</el-form></template><p v-else class="empty">選擇一項事件查看原文、紀年與證據。</p></section></div>
<section v-if="graph.factualConflicts.length" class="conflict-notes"><h2>案卷中的異說</h2><article v-for="conflict in graph.factualConflicts" :key="conflict.id"><p>{{conflict.note}}</p><p class="quiet">{{conflict.claimIds.map(id=>claimText(graph,id)).join(' ／ ')}}</p></article></section>
</el-tab-pane>
<el-tab-pane :label="'任職 · '+graph.tenures.length" name="tenures"><p class="field-help">任職身份與事件分開保存。舊起訖年尚未解譯時，不直接判定連續在任。</p><div class="year-query"><el-input v-model="year" aria-label="查詢在任年份" placeholder="公元年份，例如 260"></el-input><el-button :disabled="busy||advancedDirty" @click="queryYear">查詢在任依據</el-button></div><div v-if="yearResult" class="panel"><h2>{{yearResult.year}} 年</h2><p v-for="row in yearResult.results" :key="row.tenureId">{{graph.tenures.find(t=>t.id===row.tenureId)?.officeNameOriginal}}：{{presenceNames[row.status]}}。{{row.reason}}</p><p class="field-help">該年見任，不表示整年或前後年份皆在任。</p></div>
<div class="research-split" :class="{'detail-open':mobileDetail}"><section class="event-list" aria-label="任職列表"><button v-for="tenure in graph.tenures" :key="tenure.id" class="event-row" :aria-current="selectedTenure===tenure.id?'true':null" @click="selectTenure(tenure.id)"><strong>{{tenure.officeNameOriginal}}</strong><small>{{tenure.polityOriginal}} · {{tenure.natureOriginal}}</small></button><p v-if="!graph.tenures.length" class="empty">尚無任職記錄。可在資料管理中建立任官，或在進階編輯中加入有依據的任職。</p></section><section class="research-editor" aria-label="任職詳情"><template v-if="currentTenure"><button class="mobile-back" @click="backToList">← 返回任職列表</button><h2>{{currentTenure.officeNameOriginal}}</h2><p>{{currentTenure.polityOriginal}} · {{currentTenure.jurisdictionOriginal}} · {{currentTenure.natureOriginal}}</p><p>{{currentTenure.reason}}</p><article v-for="claim in currentClaims" :key="claim.id" class="claim-editor"><h3>{{claimText(graph,claim.id)}}</h3><p>{{assessmentNames[claim.assessment]}} · {{claim.rationale||'尚未記錄研究理由'}}</p><details v-if="claim.content.type==='legacy-record'"><summary>原始任官記載</summary><pre>{{format(claim.content.value)}}</pre></details><el-button v-if="evidenceKeys(claim).length" @click="compareClaim(claim)">並讀支持材料</el-button></article><details><summary>任期採擇與固定來源</summary><pre>{{format(currentTenure)}}</pre></details></template><p v-else class="empty">選擇任職查看記載與採擇。</p></section></div></el-tab-pane>
<el-tab-pane :label="'材料並讀 · '+sources.length" name="sources"><div class="compare-heading"><h2 id="source-compare-title" tabindex="-1">材料並讀</h2><el-button @click="returnFromCompare">← 返回記錄</el-button></div><p>選擇最多三份材料，對照原文與出處。</p><el-select v-model="compareKeys" multiple :multiple-limit="3" filterable aria-label="並讀材料" placeholder="選擇固定版本引文" class="source-picker"><el-option v-for="source in sources" :key="sourceKey(source)" :value="sourceKey(source)" :label="source.data.title+' · '+source.data.locator+' · 修訂 '+source.pin.revision"></el-option></el-select><nav v-if="compactSources&&compareSources.length>1" class="source-mobile-switch" aria-label="切換並讀材料"><button v-for="source in compareSources" :key="sourceKey(source)" type="button" :aria-pressed="compareActiveKey===sourceKey(source)" @click="compareActiveKey=sourceKey(source)">{{source.data.title}}</button></nav><p v-if="!compareSources.length" class="empty">選擇固定版本材料後，原文將顯示在這裡。</p><div class="source-comparison" :style="{'--source-count':compareSources.length||1}"><article v-for="source in compareSources" :key="sourceKey(source)" class="source-sheet" :hidden="compactSources&&compareActiveKey!==sourceKey(source)"><h2>{{source.data.title}}</h2><p class="quiet">{{source.data.edition}} · {{source.data.locator}} · 修訂 {{source.pin.revision}}</p><div class="source-transcription">{{source.data.text}}</div><p class="source-pin">{{source.pin.digest}}</p></article></div>
<details class="all-sources"><summary>全部固定版本材料（{{sources.length}}）</summary><details v-for="source in sources" :key="sourceKey(source)"><summary>{{source.data.title}} · {{source.data.locator}} · 修訂 {{source.pin.revision}}</summary><p>{{source.data.edition}} · {{source.data.textScope==='full'?'全文':'節引'}}</p><div class="source-transcription">{{source.data.text}}</div><p class="source-pin">{{source.pin.id}} · SHA-256 {{source.pin.digest}}</p><p>{{source.data.url}}</p></details></details><p v-if="!sources.length" class="empty">案卷尚無固定材料。載入研究材料包後即可並讀。</p>
<section v-if="graph.textualVariants.length" class="conflict-notes"><h2>文字異文</h2><article v-for="variant in graph.textualVariants" :key="variant.id"><h3>{{variant.locus}}</h3><p>{{variant.note}}</p><div v-for="reading in variant.readings" :key="reading.source.id+'@'+reading.source.revision"><p class="quiet">{{reading.source.id}} · 修訂 {{reading.source.revision}}</p><div class="source-transcription">{{reading.text}}</div></div></article></section></el-tab-pane>
<el-tab-pane label="修訂紀錄" name="history"><section v-if="conflict" class="panel revision-conflict"><h2>伺服器已有修訂 {{conflict.number}}</h2><p>你的草稿仍保留。逐項查看差異，可以採用伺服器內容；完成比較後，再次保存會新增修訂。</p><details v-for="row in conflictRows" :key="row.key"><summary>{{row.kind}} · {{row.id}}</summary><div class="revision-comparison"><div><h3>目前草稿</h3><pre>{{format(row.local)||'此項不存在'}}</pre></div><div><h3>伺服器新修訂</h3><pre>{{format(row.remote)||'此項不存在'}}</pre><el-button :disabled="busy" @click="useRemoteItem(row)">採用此項伺服器內容</el-button></div></div></details><el-button :disabled="busy" @click="acceptConflictBase">已完成比較，繼續保存</el-button></section>
<p v-if="!revisions.length" class="empty">{{saveAvailable?'尚無已保存修訂。':'研究保存服務尚未就緒。'}}</p><ol class="revision-list"><li v-for="revision in revisions" :key="revision.version"><div><strong>修訂 {{revision.version}}</strong><p>{{revision.reason}}</p><small>{{revision.at}}</small></div><el-button :disabled="busy" @click="showRevision(revision.version)">查看此修訂</el-button></li></ol><el-button v-if="nextBefore" :disabled="busy" @click="loadHistory(false)">讀取更早修訂</el-button><section v-if="historyPreview" class="panel"><h2>修訂 {{historyPreview.number}}</h2><p>{{historyPreview.reason}}</p><p class="quiet">恢復後仍需保存，既有修訂會完整保留。</p><el-button :disabled="busy" @click="restoreRevision">恢復至草稿</el-button><details><summary>查看完整內容</summary><pre>{{format(historyPreview.graph)}}</pre></details></section></el-tab-pane>
</el-tabs>
<aside v-if="tab==='events'||tab==='tenures'" class="research-evidence-rail" aria-label="目前記錄的證據"><h2>固定版本證據</h2><p class="field-help">{{contextEvidence.length}} 份引用材料</p><p v-if="!contextEvidence.length" class="empty">此記錄尚未關聯固定引文。</p><article v-for="ref in contextEvidence" :key="ref.evidence.id"><template v-if="ref.source"><h3>{{ref.source.data.title}}</h3><p class="quiet">{{ref.source.data.locator}} · 修訂 {{ref.source.pin.revision}}</p><p class="assessment">{{assessmentNames[ref.claim.assessment]}} · {{ref.evidence.role==='counter'?'反證':ref.evidence.role==='variant'?'異文':'支持材料'}}</p><el-button @click="readEvidence(ref.source)" :disabled="busy">查看原文</el-button></template><p v-else>固定來源暫未載入，請重新核對案卷。</p></article></aside></div>
<section class="save-panel" aria-label="保存案卷"><div><h2>保存研究修訂</h2><p class="field-help">每次保存保留完整案卷與固定出處。研究案卷保存在私有工作區。</p></div><el-input v-model="reason" type="textarea" :autosize="{minRows:2,maxRows:5}" :disabled="busy" aria-label="本次修訂說明" placeholder="說明新增材料、紀年判斷或異說處理"></el-input><el-checkbox v-if="needsReview" v-model="reviewed" :disabled="busy">我已檢查本稿中的已核說法與採擇</el-checkbox><div class="save-bar"><el-button type="primary" @click="save" :loading="busy&&!importBusy" :disabled="!saveAvailable||busy||!!conflict||advancedDirty">保存案卷</el-button><el-button @click="checkDraft" :disabled="busy||advancedDirty">核對結構與引文</el-button><span>{{dirty?'修改尚未保存':'目前沒有未保存修改'}}</span></div><p v-if="!saveAvailable" class="field-help">保存服務尚未就緒，可先匯出草稿 JSON 保留研究。</p><details v-if="inspection"><summary>校驗提示（{{inspection.warnings.length}}）</summary><p>結構校驗通過不等於史實已核。</p><p v-for="(warning,index) in inspection.warnings" :key="index">{{warning.message}}</p><p class="source-pin">研究圖 SHA-256 {{inspection.graphDigest}}</p></details></section>
<details class="advanced-editor"><summary>進階編輯：完整研究圖</summary><p class="field-help">用於任期採擇、反證與文字異文等完整關係編輯。原始預覽與草稿分開保存；修改後先套用校驗，再保存案卷。</p><el-input v-model="advanced" type="textarea" :autosize="{minRows:12,maxRows:30}" :disabled="busy" aria-label="研究圖 JSON" spellcheck="false" @input="advancedDirty=true"></el-input><div class="save-bar"><el-button @click="applyAdvanced" :disabled="busy||!advancedDirty">校驗並套用</el-button><el-button @click="discardAdvanced" :disabled="busy||!advancedDirty">捨棄進階修改</el-button></div></details>
</template></div></div></main></div></body></html>
