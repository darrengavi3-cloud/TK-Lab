<!doctype html>
<html lang="zh-Hant" data-sgz-theme="laitai-day">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>觀史台 · 管理後台</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/legacy/assets/vendor/element-plus/index.css">
<link rel="stylesheet" href="/legacy/assets/ui/tokens.css">
<link rel="stylesheet" href="/legacy/assets/ui/base.css">
<link rel="stylesheet" href="/legacy/assets/ui/components.css">
<link rel="stylesheet" href="/admin.css">
<script defer src="/legacy/assets/vendor/vue/vue.global.min.js"></script>
<script defer src="/legacy/assets/vendor/element-plus/index.full.min.js"></script>
<script type="module" src="/admin-client.mjs"></script>
</head>
<body><div id="catalogue" v-cloak>
<header class="admin-header"><a class="wordmark" href="/">觀史台</a><span class="header-note">資料管理</span><div class="header-actions"><el-select v-model="theme" aria-label="外觀主題" @change="setTheme"><el-option label="蘭臺清晝" value="laitai-day"></el-option><el-option label="朱批紙本" value="review-paper"></el-option><el-option label="青燈夜校" value="lamp-night"></el-option></el-select><a href="/" target="_blank" rel="noopener">閱讀版 ↗</a></div></header>
<div class="admin-layout">
<nav class="admin-nav" aria-label="管理後台"><button v-for="item in navigation" :key="item.id" :aria-current="screen===item.id?'page':null" @click="navigate(item.id)"><span>{{item.label}}</span><span aria-hidden="true">›</span></button><p>保存修訂後，<br>由你決定何時發布。</p></nav>
<main id="admin-main">
<div v-if="error" class="notice error" role="alert" id="admin-error" tabindex="-1"><p>{{error}}</p><a v-if="unauthorized" href="/signin-with-chatgpt?return_to=%2Fadmin" target="_top">重新登入</a><el-button v-else @click="refreshScreen" :disabled="busy">重試</el-button></div>
<div v-if="message" class="notice" role="status">{{message}}</div>
<p v-if="loading" role="status">正在讀取資料…</p>
<template v-if="ready">
<section v-if="needsBaseline" class="panel"><h2>載入既有觀史台資料</h2><p>將已核驗的 V86 基線、4,336 筆工作記錄與原始檔保存至後台。這是一次性初始化；目前閱讀內容維持原版。</p><el-button type="primary" @click="initializeBaseline" :loading="busy">載入既有資料</el-button><p class="field-help">中途關閉可重新開啟繼續，同一基線不會重複新增。</p></section>
<section v-if="screen==='workspace'||screen==='sources'" class="work-section">
<div class="section-heading"><div><p class="eyebrow">{{screen==='sources'?'底本與引用':'資料工作台'}}</p><h1>{{screen==='sources'?'史料庫':'人物與任官'}}</h1></div><el-button type="primary" @click="newRecord" :disabled="busy">新增{{kindLabel(kind)}}</el-button></div>
<div class="workspace-toolbar"><el-radio-group v-if="screen==='workspace'" v-model="kind" @change="changeKind" aria-label="資料類型"><el-radio-button value="person">人物</el-radio-button><el-radio-button value="appointment">任官</el-radio-button></el-radio-group><form novalidate @submit.prevent="search"><el-input v-model="query" :placeholder="'搜尋'+kindLabel(kind)+'名稱或 ID'" aria-label="搜尋記錄" @compositionstart="composing=true" @compositionend="composing=false"></el-input><el-button v-if="query" @click="clearSearch" aria-label="清除搜尋">清除</el-button><el-button native-type="submit" :disabled="composing">搜尋</el-button></form><span class="quiet">共 {{total}} 筆</span></div>
<div class="workspace-grid" :class="{'has-selection':selected}">
<section class="record-list" aria-label="記錄列表"><p v-if="!loading&&!rows.length" class="empty">尚無符合的記錄。可清除搜尋，或新增{{kindLabel(kind)}}。</p><button v-for="row in rows" :key="row.id" class="record-row" :class="{selected:selected?.data.id===row.id}" @click="selectRecord(row.id)"><span class="record-name">{{recordName(row.data)}}</span><span class="status-text">{{assessmentLabel(row.data.assessment)}}</span><small>{{row.id}}</small></button><el-pagination v-if="total>40" v-model:current-page="page" :page-size="40" :total="total" layout="prev, pager, next" @current-change="loadList"></el-pagination></section>
<section v-if="selected" class="editor" aria-label="記錄詳情">
<button class="mobile-back" @click="closeEditor">← 返回列表</button>
<div class="editor-heading"><h2 tabindex="-1" ref="editorHeading">{{recordName(selected.data)||'新增'+kindLabel(kind)}}</h2><span class="save-status" role="status">{{saveStatus}}</span></div>
<p class="record-id">{{selected.data.id}} · 修訂 {{selected.number}}</p>
<div v-if="recoverable" class="notice"><p>此裝置保留了未保存的草稿。</p><el-button @click="restoreDraft">恢復草稿</el-button><el-button type="danger" @click="discardDraft">捨棄草稿</el-button></div>
<div v-if="conflict" class="notice error"><p>伺服器已有新修訂。你的輸入仍保留；請對照後合併。</p><details><summary>查看伺服器內容（修訂 {{conflict.number}}）</summary><pre>{{format(conflict.data)}}</pre></details><el-button @click="useConflictBase">以新修訂為基礎，保留我的輸入</el-button><el-button @click="selectRecord(selected.data.id)">重新讀取</el-button></div>
<el-form novalidate label-position="top" @submit.prevent="save" class="editor-form">
<template v-if="selected.data.kind==='person'">
<el-form-item label="人物姓名"><el-input id="person-name" v-model="selected.data.name" aria-label="人物姓名"></el-input></el-form-item>
<el-form-item label="別名（每行一項）"><el-input type="textarea" :autosize="{minRows:3,maxRows:12}" :model-value="selected.data.aliases.join('\n')" @update:model-value="selected.data.aliases=$event.split('\n').filter(Boolean)" aria-label="別名"></el-input></el-form-item>
<el-form-item label="別名發布"><el-select v-model="selected.data.aliasPublication" aria-label="別名發布"><el-option value="private" label="留在後台"></el-option><el-option value="verified" label="已逐項核對，可供閱讀"></el-option></el-select></el-form-item>
<p class="field-help">同名不會自動合併。既有人物的原文小傳與其他已核欄位會繼續保留。</p>
</template>
<template v-if="selected.data.kind==='appointment'">
<el-form-item label="人物"><el-select v-model="selected.data.personId" filterable remote :remote-method="searchPeople" :loading="referenceLoading" placeholder="輸入姓名後選擇人物" aria-label="任官人物"><el-option v-for="p in personOptions" :key="p.id" :value="p.id" :label="recordName(p.data)+' · '+p.id"></el-option></el-select></el-form-item>
<div class="field-grid"><el-form-item label="原始官名"><el-input v-model="selected.data.officeName" aria-label="原始官名"></el-input></el-form-item><el-form-item label="任職性質"><el-input v-model="selected.data.nature" placeholder="例如實授、領、行、未拜" aria-label="任職性質"></el-input></el-form-item><el-form-item label="政權"><el-input v-model="selected.data.polity" aria-label="政權"></el-input></el-form-item><el-form-item label="轄區"><el-input v-model="selected.data.jurisdiction" aria-label="轄區"></el-input></el-form-item></div>
<section class="panel" aria-label="閱讀關聯">
<h3>閱讀關聯</h3><p class="field-help">選擇這條任官應出現的官職與州鎮位置。姓名、任期與引文隨同一份修訂發布；官職制度沿革仍獨立維護。</p>
<el-form-item label="官職任職者"><el-select :fit-input-width="true" :model-value="activeLinks.offices" @update:model-value="setOfficeLinks" multiple filterable :filter-method="filterOffices" no-data-text="沒有符合的記錄" no-match-text="沒有符合的記錄" placeholder="搜尋政權、官名或官職位置" aria-label="關聯官職"><el-option v-for="o in officeOptions" :key="o.id" :value="o.id" :label="officeLabel(o)"></el-option></el-select><p class="field-help">每次顯示前 60 個符合位置；已選項保留。原始官名及來源官職 ID 不因選擇而改寫。</p></el-form-item>
<el-checkbox :model-value="!!activeLinks.fangzhen" @update:model-value="toggleFangzhen">同步到州鎮表</el-checkbox>
<template v-if="activeLinks.fangzhen">
<el-form-item label="取代既有州鎮條目"><el-select :fit-input-width="true" :model-value="activeLinks.fangzhen.recordId" @update:model-value="selectFangzhenRecord" clearable filterable placeholder="留空則新增條目" aria-label="既有州鎮條目"><el-option v-for="f in fangzhenOptions" :key="f.id" :value="f.id" :label="[f.dynastyLabel,f.title,f.jurisdiction,f.tenureText,f.id].filter(Boolean).join(' · ')"></el-option></el-select><p class="field-help">只列同一人物的條目。指定後，原條目的官名、任期與引文改由本條任官維護；不重複新增。</p></el-form-item>
<div class="field-grid">
<el-form-item label="州鎮檔案"><el-select :fit-input-width="true" :model-value="activeLinks.fangzhen.polityKey" @update:model-value="v=>setFangzhenField('polityKey',v)" aria-label="州鎮檔案"><el-option v-for="k in ['han','wei','shu','wu','jin','eastjin']" :key="k" :value="k" :label="polityLabels[k]"></el-option></el-select></el-form-item>
<el-form-item label="職任類型"><el-select :fit-input-width="true" :model-value="activeLinks.fangzhen.recordType" @update:model-value="v=>setFangzhenField('recordType',v)" aria-label="州鎮職任類型"><el-option value="cishi" label="刺史／州牧"></el-option><el-option value="taishou" label="太守／國相"></el-option><el-option value="dudu" label="都督"></el-option><el-option value="duwei" label="都尉"></el-option><el-option value="junshou" label="郡守"></el-option><el-option value="other" label="其他職任"></el-option></el-select></el-form-item>
</div>
<el-form-item label="職權性質"><el-select :fit-input-width="true" :model-value="activeLinks.fangzhen.powerKinds||[]" @update:model-value="v=>setFangzhenField('powerKinds',v)" multiple clearable placeholder="可多選；舊資料可留空" aria-label="州鎮職權性質"><el-option value="administrative" label="行政"></el-option><el-option value="military_title" label="軍號"></el-option><el-option value="military_command" label="軍事督轄"></el-option><el-option value="delegated_power" label="節權"></el-option></el-select><p class="field-help">地域層級與職權性質分開。兼領可多選；不設定「軍政兼領」布林值，由同一人物的任期與職權動態呈現。</p></el-form-item>
<el-form-item label="行政單元（可留空）"><el-select :fit-input-width="true" :model-value="activeLinks.fangzhen.administrativeUnitId" @update:model-value="v=>setFangzhenField('administrativeUnitId',v)" clearable filterable placeholder="選擇已建檔的行政單元" aria-label="行政單元"><el-option v-for="u in unitOptions" :key="u.id" :value="u.id" :label="u.polity+' · '+u.name+' · '+u.id"></el-option></el-select><p class="field-help">轄區名稱須與行政單元一致。只有確定任期完全落在已核治所分期內，才顯示該治所；未知年份及未拜不進在任快照。</p></el-form-item>
</template>
</section>
<el-form-item label="原始年代文字"><el-input v-model="selected.data.date.original" aria-label="原始年代文字"></el-input></el-form-item>
<div class="field-grid"><el-form-item label="起年（未知留空）"><el-input-number v-model="selected.data.date.startYear" :min="-5000" :max="5000" :controls="false" aria-label="起年"></el-input-number></el-form-item><el-form-item label="迄年（未知留空）"><el-input-number v-model="selected.data.date.endYear" :min="-5000" :max="5000" :controls="false" aria-label="迄年"></el-input-number></el-form-item><el-form-item label="年代精度"><el-select v-model="selected.data.date.precision" aria-label="年代精度"><el-option value="unknown" label="未知或端點不全"></el-option><el-option value="year" label="單年"></el-option><el-option value="range" label="起訖範圍"></el-option></el-select></el-form-item><el-form-item label="年代確定性"><el-select v-model="selected.data.date.certainty" aria-label="年代確定性"><el-option value="unknown" label="尚未判定"></el-option><el-option value="certain" label="確定"></el-option><el-option value="inferred" label="推定"></el-option></el-select></el-form-item></div>
<el-form-item label="換算或推定依據"><el-input v-model="selected.data.date.basis" aria-label="年代依據"></el-input></el-form-item>
</template>
<template v-if="selected.data.kind==='source'">
<el-form-item label="典籍或底本題名"><el-input v-model="selected.data.title" aria-label="史料題名"></el-input></el-form-item>
<div class="field-grid"><el-form-item label="版本"><el-input v-model="selected.data.edition" aria-label="底本版本"></el-input></el-form-item><el-form-item label="卷頁或行段定位"><el-input v-model="selected.data.locator" aria-label="來源定位"></el-input></el-form-item></div>
<el-form-item label="錄入範圍"><el-radio-group v-model="selected.data.textScope" aria-label="錄入範圍"><el-radio value="excerpt">節引</el-radio><el-radio value="full">全文</el-radio></el-radio-group></el-form-item>
<el-form-item label="原文（保留原注、異文與換行）"><el-input type="textarea" :autosize="{minRows:14,maxRows:30}" v-model="selected.data.text" aria-label="史料原文" class="source-text"></el-input></el-form-item>
<el-form-item label="來源網址"><el-input v-model="selected.data.url" aria-label="來源網址"></el-input></el-form-item>
<p class="field-help">修改會新增原文版本；既有引用仍指向當時選定的版本。</p>
</template>
<div class="field-grid"><el-form-item label="史實判斷"><el-select v-model="selected.data.assessment" @change="reviewed=false" aria-label="史實判斷"><el-option v-for="s in assessments" :key="s.value" :value="s.value" :label="s.label"></el-option></el-select></el-form-item><el-form-item label="整理進度"><el-select v-model="selected.data.workflow" aria-label="整理進度"><el-option value="draft" label="草稿"></el-option><el-option value="review" label="待處理"></el-option><el-option value="ready" label="已整理"></el-option></el-select></el-form-item><el-form-item label="讀者可見性"><el-select v-model="selected.data.visibility" aria-label="讀者可見性"><el-option value="private" label="留在後台"></el-option><el-option value="reader" label="允許納入閱讀版"></el-option></el-select></el-form-item></div>
<template v-if="selected.data.assessment==='excluded'"><el-form-item label="排除性質"><el-select v-model="selected.data.disposition" aria-label="排除性質"><el-option v-for="d in dispositions" :key="d.value" :value="d.value" :label="d.label"></el-option></el-select></el-form-item><el-form-item v-if="selected.data.kind==='appointment'&&selected.data.disposition==='duplicate'" label="保留的任官 ID"><el-input v-model="selected.data.duplicateOf" aria-label="互證任官 ID"></el-input></el-form-item></template>
<el-form-item label="史實判斷依據"><el-input type="textarea" :autosize="{minRows:3,maxRows:12}" v-model="selected.data.reason" aria-label="史實判斷依據"></el-input></el-form-item>
<fieldset v-if="selected.data.kind!=='source'" class="evidence-editor"><legend>引用史料</legend><div v-for="(e,index) in selected.data.evidence" :key="index" class="evidence-row"><el-select v-model="e.sourceId" filterable remote :remote-method="searchSources" @change="setEvidenceVersion(e)" aria-label="引用史料"><el-option v-for="s in sourceOptions" :key="s.id" :value="s.id" :label="recordName(s.data)+' · '+s.id"></el-option></el-select><el-input-number v-model="e.sourceRevision" :min="1" aria-label="引用修訂"></el-input-number><el-select v-model="e.role" aria-label="引用用途"><el-option value="support" label="支持"></el-option><el-option value="counter" label="反證"></el-option><el-option value="variant" label="異說"></el-option></el-select><el-input v-model="e.note" placeholder="可供讀者閱讀的引文說明" aria-label="引文說明"></el-input><el-button @click="selected.data.evidence.splice(index,1)" :aria-label="'移除第'+(index+1)+'條引用'">移除</el-button></div><el-button @click="addEvidence">新增引用</el-button></fieldset>
<el-form-item label="本次修訂說明"><el-input v-model="reason" placeholder="說明這次改了什麼" aria-label="本次修訂說明"></el-input></el-form-item>
<el-checkbox v-if="selected.data.assessment==='verified'" v-model="reviewed">我已核對這次內容與所引史料</el-checkbox>
<div class="save-bar"><el-button type="primary" @click="save" :loading="busy">保存修訂</el-button><el-button @click="showHistory" :disabled="busy||!selected.number">修訂紀錄</el-button><span>保存後由發布中心統一發布。</span></div>
</el-form>
</section><section v-else class="empty editor"><p>選擇記錄，查看原文與修訂。</p><p v-if="!total">可從匯入中心載入資料。</p></section>
</div></section>
<section v-else-if="screen==='imports'"><div class="section-heading"><div><p class="eyebrow">原檔留存 · 先預覽，再提交</p><h1>匯入中心</h1></div></div>
<div class="panel"><label for="import-file">選擇 UTF-8 CSV、單工作表 Excel 或 JSON（最多 24 MB、10,000 筆）</label><input id="import-file" type="file" accept=".csv,.xlsx,.xls,.json" @change="chooseFile" :disabled="busy">
<div v-if="fileInfo"><p>{{fileInfo.filename}} · {{fileInfo.total}} 筆</p><template v-if="!fileInfo.native"><el-select v-model="importKind" aria-label="匯入類型"><el-option value="person" label="人物"></el-option><el-option value="appointment" label="任官"></el-option><el-option value="source" label="史料"></el-option></el-select><div class="mapping-grid"><label v-for="field in mappingFields" :key="field.key">{{field.label}}<el-select v-model="mapping[field.key]" clearable :aria-label="field.label+'對應欄位'"><el-option v-for="col in fileInfo.columns" :key="col" :value="col" :label="col"></el-option></el-select></label></div><el-checkbox v-model="allowUnmapped">未對應欄位保留於原檔，不填入結構化記錄</el-checkbox></template><p class="field-help">一般匯入均作為待核候選；同名不會自動合併。</p><el-button type="primary" @click="prepareImport" :loading="busy">產生匯入預覽</el-button></div></div>
<div v-if="importPreview" class="panel"><h2>{{importPreview.job.filename}}</h2><p>{{importPreview.count}}／{{importPreview.job.total}} 筆已暫存 · {{importState(importPreview.job.state)}}</p><p v-for="warning in importPreview.warnings" :key="warning">{{warning}}</p><ul v-if="importPreview.errors.length" class="error"><li v-for="e in importPreview.errors.slice(0,30)" :key="e.row">第 {{e.row}} 行：{{e.message}}</li></ul><el-table :data="importPreview.rows" row-key="id"><el-table-column label="操作" width="90"><template #default="{row}">{{row.baseVersion?'修訂':'新增'}}</template></el-table-column><el-table-column label="記錄"><template #default="{row}">{{recordName(row.data)}}<small class="block">{{row.id}}</small></template></el-table-column><el-table-column label="原修訂" prop="baseVersion" width="90"></el-table-column></el-table><p v-if="importPreview.more">顯示前 80 筆。可下載整批內容逐項核對。</p><a class="preview-link" :href="'/api/admin/imports/'+encodeURIComponent(importPreview.job.id)+'/preview'" download>下載完整匯入預覽</a><el-button v-if="importPreview.job.state==='staging'" @click="resumeImport" :loading="busy">繼續暫存</el-button><el-button v-if="staging" @click="stopStaging=true">暫停</el-button><template v-if="importPreview.job.state==='ready'"><el-checkbox v-model="importConfirmed">已檢查本批新增與修訂</el-checkbox><el-button type="warning" @click="commitImport" :disabled="!importConfirmed" :loading="busy">提交整批</el-button></template></div>
<h2>最近的匯入</h2><el-table :data="jobs" row-key="id"><el-table-column label="檔案"><template #default="{row}"><button class="text-button" @click="openImport(row.id)">{{row.filename}}</button></template></el-table-column><el-table-column label="狀態"><template #default="{row}">{{importState(row.state)}}</template></el-table-column><el-table-column label="筆數" prop="total"></el-table-column></el-table></section>
<section v-else-if="screen==='history'"><div class="section-heading"><div><p class="eyebrow">每次更正都有來處</p><h1>修訂紀錄</h1></div></div><p v-if="!selected">先在資料工作台選擇記錄，再查看其修訂。</p><template v-else><h2>{{recordName(selected.data)}}</h2><p>恢復舊內容會新增修訂，原紀錄保留。</p><article v-for="(r,index) in revisions" :key="r.number" class="panel"><h3>修訂 {{r.number}} <small>{{formatTime(r.at)}}</small></h3><p>{{r.reason}}</p><details v-if="revisions[index+1]"><summary>比較前後修訂</summary><div v-for="d in differences(revisions[index+1].data,r.data)" :key="d.field"><strong>{{d.field}}</strong><div class="field-grid"><pre>原內容：{{format(d.before)}}</pre><pre>新內容：{{format(d.after)}}</pre></div></div></details><details><summary>查看這次保存的完整內容</summary><pre>{{format(r.data)}}</pre></details><el-button v-if="r.number!==selected.number" @click="restoreRevision(r)">載入此內容作為新修訂</el-button></article></template></section>
<section v-else-if="screen==='publish'"><div class="section-heading"><div><p class="eyebrow">固定內容 · 預覽確認 · 可回退</p><h1>發布中心</h1></div><el-button type="primary" @click="createCandidate" :loading="busy">建立發布候選</el-button></div><p>候選固定當時的資料。之後保存的草稿會留待下一次發布。</p><p class="field-help">現行相容閱讀版沿用已核人物與任官；待核任官保留在後台。州鎮保留已公開的待審記錄；新增關聯也依史實狀態顯示，未核內容不進確定在任快照。</p><div v-if="candidate" class="panel"><h2>本次候選</h2><p>人物 {{candidate.counts.people}} · 已核任官 {{candidate.counts.appointments}} · 待核任官 {{candidate.counts.pending}}</p><p>{{candidate.changes.length}} 筆記錄曾在基線後修訂。</p><p v-if="candidate.counts.linkedAppointments!=null">跨板塊關聯 {{candidate.counts.linkedAppointments}} 條任官 · 州鎮 {{candidate.counts.fangzhen}} 條</p><a :href="'/reader/preview/'+candidate.id+'/index.html'" target="_blank" rel="noopener" class="preview-link">打開這份候選的閱讀預覽 ↗</a><details><summary>查看候選變更</summary><ul><li v-for="c in candidate.changes" :key="c.id">{{c.id}} · 修訂 {{c.revision}} · {{assessmentLabel(c.assessment)}}</li></ul></details><el-checkbox v-model="publishConfirmed">我已檢查此候選，確認發布這份內容</el-checkbox><div class="save-bar"><el-button type="danger" @click="publishCandidate" :disabled="!publishConfirmed" :loading="busy">發布閱讀內容</el-button></div></div>
<h2>閱讀版本</h2><article v-for="r in releases" :key="r.id" class="release-row"><div><strong>{{activeRelease===r.id?'目前閱讀版':r.state==='published'?'曾發布':'候選'}}</strong><p>{{formatTime(r.at)}} · 人物 {{r.manifest.counts.people}} · 任官 {{r.manifest.counts.appointments}}</p><small>資料提交 {{r.watermark}} · {{r.id.slice(0,12)}}</small></div><div><el-button @click="candidate=r.manifest;publishConfirmed=false">查看候選</el-button><el-button v-if="r.state==='published'&&activeRelease!==r.id" type="warning" @click="rollback(r)">切回此版</el-button></div></article><p class="field-help">這裡記錄閱讀內容發布。網站程式的 Sites 部署回執另行保存，不因保存草稿或切換內容而增加部署版號。</p></section>
<section v-else-if="screen==='settings'"><div class="section-heading"><div><p class="eyebrow">資料與原檔</p><h1>系統設定</h1></div></div><div class="panel"><h2>完整備份</h2><p>下載一致時間點的資料表、修訂歷史、原檔、匯入暫存、讀者基線與發布快照。備份包含後台研究內容；還原須先在空資料庫核驗，現有編輯資料不會被下載操作改動。</p><a class="preview-link" href="/api/admin/backup" download>下載備份</a></div><div class="panel"><h2>維護範圍</h2><p>此版管理人物身份、任官、引用史料及閱讀關聯。已關聯的官職任職者與州鎮條目隨任官發布；其餘州鎮、官職制度、小傳、金石、封爵、府署、戰事、食貨和地圖繼續使用原有資料。</p><p>單筆修訂可在修訂紀錄恢復；發布中心切回閱讀版本時，不回退工作資料。</p></div></section>
</template></main></div></div><noscript>管理後台需要啟用 JavaScript。</noscript></body></html>
