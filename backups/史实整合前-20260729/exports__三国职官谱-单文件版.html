<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>职官谱 · 三国官职爵位管理系统</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/element-plus/2.11.4/index.css" crossorigin="anonymous" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.39/vue.global.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/element-plus/2.11.4/index.full.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gojs/3.1.10/go.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>

<style>
@font-face { font-family: 'sys-serif'; src: local('Noto Serif SC'), local('Songti SC'), local('SimSun'); }

:root{
  --paper:#EDE6D6;
  --card:#F6F1E4;
  --ink:#2B2622;
  --ink-soft:#6B6255;
  --rule:#C9BFA5;
  --seal:#9C3B2E;
  --gold:#B08D3F;
  --wei:#376B9E;
  --shu:#A54136;
  --wu:#3F7652;
  --han:#77736B;
  --tribal:#7A5230;
}
*{box-sizing:border-box;}
html,body,#app{height:100%;margin:0;}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--paper);
  color:var(--ink);
}
.serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;}

/* ---------- layout shell ---------- */
.shell{display:flex;flex-direction:column;height:100vh;}
.topbar{
  height:56px;flex:0 0 auto;display:flex;align-items:center;gap:18px;
  padding:0 16px;background:var(--card);border-bottom:1px solid var(--rule);
  box-shadow:0 1px 0 rgba(43,38,34,.03);
}
.seal-mark{
  width:34px;height:34px;border-radius:4px;background:var(--seal);color:#F6F1E4;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
  font-family:'Noto Serif SC',serif; flex:0 0 auto; letter-spacing:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:10px;}
.brand .t1{font-size:16px;font-weight:700;font-family:'Noto Serif SC',serif;letter-spacing:1px;}
.brand .t2{font-size:11px;color:var(--ink-soft);letter-spacing:.5px;}

.faction-tabs{display:flex;gap:6px;flex:1 1 auto;overflow-x:auto;}
.faction-tab{
  padding:6px 14px;border-radius:3px;font-size:13px;cursor:pointer;white-space:nowrap;
  border:1px solid transparent; color:var(--ink-soft); transition:all .15s;
}
.faction-tab:hover{background:rgba(43,38,34,.05);}
.faction-tab.active{color:#F6F1E4;font-weight:600;}
.faction-short{display:none;}

.topbar-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto;}

.body-row{flex:1 1 auto;display:flex;min-height:0;}

.left-toolbar{
  width:56px;flex:0 0 auto;background:var(--card);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;overflow-y:auto;position:relative;
}
.tool-btn{
  width:38px;height:38px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;color:var(--ink);background:transparent;border:1px solid transparent;
  transition:all .12s;position:relative;
}
.tool-btn:hover{background:rgba(43,38,34,.06);border-color:var(--rule);}
.tool-btn.disabled{opacity:.3;cursor:not-allowed;}
.tool-btn.disabled:hover{background:transparent;border-color:transparent;}
.tool-sep{width:28px;height:1px;background:var(--rule);margin:4px 0;}
.tool-hint-bubble{
  position:fixed;left:62px;z-index:3000;pointer-events:none;white-space:nowrap;
  padding:5px 9px;border-radius:4px;background:var(--ink);color:#F6F1E4;
  font-size:12px;line-height:1;box-shadow:0 3px 10px rgba(43,38,34,.2);
}

.canvas-wrap{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:
  radial-gradient(circle at 1px 1px, rgba(43,38,34,.06) 1px, transparent 0) 0 0/22px 22px, var(--paper);
}
.canvas-tabs{
  display:flex;align-items:center;gap:4px;padding:8px 14px;border-bottom:1px solid var(--rule);
  background:rgba(246,241,228,.6);
}
.mini-tab{
  padding:4px 12px;border-radius:14px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);
  border:1px solid var(--rule);
}
.mini-tab.active{background:var(--ink);color:#F6F1E4;border-color:var(--ink);}
.canvas-tabs .spacer{flex:1;}
.canvas-tabs .hint{font-size:12px;color:var(--ink-soft);}
.period-select{width:210px;flex:0 0 auto;}
.period-summary-btn{margin-left:4px;}

#goCanvas{flex:1 1 auto;background:transparent;}

.right-panel{
  width:340px;flex:0 0 auto;background:var(--card);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;min-height:0;
}
.panel-head{
  padding:14px 16px 10px;border-bottom:1px solid var(--rule);
}
.panel-head .name{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:700;}
.panel-head .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.panel-body{flex:1 1 auto;overflow-y:auto;padding:12px 16px 30px;}
.panel-empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}
.panel-empty .glyph{font-size:34px;margin-bottom:10px;font-family:'Noto Serif SC',serif;color:var(--rule);}

.statusbar{
  height:28px;flex:0 0 auto;background:var(--ink);color:#EDE6D6;font-size:11.5px;
  display:flex;align-items:center;padding:0 14px;gap:18px;
}
.statusbar .item{opacity:.85;}
.statusbar .spacer{flex:1;}

.field-group-title{
  font-size:12px;color:var(--ink-soft);margin:14px 0 6px;letter-spacing:1px;
  border-bottom:1px dashed var(--rule);padding-bottom:4px;
}
.field-group-title:first-child{margin-top:0;}

.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.mini-badge{
  font-size:11px;padding:2px 7px;border-radius:3px;background:rgba(43,38,34,.06);color:var(--ink-soft);
}

.el-drawer__header{margin-bottom:8px !important;font-family:'Noto Serif SC',serif;}
.log-item{padding:8px 10px;border-bottom:1px solid var(--rule);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.log-item .t{color:var(--ink-soft);font-size:11px;}
.log-item.current{background:rgba(155,59,46,.07);}

.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;}
.stat-row .label{width:96px;flex:0 0 auto;color:var(--ink-soft);}
.stat-row .bar-bg{flex:1;height:8px;background:rgba(43,38,34,.08);border-radius:4px;overflow:hidden;}
.stat-row .bar{height:100%;background:var(--seal);}
.stat-row .num{width:28px;text-align:right;flex:0 0 auto;font-family:'Noto Serif SC',serif;}

.icon-picker{display:flex;flex-wrap:wrap;gap:6px;}
.icon-picker .opt{
  width:32px;height:32px;border:1px solid var(--rule);border-radius:4px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;font-size:16px;background:#fff;
}
.icon-picker .opt.sel{border-color:var(--seal);background:rgba(155,59,46,.08);}

.footnote-badges{display:flex;flex-direction:column;gap:4px;margin:-4px 0 10px;}
.footnote-badge{
  font-size:11.5px;color:var(--ink-soft);background:rgba(43,38,34,.05);border-radius:3px;
  padding:4px 8px;display:flex;gap:4px;align-items:flex-start;line-height:1.4;
}
.footnote-badge sup{color:var(--seal);font-weight:700;margin-right:1px;}
.footnote-badge .fn-del{margin-left:auto;color:var(--ink-soft);cursor:pointer;opacity:.6;flex:0 0 auto;}
.footnote-badge .fn-del:hover{opacity:1;color:var(--seal);}
.tongdian-note{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.archive-cat-row{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.gis-stub{
  border:1px dashed var(--rule);border-radius:4px;padding:8px 10px;font-size:11.5px;color:var(--ink-soft);
  margin-top:6px;
}
.rank-notice{
  border-left:3px solid var(--shu);background:rgba(75,107,75,.08);padding:8px 10px;
  margin:6px 0 10px;font-size:12px;line-height:1.55;color:var(--ink-soft);
}
.person-toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0;}
.person-toolbar .tip{font-size:11px;color:var(--ink-soft);}
.person-card{
  border:1px solid var(--rule);border-radius:6px;background:rgba(255,255,255,.46);
  padding:10px;margin-bottom:10px;
}
.person-card-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.portrait-box{
  width:64px;height:82px;flex:0 0 auto;border:1px solid var(--rule);border-radius:4px;
  background:#EEE7D6;overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);font-size:11px;text-align:center;
}
.portrait-box img{width:100%;height:100%;object-fit:cover;display:block;}
.person-card-title{flex:1;min-width:0;}
.person-card-actions{display:flex;gap:4px;align-items:center;margin-top:6px;}
.year-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.portrait-source{font-size:10.5px;color:var(--ink-soft);line-height:1.45;margin-top:5px;}
.summary-head{
  padding:10px 12px;margin-bottom:12px;background:rgba(43,38,34,.05);border-radius:5px;
  font-size:12px;color:var(--ink-soft);line-height:1.6;
}
.official-card{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--rule);}
.official-portrait{
  width:70px;height:92px;flex:0 0 auto;border-radius:5px;overflow:hidden;background:#E7DFCD;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;text-align:center;
}
.official-portrait img{width:100%;height:100%;object-fit:cover;}
.official-info{flex:1;min-width:0;}
.official-name{font:700 16px 'Noto Serif SC','Songti SC',serif;margin-bottom:5px;}
.appointment-line{font-size:12px;line-height:1.55;margin-bottom:4px;}
.appointment-line .office{font-weight:600;color:var(--seal);}
.appointment-line .period{color:var(--ink-soft);}
.summary-empty{padding:50px 20px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.7;}
.filter-bar{
  display:flex;align-items:center;gap:7px;padding:7px 12px;border-bottom:1px solid var(--rule);
  background:rgba(246,241,228,.88);flex-wrap:wrap;
}
.filter-bar .search-box{width:220px;}
.filter-bar .compact-select{width:128px;}
.filter-tag{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.timeline-bar{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  padding:4px 16px;background:rgba(43,38,34,.035);border-bottom:1px dashed var(--rule);font-size:12px;
}
.timeline-bar .el-slider{margin:0 8px;}
.search-summary{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
.search-result{
  padding:10px 12px;margin-bottom:7px;border:1px solid var(--rule);border-radius:5px;
  background:rgba(255,255,255,.48);cursor:pointer;transition:.12s;
}
.search-result:hover{border-color:var(--seal);transform:translateY(-1px);}
.search-result .title{font:700 14px 'Noto Serif SC','Songti SC',serif;display:flex;align-items:center;gap:7px;}
.search-result .meta{font-size:11px;color:var(--ink-soft);margin-top:4px;}
.search-result .excerpt{font-size:12px;line-height:1.5;margin-top:5px;overflow-wrap:anywhere;}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.metric-card{border:1px solid var(--rule);border-radius:5px;padding:9px;background:rgba(255,255,255,.48);}
.metric-card .value{font:700 20px 'Noto Serif SC','Songti SC',serif;color:var(--seal);}
.metric-card .label{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.batch-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.compare-grid{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:12px;height:calc(100vh - 120px);}
.compare-column{border:1px solid var(--rule);border-radius:6px;overflow:auto;background:rgba(255,255,255,.42);}
.compare-head{position:sticky;top:0;z-index:1;padding:10px 12px;color:white;font:700 15px 'Noto Serif SC',serif;}
.compare-node{font-size:12px;line-height:1.65;border-bottom:1px dashed rgba(43,38,34,.08);padding-right:8px;}
.archive-row{padding:10px 0;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px;}
.archive-info{flex:1;min-width:0;}
.archive-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.archive-time{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.form-inline-note{font-size:11px;color:var(--ink-soft);line-height:1.55;margin-top:5px;}
.warning-inline{padding:7px 9px;border-left:3px solid var(--gold);background:rgba(176,141,63,.09);font-size:11.5px;line-height:1.5;margin:6px 0;}
.toolbar-count{font-size:10px;line-height:16px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--seal);color:white;text-align:center;position:absolute;margin:0 0 24px 24px;}
.palette-row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;}
.person-link{cursor:pointer;color:var(--seal);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
.profile-portrait{width:100px;height:132px;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:#E7DFCD;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;}
.profile-portrait img{width:100%;height:100%;object-fit:cover;}

/* ---------- 2026 简约模块化界面 ---------- */
:root{
  --paper:#F4F3EF;
  --card:#FFFFFF;
  --ink:#202420;
  --ink-soft:#6F756F;
  --rule:#E2E4DF;
  --seal:#8D3D32;
  --gold:#A78345;
}
body{background:#F4F3EF;}
.topbar{
  height:68px;padding:0 18px;gap:14px;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--rule);box-shadow:0 4px 18px rgba(25,32,25,.035);
}
.seal-mark{width:36px;height:36px;border-radius:10px;box-shadow:none;}
.brand{min-width:138px;margin-right:2px;}
.brand .t1{font-size:17px;letter-spacing:2px;}
.brand .t2{font-size:10.5px;letter-spacing:.2px;}
.module-nav{display:flex;align-items:center;gap:5px;padding:4px;background:#F2F3F0;border-radius:11px;flex:0 0 auto;}
.module-tab{height:34px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--ink-soft);font-size:13px;cursor:pointer;transition:.16s;white-space:nowrap;}
.module-tab:hover{color:var(--ink);background:rgba(255,255,255,.6);}
.module-tab.active{color:var(--ink);background:#fff;box-shadow:0 1px 5px rgba(27,34,27,.08);font-weight:600;}
.module-tab.pending{color:#A3A8A2;}
.module-dot{display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:#B8BCB7;vertical-align:1px;}
.module-context{flex:1;min-width:0;color:var(--ink-soft);font-size:12px;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.faction-tabs{gap:4px;padding-left:4px;}
.faction-tab{padding:6px 11px;border-radius:8px;}
.topbar-actions{gap:6px;}
.left-toolbar{width:54px;background:#FAFAF8;border-right:1px solid var(--rule);padding:9px 0;gap:4px;}
.tool-btn{width:36px;height:36px;border-radius:9px;font-size:15px;color:#555C55;}
.tool-btn:hover{background:#ECEEEA;border-color:transparent;}
.canvas-wrap{background:radial-gradient(circle at 1px 1px,rgba(32,36,32,.055) 1px,transparent 0) 0 0/24px 24px,#F5F4F1;}
.canvas-tabs,.filter-bar{background:rgba(255,255,255,.9);}
.canvas-tabs{min-height:48px;padding:8px 14px;gap:6px;}
.mini-tab{padding:5px 11px;border-radius:8px;border:1px solid transparent;background:#F1F2EF;}
.mini-tab:hover{color:var(--ink);}
.mini-tab.active{background:#262B26;color:white;border-color:#262B26;}
.filter-bar{padding:8px 14px;}
.timeline-bar{background:rgba(255,255,255,.72);border-bottom:1px solid var(--rule);padding:5px 16px;}
.right-panel{width:360px;background:#FFFFFF;border-left:1px solid var(--rule);}
.panel-head{padding:16px 18px 12px;}
.panel-body{padding:14px 18px 30px;}
.statusbar{height:30px;background:#292E29;}
.classification-strip{display:flex;align-items:center;gap:7px;padding:8px 14px;border-bottom:1px solid var(--rule);background:#FBFBF9;overflow-x:auto;}
.class-label{font-size:11px;color:var(--ink-soft);white-space:nowrap;margin-right:2px;}
.class-chip{border:1px solid var(--rule);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;color:#596059;cursor:pointer;white-space:nowrap;transition:.15s;}
.class-chip:hover{border-color:#B9BDB7;color:var(--ink);}
.class-chip.active{background:#E9EEE9;border-color:#879687;color:#334033;font-weight:600;}
.class-chip b{font-size:10px;margin-left:5px;color:#8A918A;font-weight:500;}
.office-table-wrap{flex:1;min-height:0;padding:14px;background:#F5F4F1;overflow:auto;}
.office-table-card{height:100%;background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(30,37,30,.035);}
.office-table-card .el-table{height:100%;--el-table-header-bg-color:#F7F8F5;--el-table-row-hover-bg-color:#F2F5F1;}
.scope-pill{display:inline-flex;align-items:center;border-radius:7px;padding:3px 7px;font-size:11px;background:#EDF1ED;color:#4D5E4D;}
.scope-pill.local{background:#F2ECE5;color:#795A3A;}
.module-page{flex:1;min-height:0;overflow:auto;padding:24px 28px 34px;background:#F4F3EF;}
.module-page-inner{max-width:1380px;margin:0 auto;}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px;}
.page-kicker{font-size:11px;color:#8A918A;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:6px;}
.page-heading h1{font:700 25px 'Noto Serif SC','Songti SC',serif;margin:0;color:var(--ink);letter-spacing:1px;}
.page-heading p{margin:7px 0 0;color:var(--ink-soft);font-size:13px;}
.fangzhen-toolbar{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding:12px;background:#fff;border:1px solid var(--rule);border-radius:12px;}
.period-switch{display:flex;gap:4px;padding:3px;background:#F1F2EF;border-radius:9px;}
.period-switch button{border:0;background:transparent;padding:7px 13px;border-radius:7px;color:var(--ink-soft);cursor:pointer;}
.period-switch button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(30,37,30,.08);}
.fangzhen-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;}
.fz-metric{background:#fff;border:1px solid var(--rule);border-radius:11px;padding:13px 15px;}
.fz-metric strong{display:block;font:700 22px 'Noto Serif SC','Songti SC',serif;color:#394239;}
.fz-metric span{font-size:11px;color:var(--ink-soft);}
.fangzhen-table-card{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(30,37,30,.035);}
.fz-person{font-weight:650;color:#303630;}
.fz-title{font-size:12px;color:#687068;margin-top:3px;}
.source-link{color:#5E735E;text-decoration:none;border-bottom:1px dotted #8E9C8E;}
.source-link:hover{color:#2E4D2E;}
.history-map-page{padding:16px 20px 20px;display:flex;flex-direction:column;overflow:hidden;background:#F4F3EF;}
.battle-timebar{flex:0 0 auto;background:#fff;border:1px solid var(--rule);border-radius:13px;padding:11px 13px 10px;margin-bottom:12px;box-shadow:0 6px 22px rgba(30,37,30,.035);}
.battle-time-head{display:flex;align-items:center;gap:12px;margin-bottom:9px;}
.battle-time-title{min-width:220px;display:flex;align-items:baseline;gap:10px;}
.battle-time-title .eyebrow{font-size:10.5px;color:#8A918A;letter-spacing:1px;}
.battle-time-title strong{font:700 18px 'Noto Serif SC','Songti SC',serif;color:var(--ink);}
.battle-time-title span{font-size:12px;color:var(--seal);font-weight:600;}
.battle-time-summary{flex:1;min-width:0;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.map-play-controls{display:flex;gap:5px;}
.map-play-btn{width:32px;height:30px;border:1px solid var(--rule);border-radius:8px;background:#F7F8F5;color:#4F564F;cursor:pointer;display:grid;place-items:center;}
.map-play-btn:hover{background:#ECEFEA;color:var(--ink);}
.map-play-btn.playing{background:#8D3D32;color:white;border-color:#8D3D32;}
.battle-timeline-scroll{overflow-x:auto;padding-bottom:1px;}
.battle-era-track{display:grid;grid-template-columns:repeat(9,minmax(112px,1fr));gap:6px;min-width:1056px;margin-bottom:6px;}
.battle-era-segment{height:24px;border:0;border-radius:7px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--era-color) 10%,#fff);color:var(--era-color);font-size:10.5px;letter-spacing:1px;cursor:pointer;box-shadow:inset 0 -1px color-mix(in srgb,var(--era-color) 28%,transparent);}
.battle-era-segment strong{font:650 11.5px 'Noto Serif SC','Songti SC',serif;}
.battle-era-segment span{opacity:.72;letter-spacing:0;}
.battle-era-segment.active{background:var(--era-color);color:#fff;box-shadow:0 2px 7px color-mix(in srgb,var(--era-color) 23%,transparent);}
.battle-period-track{display:grid;grid-template-columns:repeat(9,minmax(112px,1fr));gap:6px;min-width:1056px;}
.battle-period{position:relative;border:1px solid var(--rule);border-radius:9px;background:#FAFAF8;padding:7px 9px;text-align:left;cursor:pointer;color:#626862;min-width:0;transition:.15s;}
.battle-period:hover{border-color:#AEB5AD;background:#F4F6F2;}
.battle-period.active{background:#EFF3EE;border-color:#809080;color:#2F3D2F;box-shadow:inset 0 0 0 1px #A9B5A8;}
.battle-period.past:before{content:'';position:absolute;left:9px;right:9px;top:-1px;height:2px;background:#A78345;}
.battle-period b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.battle-period span{font-size:10.5px;color:#8B918B;}
.history-map-stage{position:relative;flex:1;min-height:0;border:1px solid var(--rule);border-radius:13px;overflow:hidden;background:#E8E3D7;box-shadow:0 10px 28px rgba(30,37,30,.06);}
.history-map-frame{display:block;width:100%;height:100%;border:0;background:#E8E3D7;}
.map-loading{position:absolute;inset:0;display:grid;place-items:center;background:#F2F1ED;color:#858B85;font-size:13px;letter-spacing:1px;z-index:2;}
.research-note{font-size:11.5px;color:var(--ink-soft);padding:10px 13px;border-top:1px solid var(--rule);background:#FAFAF8;}
.fangzhen-workbench{--fz-accent:#59635B;--fz-pale:#EEF1EE;--fz-deep:#29322B;background:linear-gradient(180deg,var(--fz-pale) 0,#F4F3EF 300px);transition:background .2s;}
.fangzhen-archive-tabs{display:grid;grid-template-columns:repeat(5,minmax(155px,1fr));gap:9px;margin-bottom:14px;}
.fz-archive-button{--archive-color:#59635B;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;min-height:66px;padding:10px 11px;border:1px solid var(--rule);border-radius:12px;background:#fff;color:#596059;text-align:left;cursor:pointer;transition:.16s;box-shadow:0 4px 14px rgba(30,37,30,.025);}
.fz-archive-button:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--archive-color) 42%,#fff);box-shadow:0 8px 18px rgba(30,37,30,.055);}
.fz-archive-button.active{border-color:var(--archive-color);box-shadow:inset 0 0 0 1px var(--archive-color),0 8px 18px rgba(30,37,30,.07);}
.fz-archive-seal{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--archive-color) 11%,#fff);color:var(--archive-color);font:700 17px 'Noto Serif SC','Songti SC',serif;}
.fz-archive-button.active .fz-archive-seal{background:var(--archive-color);color:#fff;}
.fz-archive-copy{min-width:0;}
.fz-archive-copy strong{display:block;color:#333A34;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fz-archive-copy small{display:block;margin-top:3px;color:#8B918B;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fz-archive-count{min-width:27px;height:22px;padding:0 7px;border-radius:11px;display:grid;place-items:center;background:#F0F2EF;color:#737A73;font-size:10.5px;}

function buildWeiArchiveRecords(type, groups){
  const sourceUrl = type==='cishi' ? WEI_CISHI_SOURCE : WEI_DUDU_SOURCE;
  const sourceTitle = type==='cishi' ? '维基百科：曹魏刺史列表' : '维基百科：曹魏都督列表';
  const rows=[];
  groups.forEach((group,groupIndex)=>{
    group.entries.forEach((entry,entryIndex)=>{
      const years=(String(entry[1]||'').match(/(?:1|2)\d{2}(?=年)/g)||[]).map(Number);
      rows.push({
        id:'wei_'+type+'_'+groupIndex+'_'+entryIndex,
        type, region:group.region, office:group.office,
        name:entry[0], tenure:entry[1], note:entry[2]||'',
        startYear:years.length?years[0]:null,
        endYear:years.length?years[years.length-1]:null,
        sourceTitle, sourceUrl,
      });
    });
  });
  return rows;
}

(function(){

  var EARTH_RADIUS=6378137;
  var PROVINCE_KEYS={
    'Bingzhou':'bingzhou','Jiaozhou':'jiaozhou','Jingzhou (Wei)':'jing_wei',
    'Jingzhou (Wu)':'jing_wu','Jizhou':'jizhou','Liangzhou':'liangzhou',
    'Qingzhou':'qingzhou','Sili':'sili','Xuzhou':'xuzhou',
    'Yangzhou (Wei)':'yang_wei','Yangzhou (Wu)':'yang_wu','Yanzhou':'yanzhou',
    'Yizhou (North)':'yizhou','Yizhou (South)':'yizhou','Yongzhou':'yongzhou',
    'Youzhou':'youzhou','Yuzhou':'yuzhou'
  };

  function lonLat(point){
    var lon=point[0]/EARTH_RADIUS*180/Math.PI;
    var lat=(2*Math.atan(Math.exp(point[1]/EARTH_RADIUS))-Math.PI/2)*180/Math.PI;
    return [Number(lon.toFixed(5)),Number(lat.toFixed(5))];
  }
  function simplifyRing(points){
    if(!points||points.length<=4) return points||[];
    var tolerance=6000;
    var sqTolerance=tolerance*tolerance;
    var result=[points[0]];
    var previous=points[0];
    for(var i=1;i<points.length-1;i+=1){
      var point=points[i];
      var dx=point[0]-previous[0];
      var dy=point[1]-previous[1];
      if(dx*dx+dy*dy>=sqTolerance){
        result.push(point);
        previous=point;
      }
    }
    result.push(points[points.length-1]);
    return result.length>=4?result:points;
  }

    if(geometry.type==='Polygon'){
      return {type:'Polygon',coordinates:geometry.coordinates.map(function(ring){
        return simplifyRing(ring).map(lonLat);
      })};
    }
    return {type:'MultiPolygon',coordinates:geometry.coordinates.map(function(polygon){
      return polygon.map(function(ring){return simplifyRing(ring).map(lonLat);});

      members.forEach(function(feature){parts=parts.concat(polygonParts(feature.geometry));});
      var combined={type:'MultiPolygon',coordinates:parts};
      var first=members[0].properties;
      return {
        key:key,
        name:key==='sili'&&mode==='late'?'司州':cleanProvinceName(first.Name_CHS),
        kingdom:mode==='jin'?'jin':first.kingdom,
        label:geometryLabel(combined),
        geometry:convertGeometry(combined)
      };
    });
  }
  function commanderyName(name){
    name=String(name||'').replace(/楗\\/犍为|楗为/g,'犍为');
    return /(?:国|州|校尉)$/.test(name)?name:name+'郡';
  }
  function buildCommanderies(source){
    return source.filter(function(feature){return feature.properties.level==='commandery';}).map(function(feature){
      var properties=feature.properties;
      return {
        key:'commandery_'+properties.id,
        name:commanderyName(properties.Name_CHS),
        state:cleanProvinceName(properties.Prov_CHS),
        kingdom:properties.kingdom,
        sourceName:properties.Name_EN,
        sourceProvince:properties.Prov_EN,
        label:geometryLabel(feature.geometry),
        geometry:convertGeometry(feature.geometry)
      };
    });
  }
  /*
   * 184 年郡名采用东汉当时名称；262 年资料中明确晚置的郡不在汉视图重复出现。
   * 州界则将全部后世细分郡重新归并为东汉十三州部，以免过滤后留下空洞。
   */
  var HAN_184_KEEP={
    'Bingzhou':['Shangdang','Yanmen','Taiyuan','Xihe'],
    'Yangzhou (Wei)':['Lujiang','Huainan'],
    'Yuzhou':['Pei State','Liang State','Runan','Chen','Yingchuan'],
    'Yanzhou':['Taishan','Shanyang','Rencheng','Jibei State','Dongping State','Jiyin','Chenliu State','Dong','Lu'],
    'Qingzhou':['Jinan State','Qi State','Beihai State','Donglai',"Le'an"],
    'Xuzhou':['Xiapi','Guangling','Donghai State','Langya State','Pengcheng State'],
    'Sili':['Hongnong','Henei','Henan','Hedong'],
    'Yangzhou (Wu)':['Danyang','Guiji / Kuaiji','Lujiang','Wu','Yuzhang'],
    'Jingzhou (Wu)':['Guiyang','Lingling','Wuling','Changsha','Jiangxia','Nan'],
    'Jingzhou (Wei)':['Nanyang'],
    'Yizhou (South)':['Yongchang','Jianning','Zangke','Yuesui'],
    'Yizhou (North)':['Ba','Jianwei','Guanghan','Shu','Hanzhong','Wudu'],
    'Jiaozhou':['Rinan','Jiaozhi','Jiuzhen','Yulin','Hepu','Cangwu','Nanhai'],
    'Youzhou':['Lelang','Xuantu','Liaodong','Liaoxi','Youbeiping','Yuyang','Yan State','Fanyang','Shanggu','Dai'],
    'Liangzhou':['Dunhuang','Zhangye','Wuwei','Jincheng','Jiuquan'],
    'Yongzhou':['Jingzhao','Beidi','Fufeng','Tianshui','Longxi','Pingyi','Anding'],
    'Jizhou':['Pingyuan','Bohai','Hejian','Anping','Julu','Zhao State','Wei','Changshan','Qinghe','Zhongshan State']
  };
  var HAN_NAME_184={
    'Huainan':'九江郡',
    'Jianning':'益州郡',
    'Fanyang':'涿郡',
    'Jianwei':'犍为郡'
  };
  var STATE_KEYS={
    '司隶':'sili','并州':'bingzhou','冀州':'jizhou','兖州':'yanzhou','豫州':'yuzhou',
    '青州':'qingzhou','徐州':'xuzhou','扬州':'yangzhou','荆州':'jingzhou',
    '益州':'yizhou','凉州':'liangzhou','幽州':'youzhou','交州':'jiaozhou',
    '广州':'guangzhou'
  };
  function hanStateInfo(feature){
    var province=feature.sourceProvince;
    var sourceName=feature.sourceName;
    if(province.indexOf('Jingzhou')===0) return {key:'jingzhou',name:'荆州',kingdom:'han'};
    if(province.indexOf('Yangzhou')===0) return {key:'yangzhou',name:'扬州',kingdom:'han'};
    if(province.indexOf('Yizhou')===0) return {key:'yizhou',name:'益州',kingdom:'han'};
    if(province==='Yongzhou'){
      if(['Jingzhao','Fufeng','Pingyi'].indexOf(sourceName)!==-1) return {key:'sili',name:'司隶',kingdom:'han'};
      return {key:'liangzhou',name:'凉州',kingdom:'han'};
    }
    if(province==='Jizhou'&&sourceName==='Pingyuan') return {key:'qingzhou',name:'青州',kingdom:'han'};
    var names={
      'Bingzhou':'并州','Jiaozhou':'交州','Jizhou':'冀州','Liangzhou':'凉州',
      'Qingzhou':'青州','Sili':'司隶','Xuzhou':'徐州','Yanzhou':'兖州',
      'Youzhou':'幽州','Yuzhou':'豫州'
    };
    var name=names[province]||cleanProvinceName(feature.state);
    return {key:STATE_KEYS[name]||String(province).toLowerCase(),name:name,kingdom:'han'};
  }
  function jin266StateInfo(feature){
    var province=feature.sourceProvince;
    var sourceName=feature.sourceName;
    var kingdom=feature.kingdom==='wu'?'wu':'jin';
    if(province==='Jiaozhou'){
      var guang=['Nanhai','Cangwu','Yulin','Gaoliang','Hepu'];
      return guang.indexOf(sourceName)!==-1
        ?{key:'guangzhou',name:'广州',kingdom:'wu'}
        :{key:'jiaozhou',name:'交州',kingdom:'wu'};
    }
    if(province==='Jingzhou (Wei)') return {key:'jing_wei',name:'荆州',kingdom:'jin'};
    if(province==='Jingzhou (Wu)') return {key:'jing_wu',name:'荆州',kingdom:'wu'};
    if(province==='Yangzhou (Wei)') return {key:'yang_wei',name:'扬州',kingdom:'jin'};
    if(province==='Yangzhou (Wu)') return {key:'yang_wu',name:'扬州',kingdom:'wu'};
    if(province.indexOf('Yizhou')===0) return {key:'yizhou',name:'益州',kingdom:'jin'};
    var names={
      'Bingzhou':'并州','Jizhou':'冀州','Liangzhou':'凉州','Qingzhou':'青州',
      'Sili':'司州','Xuzhou':'徐州','Yanzhou':'兖州','Yongzhou':'雍州',
      'Youzhou':'幽州','Yuzhou':'豫州'
    };
    var keys={
      'Bingzhou':'bingzhou','Jizhou':'jizhou','Liangzhou':'liangzhou',
      'Qingzhou':'qingzhou','Sili':'sili','Xuzhou':'xuzhou','Yanzhou':'yanzhou',
      'Yongzhou':'yongzhou','Youzhou':'youzhou','Yuzhou':'yuzhou'
    };
    return {key:keys[province]||String(province).toLowerCase(),name:names[province]||feature.state,kingdom:kingdom};
  }
  function jin280StateInfo(feature){
    var province=feature.sourceProvince;
    var sourceName=feature.sourceName;
    if(province==='Jiaozhou'){
      return ['Nanhai','Cangwu','Yulin','Gaoliang','Hepu'].indexOf(sourceName)!==-1
        ?{key:'guangzhou',name:'广州',kingdom:'jin'}
        :{key:'jiaozhou',name:'交州',kingdom:'jin'};
    }
    if(province==='Youzhou'){
      return ['Changli','Liaodong','Xuantu','Daifang','Lelang'].indexOf(sourceName)!==-1
        ?{key:'pingzhou',name:'平州',kingdom:'jin'}
        :{key:'youzhou',name:'幽州',kingdom:'jin'};
    }
    if(province==='Yongzhou'){
      return ['Longxi',"Nan'an",'Tianshui','Guangwei'].indexOf(sourceName)!==-1
        ?{key:'qinzhou',name:'秦州',kingdom:'jin'}
        :{key:'yongzhou',name:'雍州',kingdom:'jin'};
    }
    if(province==='Liangzhou'){
      return sourceName==='Jincheng'
        ?{key:'qinzhou',name:'秦州',kingdom:'jin'}
        :{key:'liangzhou',name:'凉州',kingdom:'jin'};
    }
    if(province==='Yizhou (North)'){
      if(['Wudu','Yinping'].indexOf(sourceName)!==-1) return {key:'qinzhou',name:'秦州',kingdom:'jin'};
      if(['Hanzhong','Zitong','Guanghan','Dongguanghan','Fuling','Ba','Baxi','Badong'].indexOf(sourceName)!==-1){
        return {key:'liang_state',name:'梁州',kingdom:'jin'};
      }
      return {key:'yizhou',name:'益州',kingdom:'jin'};
    }
    if(province==='Yizhou (South)'){
      return ['Yongchang','Xinggu','Jianning','Yunnan'].indexOf(sourceName)!==-1
        ?{key:'ningzhou',name:'宁州',kingdom:'jin'}
        :{key:'yizhou',name:'益州',kingdom:'jin'};
    }
    if(province.indexOf('Jingzhou')===0) return {key:'jingzhou',name:'荆州',kingdom:'jin'};
    if(province.indexOf('Yangzhou')===0) return {key:'yangzhou',name:'扬州',kingdom:'jin'};
    var names={
      'Bingzhou':'并州','Jizhou':'冀州','Qingzhou':'青州','Sili':'司州',
      'Xuzhou':'徐州','Yanzhou':'兖州','Yuzhou':'豫州'
    };
    var keys={
      'Bingzhou':'bingzhou','Jizhou':'jizhou','Qingzhou':'qingzhou',
      'Sili':'sili','Xuzhou':'xuzhou','Yanzhou':'yanzhou','Yuzhou':'yuzhou'
    };
    return {key:keys[province]||String(province).toLowerCase(),name:names[province]||feature.state,kingdom:'jin'};
  }
  function buildHistoricalProvinces(commanderies,infoFor){
    var groups={};
    commanderies.forEach(function(feature){
      var info=infoFor(feature);
      if(!groups[info.key]) groups[info.key]={info:info,members:[]};
      groups[info.key].members.push(feature);
    });
    return Object.keys(groups).map(function(key){
      var group=groups[key];
      var parts=[];
      group.members.forEach(function(feature){parts=parts.concat(polygonParts(feature.geometry));});
      var combined={type:'MultiPolygon',coordinates:parts};
      return {
        key:key,name:group.info.name,kingdom:group.info.kingdom,
        label:geometryLabelWgs(combined),geometry:combined
      };
    });
  }
  function buildHan184Commanderies(commanderies){
    var normalized=commanderies.filter(function(feature){
      var allowed=HAN_184_KEEP[feature.sourceProvince]||[];
      return allowed.indexOf(feature.sourceName)!==-1;
    }).map(function(feature){
      var info=hanStateInfo(feature);
      return Object.assign({},feature,{
        name:HAN_NAME_184[feature.sourceName]||feature.name,
        state:info.name,kingdom:'han'
      });
    });
    var groups={};
    normalized.forEach(function(feature){
      var key=feature.state+'|'+feature.name;
      if(!groups[key]) groups[key]={first:feature,parts:[]};
      groups[key].parts=groups[key].parts.concat(polygonParts(feature.geometry));
    });
    return Object.keys(groups).map(function(key){
      var group=groups[key];
      var geometry={type:'MultiPolygon',coordinates:group.parts};
      return Object.assign({},group.first,{geometry:geometry,label:geometryLabelWgs(geometry)});
    });
  }
  function mergeNamedCommanderies(commanderies){
    var groups={};
    commanderies.forEach(function(feature){
      var key=feature.kingdom+'|'+feature.state+'|'+feature.name;
      if(!groups[key]) groups[key]={first:feature,parts:[]};
      groups[key].parts=groups[key].parts.concat(polygonParts(feature.geometry));
    });
    return Object.keys(groups).map(function(key){
      var group=groups[key];
      var geometry={type:'MultiPolygon',coordinates:group.parts};
      return Object.assign({},group.first,{geometry:geometry,label:geometryLabelWgs(geometry)});
    });
  }
  function prepareGeoData(payload){
    var source=payload.features||[];
    var commanderies=buildCommanderies(source);
    var han184=buildHan184Commanderies(commanderies);
    var jin266=commanderies.map(function(feature){
      var info=jin266StateInfo(feature);
      return Object.assign({},feature,{state:info.name,kingdom:info.kingdom});
    });
    var wei263=commanderies.map(function(feature){
      return Object.assign({},feature,{
        state:feature.sourceProvince==='Sili'?'司州':feature.state,
        kingdom:feature.kingdom==='wu'?'wu':'wei'
      });
    });
    var jin280=mergeNamedCommanderies(commanderies.map(function(feature){
      var info=jin280StateInfo(feature);
      var correctedName=feature.sourceName==='Guangwei'?'略阳郡'
        :(feature.sourceName==='Dongguanghan'?'新都郡':feature.name);
      return Object.assign({},feature,{name:correctedName,state:info.name,kingdom:'jin'});
    }));
    return {
      provinces:{
        early:buildProvinces(source,'early'),
        han184:buildHistoricalProvinces(commanderies,hanStateInfo),
        late:buildProvinces(source,'late'),
        jin266:buildHistoricalProvinces(commanderies,jin266StateInfo),
        jin:buildHistoricalProvinces(jin280,jin280StateInfo)
      },
      commanderies:han184,
      shu:commanderies,
      wu:wei263,
      jin:jin280,
      wei263:wei263,
      jin266:jin266
    };
  }
  function getJson(url){
    return fetch(url,{mode:'cors'}).then(function(response){
      if(!response.ok) throw new Error('HTTP '+response.status);
      return response.json();
    });
  }
  var geoReady=getJson(GEO_SOURCE).then(prepareGeoData).then(function(data){
    window.__HISTORY_GEO_DATA=data;
    return data;
  });
  window.__historyMapGeoReady=geoReady;

  var nativeAppend=document.head.appendChild.bind(document.head);
  document.head.appendChild=function(node){
    var src=node&&node.tagName==='SCRIPT'?String(node.getAttribute('src')||''):'';
    var provinceMatch=src.match(/data\\/geo-provinces-(early|late|jin|han184|jin266)\\.js$/);
    var isGeoScript=provinceMatch||
      /data\\/geo-wu-commanderies-263\\.js$/.test(src)||
      /data\\/geo-commanderies-jin\\.js$/.test(src)||
      /data\\/geo-shu-commanderies\\.js$/.test(src)||
      /data\\/geo-commanderies\\.js$/.test(src);
    if(!isGeoScript) return nativeAppend(node);
    geoReady.then(function(data){
      if(provinceMatch) window.GEO_PROVINCES=data.provinces[provinceMatch[1]];
      else if(/geo-wu-commanderies-263\\.js$/.test(src)){
        var activeVariant=window.__activeMapVariant==='jin266'?'jin266':'wei263';
        window.GEO_WU_COMMANDERIES_263=data[activeVariant];
      }
      else if(/geo-commanderies-jin\\.js$/.test(src)) window.GEO_COMMANDERIES_JIN=data.jin;
      else if(/geo-shu-commanderies\\.js$/.test(src)) window.GEO_SHU_COMMANDERIES=data.shu;
      else window.GEO_COMMANDERIES=data.commanderies;
      if(typeof node.onload==='function') node.onload();
    }).catch(function(error){
      console.error('州郡边界资料载入失败：',error);
      var body=document.querySelector('#info-panel .panel-body');
      if(body) body.innerHTML='<div class="pv-head"><h2 class="pv-title">地图资料载入失败</h2></div><p class="pv-summary">请检查网络连接后重新打开页面。</p>';
      if(typeof node.onerror==='function') node.onerror(error);
    });
    return node;
  };
})();

<script>
/* 州、郡同国同系分色；两套郡界互斥，避免跨时期切换时残留叠线。 */
(function(){
  var TONES=['#F2E6D2','#DCE7DF','#E5E0ED','#ECDDD8','#DFE5CF','#D9E6EA','#EADFC8'];
  function rgb(hex){
    var value=String(hex||'#6c675e').replace('#','');
    if(value.length===3) value=value.split('').map(function(c){return c+c;}).join('');
    return [parseInt(value.slice(0,2),16),parseInt(value.slice(2,4),16),parseInt(value.slice(4,6),16)];
  }
  function mix(a,b,ratio){
    var one=rgb(a),two=rgb(b);
    var out=one.map(function(value,index){return Math.round(value*(1-ratio)+two[index]*ratio);});
    return '#'+out.map(function(value){return value.toString(16).padStart(2,'0');}).join('');
  }
  function hash(value){
    return Array.from(String(value||'')).reduce(function(total,char){return (total*31+char.charCodeAt(0))>>>0;},7);
  }
  function historicalColor(feature,factionId,level){
    var faction=FACTIONS[factionId]||FACTIONS[feature.kingdom]||{color:'#746c60'};
    var stateTone=TONES[hash(feature.state||feature.key)%TONES.length];
    var color=mix(faction.color,stateTone,level==='province'?0.34:0.27);
    if(level==='commandery'){
      color=mix(color,TONES[hash(feature.key)%TONES.length],.10);
    }
    return color;
  }
  var labelLayoutTimer=0;
  function overlaps(a,b,padding){
    return !(a.right+padding<b.left||a.left-padding>b.right||a.bottom+padding<b.top||a.top-padding>b.bottom);
  }
  function declutterLabels(){
    var countries=Array.from(document.querySelectorAll('.faction-label'));
    var provinces=Array.from(document.querySelectorAll('.province-label'));
    var commanderies=Array.from(document.querySelectorAll('.cmd-label'));
    var all=countries.concat(provinces,commanderies);
    all.forEach(function(label){label.style.visibility='visible';});
    var accepted=[];
    countries.forEach(function(label){
      var rect=label.getBoundingClientRect();
      if(rect.width&&rect.height) accepted.push(rect);
    });
    provinces.forEach(function(label){
      var rect=label.getBoundingClientRect();
      var blocked=accepted.some(function(used){return overlaps(rect,used,3);});
      if(blocked) label.style.visibility='hidden';
      else if(rect.width&&rect.height) accepted.push(rect);
    });
    commanderies.forEach(function(label){
      var rect=label.getBoundingClientRect();
      var blocked=accepted.some(function(used){return overlaps(rect,used,1);});
      if(blocked) label.style.visibility='hidden';
      else if(rect.width&&rect.height) accepted.push(rect);
    });
  }
  function scheduleLabelLayout(){
    clearTimeout(labelLayoutTimer);
    labelLayoutTimer=setTimeout(declutterLabels,90);
  }
  window.addEventListener('resize',scheduleLabelLayout);
  var mapApp=document.getElementById('app');
  if(mapApp){
    new MutationObserver(scheduleLabelLayout).observe(mapApp,{attributes:true,attributeFilter:['class']});
  }
  var renderTerritories=Territories.render;
  Territories.render=function(map,features,mapping,opts){
    var result=renderTerritories.apply(Territories,arguments);
    requestAnimationFrame(function(){
      var all=Array.from(document.querySelectorAll('.territory'));
      var current=all.slice(-features.length);
      current.forEach(function(path,index){
        var feature=features[index];
        var factionId=(mapping&&mapping[feature.key])||feature.kingdom;
        path.style.setProperty('fill',historicalColor(feature,factionId,'province'),'important');
      });
      scheduleLabelLayout();
    });
    return result;
  };
  var renderWu=WuCommanderies.render;
  var renderGeneral=Commanderies.render;
  WuCommanderies.render=function(map,opts){
    Commanderies.hide();
    window.GEO_WU_COMMANDERIES_263=(window.GEO_WU_COMMANDERIES_263||[]).map(function(feature){
      return Object.assign({},feature,{color:historicalColor(feature,feature.kingdom,'commandery')});
    });
    var result=renderWu.call(WuCommanderies,map,opts);
    scheduleLabelLayout();
    return result;
  };
  Commanderies.render=function(map,data,opts){
    WuCommanderies.hide();
    var colored=(data||[]).map(function(feature){
      return Object.assign({},feature,{color:historicalColor(feature,feature.kingdom,'commandery')});
    });
    var result=renderGeneral.call(Commanderies,map,colored,opts);
    scheduleLabelLayout();
    return result;
  };
})();

(function(){
  function factionsFor(periodId){
    var def=PROVINCE_PERIODS[periodId]||{};
    var map=def.provinces||{};
    var ids=Array.from(new Set(Object.values(map)));
    var order=['han','dongzhuo','lianjun','yuan_shao','caocao','liubiao','liuzhang','liubei','sunquan','liangzhou','shikie','wei','shu','wu','jin'];
    return order.filter(function(id){return ids.indexOf(id)!==-1&&FACTIONS[id];}).map(function(id){return FACTIONS[id];});
  }
  Panel.periodView=function(p){
    var periodLabel=p.range?('公元 '+p.range+' 年'):((p.year||'')+' 年');
    var events=(p.events||[]).map(function(e){
      return '<li><span class="ev-year">'+e.year+'</span><span class="ev-text"><span class="ev-era">'+(e.era||'')+'</span><span class="ev-emperor">'+(e.emperor?' · '+e.emperor:'')+'</span><span class="ev-desc">'+e.text+'</span></span></li>';
    }).join('');
    var reigns=(p.reigns||[]).map(function(r){
      return '<div class="reign-row"><span class="reign-era">'+r.era+'</span><span class="reign-emp">'+r.emperor+'</span><span class="reign-yr">'+(r.years||'')+'</span></div>';
    }).join('');
    var terr=factionsFor(p.id).map(function(f){
      return '<span class="chip" style="--c:'+f.color+'">'+f.name+'</span>';
    }).join('');
    var research=p.researchNote?'<div class="pv-source-note"><strong>考据说明</strong><br>'+p.researchNote+'</div>':'';
    var panel=document.getElementById('info-panel');
    panel.querySelector('.panel-body').innerHTML=
      '<div class="pv-head"><div class="pv-year">'+periodLabel+'</div><h2 class="pv-title">'+p.name+
      '</h2><div class="pv-tag">'+p.tagline+'</div></div><p class="pv-summary">'+p.summary+
      '</p><div class="pv-section"><div class="pv-label">国家与政权</div><div class="pv-chips">'+terr+
      '</div></div><div class="pv-section"><div class="pv-label">年号与皇帝</div><div class="pv-reigns">'+reigns+
      '</div></div><div class="pv-section"><div class="pv-label">编年要事</div><ul class="ev-list">'+events+
      '</ul></div>'+research+'<div class="pv-hint">点击地图上的城池、战役或州郡，以观其详。</div>';
    panel.classList.add('is-open');
  };
  document.addEventListener('DOMContentLoaded',function(){
    if(window.innerWidth<=760){
      document.getElementById('sidebox')?.classList.add('is-collapsed');
      document.getElementById('info-panel')?.classList.add('is-collapsed');
    }
  });
})();

(function(){
  var originalInit=Timeline.init.bind(Timeline);

        if(geo&&geo[variant]) window.GEO_WU_COMMANDERIES_263=geo[variant];

function normalizeYear(value){
  if(value === '' || value === null || value === undefined) return null;
  const n = Number(value);
  return Number.isFinite(n) ? Math.trunc(n) : null;
}

function makeFigureRecord(source){
  const raw = source || {};
  return {
    id: raw.id || figureKey(),
    name: String(raw.name || raw.person || '').trim(),
    portrait: typeof (raw.portrait || raw.image) === 'string' ? (raw.portrait || raw.image) : '',
    rulerKey: String(raw.rulerKey || raw.periodKey || ''),
    startYear: normalizeYear(raw.startYear),
    endYear: normalizeYear(raw.endYear),
    note: String(raw.note || ''),
  };
}

function normalizeFigures(rawFigures, factionKey){
  if(!Array.isArray(rawFigures)) return [];
  const records = [];
  rawFigures.forEach(raw=>{
    if(typeof raw === 'string'){
      const defaults = LEGACY_FIGURE_DEFAULTS[factionKey] && LEGACY_FIGURE_DEFAULTS[factionKey][raw];
      (defaults || [{name:raw}]).forEach(item=>records.push(makeFigureRecord(item)));
    } else if(raw && typeof raw === 'object') records.push(makeFigureRecord(raw));
  });
  const ids = new Set();
  records.forEach(record=>{
    if(ids.has(record.id)) record.id = figureKey();
    ids.add(record.id);
  });
  return records;
}

function nextUniqueKey(prefix, occupied){
  let key;
  do { key = nk(prefix); } while(occupied.has(key));
  occupied.add(key);
  return key;
}

function O(prefix, parent, name, category, rank9, hanRank, extra){
  const k = nk(prefix);
  const node = Object.assign({
    key:k, kind:'office', name, category, rank9: rank9||'', hanRank: hanRank||'',
    duty:'', figures:[], region:'', regionPath:[], jie:'无', kaifu:false, yaoling:false, worldTangBing:false,
    lushangshushi:false, jiaguan:'无',
    virtual:false, temporary:false, archived:false, hidden:false, customTags:[], aliases:'',
    officeStartYear:null, officeEndYear:null, sources:'', evolution:'', relationType:'', directRules:'',
    polity:'', note:'', locked:false, color:'', icon:'', mountId:'', footnotes:[]
  }, extra||{});
  // GoJS 3.x 要求根节点完全不带 parent；parent:null 会令整个 TreeModel 构建失败。
  if(parent !== null && parent !== undefined && parent !== '') node.parent = parent;
  return node;
}
function N(prefix, parent, name, nobleRank, extra){
  const k = nk(prefix);

  return node;
}

      .map(nm=>O('tribal_o', huguan[0].key, nm, '属国护官', '五品', '比二千石', {polity:'匈奴'}));

      .map(nm=>O('tribal_o', huguan[1].key, nm, '部族首领', '', '', {polity:'乌桓', duty:'汉朝赐印绶封号，羁縻部族首领'}));

    const officeNodes = [root, chanyu, daduhu, ...xianwang, ...buluo, ...huguan, ...shuguo, ...guiyi];

    const nroot = N('tribal_n', null, '异族封授爵位', '', {kind:'root', polity:'异族诸部'});
    const shuaizhongwang = N('tribal_n', nroot.key, '率众王（汉封）', '名号侯', {polity:'乌桓', inherit:'虚封遥授', mountId: guiyi[1].key});

    const shizhang = N('tribal_n', qianzhang.key, '什长', '二十等爵（其他）', {polity:'匈奴', inherit:'世袭罔替'});
    const nobleNodes = [nroot, shuaizhongwang, guiyihou, qianzhang, shizhang];

    P.tribal = { office: officeNodes, noble: nobleNodes };
  }

  return P;
}


function cloneJSON(value){ return JSON.parse(JSON.stringify(value)); }
function normalizeFangzhenRecords(rows){
  return cloneJSON(Array.isArray(rows)?rows:[]).map(record=>{
    if(record.polity==='季汉'||record.polity==='蜀汉') record.polity='汉';
    ['note','title','jurisdiction'].forEach(field=>{
      if(typeof record[field]==='string') record[field]=record[field].replace(/蜀汉|季汉/g,'汉');
    });
    return record;
  });
}

function normalizeAndValidateNodes(nodes, label, factionKey){
  if(!Array.isArray(nodes)) throw new Error(label+'必须是节点数组');
  const keys = new Set();
  nodes.forEach((node, idx)=>{
    if(!node || typeof node!=='object' || Array.isArray(node)) throw new Error(label+'第 '+(idx+1)+' 条不是有效节点');
    if(!['string','number'].includes(typeof node.key) || String(node.key).trim()==='') throw new Error(label+'第 '+(idx+1)+' 条缺少有效 key');
    if(keys.has(node.key)) throw new Error(label+'存在重复 key：'+node.key);
    keys.add(node.key);
    if(node.parent === null || node.parent === undefined || node.parent === '') delete node.parent;
    else if(!['string','number'].includes(typeof node.parent)) throw new Error('节点「'+(node.name||node.key)+'」的 parent 必须是字符串或数字');
    node.figures = normalizeFigures(node.figures, factionKey);
    node.regionPath = Array.isArray(node.regionPath) ? node.regionPath.map(String) : [];
    node.customTags = Array.isArray(node.customTags) ? node.customTags.map(String).filter(Boolean) : [];
    node.officeStartYear = normalizeYear(node.officeStartYear ?? node.establishedYear);
    node.officeEndYear = normalizeYear(node.officeEndYear ?? node.abolishedYear);
    node.archived = Boolean(node.archived);
    node.hidden = Boolean(node.hidden);
    node.locked = Boolean(node.locked);
    node.sources = String(node.sources || node.source || '');
    node.polity = String(node.polity || node.country || node.tribe || '');
    node.footnotes = Array.isArray(node.footnotes) ? node.footnotes.filter(f=>f && f.text).map(f=>({
      id: f.id || ('fn_'+Math.random().toString(36).slice(2)), field: String(f.field||'备注'), text: String(f.text||'')
    })) : [];
    if(node.kind==='office'){
      node.category = String(node.category || '其他');
      if(node.category==='临时考据') node.category='其他';
      node.duty = String(node.duty || '');
      node.region = String(node.region || '');
      node.jie = String(node.jie || '无');
      node.kaifu = Boolean(node.kaifu);
      node.yaoling = Boolean(node.yaoling);
      node.worldTangBing = Boolean(node.worldTangBing);
      node.lushangshushi = Boolean(node.lushangshushi);
      node.jiaguan = String(node.jiaguan || '无');
      node.virtual = Boolean(node.virtual);
      node.temporary = Boolean(node.temporary);
      node.aliases = String(node.aliases || '');
      node.evolution = String(node.evolution || '');
      node.relationType = String(node.relationType || '');
      node.directRules = String(node.directRules || '');
    } else if(node.kind==='noble'){
      node.actualFief = node.actualFief !== false;
    }
    if(factionKey==='shu' && node.kind==='office') node.rank9 = '';
    if(factionKey==='shu' && node.kind==='root'){
      if(node.name==='蜀汉官制'||node.name==='季汉官制') node.name='汉官制';
      if(node.name==='蜀汉爵制'||node.name==='季汉爵制') node.name='汉爵制';
    }
    if(factionKey==='tribal' && node.kind==='root'){
      if(node.name==='边疆异族官制') node.name='异族官制';
      if(node.name==='边疆封授爵位') node.name='异族封授爵位';
    }
  });

  const byKey = new Map(nodes.map(node=>[node.key, node]));
  nodes.forEach(node=>{
    if(node.parent !== undefined && !byKey.has(node.parent)) throw new Error('节点「'+(node.name||node.key)+'」引用了不存在的上级 key：'+node.parent);
    const chain = new Set();
    let cursor = node;
    while(cursor && cursor.parent !== undefined){
      if(chain.has(cursor.key)) throw new Error('节点「'+(node.name||node.key)+'」的上级关系形成循环');
      chain.add(cursor.key);
      cursor = byKey.get(cursor.parent);
    }
  });
  return nodes;
}

function normalizeAndValidateTrees(rawTrees){
  if(!rawTrees || typeof rawTrees!=='object' || Array.isArray(rawTrees)) throw new Error('trees 必须是对象');
  const trees = cloneJSON(rawTrees);
  let fallback = null;
  FACTIONS.forEach(faction=>{
    let group = trees[faction.key];
    if(!group || typeof group!=='object'){
      // 兼容旧版工程（如缺少后续新增的“两晋官制”）：自动补入该势力的默认预设模板
      if(!fallback) fallback = buildPresets();
      group = cloneJSON(fallback[faction.key]) || { office:[], noble:[] };
      trees[faction.key] = group;
    }
    group.office = normalizeAndValidateNodes(group.office||[], faction.name+'官职体系', faction.key);
    group.noble = normalizeAndValidateNodes(group.noble||[], faction.name+'爵位体系', faction.key);
  });
  return trees;
}

    /* ---------- 撤销/重做 + 操作日志 + 命名版本 ---------- */
    const history = reactive({ stack: [], index: -1 });
    const versions = reactive({ list: [] });

    function snapshotAll(){ return {trees:cloneJSON(data.trees),fangzhenRecords:cloneJSON(fangzhenRecords.value)}; }
    function pushHistory(label){
      history.stack = history.stack.slice(0, history.index+1);
      history.stack.push({ label, time: nowStr(), snap: snapshotAll() });
      history.index = history.stack.length - 1;
      if(history.stack.length > 60){ history.stack.shift(); history.index--; }
    }
    function nowStr(){
      const d = new Date();
      return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0');
    }
    function applySnapshot(snap){
      const treeSnap=snap && snap.trees ? snap.trees : snap;

      selectedKey.value = null;
      rebuildModel();
    }
    function undo(){
      if(history.index <= 0){ ElementPlus.ElMessage.info('已到最早状态'); return; }
      history.index--;
      applySnapshot(history.stack[history.index].snap);
    }
    function redo(){
      if(history.index >= history.stack.length-1){ ElementPlus.ElMessage.info('已到最新状态'); return; }
      history.index++;
      applySnapshot(history.stack[history.index].snap);
    }
    function jumpToHistory(idx){
      history.index = idx;
      applySnapshot(history.stack[idx].snap);
    }

    function rankIdx(r){ const i = RANK9_OPTIONS.indexOf(r); return i<0?99:i; }
    function findNode(key){ return currentArr.value.find(n=>n.key===key); }
    function validateReparent(child, newParent){
      if(!validationEnabled.value) return { ok:true };
      if(!child || !newParent) return { ok:false, msg:'缺少拖拽节点或目标节点。' };
      if(child.kind==='root') return { ok:false, msg:'根节点不能改挂到其他节点。' };
      if(newParent.kind!=='root' && child.kind!==newParent.kind) return { ok:false, msg:'官职与爵位属于不同体系，不能跨体系直接挂靠。' };
      if(child.kind==='office' && newParent.kind==='office'){
        const allowedParents = CATEGORY_PARENT_RULES[child.category];
        if(allowedParents && !allowedParents.includes(newParent.category)){
          return { ok:false, msg:'体系校验未通过：「'+child.category+'」不可归入「'+newParent.category+'」分支。' };
        }
        if(currentFaction.value!=='shu' && child.rank9 && newParent.rank9 && rankIdx(child.rank9) < rankIdx(newParent.rank9)){
          return { ok:false, msg:'官品校验未通过：下级官职（'+child.name+'，'+child.rank9+'）品级高于拟挂靠的上级（'+newParent.name+'，'+newParent.rank9+'）。' };
        }
      }
      return { ok:true };
    }
    function validateNodeWarnings(n){
      if(!validationEnabled.value || n.kind!=='office') return [];
      const warns = [];
      const highCat = ['宗室诸王','丞相／相国','大将军／大司马','三公','都督军事'];
      if(n.kaifu && !highCat.includes(n.category)) warns.push('开府通常限于丞相／三公／大将军等中枢或统兵高位，当前分类为「'+n.category+'」。');
      if(['假节钺','假黄钺','使持节'].includes(n.jie) && !['将军武职','都督军事','州牧刺史','属国护官','丞相／相国','大将军／大司马'].includes(n.category)) warns.push('假黄钺／假节钺／使持节等高等符节，历史上多授予统兵将帅或方面大员。');
      if(n.yaoling && !n.region) warns.push('遥领官职建议注明其名义辖区（管辖区域字段）。');
      if(n.yaoling && !n.note) warns.push('遥领官职建议在备注中区分实授与虚领。');
      if(n.category==='都督军事' && !n.region) warns.push('都督官职必须关联辖区，请补充管辖区域。');
      if(n.officeStartYear!==null && n.officeEndYear!==null && Number(n.officeStartYear)>Number(n.officeEndYear)) warns.push('沿革时间有误：设立年份晚于裁撤年份。');
      if(n.worldTangBing && currentFaction.value!=='wu') warns.push('世袭领兵制为东吴特色兵制，其他势力较为罕见，请确认是否为自定义设定。');
      return warns;

    // 九品中正体系自动校准：按分类给出建议品级，仅在字段为空时自动填入；也可通过按钮手动强制重新校准。
    function calibrateRank9(node, force){
      if(!node || node.kind!=='office') return;
      if(currentFaction.value==='shu') return; // 汉未实行九品中正制
      const suggestion = CATEGORY_RANK9_MAP[node.category];

    // ---------- 脚注 / 学术引文系统 ----------
    // 任意字段分组均可挂载多条脚注（记录史料原文出处）。编号按当前树的节点遍历顺序全局递增，
    // 供导出表格／图片／Markdown 时在文末统一排布，符合学术引文规范。
    const footnoteDialog = reactive({ visible:false, nodeKey:'', fieldLabel:'', text:'' });
    function openFootnoteDialog(fieldLabel){
      const sel = selectedNode.value; if(!sel) return;
      footnoteDialog.visible = true;
      footnoteDialog.nodeKey = sel.key;
      footnoteDialog.fieldLabel = fieldLabel;

    function confirmFootnote(){
      const sel = currentArr.value.find(n=>n.key===footnoteDialog.nodeKey);
      if(!sel || !footnoteDialog.text.trim()){ footnoteDialog.visible=false; return; }
      if(!sel.footnotes) sel.footnotes = [];
      sel.footnotes.push({ id: 'fn_'+Date.now()+'_'+Math.floor(Math.random()*1000), field: footnoteDialog.fieldLabel, text: footnoteDialog.text.trim() });

    function removeFootnote(node, id){
      if(!node || !node.footnotes) return;
      node.footnotes = node.footnotes.filter(f=>f.id!==id);
      pushHistory('删除「'+node.name+'」的一条脚注');
    }
    // 按当前树的遍历顺序，为所有脚注生成全局连续编号
    const footnoteIndex = computed(()=>{
      const map = {}; // nodeKey -> [{num, field, text}]
      const flat = []; // 有序列表，供导出使用
      let n = 0;
      currentArr.value.forEach(node=>{
        (node.footnotes||[]).forEach(fn=>{
          n++;
          if(!map[node.key]) map[node.key] = [];
          map[node.key].push({ num:n, field:fn.field, text:fn.text, id:fn.id });
          flat.push({ num:n, nodeName:node.name, field:fn.field, text:fn.text });
        });
      });
      return { map, flat };
    });
    function footnotesFor(fieldLabel){
      const sel = selectedNode.value; if(!sel) return [];
      const list = footnoteIndex.value.map[sel.key] || [];
      return list.filter(f=>f.field===fieldLabel);
    }


    let diagram = null;
    function factionColor(key){ const f=factions.find(x=>x.key===key); return f?f.color:'#9C3B2E'; }
    function tintColor(hex,ratio){
      const clean=String(hex||'').replace('#','');
      if(!/^[0-9a-f]{6}$/i.test(clean)) return '#F6F1E4';
      const rgb=[0,2,4].map(i=>parseInt(clean.slice(i,i+2),16));
      return '#'+rgb.map(v=>Math.round(v+(255-v)*ratio).toString(16).padStart(2,'0')).join('');
    }
    function nodeFill(d){
      if(d.archived) return '#DED9CF';
      if(d.hidden) return '#E8E3D8';
      return tintColor(factionColor(currentFaction.value),d.kind==='root' ? .72 : .87);
    }
    function nodeStroke(d){ return d.color || factionColor(currentFaction.value); }
    function nodeSearchText(node){
      return [node.name,node.category,node.rank9,node.hanRank,node.duty,node.region,node.note,node.sources,node.aliases,node.evolution,node.directRules,
        ...(node.customTags||[]),...(node.figures||[]).flatMap(f=>[f.name,f.note])].filter(Boolean).join(' ').toLowerCase();
    }
    function visibleNodesForCanvas(){
      const arr = currentArr.value;
      const query = canvasFilters.query.trim().toLowerCase();
      const hasFacet = Boolean(query || canvasFilters.category || canvasFilters.rank || canvasFilters.special || canvasFilters.hideNonCore || timelineEnabled.value || officeDomain.value!=='all' || officeBranch.value!=='all');
      const wanted = new Set();
      arr.forEach(node=>{
        if(node.kind==='root'){ wanted.add(node.key); return; }
        if(node.archived && !canvasFilters.showArchived) return;
        if(node.hidden && !canvasFilters.showHidden) return;
        if(node.kind==='office' && !officeClassMatches(node)) return;
        if(canvasFilters.hideNonCore && node.kind==='office' && !CORE_CATEGORIES.includes(node.category)) return;
        if(timelineEnabled.value){
          const start = normalizeYear(node.officeStartYear), end = normalizeYear(node.officeEndYear);
          if(start!==null && timelineYear.value<start) return;
          if(end!==null && timelineYear.value>end) return;
        }
        if(canvasFilters.category && node.category!==canvasFilters.category) return;
        if(canvasFilters.rank && node.rank9!==canvasFilters.rank && node.hanRank!==canvasFilters.rank) return;
        if(canvasFilters.special && !node[canvasFilters.special]) return;
        if(query && !nodeSearchText(node).includes(query)) return;
        wanted.add(node.key);
      });
      // 筛选结果必须补齐祖先链，避免 TreeModel 出现悬空 parent。
      const byKey = new Map(arr.map(n=>[n.key,n]));
      Array.from(wanted).forEach(key=>{
        let cursor=byKey.get(key), guard=0;
        while(cursor && cursor.parent!==undefined && guard++<200){
          wanted.add(cursor.parent);
          cursor=byKey.get(cursor.parent);
        }
      });
      if(!hasFacet) return arr.filter(n=>wanted.has(n.key));
      return arr.filter(n=>wanted.has(n.key));
    }

    function rebuildModel(fitView=true){
      if(!diagram) return;
      const arr = currentArr.value;
      try{ normalizeAndValidateNodes(arr, currentFactionDef.value.name+(treeType.value==='office'?'官职体系':'爵位体系'), currentFaction.value); }
      catch(err){ ElementPlus.ElMessage.error('树数据无效：'+err.message); return; }
      const model = new go.TreeModel();
      model.nodeParentKeyProperty = "parent";
      model.nodeDataArray = visibleNodesForCanvas();
      diagram.model = model;
      applyLayout();
      nextTick(()=>{
        const selected = selectedKey.value ? diagram.findNodeForKey(selectedKey.value) : null;
        if(selected) diagram.select(selected);
        if(fitView){
          requestAnimationFrame(()=>requestAnimationFrame(()=>{
            if(!diagram) return;
            diagram.zoomToFit(); zoomPct.value=Math.round(diagram.scale*100);
          }));

    function applyLayout(){
      if(!diagram) return;
      if(viewMode.value === 'tree'){
        diagram.layout = $go(go.TreeLayout, { angle: 90, layerSpacing: 42, nodeSpacing: 14, arrangement: go.TreeLayout.ArrangementVertical });
        diagram.layoutDiagram(true);
      } else if(viewMode.value === 'horizontal'){
        diagram.layout = $go(go.TreeLayout, { angle: 0, layerSpacing: 70, nodeSpacing: 14, arrangement: go.TreeLayout.ArrangementVertical });
        diagram.layoutDiagram(true);
      } else {
        diagram.layout = $go(go.LayeredDigraphLayout, { direction: 90, layerSpacing: 46, columnSpacing: 20 });
        diagram.layoutDiagram(true);
        nextTick(()=>applyRankPositions());
      }

    function applyRankPositions(){
      if(!diagram || viewMode.value!=='rank') return;
      const groups = new Map();
      diagram.nodes.each(node=>{
        let level = 0;
        if(node.data.kind!=='root'){
          const rank = currentFaction.value==='shu' ? node.data.hanRank : (node.data.rank9 || node.data.hanRank);
          level = currentFaction.value==='shu' ? HAN_RANK_OPTIONS.indexOf(rank) : RANK9_OPTIONS.indexOf(rank);
          if(level<0) level = 18;
          level += 1;
        }
        if(!groups.has(level)) groups.set(level,[]);
        groups.get(level).push(node);
      });
      diagram.startTransaction('品级分层');
      Array.from(groups.keys()).sort((a,b)=>a-b).forEach((level,row)=>{
        groups.get(level).sort((a,b)=>String(a.data.name).localeCompare(String(b.data.name),'zh-CN')).forEach((node,col)=>{
          node.position = new go.Point(col*210,row*105);
        });
      });
      diagram.commitTransaction('品级分层');
    }

    function isDescendant(arr, ancestorKey, node){
      let cur = node;
      const map = {}; arr.forEach(n=>map[n.key]=n);
      let guard = 0;
      while(cur && cur.parent && guard++ < 200){
        if(cur.parent === ancestorKey) return true;
        cur = map[cur.parent];
      }
      return false;
    }

      if(!diagram) return [];
      const selected = [];
      diagram.selection.each(part=>{ if(part instanceof go.Node) selected.push(part.data); });
      const keys = new Set(selected.map(n=>n.key));
      const byKey = new Map(currentArr.value.map(n=>[n.key,n]));
      return selected.filter(node=>{
        let cursor=node, guard=0;
        while(cursor && cursor.parent!==undefined && guard++<200){
          if(keys.has(cursor.parent)) return false;
          cursor=byKey.get(cursor.parent);
        }
        return true;
      });
    }
    function previewDropTarget(target,on){
      if(!target || !(target instanceof go.Node)) return;
      const shape=target.findObject('CARD'); if(!shape) return;
      if(!on){ shape.stroke=nodeStroke(target.data); shape.strokeWidth=1.4; shape.fill=nodeFill(target.data); return; }
      const candidates=topSelectedData().filter(n=>n.key!==target.data.key && n.kind!=='root');
      const valid=candidates.length>0 && candidates.every(child=>!isDescendant(currentArr.value,child.key,target.data) && validateReparent(child,target.data).ok);
      shape.stroke=valid?'#B08D3F':'#A54136'; shape.strokeWidth=3; shape.fill=valid?'#FFF3D6':'#F8DDDA';
    }
    function moveSelectionToParent(target){
      if(!target || !(target instanceof go.Node)) return;
      previewDropTarget(target,false);
      const roots=topSelectedData().filter(n=>n.key!==target.data.key && n.kind!=='root');
      if(!roots.length){ diagram.layoutDiagram(true); return; }
      for(const child of roots){
        if(child.locked){ ElementPlus.ElMessage.warning('「'+child.name+'」已锁定，不能调整从属。'); diagram.layoutDiagram(true); return; }
        if(isDescendant(currentArr.value,child.key,target.data)){ ElementPlus.ElMessage.error('不能将节点挂靠到其自身的下级分支。'); diagram.layoutDiagram(true); return; }
        const check=validateReparent(child,target.data);
        if(!check.ok){ ElementPlus.ElMessage.error(check.msg+'（可关闭左侧校验后自由调整）'); diagram.layoutDiagram(true); return; }
      }
      diagram.model.commit(model=>roots.forEach(child=>model.setParentKeyForNodeData(child,target.data.key)),'批量调整从属');
      pushHistory('批量调整从属：'+roots.map(n=>n.name).join('、')+' → '+target.data.name);
      ElementPlus.ElMessage.success('已将 '+roots.length+' 个分支挂靠至「'+target.data.name+'」');
      diagram.layoutDiagram(true);
    }

    function initDiagram(){
      diagram = $go(go.Diagram, "goCanvas", {
        "undoManager.isEnabled": false, // 我们自己管理历史
        allowCopy:false,
        allowDrop:true,
        maxSelectionCount:Infinity,
        "toolManager.hoverDelay": 200,
      });
      buildTemplates();
      diagram.addDiagramListener("ObjectSingleClicked", (e)=>{
        const part = e.subject.part;
        if(part instanceof go.Node){ selectedKey.value = part.data.key; }
      });
      diagram.addDiagramListener("BackgroundSingleClicked", ()=>{ selectedKey.value = null; });
      diagram.addDiagramListener("ChangedSelection", ()=>{
        const keys=[]; diagram.selection.each(part=>{ if(part instanceof go.Node) keys.push(part.data.key); });
        selectedKeys.value=keys;
        if(keys.length && !keys.includes(selectedKey.value)) selectedKey.value=keys[0];
      });
      diagram.addDiagramListener("SelectionMoved", ()=>setTimeout(()=>{ if(diagram) diagram.layoutDiagram(true); },0));
      diagram.addDiagramListener("ViewportBoundsChanged", ()=>{ zoomPct.value = Math.round(diagram.scale*100); });
      rebuildModel();
    }

    function duplicateBranch(){
      const sel = selectedNode.value;
      if(!sel){ ElementPlus.ElMessage.warning('请先选中要复制的分支根节点'); return; }
      if(sel.kind==='root'){ ElementPlus.ElMessage.warning('不能复制根节点'); return; }
      const arr = currentArr.value;
      const prefix = currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const keyMap = {};
      const occupied = new Set(arr.map(n=>n.key));
      const subtree = [sel, ...(()=>{ const acc=[]; (function c(k){ arr.filter(n=>n.parent===k).forEach(n=>{acc.push(n); c(n.key);}); })(sel.key); return acc; })()];
      const clones = subtree.map(n=>{
        const clone = JSON.parse(JSON.stringify(n));
        const newKey = nextUniqueKey(prefix, occupied);
        keyMap[n.key] = newKey;
        clone.key = newKey;
        return clone;
      });
      clones.forEach(c=>{ c.parent = (c.key===keyMap[sel.key]) ? sel.parent : (keyMap[c.parent] || c.parent); });
      clones[0].name = clones[0].name + '（副本）';
      arr.push(...clones);
      pushHistory('复制分支：'+sel.name);
      selectedKey.value = clones[0].key;
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已复制整条分支（含 '+clones.length+' 个节点）');
    }
    function collectBranchKeys(roots, arr=currentArr.value){
      const keys=new Set(roots.map(n=>n.key));
      let changed=true;
      while(changed){
        changed=false;
        arr.forEach(n=>{ if(!keys.has(n.key) && keys.has(n.parent)){ keys.add(n.key); changed=true; } });
      }
      return keys;
    }
    function selectedBranchRoots(){
      const roots=topSelectedData().filter(n=>n.kind!=='root');
      if(!roots.length && selectedNode.value && selectedNode.value.kind!=='root') return [selectedNode.value];
      return roots;
    }
    function copyBranches(showMessage=true){
      const roots=selectedBranchRoots();
      if(!roots.length){ ElementPlus.ElMessage.warning('请先选择一个或多个分支'); return false; }
      const keys=collectBranchKeys(roots);
      branchClipboard.value={ mode:'copy', faction:currentFaction.value, treeType:treeType.value,
        roots:roots.map(n=>n.key), nodes:cloneJSON(currentArr.value.filter(n=>keys.has(n.key))) };
      if(showMessage) ElementPlus.ElMessage.success('已复制 '+roots.length+' 组分支，共 '+keys.size+' 个节点');
      return true;
    }
    function cutBranches(){
      const roots=selectedBranchRoots();
      if(!roots.length){ ElementPlus.ElMessage.warning('请先选择一个或多个分支'); return; }
      if(roots.some(n=>n.locked)){ ElementPlus.ElMessage.warning('选择中含已锁定节点，不能剪切'); return; }
      const keys=collectBranchKeys(roots);
      branchClipboard.value={ mode:'cut', faction:currentFaction.value, treeType:treeType.value,
        roots:roots.map(n=>n.key), nodes:cloneJSON(currentArr.value.filter(n=>keys.has(n.key))) };
      data.trees[currentFaction.value][treeType.value]=currentArr.value.filter(n=>!keys.has(n.key));
      selectedKey.value=null; selectedKeys.value=[];
      pushHistory('剪切 '+roots.length+' 组分支（'+keys.size+' 个节点）');
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已剪切分支，请选择目标父节点后粘贴');
    }
    function pasteBranches(){
      const clip=branchClipboard.value;
      if(!clip || !Array.isArray(clip.nodes) || !clip.nodes.length){ ElementPlus.ElMessage.warning('分支剪贴板为空'); return; }
      if(clip.treeType!==treeType.value){ ElementPlus.ElMessage.warning('请切换到'+(clip.treeType==='office'?'官职':'爵位')+'体系后粘贴'); return; }
      const target=(selectedNode.value && selectedNode.value.kind!=='office' && treeType.value==='office') ? null : selectedNode.value;
      const parent=target || currentArr.value.find(n=>n.kind==='root');
      if(!parent){ ElementPlus.ElMessage.error('当前体系缺少根节点，无法粘贴'); return; }
      const rootSet=new Set(clip.roots);
      for(const source of clip.nodes.filter(n=>rootSet.has(n.key))){
        const check=validateReparent(source,parent);
        if(!check.ok){ ElementPlus.ElMessage.error(check.msg+'（可关闭校验后粘贴）'); return; }
      }
      const prefix=currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const occupied=new Set(currentArr.value.map(n=>n.key));
      const keyMap={};
      clip.nodes.forEach(n=>{ keyMap[n.key]=nextUniqueKey(prefix,occupied); });
      const clones=clip.nodes.map(n=>{
        const c=cloneJSON(n); c.key=keyMap[n.key];
        c.parent=rootSet.has(n.key) ? parent.key : (keyMap[n.parent] || parent.key);
        if(currentFaction.value==='shu' && c.kind==='office') c.rank9='';
        return c;
      });
      currentArr.value.push(...clones);
      selectedKey.value=clones[0].key;
      pushHistory('粘贴 '+clip.roots.length+' 组分支（'+clones.length+' 个节点）');
      if(clip.mode==='cut') branchClipboard.value=null;
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已粘贴至「'+parent.name+'」下');
    }
    function batchAddTemplate(templateKey){

    function standardizeCurrentTree(){
      ElementPlus.ElMessageBox.confirm('将规范当前树中的半角括号、多余空格、重复标签，并为“中护军／护军将军”等别称建立统一归类标签。节点 key 与层级不会改变。','数据标准化',{confirmButtonText:'开始规范',cancelButtonText:'取消',type:'warning'})
        .then(()=>{
          let changed=0;
          currentArr.value.filter(n=>n.kind!=='root').forEach(node=>{
            const before=JSON.stringify([node.name,node.aliases,node.region,node.customTags]);
            node.name=String(node.name||'').trim().replace(/\s+/g,' ').replace(/\(([^()]*)\)/g,'（$1）');
            node.aliases=String(node.aliases||'').trim().replace(/\s*[/／]\s*/g,'／');
            node.region=String(node.region||'').trim().replace(/\s+/g,'');
            node.customTags=Array.from(new Set((node.customTags||[]).map(t=>String(t).trim()).filter(Boolean)));
            if(/中护军|护军将军/.test(node.name+' '+node.aliases)){
              if(!node.customTags.includes('护军官组')) node.customTags.push('护军官组');
              const counterpart=node.name.includes('中护军')?'护军将军':'中护军';
              if(!node.aliases.includes(counterpart)) node.aliases=[node.aliases,counterpart].filter(Boolean).join('／');
            }
            if(before!==JSON.stringify([node.name,node.aliases,node.region,node.customTags])) changed++;
          });
          if(changed){ pushHistory('数据标准化（'+changed+' 个节点）'); refreshDiagramData(false); }
          ElementPlus.ElMessage.success('标准化完成，共调整 '+changed+' 个节点');
        }).catch(()=>{});
    }

    function periodByKey(key){
      if(!key) return null;
      for(const list of Object.values(PERIODS)){
        const found = list.find(period=>period.key===key);
        if(found) return found;
      }
      return null;
    }
    function recordYearLabel(record){
      const start = normalizeYear(record.startYear);
      const end = normalizeYear(record.endYear);
      if(start===null && end===null) return '年份未标注';
      if(start!==null && end!==null) return start===end ? start+'年' : start+'—'+end+'年';
      return (start!==null ? start+'年起' : '至'+end+'年');
    }
    function recordPeriodLabel(record){
      const period = periodByKey(record.rulerKey);
      return period ? period.name : '未指定君主时期';
    }

    function uploadPortrait(file, record){
      const allowed = ['image/jpeg','image/png','image/webp','image/gif'];
      if(!allowed.includes(file.type)){
        ElementPlus.ElMessage.error('立绘仅支持 JPG、PNG、WebP 或 GIF 图片');
        return false;
      }
      if(file.size > 1024*1024){
        ElementPlus.ElMessage.error('本地立绘请控制在 1MB 以内；较大图片建议填写网络地址');
        return false;
      }
      const reader = new FileReader();
      reader.onload = event=>{
        record.portrait = String(event.target.result || '');
        pushHistory('添加人物立绘：'+(record.name||'未命名人物'));
        ElementPlus.ElMessage.success('立绘已加入当前工程');
      };
      reader.onerror = ()=>ElementPlus.ElMessage.error('立绘读取失败');
      reader.readAsDataURL(file);
      return false;
    }

    function recordMatchesPeriod(record, period){
      if(!period) return true;
      if(record.rulerKey) return record.rulerKey===period.key;
      const start = normalizeYear(record.startYear);
      const end = normalizeYear(record.endYear);
      if(start===null && end===null) return false;
      const from = start===null ? end : start;
      const to = end===null ? start : end;
      return from <= period.endYear && to >= period.startYear;
    }

      // 附带脚注：在画布图片下方拼接一段脚注／参考文献区块，编号与画布中标注一致
      const img = new Image();
      img.onload = ()=>{
        const padding = 28, lineH = 20, fontSize = 14;
        const maxWidth = img.width - padding*2;
        const ctx0 = document.createElement('canvas').getContext('2d');
        ctx0.font = fontSize+'px sans-serif';
        function wrapLines(text){
          const words = text.split('');
          let line='', lines=[];
          words.forEach(ch=>{
            if(ctx0.measureText(line+ch).width > maxWidth){ lines.push(line); line=ch; } else { line+=ch; }
          });
          if(line) lines.push(line);
          return lines;
        }
        const allLines = [];
        notes.forEach(f=>{ wrapLines('['+f.num+'] '+f.nodeName+'·'+f.field+'：'+f.text).forEach(l=>allLines.push(l)); });
        const footH = padding*2 + 26 + allLines.length*lineH;
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height + footH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#EDE6D6'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0);
        ctx.strokeStyle = '#C9BFA5'; ctx.beginPath(); ctx.moveTo(padding,img.height+padding*0.6); ctx.lineTo(canvas.width-padding,img.height+padding*0.6); ctx.stroke();
        ctx.fillStyle = '#2B2622'; ctx.font = 'bold 16px sans-serif';
        ctx.fillText('脚注 · 参考文献', padding, img.height+padding+18);
        ctx.font = fontSize+'px sans-serif'; ctx.fillStyle = '#3A342D';
        allLines.forEach((line,i)=>{ ctx.fillText(line, padding, img.height+padding+52+i*lineH); });
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png'); a.download = '三国职官谱_'+currentFaction.value+'.png'; a.click();
        pushHistory('导出画布图片（含脚注）');
      };
      img.src = baseImg;
    }
