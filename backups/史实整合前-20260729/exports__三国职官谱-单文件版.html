    function markdownForCurrentTree(){
      const arr=currentArr.value, byParent=new Map();
      arr.forEach(n=>{ const p=n.parent===undefined?'__root__':n.parent; if(!byParent.has(p)) byParent.set(p,[]); byParent.get(p).push(n); });
      const lines=['# '+currentFactionDef.value.name+' · '+(treeType.value==='office'?'官职体系':'爵位体系'),''];
      function walk(node,depth){
        const prefix='  '.repeat(Math.max(0,depth-1))+'- ';
        if(node.kind==='root') lines.push('## '+node.name,'');
        else {
          const attrs=[];
          if(node.category) attrs.push(node.category);
          if(node.rank9) attrs.push(node.rank9);
          if(node.hanRank) attrs.push(node.hanRank);
          if(node.nobleRank) attrs.push(node.nobleRank);
          if(node.yaoling) attrs.push('遥领'); if(node.virtual) attrs.push('虚职'); if(node.kaifu) attrs.push('可开府');
          lines.push(prefix+'**'+node.name+'**'+(attrs.length?'（'+attrs.join(' · ')+'）':''));
          if(node.duty) lines.push('  '.repeat(depth)+'- 职权：'+node.duty);
          if(node.officeStartYear!==null || node.officeEndYear!==null) lines.push('  '.repeat(depth)+'- 沿革：'+(node.officeStartYear??'待考')+'—'+(node.officeEndYear??'存续')+'年'+(node.evolution?'；'+node.evolution:''));
          if(node.sources) lines.push('  '.repeat(depth)+'- 出处：'+node.sources);
          if((node.figures||[]).length) lines.push('  '.repeat(depth)+'- 人物：'+node.figures.map(f=>f.name).filter(Boolean).join('、'));
          if(node.note) lines.push('  '.repeat(depth)+'- 备注：'+node.note);
        }
        (byParent.get(node.key)||[]).forEach(child=>walk(child,depth+1));
      }
      (byParent.get('__root__')||[]).forEach(root=>walk(root,0));
      if(footnoteIndex.value.flat.length){
        lines.push('','---','### 脚注 · 参考文献','');
        footnoteIndex.value.flat.forEach(f=>{ lines.push('['+f.num+'] '+f.nodeName+'·'+f.field+'：'+f.text); });
      }
      return lines.join('\n');
    }

    function combineImportedNodes(importedNodes, mode){
      if(mode==='覆盖') return importedNodes;
      const existing=currentArr.value;
      const root=existing.find(n=>n.kind==='root');
      const incoming=importedNodes.filter(n=>n.kind!=='root');
      const prefix=currentFaction.value+'_'+(treeType.value==='office'?'o':'n')+'_imp';
      const occupied=new Set(existing.map(n=>n.key));
      const existingByName=new Map(existing.filter(n=>n.kind!=='root').map(n=>[n.name,n]));
      const keyMap={};
      incoming.forEach(n=>{
        const match=mode==='合并'?existingByName.get(n.name):null;
        keyMap[n.key]=match?match.key:nextUniqueKey(prefix,occupied);
      });
      const result=cloneJSON(existing);
      const resultByKey=new Map(result.map(n=>[n.key,n]));
      incoming.forEach(n=>{
        const targetKey=keyMap[n.key], match=resultByKey.get(targetKey);
        const mappedParent=keyMap[n.parent] || (root?root.key:undefined);
        if(match){
          const keepKey=match.key, keepParent=match.parent;
          Object.assign(match,cloneJSON(n),{key:keepKey});
          if(mappedParent!==undefined) match.parent=mappedParent; else if(keepParent!==undefined) match.parent=keepParent;
        } else {
          const clone=cloneJSON(n); clone.key=targetKey;
          if(mappedParent!==undefined) clone.parent=mappedParent; else delete clone.parent;
          result.push(clone); resultByKey.set(clone.key,clone);
        }
      });
      return result;
    }

                    figures: readFigures(row) })
              : N(prefix, null, name, row['爵等']||row['爵位分类']||'', {
                  fief:row['食邑']||'', inherit:row['承袭']||row['承袭方式']||'', actualFief:!/^否$/i.test(String(row['实封']||'是')),
                  officeStartYear:row['设立年']||null, officeEndYear:row['裁撤年']||null, sources:row['史料出处']||'',
                  customTags:String(row['自定义标签']||'').split(/[、,，]/).filter(Boolean), note:row['备注']||'', figures:readFigures(row)
                });
            if(byName[name]) duplicateNames.add(name);
            else byName[name] = n;
            n._parentName = row['上级']||row['上级名称']||row['parent']||'';
            return n;
          });
          nodes.forEach(n=>{
            if(n._parentName && duplicateNames.has(n._parentName)) throw new Error('上级名称「'+n._parentName+'」存在重复，无法确定挂靠对象；请先让名称唯一');
            if(n._parentName && byName[n._parentName]) n.parent = byName[n._parentName].key;
            else if(n._parentName) throw new Error('未找到上级「'+n._parentName+'」（节点：'+n.name+'）');
            delete n._parentName;
          });
          const rootNode = data.trees[currentFaction.value][treeType.value].find(n=>n.kind==='root');
          nodes.forEach(n=>{ if(n.parent === undefined && rootNode) n.parent = rootNode.key; });
          const importedNodes = rootNode ? [cloneJSON(rootNode), ...nodes] : nodes;
          const currentNames=new Set(currentArr.value.filter(n=>n.kind!=='root').map(n=>n.name));
          const conflicts=nodes.filter(n=>currentNames.has(n.name)).map(n=>n.name);
          let mode='覆盖';
          if(conflicts.length){
            try{
              const answer=await ElementPlus.ElMessageBox.prompt(
                '发现 '+conflicts.length+' 个同名官职／爵位（如：'+conflicts.slice(0,4).join('、')+'）。请输入“合并”“覆盖”或“保留”：',
                '导入冲突处理',{confirmButtonText:'继续导入',cancelButtonText:'取消',inputValue:'合并',inputPattern:/^(合并|覆盖|保留)$/,inputErrorMessage:'请输入：合并、覆盖或保留'});
              mode=answer.value;
            }catch(_){ ElementPlus.ElMessage.info('已取消 Excel 导入'); return; }
          }
          const combined=combineImportedNodes(importedNodes,mode);
          data.trees[currentFaction.value][treeType.value] = normalizeAndValidateNodes(combined, 'Excel 导入数据', currentFaction.value);
          pushHistory('导入 Excel 数据（'+nodes.length+' 条，'+mode+'模式）');
          selectedKey.value = null;
          rebuildModel();
          ElementPlus.ElMessage.success('Excel 导入成功，共 '+nodes.length+' 条（'+mode+'模式）');
        }catch(err){ ElementPlus.ElMessage.error('Excel 解析失败：'+err.message); }
      };
      reader.readAsArrayBuffer(file);
      return false;

          <div v-if="!activePersonAppointments.length" class="summary-empty">没有找到履历记录。</div>
          <div v-for="item in activePersonAppointments" :key="item.factionKey+'_'+item.nodeKey+'_'+item.id" class="search-result" @click="jumpToPersonAppointment(item)">
            <div class="title">{{item.nodeName}}</div><div class="meta">{{item.factionName}} · {{item.treeType==='office'?'任官':'受爵'}} · {{recordPeriodLabel(item)}} · {{recordYearLabel(item)}}</div><div v-if="item.note" class="excerpt">{{item.note}}</div>
          </div>
        </div>
      </div>
    </el-dialog>

    <el-drawer v-model="showLog" title="操作日志 · 步骤回滚" size="360px">
      <div v-for="(h,idx) in history.stack" :key="idx" class="log-item" :class="{current: idx===history.index}">
        <div>
          <div>{{ h.label }}</div>
          <div class="t">{{ h.time }}</div>
        </div>
        <el-button size="small" text @click="jumpToHistory(idx)" :disabled="idx===history.index">回退到此步</el-button>
      </div>
    </el-drawer>

    <el-drawer v-model="showVersions" title="命名版本 · 回滚" size="360px">
      <div style="margin-bottom:10px;"><el-button size="small" @click="saveVersion">＋ 保存当前为新版本</el-button></div>
      <div v-if="versions.list.length===0" style="color:#6B6255;font-size:12.5px;">尚无已保存的命名版本。</div>
      <div v-for="v in versions.list" :key="v.id" class="log-item">
        <div>
          <div>{{ v.label }}</div>
          <div class="t">{{ v.time }}</div>
        </div>
        <el-button size="small" text @click="rollbackVersion(v)">回滚</el-button>
      </div>
    </el-drawer>

    <el-dialog v-model="fangzhenDialog.visible" :title="fangzhenDialog.mode==='edit'?'编辑方镇记录':'添加方镇记录'" width="680px">
      <el-form :model="fangzhenDialog.form" label-position="top">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <el-form-item label="时期"><el-select v-model="fangzhenDialog.form.eraGroup" style="width:100%"><el-option label="三国时期" value="three"/><el-option label="两晋时期" value="jin"/></el-select></el-form-item>
          <el-form-item label="档案类别"><el-select v-model="fangzhenDialog.form.recordType" style="width:100%"><el-option label="刺史／州牧" value="cishi"/><el-option label="都督" value="dudu"/><el-option label="其他方镇" value="other"/></el-select></el-form-item>
          <el-form-item label="国家／政权">
            <el-select v-model="fangzhenDialog.form.polity" filterable allow-create default-first-option style="width:100%" placeholder="选择或输入政权">
              <el-option label="魏" value="魏"/><el-option label="汉" value="汉"/><el-option label="吴" value="吴"/><el-option label="西晋" value="西晋"/><el-option label="东晋" value="东晋"/>
            </el-select>
          </el-form-item>
          <el-form-item label="人物"><el-input v-model="fangzhenDialog.form.commander" placeholder="方镇长官姓名"/></el-form-item>
          <el-form-item label="官职／方镇名"><el-input v-model="fangzhenDialog.form.title" placeholder="如：都督荆州诸军事"/></el-form-item>
          <el-form-item label="辖区"><el-input v-model="fangzhenDialog.form.jurisdiction" placeholder="州、郡或军政区域"/></el-form-item>
          <el-form-item label="治所／驻地"><el-input v-model="fangzhenDialog.form.seat" placeholder="如：襄阳、晋阳"/></el-form-item>
          <el-form-item label="起始年"><el-input-number v-model="fangzhenDialog.form.startYear" :min="180" :max="420" style="width:100%"/></el-form-item>
          <el-form-item label="结束年"><el-input-number v-model="fangzhenDialog.form.endYear" :min="180" :max="420" style="width:100%"/></el-form-item>
          <el-form-item label="任期原文" style="grid-column:1/-1"><el-input v-model="fangzhenDialog.form.tenureText" placeholder="如：黄初元年（220年）—太和二年（228年）；可保留“约”“未详”等措辞"/></el-form-item>
          <el-form-item label="来源名称"><el-input v-model="fangzhenDialog.form.sourceTitle" placeholder="如：维基百科：羊祜"/></el-form-item>
          <el-form-item label="来源链接"><el-input v-model="fangzhenDialog.form.sourceUrl" placeholder="https://…"/></el-form-item>
        </div>
        <el-form-item label="沿革与考据备注"><el-input v-model="fangzhenDialog.form.note" type="textarea" :rows="3" placeholder="记录迁官、改辖、资料分歧或待考内容"/></el-form-item>
      </el-form>
      <template #footer><el-button @click="fangzhenDialog.visible=false">取消</el-button><el-button type="primary" @click="saveFangzhenRecord">保存记录</el-button></template>
    </el-dialog>

    <el-dialog v-model="footnoteDialog.visible" title="添加脚注（录入史料原文出处）" width="480px">
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">挂载字段：{{footnoteDialog.fieldLabel}}</div>
      <el-input v-model="footnoteDialog.text" type="textarea" :rows="4" placeholder="如：《三国志·蜀书·诸葛亮传》：「亮以丞相录尚书事，假节。」" />
      <template #footer>
        <el-button @click="footnoteDialog.visible=false">取消</el-button>
        <el-button type="primary" @click="confirmFootnote">保存脚注</el-button>
      </template>
    </el-dialog>

    <el-dialog v-model="showTongdian" title="官品体系（据《通典》卷三十六·卷三十七整理）" width="760px">
      <div class="tongdian-note">下表为对《通典》卷三十六（魏官品）、卷三十七（晋官品）内容的简编整理，非原文逐句迻录，仅供品级比对参考；具体条目请以原书及《太平御览》等互见材料核校。</div>
      <el-table :data="TONGDIAN_TABLE" border size="small">
        <el-table-column prop="rank" label="品级" width="70" />
        <el-table-column prop="wei" label="曹魏官品（通典卷三十六）" />
        <el-table-column prop="jin" label="晋官品（通典卷三十七）" />
      </el-table>
    </el-dialog>
  </div>
  `
});

app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
