(function(){

        failureHead.appendChild(failureTitle);body.replaceChildren(failureHead,failureSummary);
      }
      if(typeof node.onerror==='function') node.onerror(error);
    });
    return node;
  };
})();
</script>

<script>
/* 州、郡同国同系分色；两套郡界互斥，避免跨时期切换时残留叠线。 */
(function(){
  var TONES=['#F2E6D2','#DCE7DF','#E5E0ED','#ECDDD8','#DFE5CF','#D9E6EA','#EADFC8'];
  function rgb(hex){
    var value=String(hex||'#6c675e').replace('#','');
    if(value.length===3) value=value.split('').map(function(c){return c+c;}).join('');
    return [parseInt(value.slice(0,2),16),parseInt(value.slice(2,4),16),parseInt(value.slice(4,6),16)];
  }
  function mix(a,b,ratio){
    var one=rgb(a),two=rgb(b);
    var out=one.map(function(value,index){return Math.round(value*(1-ratio)+two[index]*ratio);});
    return '#'+out.map(function(value){return value.toString(16).padStart(2,'0');}).join('');
  }
  function hash(value){
    return Array.from(String(value||'')).reduce(function(total,char){return (total*31+char.charCodeAt(0))>>>0;},7);
  }
  function historicalColor(feature,factionId,level){
    var faction=FACTIONS[factionId]||FACTIONS[feature.kingdom]||{color:'#746c60'};
    if(level==='faction'||window.__provinceTintEnabled===false) return faction.color;
    var rawKey=String(feature.key||'').replace(/_(wei|wu)$/,'');
    var stateKeys={'司隶':'sili','司州':'sili','并州':'bingzhou','冀州':'jizhou','兖州':'yanzhou','豫州':'yuzhou','青州':'qingzhou','徐州':'xuzhou','扬州':'yangzhou','荆州':'jingzhou','益州':'yizhou','梁州':'liang_state','凉州':'liangzhou','雍州':'yongzhou','秦州':'qinzhou','幽州':'youzhou','平州':'pingzhou','交州':'jiaozhou','广州':'guangzhou','宁州':'ningzhou'};
    var stateKey=stateKeys[feature.state]||stateKeys[feature.sourceProvince]||(rawKey==='jing'?'jingzhou':rawKey==='yang'?'yangzhou':rawKey);
    var stateTone=(window.PROVINCE_COLOR_PALETTE||{})[stateKey]||TONES[hash(stateKey||feature.state||feature.key)%TONES.length];
    return level==='commandery'?mix(stateTone,'#fffdf8',.58):stateTone;
  }
  var lastTerritoryFeatures=[];
  var lastTerritoryMapping={};
  function applyTerritoryHierarchyDom(){
    var level=window.__MAP_HIERARCHY_LEVEL||'province';
    var all=Array.from(document.querySelectorAll('.territory'));
    var current=all.slice(-lastTerritoryFeatures.length);
    current.forEach(function(path,index){
      var feature=lastTerritoryFeatures[index]||{};
      var factionId=(lastTerritoryMapping&&lastTerritoryMapping[feature.key])||feature.kingdom;
      path.style.setProperty('fill',historicalColor(feature,factionId,level),'important');
      path.style.setProperty('fill-opacity',level==='commandery'?'0':'0.30','important');
      path.style.setProperty('stroke-opacity',level==='province'?'0.9':'0','important');
      path.style.setProperty('stroke-width',level==='province'?'1.5':'0','important');
    });
    document.querySelectorAll('.faction-label').forEach(function(label){label.style.visibility=level==='faction'?'visible':'hidden';});
    document.querySelectorAll('.province-label').forEach(function(label){label.style.visibility=level==='province'?'visible':'hidden';});
    if(window.__scheduleLabelLayout) window.__scheduleLabelLayout();
  }
  window.addEventListener('sgz-map-hierarchy',applyTerritoryHierarchyDom);
  var labelLayoutTimer=0;
  function overlaps(a,b,padding){
    return !(a.right+padding<b.left||a.left-padding>b.right||a.bottom+padding<b.top||a.top-padding>b.bottom);
  }
  function declutterLabels(){
    var countries=Array.from(document.querySelectorAll('.faction-label'));
    var provinces=Array.from(document.querySelectorAll('.province-label'));
    var commanderies=Array.from(document.querySelectorAll('.cmd-label'));
    var hierarchy=window.__MAP_HIERARCHY_LEVEL||'province';
    var app=document.getElementById('app');
    var compact=!!(app&&app.classList.contains('zoom-lte-5'));
    var tiny=!!(app&&app.classList.contains('zoom-lte-4'));
    var all=countries.concat(provinces,commanderies);
    all.forEach(function(label){
      var visible=label.classList.contains('faction-label')?hierarchy==='faction':label.classList.contains('province-label')?hierarchy==='province':hierarchy==='commandery';
      label.style.visibility=visible?'visible':'hidden';
    });
    var accepted=[];
    // 先固定州名，再让势力大字与郡名避开，避免国号压住行政信息。
    provinces.filter(function(label){return hierarchy==='province'&&label.style.visibility!=='hidden';}).forEach(function(label){
      var rect=label.getBoundingClientRect();
      if(rect.width&&rect.height) accepted.push(rect);
    });
    countries.filter(function(label){return hierarchy==='faction'&&label.style.visibility!=='hidden';}).forEach(function(label){
      var span=label.querySelector('span');
      if(!span) return;
      span.style.setProperty('--cmd-shift-y','0px');
      var base=span.getBoundingClientRect();
      var candidates=[0,-38,38,-76,76,-114,114];
      var selected=0;
      for(var i=0;i<candidates.length;i++){
        var shift=candidates[i];
        var candidate={left:base.left,right:base.right,top:base.top+shift,bottom:base.bottom+shift};
        if(!accepted.some(function(rect){return overlaps(candidate,rect,4);})){selected=shift;break;}
      }
      span.style.setProperty('--cmd-shift-y',selected+'px');
      var chosen=span.getBoundingClientRect();
      accepted.push(chosen);
    });
    // V10：郡名是行政信息本身，不再用碰撞避让把它隐藏。
    // 缩略视图只对文字做有限的上下错位，保留每一个郡块的名称，同时避免
    // 河内—魏郡、巴—巴西等相邻小郡的文字完全叠成一团。
    var visibleCommanderies=commanderies.filter(function(label){
      if(hierarchy!=='commandery') return false;
      var rect=label.getBoundingClientRect();
      return rect.width&&rect.height;
    }).sort(function(a,b){
      var ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
      return ar.top-br.top||ar.left-br.left;
    });
    visibleCommanderies.forEach(function(label){
      var span=label.querySelector('span');
      if(!span) return;
      label.classList.toggle('cmd-label-compact',compact);
      label.classList.toggle('cmd-label-tiny',tiny);
      label.style.visibility='visible';
      label.style.zIndex=compact?'640':'650';
      span.style.setProperty('--cmd-shift-y','0px');
      var base=span.getBoundingClientRect();
      var candidates=compact?[0,-8,8,-16,16,-24,24,-34,34]:[0,-10,10,-20,20,-32,32,-46,46];
      var selected=0;
      for(var i=0;i<candidates.length;i++){
        var shift=candidates[i];
        var candidate={left:base.left,right:base.right,top:base.top+shift,bottom:base.bottom+shift};
        if(!accepted.some(function(rect){return overlaps(candidate,rect,tiny?1:2);})){selected=shift;break;}
      }
      span.style.setProperty('--cmd-shift-y',selected+'px');
      var chosen=span.getBoundingClientRect();
      accepted.push(chosen);
    });
  }
  function scheduleLabelLayout(){
    clearTimeout(labelLayoutTimer);
    labelLayoutTimer=setTimeout(declutterLabels,90);
  }
  window.addEventListener('resize',scheduleLabelLayout);
  var mapApp=document.getElementById('app');
  if(mapApp && typeof mapApp.nodeType==='number'){
    new MutationObserver(scheduleLabelLayout).observe(mapApp,{attributes:true,attributeFilter:['class']});
  }
  var renderTerritories=Territories.render;
  Territories.render=function(map,features,mapping,opts){
    lastTerritoryFeatures=features||[];
    lastTerritoryMapping=mapping||{};
    var result=renderTerritories.apply(Territories,arguments);
    requestAnimationFrame(function(){
      applyTerritoryHierarchyDom();
      scheduleLabelLayout();
    });
    return result;
  };
  var renderWu=WuCommanderies.render;
  var renderGeneral=Commanderies.render;
  WuCommanderies.render=function(map,opts){
    Commanderies.hide();
    window.GEO_WU_COMMANDERIES_263=(window.GEO_WU_COMMANDERIES_263||[]).map(function(feature){
      return Object.assign({},feature,{color:historicalColor(feature,feature.kingdom,'commandery')});
    });
    var result=renderWu.call(WuCommanderies,map,opts);
    scheduleLabelLayout();
    return result;
  };
  Commanderies.render=function(map,data,opts){
    WuCommanderies.hide();
    var colored=(data||[]).map(function(feature){
      return Object.assign({},feature,{color:historicalColor(feature,feature.kingdom,'commandery')});
    });
    var result=renderGeneral.call(Commanderies,map,colored,opts);
    scheduleLabelLayout();
    return result;
  };
})();
</script>

<script>
(function(){
  function textNode(tag,className,text){
    var node=document.createElement(tag);
    if(className)node.className=className;
    node.textContent=String(text==null?'':text);
    return node;
  }
  function section(label,className){
    var node=textNode('div','pv-section','');
    node.appendChild(textNode('div','pv-label',label));
    var body=textNode('div',className||'','');node.appendChild(body);
    return {node:node,body:body};
  }
  function factionsFor(periodId){
    var def=PROVINCE_PERIODS[periodId]||{};
    var map=def.provinces||{};
    var ids=Array.from(new Set(Object.values(map)));
    var audited=(window.POLITICAL_SNAPSHOT_AUDIT||{})[periodId]||{};
    Object.values(audited.commanderyFactions||{}).forEach(function(id){if(ids.indexOf(id)===-1)ids.push(id);});
    (audited.annotations||[]).forEach(function(item){if(ids.indexOf(item.faction)===-1)ids.push(item.faction);});
    (audited.expected||[]).forEach(function(id){if(ids.indexOf(id)===-1)ids.push(id);});
    var order=['han','huangjin','dongzhuo','liguo','hanfu','yuan_shao','kongzhou','liudai','zhangmiao','qiaomao','baoxin','wangkuang','zhangchao','yuanyi','lianjun','lubu','caocao','liubiao','liuzhang','liubei','sunquan','gongsunzan','gongsundu','liangzhou','hansui','mateng','shikie','wei','shu','wu','jin','hantuo','shile','sunce'];
    return order.filter(function(id){return ids.indexOf(id)!==-1&&FACTIONS[id];}).map(function(id){return FACTIONS[id];});
  }
  Panel.periodView=function(p){
    var periodLabel=p.range?('公元 '+p.range+' 年'):((p.year||'')+' 年');
    var rosterGroups={};
    (p.officialRoster||[]).forEach(function(item){(rosterGroups[item.group]||(rosterGroups[item.group]=[])).push(item);});
    var statusSuffix={存疑:'（一说）',待考:'（任职未详）'};
    var panel=document.getElementById('info-panel');
    var body=panel&&panel.querySelector('.panel-body');
    if(!body)return;
    var fragment=document.createDocumentFragment();
    var head=textNode('div','pv-head','');
    head.appendChild(textNode('div','pv-year',periodLabel));
    head.appendChild(textNode('h2','pv-title',p.name));
    head.appendChild(textNode('div','pv-tag',String(p.tagline||'')+(p.snapshotMoment?' · '+p.snapshotMoment:'')));
    fragment.appendChild(head);
    fragment.appendChild(textNode('p','pv-summary',p.summary));
    var territories=section('国家与政权','pv-chips');
    factionsFor(p.id).forEach(function(f){var chip=textNode('span','chip',f.name);chip.style.setProperty('--c',String(f.color||''));territories.body.appendChild(chip);});
    fragment.appendChild(territories.node);
    var reignSection=section('年号与皇帝','pv-reigns');
    (p.reigns||[]).forEach(function(r){
      var row=textNode('div','reign-row','');
      row.appendChild(textNode('span','reign-era',r.era));row.appendChild(textNode('span','reign-emp',r.emperor));row.appendChild(textNode('span','reign-yr',r.years||''));
      reignSection.body.appendChild(row);
    });
    fragment.appendChild(reignSection.node);
    if(Object.keys(rosterGroups).length){
      var rosterSection=section('中央与州郡长吏','pv-roster');
      Object.keys(rosterGroups).forEach(function(group){
        var rosterGroup=textNode('div','roster-group','');rosterGroup.appendChild(textNode('b','',group));
        var rosterItems=textNode('div','','');
        rosterGroups[group].forEach(function(item){
          var status=item.status||'推定';var rosterItem=textNode('span','roster-item','');
          rosterItem.appendChild(textNode('span','roster-meta',String(item.period||'')+(item.section?' · '+item.section:'')));
          rosterItem.appendChild(textNode('strong','',String(item.name||'')+(statusSuffix[status]||'')));
          rosterItem.appendChild(textNode('small','',item.office));rosterItems.appendChild(rosterItem);
        });
        rosterGroup.appendChild(rosterItems);rosterSection.body.appendChild(rosterGroup);
      });
      fragment.appendChild(rosterSection.node);
    }
    var eventSection=section('编年要事','');var eventList=textNode('ul','ev-list','');eventSection.node.replaceChild(eventList,eventSection.body);
    (p.events||[]).forEach(function(e){
      var item=textNode('li','','');item.appendChild(textNode('span','ev-year',e.year));var copy=textNode('span','ev-text','');
      copy.appendChild(textNode('span','ev-era',e.era||''));copy.appendChild(textNode('span','ev-emperor',e.emperor?' · '+e.emperor:''));copy.appendChild(textNode('span','ev-desc',e.text));item.appendChild(copy);eventList.appendChild(item);
    });
    fragment.appendChild(eventSection.node);
    var back=textNode('button','pv-back','古水名索引');back.type='button';back.addEventListener('click',function(){Panel.hydronymIndex();});fragment.appendChild(back);
    fragment.appendChild(textNode('div','pv-hint','点击地图上的城池、战役、古水名或州郡，以观其详。'));
    body.replaceChildren(fragment);
    panel.classList.add('is-open');
  };
  document.addEventListener('DOMContentLoaded',function(){
    if(window.innerWidth<=760){
      document.getElementById('sidebox')?.classList.add('is-collapsed');
      document.getElementById('info-panel')?.classList.add('is-collapsed');
    }
  });
})();
</script>
<script src="js/timeline.js"></script>
<script>
(function(){
  Object.keys(FACTIONS).forEach(function(id){FACTIONS[id].__baseName=FACTIONS[id].name;});
  var originalInit=Timeline.init.bind(Timeline);
  Timeline.init=function(periods,onChange){
    return originalInit(periods,function(index,opts){
      var period=periods[index]||{};
      Object.keys(FACTIONS).forEach(function(id){FACTIONS[id].name=FACTIONS[id].__baseName;});
      var politicalSnapshot=(window.POLITICAL_SNAPSHOT_AUDIT||{})[period.id]||{};
      Object.keys(politicalSnapshot.displayNames||{}).forEach(function(id){if(FACTIONS[id])FACTIONS[id].name=politicalSnapshot.displayNames[id];});
      var variant=period.mapVariant;
      if(variant&&window.HISTORY_PROVINCE_VARIANTS[variant]){
        window.__activeMapVariant=variant;
        PROVINCE_PERIODS[period.id]=Object.assign({},PROVINCE_PERIODS[period.id]||PROVINCE_PERIODS.guijin,window.HISTORY_PROVINCE_VARIANTS[variant]);
        var geo=window.__HISTORY_GEO_DATA;
        if(geo&&geo[variant]) window.GEO_WU_COMMANDERIES_263=geo[variant];
      }
      return onChange(index,opts);
    });
  };
  window.HistoryMapTimeline=Timeline;
})();
</script>
