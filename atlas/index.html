function loadSgzUiModule(name){
  if(window.SGZ_UI_MODULES[name])return Promise.resolve(window.SGZ_UI_MODULES[name]);
  if(sgzUiModulePromises.has(name))return sgzUiModulePromises.get(name);
  let request;
  if(name==='shell')request=import('./assets/app/shell.js');
  else if(name==='persistence')request=import('./assets/app/persistence.js?v=66.2');
  else if(name==='people')request=import('./assets/app/people.js');
  else if(name==='fangzhen')request=import('./assets/app/fangzhen.js?v=67');
  else if(name==='jinshi')request=import('./assets/app/jinshi.js?v=71.1');
  else if(name==='shihuo')request=import('./assets/app/shihuo.js');
  else return Promise.reject(new Error('未知界面模块：'+name));
  const attempt=sgzUiModuleAttempts.get(name)||0;
  sgzUiModuleAttempts.set(name,attempt+1);
  if(attempt){request.catch(()=>{});request=import('./assets/app/'+name+'.js?retry='+attempt);}
  const pending=request.then(module=>{
    window.SGZ_UI_MODULES[name]=module;

  });

}

const sgzDataScriptPromises=new Map();
function loadSgzDataScript(key,src,globalName){
  if(globalName&&window[globalName])return Promise.resolve(window[globalName]);
  if(sgzDataScriptPromises.has(key))return sgzDataScriptPromises.get(key);
  const pending=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    const finish=(error)=>{
      clearTimeout(timeout);script.onload=null;script.onerror=null;
      if(error){script.remove();reject(error);}else resolve(globalName?window[globalName]:true);
    };
    const timeout=setTimeout(()=>finish(new Error('资料载入超时，请重试')),20000);
    script.src=src;script.async=true;script.dataset.sgzLazyData=key;
    script.onload=()=>finish(globalName&&!window[globalName]?new Error('资料未能完整载入'):null);
    script.onerror=()=>finish(new Error('资料载入失败，请检查连接后重试'));
    document.head.appendChild(script);
  }).catch(error=>{
    sgzDataScriptPromises.delete(key);
    throw error;
  });
  sgzDataScriptPromises.set(key,pending);
  return pending;
}

function buildWeiArchiveRecords(type, groups){
  const sourceUrl = type==='cishi' ? WEI_CISHI_SOURCE : WEI_DUDU_SOURCE;
  const sourceTitle = type==='cishi' ? '维基百科：曹魏刺史列表' : '维基百科：曹魏都督列表';
  const rows=[];
  groups.forEach((group,groupIndex)=>{
    group.entries.forEach((entry,entryIndex)=>{
      const years=(String(entry[1]||'').match(/(?:1|2)\d{2}(?=年)/g)||[]).map(Number);
      rows.push({
        id:'wei_'+type+'_'+groupIndex+'_'+entryIndex,
        type, region:group.region, office:group.office,
        name:entry[0], tenure:entry[1], note:entry[2]||'',
        startYear:years.length?years[0]:null,
        endYear:years.length?years[years.length-1]:null,
        sourceTitle, sourceUrl,
      });
    });
  });
  return rows;
}

  const byId = new Map(FANGZHEN_PRESETS.map(record=>[record.id, record]));
  supplements.forEach(sup=>{
    const target = byId.get(String(sup.id||''));
    if(!target) return;
    target.startYear = normalizeYear(sup.startYear);
    target.endYear = normalizeYear(sup.endYear);
    target.tenureText = String(sup.tenureText || target.tenureText || '');
    target.sourceTenureText = String(target.sourceTenureText || target.tenureText || '');
    target.confidence = String(sup.confidence || target.confidence || '待考');
    if(sup.appointmentStatus) target.appointmentStatus = String(sup.appointmentStatus);
    if(sup.sourceLevel) target.sourceLevel = String(sup.sourceLevel);
    target.note = [String(sup.note||''), String(target.note||'')].filter(Boolean).join('；');
  });
})();

function validateHistoryMapRegistry(registry){
  const expected = ['huangjin','shaodi','dongzhuo','xingping','jianbing','guandu','chibi','xiangfan','sanguo','beifa','guijin','hanwang','jinchu','taikang','hui_di','yongjia'];
  const actual = Array.isArray(registry?.periods) ? registry.periods.map(period=>period.id) : [];
  const validOrder = actual.length === expected.length && actual.every((id,index)=>id===expected[index]);
  const uniqueYears = new Set((registry?.periods||[]).map(period=>period.year)).size === expected.length;
  if (!validOrder || !uniqueYears) {
    const message = '十六期地图注册表校验失败：必须完整保留 184、189、190、194、199、200、208、219、220、228、263、264、266、280、290、311 十六期，且顺序不可变。';
    renderFatalPanel('地图数据保护校验未通过',[message,'当前 id：'+actual.join('、')],'660px');
    throw new Error(message);
  }
  return registry;
}

function normalizeYear(value){
  if(value === '' || value === null || value === undefined) return null;
  const n = Number(value);
  return Number.isFinite(n) ? Math.trunc(n) : null;
}

function makeFigureRecord(source){
  const raw = source || {};
  return {
    id: raw.id || figureKey(),
    name: String(raw.name || raw.person || '').trim(),
    personId: String(raw.personId || ''),
    portrait: typeof (raw.portrait || raw.image) === 'string' ? (raw.portrait || raw.image) : '',
    rulerKey: String(raw.rulerKey || raw.periodKey || ''),
    startYear: normalizeYear(raw.startYear),
    endYear: normalizeYear(raw.endYear),
    note: String(raw.note || ''),
    status: String(raw.status || ''),
    confidence: String(raw.confidence || ''),
    sourceTitle: String(raw.sourceTitle || raw.citations?.map(c=>c.title).join('；') || ''),
    sourceUrl: String(raw.sourceUrl || raw.citations?.[0]?.url || ''),
    sourceExcerpt: String(raw.sourceExcerpt || raw.citations?.map(c=>c.quote).join('\n') || ''),
    ...(raw.catalogueManaged ? {catalogueManaged:true,appointmentNature:String(raw.appointmentNature||''),dateCertainty:String(raw.dateCertainty||'unknown'),citations:raw.citations||[]} : {}),
  };
}

function normalizeFigures(rawFigures, factionKey){
  if(!Array.isArray(rawFigures)) return [];
  const records = [];
  rawFigures.forEach(raw=>{
    if(typeof raw === 'string'){
      const defaults = LEGACY_FIGURE_DEFAULTS[factionKey] && LEGACY_FIGURE_DEFAULTS[factionKey][raw];
      const match = raw.match(/^([^（(]+)[（(]([^）)]+)[）)]$/);
      if(defaults) defaults.forEach(item=>records.push(makeFigureRecord(item)));
      else if(match){
        const name=match[1].trim(), detail=match[2].trim();
        const yearRange=detail.match(/(约)?(\d{3}|[?？])\s*[—–-]\s*(约)?(\d{3}|[?？])/);
        const singleYear=!yearRange&&detail.match(/^(约)?(\d{3})(?:年)?$/);
        const startYear=yearRange&&/^\d{3}$/.test(yearRange[2])?Number(yearRange[2]):(singleYear?Number(singleYear[2]):null);
        const endYear=yearRange&&/^\d{3}$/.test(yearRange[4])?Number(yearRange[4]):(singleYear?Number(singleYear[2]):null);
        const note=detail
          .replace(/(约)?(\d{3}|[?？])\s*[—–-]\s*(约)?(\d{3}|[?？])(?:年)?/,'')
          .replace(/^(约)?\d{3}(?:年)?/,'')
          .replace(/待核|待考/g,'年代未详')
          .replace(/^[，,；;\s]+|[，,；;\s]+$/g,'');
        records.push(makeFigureRecord({name,startYear,endYear,note:[yearRange&&(yearRange[1]||yearRange[3])?'约':'',note].filter(Boolean).join('；')}));
      } else records.push(makeFigureRecord({name:raw}));
    } else if(raw && typeof raw === 'object'){
      // 研究模型会先将旧字符串人物包装为对象；此处仍需清理“姓名（任期／注记）”，
      // 否则对象分支会绕过上面的旧字符串解析，污染人物主键和人物记显示。
      const normalized=Object.assign({},raw);
      const rawName=String(normalized.name || normalized.person || '').trim();
      const match=rawName.match(/^([^（(]+)[（(]([^）)]+)[）)]$/);
      if(match){
        const detail=match[2].trim();
        const yearRange=detail.match(/(约)?(\d{3}|[?？])\s*[—–-]\s*(约)?(\d{3}|[?？])/);
        const singleYear=!yearRange&&detail.match(/^(约)?(\d{3})(?:年)?$/);
        if(yearRange||singleYear||detail){
          normalized.name=match[1].trim();
          if(yearRange){
            if(normalized.startYear==null && /^\d{3}$/.test(yearRange[2])) normalized.startYear=Number(yearRange[2]);
            if(normalized.endYear==null && /^\d{3}$/.test(yearRange[4])) normalized.endYear=Number(yearRange[4]);
          }else if(singleYear && normalized.startYear==null){
            normalized.startYear=Number(singleYear[2]);
            if(normalized.endYear==null) normalized.endYear=Number(singleYear[2]);
          }
          const note=detail
            .replace(/(约)?(\d{3}|[?？])\s*[—–-]\s*(约)?(\d{3}|[?？])(?:年)?/,'')
            .replace(/^(约)?\d{3}(?:年)?/,'')
            .replace(/^[，,；;\s]+|[，,；;\s]+$/g,'');
          if(note && !String(normalized.note||'').trim()) normalized.note=note;
        }
      }
      records.push(makeFigureRecord(normalized));
    }
  });
  const ids = new Set();
  records.forEach(record=>{
    if(ids.has(record.id)) record.id = figureKey();
    ids.add(record.id);
  });
  return records;
}

function nextUniqueKey(prefix, occupied){
  let key;
  do { key = nk(prefix); } while(occupied.has(key));
  occupied.add(key);
  return key;
}

/* 将《后汉书·百官志》制度补录接入东汉预设；同名旧节点保留人物与用户编辑，只补证据和父级。 */
function appendHanBaiGuanZhi(tree){
  const payload=window.SGZ_HAN_BAI_GUAN_ZHI;
  if(!payload || !Array.isArray(payload.records) || !Array.isArray(tree)) return;
  const root=tree.find(node=>node.kind==='root');
  if(!root) return;
  const normalizeName=value=>String(value||'').replace(/[（(].*?[)）]/g,'').trim();
  const findExisting=name=>{
    const target=normalizeName(name);
    return tree.find(node=>normalizeName(node.name)===target) ||
      (target==='大将军' ? tree.find(node=>normalizeName(node.name).startsWith('大将军')) : null);
  };
  const createdByName=new Map();
  payload.records.forEach(record=>{
    // 读者包只投影已通过构建期门禁的《百官志》记录；即使审校字段被剥离，
    // 也必须保留其发布结论，不能在运行时退回“推定”并误隐藏大将军等制度节点。
    const published=record.researchStatus==='确定'||window.SGZ_READER_BUILD===true;
    const parentName=record.parent==='__root__'?'__root__':record.parent;
    const parent=parentName==='__root__' ? root : (createdByName.get(parentName)||findExisting(parentName)||root);
    let node=findExisting(record.name) || createdByName.get(record.name);
    if(!node){
      node=O('han_o',parent.key,record.name,record.category||'其他',record.rank9||'',record.hanRank||'',{
        duty:record.duty||'',
        note:record.note||'',
        relationType:record.relationType||'制度并列',
        hidden:record.hidden===true,
        sortOrder:Number.isFinite(Number(record.sortOrder))?Number(record.sortOrder):null,
        sources:record.sourceTitle||payload.source.title,
        sourceLevel:record.sourceLevel||payload.source.level,
        sourceLocator:record.sourceLocator||payload.source.locator,
        sourceUrl:record.sourceUrl||payload.source.url||'',
        sourceExcerpt:record.sourceExcerpt||'',
        confidence:record.confidence||(published?'确定':'推定'),
        researchStatus:record.researchStatus||(published?'确定':'推定'),
        officePublicationStatus:published?'verified':'review-only',
        customTags:Array.isArray(record.customTags)?record.customTags.slice():['东汉百官志补录']
      });
      tree.push(node);
    }else{
      if(node.kind==='office' && node!==root) node.parent=parent.key;
      node.category=record.category||node.category;
      if(record.hanRank && !node.hanRank) node.hanRank=record.hanRank;
      if(record.duty && !node.duty) node.duty=record.duty;
      if(record.note) node.note=node.note?node.note+' '+record.note:record.note;
      if(record.hidden!==undefined) node.hidden=!!record.hidden;
      if(record.sortOrder!==undefined && Number.isFinite(Number(record.sortOrder))) node.sortOrder=Number(record.sortOrder);
      node.sources=node.sources||record.sourceTitle||payload.source.title;
      node.sourceLevel=node.sourceLevel||record.sourceLevel||payload.source.level;
      node.sourceLocator=node.sourceLocator||record.sourceLocator||payload.source.locator;
      node.sourceUrl=node.sourceUrl||record.sourceUrl||payload.source.url||'';
      node.sourceExcerpt=node.sourceExcerpt||record.sourceExcerpt||'';
      node.confidence=node.confidence||record.confidence||(published?'确定':'推定');
      node.researchStatus=node.researchStatus||record.researchStatus||(published?'确定':'推定');
      node.officePublicationStatus=published?'verified':'review-only';
      node.customTags=Array.from(new Set([...(node.customTags||[]),...(record.customTags||[]),'东汉百官志补录']));
    }
    createdByName.set(record.name,node);
  });
  // 兼容旧预设：旧版的汇总项保留在用户树中，但不再作为朝堂可见席位。
  const legacyAggregateNames=new Set(['尚书六曹','前后左右将军','四征将军','四镇将军','四安四平将军','中郎将系统','校尉系统','中央将军系统']);
  tree.forEach(node=>{
    if(node.kind==='office' && legacyAggregateNames.has(normalizeName(node.name))) node.hidden=true;
  });
}

    const frontierGroup = O('tribal_o', root.key, '中原王朝护边官署', '属国护官', '', '', {
      polity:'汉魏晋', relationType:'视图分组（非直属）', note:'这些官署由汉魏晋朝廷设置，不属于异族内部官制。'
    });
    const chanyu = O('tribal_o', internalGroup.key, '单于（匈奴）', '部族首领', '', '', {polity:'匈奴', duty:'部族共主', figures:['呼厨泉']});
    const xiyu = O('tribal_o', frontierGroup.key, '西域都护／西域长史', '属国护官', '', '比二千石', {
      polity:'汉魏晋', jie:'依时期', duty:'中原王朝经营西域的护边官署；两名不可概括为“大都护”',
      sources:'《通典》卷三十六及两汉、魏晋相关纪传'
    });
    const xianwang = ['左贤王','右贤王','日逐王']
      .map(nm=>O('tribal_o', chanyu.key, nm, '部族首领', '', '', {polity:'匈奴'}));
    const buluo = ['部落大人','邑落渠帅']
      .map(nm=>O('tribal_o', xianwang[0].key, nm, '部族首领', '', '', {polity:'匈奴'}));
    const huguan = ['护匈奴中郎将','护乌桓校尉','护羌校尉']
      .map(nm=>O('tribal_o', frontierGroup.key, nm, '属国护官', '', '比二千石', {
        polity:'汉魏晋', jie:'依任命', duty:'中原王朝所设，监护、册封、征调边疆诸族'
      }));
    const shuguo = ['属国都尉']
      .map(nm=>O('tribal_o', huguan[0].key, nm, '属国护官', '五品', '比二千石', {polity:'匈奴'}));
    const guiyi = ['归义侯','率众王','译长']
      .map(nm=>O('tribal_o', huguan[1].key, nm, '部族首领', '', '', {polity:'乌桓', duty:'汉朝赐印绶封号，羁縻部族首领'}));

    const officeNodes = [root, internalGroup, frontierGroup, chanyu, xiyu, ...xianwang, ...buluo, ...huguan, ...shuguo, ...guiyi];

    const nroot = N('tribal_n', null, '异族封授爵位', '', {kind:'root', polity:'异族诸部'});
    const shuaizhongwang = N('tribal_n', nroot.key, '率众王（汉封）', '名号侯', {polity:'乌桓', inherit:'虚封遥授', mountId: guiyi[1].key});
    const guiyihou = N('tribal_n', nroot.key, '归义侯（汉封）', '侯（县侯）', {polity:'乌桓', inherit:'虚封遥授', mountId: guiyi[0].key});
    const nobleNodes = [nroot, shuaizhongwang, guiyihou];

    P.tribal = { office: officeNodes, noble: nobleNodes };
  }

  // 维基百科《三国官制》条目补充缺失官职；仅追加，不改动原预设节点。
  WIKI_OFFICE_SUPPLEMENTS.forEach(item=>{
    const tree=P[item.faction] && P[item.faction].office;
    if(!tree) return;
    if(tree.some(n=>n.kind!=='root' && String(n.name).replace(/[（(].*?[)）]/g,'').trim()===item.name)) return;
    const parent=item.parent ? tree.find(n=>String(n.name).trim()===item.parent) : null;
    const parentNode=parent || tree.find(n=>n.kind==='root');
    if(!parentNode) return;
    const node=O(item.faction+'_o', parentNode.key, item.name, item.category||'其他', item.rank9||'', item.hanRank||'', {
      ...(item.entityId?{key:item.entityId}:{}),
      entityId:item.entityId||'',courtOrder:Number.isFinite(Number(item.courtOrder))?Number(item.courtOrder):null,
      legacyKeys:Array.isArray(item.legacyKeys)?item.legacyKeys.slice():[],
      duty:item.duty||'', note:item.note||'具体制度沿革未详。',
      sources:'维基百科：三国官制（https://zh.wikipedia.org/wiki/三国官制）',
      sourceLevel:'二手索引', confidence:'待核', officeStartYear:item.start??null, officeEndYear:item.end??null,
      customTags:[], _supplementKind:'wiki-office'
    });
    // 若条目带一手来源引用，则用它覆盖维基默认来源，同时保留"维基引入"作为补充证据层。
    // sources 保留维基作为引入来源；sourceLevel/sourceLocator/sourceUrl 标注一手史料供界面显示，避免混作单一证据层。
    if(Array.isArray(item.sourceRefs) && item.sourceRefs.length){
      const src=item.sourceRefs[0];
      if(src.sourceTitle) node.sources += '；'+src.sourceTitle;
      if(src.sourceLevel) node.sourceLevel = src.sourceLevel;
      if(src.sourceLocator) node.sourceLocator = src.sourceLocator;
      if(src.url) node.sourceUrl = src.url;
      node.confidence = '核';
      if(Array.isArray(node.customTags)) node.customTags.push('正史确认');
    }
    node._presetParentName = parentNode.name;
    tree.push(node);
  });
  appendHanBaiGuanZhi(P.han && P.han.office);
  return P;
}

function mergePresetSupplement(targetTrees){
  const preset=buildPresets();
  ['han','wei','shu','wu','jin','tribal'].forEach(fk=>{
    const saved=targetTrees[fk] && targetTrees[fk].office;
    if(!saved) return;
    const savedNames=new Set(saved.filter(n=>n.kind!=='root').map(n=>String(n.name).replace(/[（(].*?[)）]/g,'').trim()));
    const occupied=new Set(saved.map(n=>n.key));
    (preset[fk]?.office||[]).filter(n=>n.kind!=='root' && n._supplementKind==='wiki-office').forEach(pn=>{
      const nm=String(pn.name).replace(/[（(].*?[)）]/g,'').trim();
      if(savedNames.has(nm)) return;
      const parent=saved.find(n=>String(n.name).trim()===String(pn._presetParentName||''));
      const parentNode=parent || saved.find(n=>n.kind==='root');
      if(!parentNode) return;
      const prefix=fk+'_o';
      const node=O(prefix, parentNode.key, pn.name, pn.category||'其他', pn.rank9||'', pn.hanRank||'', {
        duty:pn.duty||'', note:pn.note||'', sources:pn.sources||'', sourceLevel:'二手索引', confidence:'待核',
        officeStartYear:normalizeYear(pn.officeStartYear), officeEndYear:normalizeYear(pn.officeEndYear),
        customTags:Array.isArray(pn.customTags)?pn.customTags.slice():[], _supplementKind:'wiki-office'
      });
      if(Array.isArray(pn.sourceRefs) && pn.sourceRefs.length){
        const src=pn.sourceRefs[0];
        if(src.sourceTitle) node.sources += '；'+src.sourceTitle;
        if(src.sourceLevel) node.sourceLevel = src.sourceLevel;
        if(src.sourceLocator) node.sourceLocator = src.sourceLocator;
        if(src.url) node.sourceUrl = src.url;
        node.confidence = '核';
        if(Array.isArray(node.customTags)) node.customTags.push('正史确认');
      }
      if(occupied.has(node.key)) node.key=nextUniqueKey(prefix, occupied);
      occupied.add(node.key);
      saved.push(node);
      savedNames.add(nm);
    });
  });
  return targetTrees;
}

function migrateV66WeiZhongshuSemantics(trees){
  const offices=trees?.wei?.office;
  if(!Array.isArray(offices)) return trees;
  const root=offices.find(node=>node?.kind==='root')||offices.find(node=>node&&node.parent===undefined);
  if(!root) return trees;
  const cleanName=value=>String(value||'').replace(/[（(].*?[)）]/g,'').trim();
  const mergeLegacyKeys=(node,values)=>{
    node.legacyKeys=[...new Set([...(Array.isArray(node.legacyKeys)?node.legacyKeys:[]),...values].filter(Boolean))];
  };
  const legacy=offices.find(node=>node?.entityId==='office:wei:zhongshu-jian-ling-legacy'||cleanName(node?.name)==='中书监／中书令');
  if(legacy){
    legacy.entityId='office:wei:zhongshu-jian-ling-legacy';
    legacy.hidden=true;
    legacy.archived=true;
    legacy.virtual=true;
    legacy.relationType='兼容别名';
    mergeLegacyKeys(legacy,['legacy:wei:zhongshu-jian-ling']);
    offices.forEach(node=>{
      if(node!==legacy&&node?.parent===legacy.key&&!node.hidden) node.parent=root.key;
    });
  }
  const specs=[
    {name:'中书监',entityId:'office:wei:zhongshu-jian',courtOrder:10,rank9:'三品',hanRank:'千石',legacyKeys:['legacy:wei:zhongshu-jian-ling']},
    {name:'中书令',entityId:'office:wei:zhongshu-ling',courtOrder:20,rank9:'三品',hanRank:'千石',legacyKeys:['legacy:wei:zhongshu-jian-ling']},
    {name:'中书侍郎',entityId:'office:wei:zhongshu-shilang',courtOrder:30,rank9:'五品',hanRank:'',legacyKeys:[]},
    {name:'通事郎',entityId:'office:wei:tongshi-lang',courtOrder:40,rank9:'五品',hanRank:'',legacyKeys:[]},
  ];
  specs.forEach(spec=>{
    let node=offices.find(item=>item?.entityId===spec.entityId||item?.key===spec.entityId||cleanName(item?.name)===spec.name);
    if(!node){
      node=O('wei_o',root.key,spec.name,'中书门下',spec.rank9,spec.hanRank,{
        key:spec.entityId,entityId:spec.entityId,courtOrder:spec.courtOrder,legacyKeys:[...spec.legacyKeys],
        relationType:'制度并列',sources:'《晋书》卷24·职官志',sourceLevel:'一手史料',
        sourceLocator:'中书省条',sourceUrl:'https://zh.wikisource.org/zh-hans/晉書/卷024'
      });
      offices.push(node);
    }
    node.name=spec.name;
    node.displayTitle=spec.name;
    node.entityId=spec.entityId;
    node.courtOrder=spec.courtOrder;
    node.parent=root.key;
    node.hidden=false;
    node.archived=false;
    node.virtual=false;
    node.category='中书门下';
    node.rank9=node.rank9||spec.rank9;
    node.hanRank=node.hanRank||spec.hanRank;
    mergeLegacyKeys(node,spec.legacyKeys);
  });
  return trees;
}
/* V66_WEI_ZHONGSHU_MIGRATION_END */

/* V66_WU_LEADER_MIGRATION_START */
function migrateV66WuLeaderSemantics(trees){
  const group=trees?.wu;
  const offices=group?.office;
  if(!Array.isArray(offices)) return;
  const root=offices.find(node=>node.kind==='root'||node.parent===undefined||node.parent===null);
  if(!root) return;
  const occupied=new Set(offices.map(node=>String(node.key)));
  const canonical=value=>String(value||'').replace(/[（(].*?[)）]/g,'').replace(/\s+/g,'').trim();
  const legacyCombined=offices.filter(node=>/^(?:中领军[／/]左右领军|中领军与左右领军|左右领军)$/.test(canonical(node.name)));
  legacyCombined.forEach(node=>{
    node.hidden=true;
    node.archived=true;
    node.virtual=true;
    node.historicalStatus='兼容别名';
    node.legacyKeys=Array.from(new Set([...(Array.isArray(node.legacyKeys)?node.legacyKeys:[]),String(node.key)]));
  });
  const definitions=[
    {name:'中领军',entityId:'office:wu:zhonglingjun',order:160,sourceLocator:'《资治通鉴》卷七十一胡三省注'},
    {name:'左领军',entityId:'office:wu:zuolingjun',order:161,sourceLocator:'《三国志》卷六十二·胡综传'},
    {name:'右领军',entityId:'office:wu:youlingjun',order:162,sourceLocator:'《三国志》卷六十二·胡综传；《资治通鉴》卷七十一'},
  ];
  definitions.forEach(definition=>{
    const matches=offices.filter(node=>node.kind==='office'&&canonical(node.name)===definition.name&&!node.virtual);
    let node=matches.find(item=>item.entityId===definition.entityId)||matches[0];
    matches.filter(item=>item!==node).forEach(duplicate=>{
      duplicate.hidden=true;
      duplicate.archived=true;
      duplicate.virtual=true;
      duplicate.historicalStatus='兼容别名';
      duplicate.legacyKeys=Array.from(new Set([...(Array.isArray(duplicate.legacyKeys)?duplicate.legacyKeys:[]),String(duplicate.key)]));
    });
    if(!node){
      const preferredKey=definition.entityId;
      const key=occupied.has(preferredKey)?nextUniqueKey('wu_o',occupied):preferredKey;
      occupied.add(String(key));
      node=O('wu_o',root.key,definition.name,'将军武职','','比二千石',{key});
      offices.push(node);
    }
    node.parent=root.key;
    node.name=definition.name;
    node.displayTitle=definition.name;
    node.entityId=definition.entityId;
    node.category='将军武职';
    node.serviceDomain='武官';
    node.institutionType='朝廷机关';
    node.relationType='制度并列';
    node.generalTitleSortOrder=definition.order;
    node.generalTitleKind='禁军';
    node.generalTitleGrade='禁军';
    node.courtOrder=definition.order;
    node.militaryClass='禁军';
    node.officePublicationStatus='verified';
    node.confidence='确定';
    node.sourceLevel=node.sourceLevel||'正史制度记载';
    node.sourceLocator=node.sourceLocator||definition.sourceLocator;
    node.sources=node.sources||definition.sourceLocator;
    node.hidden=false;
    node.archived=false;
    node.virtual=false;
    node.legacyKeys=Array.from(new Set(Array.isArray(node.legacyKeys)?node.legacyKeys:[]));
  });
}

function normalizeFangzhenRecords(rows){
  return cloneJSON(Array.isArray(rows)?rows:[]).map((record,index)=>{
    if(record.polity==='季汉'||record.polity==='蜀汉') record.polity='汉';
    ['note','title','jurisdiction'].forEach(field=>{
      if(typeof record[field]==='string') record[field]=record[field].replace(/蜀汉|季汉/g,'汉');
    });
    if(record.polity==='东晋' && record.eraGroup==='jin' && Number(record.endYear)>=317) record.eraGroup='eastjin';
    record.archiveScope=record.archiveScope || (record.eraGroup==='eastjin'?'东晋扩展':'核心：汉末—西晋');
    const normalizeOfficeTitle=value=>String(value==null?'':value).trim().replace(/(?:[\u4e00-\u9fff]{1,8})?郡太守/g,'太守');
    record.title=normalizeOfficeTitle(record.title||record.commission||'');
    record.commission=normalizeOfficeTitle(record.commission||record.title||'');
    record.relation=String(record.relation||'职任记录');
    record.appointmentStatus=String(record.appointmentStatus||(
      /未上任/.test(record.note||'')?'未上任':(/代理/.test((record.tenureText||'')+(record.note||''))?'代理':'实授')
    ));
    record.sourceLevel=String(record.sourceLevel||(
      /wikipedia\.org/.test(record.sourceUrl||'')?'二手索引':'待核'
    ));
    record.confidence=String(record.confidence||(
      /未详|约/.test(record.tenureText||'')?'待考':'中'
    ));
    record.sourceTenureText=String(record.sourceTenureText||record.tenureText||'');
    // 吴州镇档案任期只保留年份区间，年号原文存入 sourceTenureText 备查。
    if(record.polity==='吴' && !/[?？]|未详|待考|未知/.test(String(record.tenureText||''))){
      const start=Number(record.startYear), end=Number(record.endYear);
      const validStart=Number.isFinite(start)&&start>0;
      const validEnd=Number.isFinite(end)&&end>0;
      if(validStart&&validEnd){
        record.tenureText= start===end ? String(start) : (start+'—'+end);
      }else if(validStart){
        record.tenureText=String(start)+'—';
      }
    }
    return window.SGZResearchModel.normalizeFangzhen(record,index);
  });
}

function normalizeAndValidateNodes(nodes, label, factionKey){
  if(!Array.isArray(nodes)) throw new Error(label+'必须是节点数组');
  const keys = new Set();
  nodes.forEach((node, idx)=>{
    if(!node || typeof node!=='object' || Array.isArray(node)) throw new Error(label+'第 '+(idx+1)+' 条不是有效节点');
    if(!['string','number'].includes(typeof node.key) || String(node.key).trim()==='') throw new Error(label+'第 '+(idx+1)+' 条缺少有效 key');
    if(keys.has(node.key)) throw new Error(label+'存在重复 key：'+node.key);
    keys.add(node.key);
    if(node.parent === null || node.parent === undefined || node.parent === '') delete node.parent;
    else if(!['string','number'].includes(typeof node.parent)) throw new Error('节点「'+(node.name||node.key)+'」的 parent 必须是字符串或数字');
    Object.assign(node,window.SGZResearchModel.normalizeNode(node,factionKey,node.kind==='noble'?'noble':'office'));
    window.SGZ_APPLY_OFFICE_SUCCESSION?.(node, factionKey);
    node.figures = normalizeFigures(node.figures, factionKey);
    node.figures.forEach(person=>{ person.note=window.SGZResearchModel.readingText(person.note); });
    node.regionPath = Array.isArray(node.regionPath) ? node.regionPath.map(String) : [];
    node.customTags = Array.isArray(node.customTags) ? node.customTags.map(String).filter(Boolean) : [];
    node.officeStartYear = normalizeYear(node.officeStartYear ?? node.establishedYear);
    node.officeEndYear = normalizeYear(node.officeEndYear ?? node.abolishedYear);
    node.archived = Boolean(node.archived);
    node.hidden = Boolean(node.hidden);
    node.locked = Boolean(node.locked);
    node.sources = String(node.sources || node.source || '');
    node.duty = window.SGZResearchModel.readingText(node.duty);
    node.note = window.SGZResearchModel.readingText(node.note);
    node.directRules = window.SGZResearchModel.readingText(node.directRules);
    node.polity = String(node.polity || node.country || node.tribe || '');
    node.footnotes = Array.isArray(node.footnotes) ? node.footnotes.filter(f=>f && f.text).map(f=>({
      id: f.id || ('fn_'+Math.random().toString(36).slice(2)), field: String(f.field||'备注'), text: String(f.text||'')
    })) : [];
    node.evolutionEvents = Array.isArray(node.evolutionEvents) ? node.evolutionEvents.map(e=>e&&typeof e==='object' ? {
      id: e.id || ('evn_'+Math.random().toString(36).slice(2)),
      year: normalizeYear(e.year),
      type: EVOLUTION_TYPES.includes(String(e.type)) ? String(e.type) : (String(e.type)==='待考'?'年代未详':'年代未详'),
      text: String(e.text||''),
      source: String(e.source||'')
    } : null).filter(Boolean) : [];
    if(node.kind==='office'){
      node.category = String(node.category || '其他');
      if(node.category==='临时考据') node.category='其他';
      node.duty = String(node.duty || '');
      node.region = String(node.region || '');
      node.jie = String(node.jie || '无');
      node.kaifu = Boolean(node.kaifu);
      node.yaoling = Boolean(node.yaoling);
      node.worldTangBing = Boolean(node.worldTangBing);
      node.lushangshushi = Boolean(node.lushangshushi);
      node.jiaguan = String(node.jiaguan || '无');
      node.virtual = Boolean(node.virtual);
      node.temporary = Boolean(node.temporary);
      node.aliases = String(node.aliases || '');
      node.evolution = String(node.evolution || '');
      node.relationType = String(node.relationType || '');
      node.directRules = String(node.directRules || '');
      node.sourceLevel = String(node.sourceLevel || '');
      node.confidence = String(node.confidence || '');
      node.historicalStatus = String(node.historicalStatus || '有效');
      // 无可靠设立／裁撤年且无沿革说明时，保留自然的不确定表述，不臆造年份。
      if(!node.archived && node.officeStartYear===null && node.officeEndYear===null && !String(node.evolution||'').trim()){
        node.evolution = '沿革年代未详';
        node.confidence = node.confidence || '待考';
      }
      if(node.evolution==='沿革年代待考') node.evolution='沿革年代未详';
      if(node.relationType==='待考') node.relationType='关系未详';
    } else if(node.kind==='noble'){
      node.actualFief = node.actualFief !== false;
    }
    if(['han','shu','tribal'].includes(factionKey) && node.kind==='office') node.rank9 = '';
    if(factionKey==='shu' && node.kind==='root'){
      if(node.name==='蜀汉官制'||node.name==='季汉官制') node.name='汉官制';
      if(node.name==='蜀汉爵制'||node.name==='季汉爵制') node.name='汉爵制';
    }
    if(factionKey==='tribal' && node.kind==='root'){
      if(node.name==='边疆异族官制') node.name='异族官制';
      if(node.name==='边疆封授爵位') node.name='异族封授爵位';
    }
    // 兼容旧版工程：不删除用户节点，把已证实的时代错置项归档并写明去向。
    if(factionKey==='wei' && node.name==='刑部尚书'){
      node.name='刑部尚书（时代错置，已归档）'; node.archived=true; node.historicalStatus='纠误归档';
      node.note=[node.note,'曹魏尚书诸曹不使用后世“刑部尚书”名目；旧节点为保护用户数据而归档。'].filter(Boolean).join('；');
    }
    if(factionKey==='wei' && node.name==='邺郡太守') node.name='魏郡太守／魏尹';
    if(factionKey==='wei' && node.name==='许县令') node.name='许昌县令';
    if(factionKey==='wei' && node.category==='都督军事' && /^都督(中外|河北|幽州|雍凉|陇右|关中|荆扬益|南方|荆豫|荆州|江北|江南|豫州|扬州|淮北|青徐|青州|徐州|兖州)/.test(node.name)){
      node.archived=true; node.historicalStatus='转入州镇表';
      node.note=[node.note,'该都督辖区属于随人随时变化的职任，已转入州镇表；旧节点保留为归档。'].filter(Boolean).join('；');
    }
    if(factionKey==='wu' && /^(大都督|左都护|右都护|右部督|左部督|偏将督)/.test(node.name)){
      node.archived=true; node.historicalStatus='转入州镇表';
      node.note=[node.note,'此项不宜构成固定上下级官署树，旧节点保留归档；具体职任请录入州镇表。'].filter(Boolean).join('；');
    }
    if(factionKey==='jin' && node.name==='建康令'){
      node.name='建康令（317年后，东晋扩展）'; node.archived=true; node.historicalStatus='超出核心时段';
      node.note=[node.note,'建康之名用于313年以后；西晋核心树改列秣陵令／建邺令。'].filter(Boolean).join('；');
    }
    if(factionKey==='tribal' && /^(大都护（西域）|仟长（部落军事编制）|什长)$/.test(node.name)){
      node.archived=true; node.historicalStatus='纠误归档';
      node.note=[node.note,'该项不应作为异族内部世袭官爵；旧数据为兼容导入而归档。'].filter(Boolean).join('；');
    }
  });

  const byKey = new Map(nodes.map(node=>[node.key, node]));
  nodes.forEach(node=>{
    if(node.parent !== undefined && !byKey.has(node.parent)) throw new Error('节点「'+(node.name||node.key)+'」引用了不存在的上级 key：'+node.parent);
    const chain = new Set();
    let cursor = node;
    while(cursor && cursor.parent !== undefined){
      if(chain.has(cursor.key)) throw new Error('节点「'+(node.name||node.key)+'」的上级关系形成循环');
      chain.add(cursor.key);
      cursor = byKey.get(cursor.parent);
    }
  });
  return nodes;
}

function normalizeAndValidateTrees(rawTrees){
  if(!rawTrees || typeof rawTrees!=='object' || Array.isArray(rawTrees)) throw new Error('trees 必须是对象');
  const trees = cloneJSON(rawTrees);
  let fallback = null;
  FACTIONS.forEach(faction=>{
    let group = trees[faction.key];
    if(!group || typeof group!=='object'){
      // 兼容旧版工程（如缺少后续新增的“西晋官制”）：自动补入该势力的默认预设模板
      if(!fallback) fallback = buildPresets();
      group = cloneJSON(fallback[faction.key]) || { office:[], noble:[] };
      trees[faction.key] = group;
    }
    if(faction.key==='wei'){
      migrateV66WeiZhongshuSemantics(trees);
      group=trees.wei;
    }
    if(faction.key==='wu'){
      migrateV66WuLeaderSemantics(trees);
      group=trees.wu;
    }
    // 将分级名号表中的具体武官补入朝堂树；已存在的节点不重复创建。
    // 名号的制度排序仍由 general-titles.js 提供，树只负责可点击入口与武官分类。
    const titlePolity = faction.key === 'han' ? '' : faction.key;
    const titleGroup = (window.SGZ_GENERAL_TITLES?.groups || []).find(item => item.polity === titlePolity);
    const rootNode = (group.office || []).find(item => item.kind === 'root' || (item.parent == null && !item.parentKey));
    if(titleGroup && rootNode){
      const existingByName = new Map((group.office || []).map(item => [String(item.name || '').replace(/（.*?）/g,''),item]));
      const slug = value => String(value).replace(/[^\u4e00-\u9fffA-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'title';
      const additions = [];
      titleGroup.titles.forEach(title => {
        const cleanTitle = String(title.title || '').replace(/（.*?）/g,'');
        if(!cleanTitle) return;
        // 读者包在构建时已经只保留可公开名号，并会剥离 evidence 审校字段。
        // 因此不能在读者运行时把缺少 evidence 误判为 review-only。
        const published=['确定','推定'].includes(String(title.evidence||''))||window.SGZ_READER_BUILD===true;
        const existing=existingByName.get(cleanTitle);
        if(existing){
          existing.generalTitleSortOrder=Number(title.sortOrder);
          existing.generalTitleKind=String(title.kind||'');
          existing.generalTitleGrade=String(title.grade||'');
          existing.confidence=String(title.evidence||existing.confidence||'待考');
          existing.officePublicationStatus=published?'verified':'review-only';
          existing.militaryClass=militaryClassForNode({...existing,generalTitleKind:title.kind},faction.key);
          existing.courtOrder=Number(title.sortOrder);
          return;
        }
        existingByName.set(cleanTitle,true);
        additions.push({
          key:`${faction.key}_general_title_${slug(cleanTitle)}_${title.sortOrder}`,
          parent:rootNode.key,
          name:cleanTitle,
          kind:'office',
          category:'将军武职',
          rank9:/品/.test(String(title.grade || '')) ? String(title.grade) : '',
          hanRank:'',
          serviceDomain:'武官',
          institutionType:'朝廷机关',
          relationType:'制度并列',
          sourceLevel:'制度整理',
          confidence:title.evidence || '待考',
          officePublicationStatus:published?'verified':'review-only',
          note:`${title.kind || '将军名号'}；排序 ${title.sortOrder}。具体任官人物、年代和府署关系以人物记、州镇表与原始出处为准。`,
          sources:(title.sourceRefs || []).join('；'),
          generalTitleSortOrder:Number(title.sortOrder),
          generalTitleKind:String(title.kind||''),
          generalTitleGrade:String(title.grade||''),
          courtOrder:Number(title.sortOrder),
          militaryClass:militaryClassForNode({kind:'office',name:cleanTitle,category:'将军武职',generalTitleKind:title.kind},faction.key),
          generatedPattern:Boolean(title.generatedPattern),
        });
      });
      group.office = [...group.office, ...additions];
    }
    group.office = window.SGZResearchModel.normalizeOfficeClassifications(
      normalizeAndValidateNodes(group.office||[], faction.name+'官职体系', faction.key)
    );
    const militaryOrder=OFFICE_ORDER_POLICIES.militaryGroupOrder?.[faction.key]||[];
    group.office.forEach(node=>{
      if(node.kind!=='office')return;
      const militaryClass=militaryClassForNode(node,faction.key);
      if(!militaryClass)return;
      node.militaryClass=militaryClass;
      const groupIndex=militaryOrder.indexOf(militaryClass);
      const within=Number(node.generalTitleSortOrder??node.courtOrder??node.sortOrder);
      node.militaryClassOrder=(groupIndex<0?999:groupIndex)*1000+(Number.isFinite(within)?within:900);
    });
    group.noble = normalizeAndValidateNodes(group.noble||[], faction.name+'爵位体系', faction.key);
  });
  return trees;
}

      const nameById=new Map((readerPeople.people||[]).map(person=>[person.personId,person.name]));

          title:`${nameById.get(appointment.personId)||appointment.personId} · ${appointment.nodeName||''}`.trim(),
          meta:appointment.appointmentNature||'',

        if(!record||!record.sourceTitle)continue;
        entries.push({kind:'shihuo',id:record.id,title:record.title||record.id,meta:record.category||'',citations:[record.sourceTitle]});
      }
      /* 金石条目的 sourceName／sourceTitle 是碑名，不是典籍出处；能归卷的是

    function residenceDefinitionFor(owner){

      const ownerName=canonicalOfficeName(owner.name),figures=courtFigures(owner),kaifu=courtKaifuPolicyFor(owner);
      function categoryRoleMatches(item){
        const category=String(owner.category||'');
        const name=canonicalOfficeName(owner.name);
        if(!(item.ownerCategories||[]).includes(category)) return false;
        if(category==='州牧刺史') return /州牧|刺史/.test(name);
        if(category==='郡国守相') return /太守|国相|相$/.test(name);
        if(category==='太子官属') return /储君|皇太子|太子$/.test(name);
        if(category==='诸王官属') return /王$|王国|王府/.test(name);
        if(category==='大将军／大司马') return /大将军|大司马/.test(name);
        if(category==='将军武职') return /将军/.test(name);
        return false;
      }
      return (window.SGZ_OFFICE_RESIDENCES||[]).filter(item=>!item.isFallback&&policyPolityMatches(item)&&recordValidAtCourtYear(item)).map(item=>{
        let score=0;
        const names=(item.ownerOfficeNames||[]).map(canonicalOfficeName);
        if(names.includes(ownerName)) score+=60;
        else if(canonicalOfficeName(item.ownerOfficeName)===ownerName) score+=50;
        if(categoryRoleMatches(item)) score+=25;
        if(item.ownerPersonName){

      const atA=filteredFangzhenRecords.value.filter(r=>fangzhenValidAtYear(r,first));
      const atB=filteredFangzhenRecords.value.filter(r=>fangzhenValidAtYear(r,second));
      return [
        {year:first,rows:atA,added:[],removed:[]},
        {year:second,rows:atB,added:atB.filter(r=>!atA.some(o=>o.id===r.id)),removed:atA.filter(r=>!atB.some(o=>o.id===r.id))}
      ];
    });

    const fangzhenOverlapIssues=computed(()=>{
      const groups=new Map();
      fangzhenRecords.value.forEach(record=>{
        const start=normalizeYear(record.startYear),end=normalizeYear(record.endYear);
        if(start===null||end===null) return;
        const key=[record.administrativeUnitId||record.jurisdictionId||record.jurisdiction,record.officeId||record.title].join('|');
        if(!groups.has(key))groups.set(key,[]);
        groups.get(key).push({...record,__start:start,__end:end});
      });
      const issues=[];
      groups.forEach(rows=>rows.sort((a,b)=>a.__start-b.__start).forEach((row,index)=>{
        for(let cursor=index+1;cursor<rows.length&&rows[cursor].__start<=row.__end;cursor+=1){
          const next=rows[cursor];
          if(row.personId!==next.personId)issues.push({id:`overlap:${row.id}:${next.id}`,unit:row.jurisdiction||next.jurisdiction,office:row.title||next.title,a:row,b:next});
        }
      }));
      return issues;
    });

    function applyHistoryPatch(patch,direction='forward',options={}){
      if(!patch?.targets?.length)return false;
      const wasApplying=historyApplying;
      historyApplying=true;
      historyWatcherSuppression+=1;
      try{
        historyPatchEngine.applyPatch(patch,direction,options);
        selectedKey.value=null;

    function enqueuePersistenceOperation(entry,direction='forward'){
      pendingPersistencePatches.push({schemaVersion:1,label:entry.label,time:entry.time,direction,patch:cloneJSON(entry.patch)});

    function pushHistory(label,options={}){
      if(historyApplying)return false;
      const patch=historyPatchEngine.capturePatch();
      if(!patch)return false;
      history.stack = history.stack.slice(0, history.index+1);
      const entry={label,time:nowStr(),patch};
      history.stack.push(entry);
      history.index = history.stack.length - 1;
      if(history.stack.length>121){history.stack.splice(1,1);history.index--;}
      if(options.markDirty!==false)enqueuePersistenceOperation(entry,'forward');

        if(node.archived && !canvasFilters.showArchived) return;
        if(node.hidden && !canvasFilters.showHidden) return;
        if(node.kind==='office' && !officeClassMatches(node)) return;
        if(canvasFilters.hideNonCore && node.kind==='office' && !CORE_CATEGORIES.includes(node.category)) return;
        if(timelineEnabled.value){
          const start = normalizeYear(node.officeStartYear), end = normalizeYear(node.officeEndYear);
          if(start!==null && timelineYear.value<start) return;
          if(end!==null && timelineYear.value>end) return;
        }
        if(canvasFilters.category && node.category!==canvasFilters.category) return;
        if(canvasFilters.rank && node.rank9!==canvasFilters.rank && node.hanRank!==canvasFilters.rank) return;
        if(canvasFilters.special && !node[canvasFilters.special]) return;
        if(query && !nodeSearchText(node).includes(query)) return;
        wanted.add(node.key);
      });
      // 筛选结果必须补齐祖先链，避免 TreeModel 出现悬空 parent。
      const byKey = new Map(arr.map(n=>[n.key,n]));
      Array.from(wanted).forEach(key=>{
        let cursor=byKey.get(key), guard=0;
        while(cursor && cursor.parent!==undefined && guard++<200){
          wanted.add(cursor.parent);
          cursor=byKey.get(cursor.parent);
        }
      });
      if(!hasFacet) return arr.filter(n=>wanted.has(n.key));
      return arr.filter(n=>wanted.has(n.key));
    }

    function rebuildModel(fitView=true){
      if(!diagram) return;
      const arr = currentArr.value;
      try{ normalizeAndValidateNodes(arr, currentFactionDef.value.name+(treeType.value==='office'?'官职体系':'爵位体系'), currentFaction.value); }
      catch(err){ ElementPlus.ElMessage.error('树数据无效：'+err.message); return; }
      const model = new go.TreeModel();
      model.nodeParentKeyProperty = "parent";
      model.nodeDataArray = visibleNodesForCanvas();
      diagram.model = model;
      applyLayout();
      nextTick(()=>{
        const selected = selectedKey.value ? diagram.findNodeForKey(selectedKey.value) : null;
        if(selected) diagram.select(selected);
        if(fitView){
          requestAnimationFrame(()=>requestAnimationFrame(()=>{
            if(!diagram) return;
            diagram.zoomToFit(); zoomPct.value=Math.round(diagram.scale*100);
          }));
        }else zoomPct.value = Math.round(diagram.scale*100);
      });
    }
    function applyLayout(){
      if(!diagram) return;
      if(viewMode.value === 'tree'){
        diagram.layout = $go(go.TreeLayout, { angle: 90, layerSpacing: 42, nodeSpacing: 14, arrangement: go.TreeLayout.ArrangementVertical });
        diagram.layoutDiagram(true);
      } else if(viewMode.value === 'horizontal'){
        diagram.layout = $go(go.TreeLayout, { angle: 0, layerSpacing: 70, nodeSpacing: 14, arrangement: go.TreeLayout.ArrangementVertical });
        diagram.layoutDiagram(true);
      } else {
        diagram.layout = $go(go.LayeredDigraphLayout, { direction: 90, layerSpacing: 46, columnSpacing: 20 });
        diagram.layoutDiagram(true);
        nextTick(()=>applyRankPositions());
      }
    }

    function applyRankPositions(){
      if(!diagram || viewMode.value!=='rank') return;
      const groups = new Map();
      diagram.nodes.each(node=>{
        let level = 0;
        if(node.data.kind!=='root'){
          const rank = rank9Enabled.value ? (node.data.rank9 || node.data.hanRank) : node.data.hanRank;
          level = rank9Enabled.value ? RANK9_OPTIONS.indexOf(rank) : HAN_RANK_OPTIONS.indexOf(rank);
          if(level<0) level = 18;
          level += 1;
        }
        if(!groups.has(level)) groups.set(level,[]);
        groups.get(level).push(node);
      });
      diagram.startTransaction('品级分层');
      Array.from(groups.keys()).sort((a,b)=>a-b).forEach((level,row)=>{
        groups.get(level).sort((a,b)=>String(a.data.name).localeCompare(String(b.data.name),'zh-CN')).forEach((node,col)=>{
          node.position = new go.Point(col*210,row*105);
        });
      });
      diagram.commitTransaction('品级分层');
    }

    function isDescendant(arr, ancestorKey, node){
      let cur = node;
      const map = {}; arr.forEach(n=>map[n.key]=n);
      let guard = 0;
      while(cur && cur.parent && guard++ < 200){
        if(cur.parent === ancestorKey) return true;
        cur = map[cur.parent];
      }
      return false;
    }

    function topSelectedData(){
      if(!diagram) return [];
      const selected = [];
      diagram.selection.each(part=>{ if(part instanceof go.Node) selected.push(part.data); });
      const keys = new Set(selected.map(n=>n.key));
      const byKey = new Map(currentArr.value.map(n=>[n.key,n]));
      return selected.filter(node=>{
        let cursor=node, guard=0;
        while(cursor && cursor.parent!==undefined && guard++<200){
          if(keys.has(cursor.parent)) return false;
          cursor=byKey.get(cursor.parent);
        }
        return true;
      });
    }
    function previewDropTarget(target,on){
      if(!target || !(target instanceof go.Node)) return;
      const shape=target.findObject('CARD'); if(!shape) return;
      if(!on){ shape.stroke=nodeStroke(target.data); shape.strokeWidth=1.4; shape.fill=nodeFill(target.data); return; }
      const candidates=topSelectedData().filter(n=>n.key!==target.data.key && n.kind!=='root');
      const valid=candidates.length>0 && candidates.every(child=>!isDescendant(currentArr.value,child.key,target.data) && validateReparent(child,target.data).ok);
      shape.stroke=valid?'#B08D3F':'#A54136'; shape.strokeWidth=3; shape.fill=valid?'#FFF3D6':'#F8DDDA';
    }
    function moveSelectionToParent(target){
      if(!target || !(target instanceof go.Node)) return;
      previewDropTarget(target,false);
      const roots=topSelectedData().filter(n=>n.key!==target.data.key && n.kind!=='root');
      if(!roots.length){ diagram.layoutDiagram(true); return; }
      for(const child of roots){
        if(child.locked){ ElementPlus.ElMessage.warning('「'+child.name+'」已锁定，不能调整从属。'); diagram.layoutDiagram(true); return; }
        if(isDescendant(currentArr.value,child.key,target.data)){ ElementPlus.ElMessage.error('不能将节点挂靠到其自身的下级分支。'); diagram.layoutDiagram(true); return; }
        const check=validateReparent(child,target.data);
        if(!check.ok){ ElementPlus.ElMessage.error(check.msg+'（可关闭左侧校验后自由调整）'); diagram.layoutDiagram(true); return; }
      }
      diagram.model.commit(model=>roots.forEach(child=>model.setParentKeyForNodeData(child,target.data.key)),'批量调整从属');
      pushHistory('批量调整从属：'+roots.map(n=>n.name).join('、')+' → '+target.data.name);
      ElementPlus.ElMessage.success('已将 '+roots.length+' 个分支挂靠至「'+target.data.name+'」');
      diagram.layoutDiagram(true);
    }

    function initDiagram(){
      diagram = $go(go.Diagram, "goCanvas", {
        "undoManager.isEnabled": false, // 我们自己管理历史
        allowCopy:false,
        allowDrop:true,
        maxSelectionCount:Infinity,
        "toolManager.hoverDelay": 200,
      });
      buildTemplates();
      diagram.addDiagramListener("ObjectSingleClicked", (e)=>{
        const part = e.subject.part;
        if(part instanceof go.Node){ selectedKey.value = part.data.key; }
      });
      diagram.addDiagramListener("BackgroundSingleClicked", ()=>{ selectedKey.value = null; });
      diagram.addDiagramListener("ChangedSelection", ()=>{
        const keys=[]; diagram.selection.each(part=>{ if(part instanceof go.Node) keys.push(part.data.key); });
        selectedKeys.value=keys;
        if(keys.length && !keys.includes(selectedKey.value)) selectedKey.value=keys[0];
      });
      diagram.addDiagramListener("SelectionMoved", ()=>setTimeout(()=>{ if(diagram) diagram.layoutDiagram(true); },0));
      diagram.addDiagramListener("ViewportBoundsChanged", ()=>{ zoomPct.value = Math.round(diagram.scale*100); });
      rebuildModel();
    }

    /* ---------- 工具栏操作 ---------- */
    function refreshDiagramData(fitView=false){
      // 由于我们直接修改 reactive 数组内对象，GoJS model 数据是同一份引用数组，
      // 结构性变化（增删）需要重建 model；字段编辑可以走 model.set。
      rebuildModel(fitView);
    }

    function addChildNode(){
      const sel = selectedNode.value;
      if(!sel){ ElementPlus.ElMessage.warning('请先在画布中选中一个节点'); return; }
      const prefix = currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const occupied = new Set(currentArr.value.map(n=>n.key));
      const nn = treeType.value==='office'
        ? O(prefix, sel.key, '新设官职', sel.category||'其他', '', '')
        : N(prefix, sel.key, '新设爵位', '');
      if(occupied.has(nn.key)) nn.key = nextUniqueKey(prefix, occupied);
      else occupied.add(nn.key);
      currentArr.value.push(nn);
      pushHistory('新增子节点：'+nn.name);
      selectedKey.value = nn.key;
      refreshDiagramData(true);
    }
    function addSiblingNode(){
      const sel = selectedNode.value;
      if(!sel){ ElementPlus.ElMessage.warning('请先在画布中选中一个节点'); return; }
      if(sel.kind==='root'){ ElementPlus.ElMessage.warning('根节点不可添加同级节点，请添加子节点'); return; }
      const prefix = currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const occupied = new Set(currentArr.value.map(n=>n.key));
      const nn = treeType.value==='office'
        ? O(prefix, sel.parent, '新设官职', sel.category||'其他', '', '')
        : N(prefix, sel.parent, '新设爵位', '');
      if(occupied.has(nn.key)) nn.key = nextUniqueKey(prefix, occupied);
      else occupied.add(nn.key);
      currentArr.value.push(nn);
      pushHistory('新增同级节点：'+nn.name);
      selectedKey.value = nn.key;
      refreshDiagramData(true);
    }
    function addCourtPosition(){
      if(treeType.value!=='office') return;
      const selected=selectedNode.value;
      const parent=(selected && selected.kind!=='root' && !selected.virtual) ? selected : currentArr.value.find(node=>node.kind==='root');

      ElementPlus.ElMessageBox.prompt('输入要添加的朝堂官职名称', '添加朝堂位置', {
        inputValue:'新设官职',
        inputPlaceholder:'如：太傅、尚书仆射、军师祭酒',

        const prefix=currentFaction.value+'_o';
        const occupied=new Set(currentArr.value.map(node=>node.key));
        const node=O(prefix,parent.key,name,category,'','',Object.assign({customTags:['朝堂界面新增'],note:'由朝堂谱系界面新增；官制归属与品秩未详。',relationType:'用户新增'},/^侍中$/.test(name)?{seatCount:6,seatCountSource:'用户自定义朝堂展示席位'}:{}));
        if(occupied.has(node.key)) node.key=nextUniqueKey(prefix,occupied);

    function deleteCourtPosition(){
      const selected=selectedNode.value;
      if(!selected || selected.kind==='root'){ ElementPlus.ElMessage.warning('请先选中要删除的自定义朝堂官职'); return; }
      if(!(selected.customTags||[]).includes('朝堂界面新增')){
        ElementPlus.ElMessage.warning('预置官职不在朝堂快捷删除；请在编辑谱系中归档并保留原记录。'); return;
      }
      const keys=collectBranchKeys([selected]);
      ElementPlus.ElMessageBox.confirm('删除自定义官职「'+selected.name+'」及其下级节点，共 '+keys.size+' 项？','删除朝堂自定义位置',{confirmButtonText:'删除',cancelButtonText:'取消',type:'warning'})
        .then(()=>{
          data.trees[currentFaction.value][treeType.value]=currentArr.value.filter(node=>!keys.has(node.key));
          selectedKey.value=null; selectedKeys.value=[];
          pushHistory('删除自定义朝堂位置：'+selected.name);
          refreshDiagramData(true);
          ElementPlus.ElMessage.success('已删除自定义朝堂位置');
        }).catch(()=>{});
    }
    function duplicateBranch(){
      const sel = selectedNode.value;
      if(!sel){ ElementPlus.ElMessage.warning('请先选中要复制的分支根节点'); return; }
      if(sel.kind==='root'){ ElementPlus.ElMessage.warning('不能复制根节点'); return; }
      const arr = currentArr.value;
      const prefix = currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const keyMap = {};
      const occupied = new Set(arr.map(n=>n.key));
      const subtree = [sel, ...(()=>{ const acc=[]; (function c(k){ arr.filter(n=>n.parent===k).forEach(n=>{acc.push(n); c(n.key);}); })(sel.key); return acc; })()];
      const clones = subtree.map(n=>{
        const clone = JSON.parse(JSON.stringify(n));
        const newKey = nextUniqueKey(prefix, occupied);
        keyMap[n.key] = newKey;
        clone.key = newKey;
        return clone;
      });
      clones.forEach(c=>{ c.parent = (c.key===keyMap[sel.key]) ? sel.parent : (keyMap[c.parent] || c.parent); });
      clones[0].name = clones[0].name + '（副本）';
      arr.push(...clones);
      pushHistory('复制分支：'+sel.name);
      selectedKey.value = clones[0].key;
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已复制整条分支（含 '+clones.length+' 个节点）');
    }
    function collectBranchKeys(roots, arr=currentArr.value){
      const keys=new Set(roots.map(n=>n.key));
      let changed=true;
      while(changed){
        changed=false;
        arr.forEach(n=>{ if(!keys.has(n.key) && keys.has(n.parent)){ keys.add(n.key); changed=true; } });
      }
      return keys;
    }
    function selectedBranchRoots(){
      const roots=topSelectedData().filter(n=>n.kind!=='root');
      if(!roots.length && selectedNode.value && selectedNode.value.kind!=='root') return [selectedNode.value];
      return roots;
    }
    function copyBranches(showMessage=true){
      const roots=selectedBranchRoots();
      if(!roots.length){ ElementPlus.ElMessage.warning('请先选择一个或多个分支'); return false; }
      const keys=collectBranchKeys(roots);
      branchClipboard.value={ mode:'copy', faction:currentFaction.value, treeType:treeType.value,
        roots:roots.map(n=>n.key), nodes:cloneJSON(currentArr.value.filter(n=>keys.has(n.key))) };
      if(showMessage) ElementPlus.ElMessage.success('已复制 '+roots.length+' 组分支，共 '+keys.size+' 个节点');
      return true;
    }
    function cutBranches(){
      const roots=selectedBranchRoots();
      if(!roots.length){ ElementPlus.ElMessage.warning('请先选择一个或多个分支'); return; }
      if(roots.some(n=>n.locked)){ ElementPlus.ElMessage.warning('选择中含已锁定节点，不能剪切'); return; }
      const keys=collectBranchKeys(roots);
      branchClipboard.value={ mode:'cut', faction:currentFaction.value, treeType:treeType.value,
        roots:roots.map(n=>n.key), nodes:cloneJSON(currentArr.value.filter(n=>keys.has(n.key))) };
      data.trees[currentFaction.value][treeType.value]=currentArr.value.filter(n=>!keys.has(n.key));
      selectedKey.value=null; selectedKeys.value=[];
      pushHistory('剪切 '+roots.length+' 组分支（'+keys.size+' 个节点）');
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已剪切分支，请选择目标父节点后粘贴');
    }
    function pasteBranches(){
      const clip=branchClipboard.value;
      if(!clip || !Array.isArray(clip.nodes) || !clip.nodes.length){ ElementPlus.ElMessage.warning('分支剪贴板为空'); return; }
      if(clip.treeType!==treeType.value){ ElementPlus.ElMessage.warning('请切换到'+(clip.treeType==='office'?'官职':'爵位')+'体系后粘贴'); return; }
      const target=(selectedNode.value && selectedNode.value.kind!=='office' && treeType.value==='office') ? null : selectedNode.value;
      const parent=target || currentArr.value.find(n=>n.kind==='root');
      if(!parent){ ElementPlus.ElMessage.error('当前体系缺少根节点，无法粘贴'); return; }
      const rootSet=new Set(clip.roots);
      for(const source of clip.nodes.filter(n=>rootSet.has(n.key))){
        const check=validateReparent(source,parent);
        if(!check.ok){ ElementPlus.ElMessage.error(check.msg+'（可关闭校验后粘贴）'); return; }
      }
      const prefix=currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const occupied=new Set(currentArr.value.map(n=>n.key));
      const keyMap={};
      clip.nodes.forEach(n=>{ keyMap[n.key]=nextUniqueKey(prefix,occupied); });
      const clones=clip.nodes.map(n=>{
        const c=cloneJSON(n); c.key=keyMap[n.key];
        c.parent=rootSet.has(n.key) ? parent.key : (keyMap[n.parent] || parent.key);
        if(!RANK9_FACTIONS.includes(currentFaction.value) && c.kind==='office') c.rank9='';
        return c;
      });
      currentArr.value.push(...clones);
      selectedKey.value=clones[0].key;

    }
    function personEntityAllowed(name){
      const key=personKeyOf(name);
      const audit=window.SGZ_PERSON_ENTITY_AUDIT||{};
      const v57=window.SGZ_PERSON_V57_RUNTIME_RULES||{};
      const canonical=personCanonicalNameFor(key);
      if((v57.blockedNames||[]).includes(key)||(v57.blockedNames||[]).includes(canonical)) return false;
      if(Object.prototype.hasOwnProperty.call(audit.exclusions||{},key)) return false;
      if((audit.reviewNames||[]).includes(key)) return false;
      const sourcePerson=(window.SGZ_PERSON_SOURCE_INDEX?.people||[]).find(person=>[person.name,...(person.aliases||[])].map(personKeyOf).includes(key));
      if(sourcePerson && (sourcePerson.entityType&&sourcePerson.entityType!=='person' || ['excluded','review'].includes(sourcePerson.visibilityStatus))) return false;
      if(Array.from(key).length<2 || /[〈〉《》{}|]/.test(key)) return false;
      return true;
    }
    function personZiFor(name,personId=''){
      const resolvedId=canonicalV63PersonId(String(personId||'')||window.SGZ_PERSON_IDENTITIES?.resolve(name)?.personId||'');
      const v62Zi=v62PeopleById?.[resolvedId]?.readerZi;
      if(v62Zi) return String(v62Zi);
      if(resolvedId&&window.SGZ_PERSON_ZI_BY_ID?.[resolvedId]) return window.SGZ_PERSON_ZI_BY_ID[resolvedId].zi||'';
      const key=personCanonicalNameFor(name);

    function personRelevantAt(person,year){
      const target=Number(year);
      if(!Number.isFinite(target)) return false;
      if(person.birthYear!==null&&person.deathYear!==null&&person.birthYear<=target&&person.deathYear>=target) return true;
      if((person.snapshots260||[]).some(record=>Number(record.year)===target))return true;
      return person.appointments.some(record=>{
        const start=normalizeYear(record.startYear),end=normalizeYear(record.endYear);
        return (start!==null||end!==null)&&(start===null||start<=target)&&(end===null||end>=target);
      });
    }
    function personRelevanceScore(person){
      const year=Number(peopleYear.value);
      if(personRelevantAt(person,year)) return 0;
      const points=person.appointments.flatMap(record=>[normalizeYear(record.startYear),normalizeYear(record.endYear)]).filter(value=>value!==null);
      if(person.birthYear!==null)points.push(person.birthYear);
      if(person.deathYear!==null)points.push(person.deathYear);
      (person.snapshots260||[]).forEach(record=>{if(Number.isFinite(Number(record.year)))points.push(Number(record.year));});
      (person.peerageEvents||[]).forEach(record=>{if(Number.isFinite(Number(record.year)))points.push(Number(record.year));});
      return points.length?Math.min(...points.map(value=>Math.abs(value-year)))+1:10000;
    }

    function officeNameIndex(){
      const index={};
      factions.forEach(faction=>['office','noble'].forEach(type=>{
        const list=[];
        data.trees[faction.key][type].forEach(node=>{ if(node.kind!=='root') list.push(node); });
        index[faction.key+'_'+type]=list;
      }));
      return index;
    }
    function runDataAudit(){
      const issues=[];
      const add=(severity,module,title,detail,target)=>issues.push({id:'audit_'+issues.length,severity,module,title,detail,target});
      const nameIndex=officeNameIndex();
      // 同名官职／爵位（同势力同体系，忽略归档节点）
      Object.entries(nameIndex).forEach(([key,nodes])=>{
        const seen={};
        nodes.forEach(node=>{
          const nm=String(node.name||'').trim();
          if(!nm) return;
          if(!seen[nm]) seen[nm]=[];
          seen[nm].push(node);
        });
        Object.entries(seen).forEach(([nm,list])=>{
          const active=list.filter(n=>!n.archived);
          if(active.length<2) return;
          const [factionKey,type]=key.split('_');
          add('warn','职官谱','同名'+ (type==='office'?'官职':'爵位') +'「'+nm+'」',active.length+' 个节点同名（共 '+list.length+' 个，含归档）。建议合并，或用时期、别称区分。',{type:'nodeList',factionKey,treeType:type,names:active.map(n=>n.name)});
        });
      });
      // 沿革时间与字段一致性
      factions.forEach(faction=>['office','noble'].forEach(type=>{
        data.trees[faction.key][type].forEach(node=>{
          if(node.kind==='root') return;
          if(node.officeStartYear!==null && node.officeEndYear!==null && node.officeStartYear>node.officeEndYear){
            add('error','职官谱','沿革时间倒置','「'+node.name+'」设立年 '+node.officeStartYear+' 晚于裁撤年 '+node.officeEndYear+'。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
          }
          if(node.kind==='office' && node.yaoling && !String(node.region||'').trim()){
            add('warn','职官谱','遥领官职缺少辖区','「'+node.name+'」标记为遥领，但未填写管辖区域。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
          }
          if(node.kind==='office' && node.officeStartYear===null && node.officeEndYear===null && !String(node.evolution||'').trim()){
            add('info','职官谱','沿革年代未详','「'+node.name+'」未记录设立／裁撤年，也无沿革说明。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
          }
          // 结构化沿革事件与节点沿革年份一致性
          (node.evolutionEvents||[]).forEach(ev=>{
            if(ev.year===null) return;
            if(node.officeStartYear!==null && ev.year<node.officeStartYear && ev.type!=='设立'){
              add('warn','职官谱','沿革事件早于设立年','「'+node.name+'」存在 '+ev.year+' 年'+ev.type+'事件，早于节点设立年 '+node.officeStartYear+'。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
            }
            if(node.officeEndYear!==null && ev.year>node.officeEndYear){
              add('warn','职官谱','沿革事件晚于裁撤年','「'+node.name+'」存在 '+ev.year+' 年'+ev.type+'事件，晚于节点裁撤年 '+node.officeEndYear+'。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
            }
          });
        });
      }));
      // 无可靠沿革年份的官职统一标注“未详”，避免填入推算年份。
      let chronologyPendingCount=0;
      factions.forEach(faction=>{
        data.trees[faction.key].office.forEach(node=>{
          if(node.kind==='root'||node.archived) return;
          if(node.officeStartYear===null && node.officeEndYear===null && /待考|未详/.test(String(node.evolution||''))) chronologyPendingCount++;
        });
      });
      if(chronologyPendingCount){
        add('info','职官谱','沿革年代未详',chronologyPendingCount+' 个官职节点没有可靠设立／裁撤年，统一显示为“沿革年代未详”。',{type:'summary'});
      }
      // 上下级时期冲突：子节点设立晚于父节点裁撤，或子节点裁撤早于父节点设立
      factions.forEach(faction=>{
        const byKey=new Map(data.trees[faction.key].office.map(n=>[n.key,n]));
        data.trees[faction.key].office.forEach(node=>{
          if(node.kind==='root'||node.parent===undefined) return;
          const parent=byKey.get(node.parent);
          if(!parent) return;
          const cs=normalizeYear(node.officeStartYear), ce=normalizeYear(node.officeEndYear);
          const ps=normalizeYear(parent.officeStartYear), pe=normalizeYear(parent.officeEndYear);
          if(cs!==null && pe!==null && cs>pe){
            add('warn','职官谱','子节点晚于父节点存续','「'+node.name+'」（'+cs+'年设）晚于其上级「'+parent.name+'」裁撤年（'+pe+'年）。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
          }
          if(ce!==null && ps!==null && ce<ps){
            add('warn','职官谱','子节点早于父节点设立','「'+node.name+'」（'+ce+'年裁）早于其上级「'+parent.name+'」设立年（'+ps+'年）。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
          }
        });
      });
      // 势力存续范围：节点沿革年份超出该势力实际存续区间
      const POLITY_RANGES={ han:[168,220], wei:[220,265], shu:[221,263], wu:[222,280], jin:[266,316], tribal:[168,316] };
      factions.forEach(faction=>{
        const range=POLITY_RANGES[faction.key]; if(!range) return;
        data.trees[faction.key].office.forEach(node=>{
          if(node.kind==='root') return;
          const cs=normalizeYear(node.officeStartYear), ce=normalizeYear(node.officeEndYear);
          if(cs!==null && cs<range[0]){
            add('warn','职官谱','设立年早于势力存续','「'+node.name+'」设立年 '+cs+' 早于'+faction.name+'存续起点 '+range[0]+' 年。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
          }
          if(ce!==null && ce>range[1]){
            add('warn','职官谱','裁撤年晚于势力存续','「'+node.name+'」裁撤年 '+ce+' 晚于'+faction.name+'存续终点 '+range[1]+' 年。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
          }
        });
      });
      // 职官分类：文武性质与官署归属分别校验，不以官署属性覆盖职掌属性。
      factions.forEach(faction=>data.trees[faction.key].office.filter(node=>node.kind==='office').forEach(node=>{
        if(['大将军／大司马','将军武职','都督军事','属国护官'].includes(node.category)&&!['武官','文武兼'].includes(node.serviceDomain)){
          add('error','职官谱','武官分类冲突','「'+node.name+'」属'+node.category+'，但 serviceDomain 为「'+(node.serviceDomain||'空')+'」。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
        }
        if(node.category==='州郡属官'&&!['州府','郡府','县署'].includes(node.institutionType)){
          add('warn','职官谱','州郡属官官署冲突','「'+node.name+'」归入州郡属官，但 institutionType 为「'+(node.institutionType||'空')+'」。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
        }
        if(node.category==='太子官属'&&node.institutionType!=='东宫'){
          add('warn','职官谱','东宫官属归署冲突','「'+node.name+'」未归入东宫。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
        }
        if(node.category==='幕府属官'&&!['丞相府','三公府','将军府','都督府','州府','郡府','待考'].includes(node.institutionType)){
          add('warn','职官谱','府署属官归署冲突','「'+node.name+'」为幕府属官，但 institutionType 为「'+(node.institutionType||'空')+'」。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
        }
      }));
      // 人物记录完整性
      const personNames={};
      factions.forEach(faction=>['office','noble'].forEach(type=>{
        data.trees[faction.key][type].filter(n=>n.kind!=='root').forEach(node=>{
          (node.figures||[]).forEach(f=>{
            const key=personKeyOf(f.name); if(!key) return;
            if(!personNames[key]) personNames[key]={count:0,portrait:false};
            personNames[key].count++;
            if(f.portrait) personNames[key].portrait=true;
          });
        });
      }));
      fangzhenRecords.value.forEach(record=>{
        const key=personKeyOf(record.commander); if(!key) return;
        if(!personNames[key]) personNames[key]={count:0,portrait:false};
        personNames[key].count++;
        if(record.portrait) personNames[key].portrait=true;
      });
      Object.entries(personNames).forEach(([key,info])=>{
        if(!info.portrait) add('info','人物记','暂无立绘','人物「'+key+'」有 '+info.count+' 条任职／受爵记录，暂无立绘。',{type:'person',name:key});
      });
      // 州镇表任期与辖区
      const fzIndex={};
      fangzhenRecords.value.forEach(record=>{
        if(record.startYear!==null && record.endYear!==null && record.startYear>record.endYear){
          add('error','州镇表','任期倒置','「'+record.commander+'」的「'+record.title+'」起始年 '+record.startYear+' 晚于结束年 '+record.endYear+'。',{type:'fangzhen',record});
        }
        if(['cishi','cimu','dudu','junshou','taishou','duwei'].includes(record.recordType) && !String(record.jurisdiction||'').trim()){
          add('warn','州镇表','辖区未详','「'+record.commander+'」任「'+record.title+'」未填写辖区。',{type:'fangzhen',record});
        }
        if(!String(record.sourceTitle||'').trim() && !String(record.sourceUrl||'').trim()){
          add('info','州镇表','内部引文未登记','「'+record.commander+'」任「'+record.title+'」的内部引文未登记。',{type:'fangzhen',record});
        }
        if(!Number.isFinite(record.startYear) && !Number.isFinite(record.endYear) && /[?？]|未详|未知|待考/.test(String(record.tenureText||''))){
          add('info','州镇表','任期未详','「'+record.commander+'」任「'+record.title+'」无可靠年代锚点，任期显示为未详。',{type:'fangzhen',record});
        }
        const overlapKey=record.polity+'|'+record.commander+'|'+record.title+'|'+String(record.jurisdiction||'').trim();
        if(!fzIndex[overlapKey]) fzIndex[overlapKey]=[];
        fzIndex[overlapKey].push(record);
      });
      Object.entries(fzIndex).forEach(([,list])=>{
        if(list.length<2) return;
        for(let i=0;i<list.length;i++){
          for(let j=i+1;j<list.length;j++){
            const a=list[i],b=list[j];
            const as=normalizeYear(a.startYear)??-9999, ae=normalizeYear(a.endYear)??9999;
            const bs=normalizeYear(b.startYear)??-9999, be=normalizeYear(b.endYear)??9999;
            // 同辖区同职任才判重叠；首尾相接的连任（220—226 与 226—231）不视为重叠。
            const overlaps = (as<be && bs<ae) || (as===ae && bs===be && as===bs);
            if(overlaps){
              add('error','州镇表','同期任职重叠','「'+a.commander+'」的「'+a.title+'」存在两段重叠任期（'+recordYearLabel(a)+' 与 '+recordYearLabel(b)+'）。请核对应为兼领还是记录重复。',{type:'fangzhen',record:a});
            }
          }
        }
      });
      Object.entries(fzIndex).forEach(([key,list])=>{
        if(list.length<2) return;
        const [polity,commander,title,jurisdiction]=key.split('|');
        add('info','州镇表','同人同职同辖区多段记录','「'+commander+'」任「'+title+'」辖「'+jurisdiction+'」共 '+list.length+' 段记录（'+list.map(r=>recordYearLabel(r)).join('、')+'）。请确认为连任拆分、兼领还是重复导入。',{type:'fangzhen',record:list[0]});
      });
      fangzhenOverlapIssues.value.forEach(issue=>add('warn','州镇表','同官同辖区异人任期重叠','「'+issue.unit+'」的「'+issue.office+'」出现 '+issue.a.commander+' 与 '+issue.b.commander+' 任期重叠，需核定兼置、遥领或年代误差。',{type:'fangzhen',record:issue.a}));
      // 人物记：同名待消歧（合并展示但未人工确认）
      personRegistry.value.filter(p=>/同名待消歧/.test(p.homonymStatus||'')&&!/异人/.test(p.homonymStatus||'')).forEach(p=>{
        add('warn','人物记','同名待消歧','「'+p.name+'」已有独立 personId，但同名身份说明仍待复核；系统不会再按姓名自动合并。',{type:'person',name:p.name,personId:p.personId});
      });
      // 人物记：同名重复人物（同一姓名仍存在多个独立 personId，需显式消歧）
      const personByName={};
      personRegistry.value.forEach(p=>{
        if(!personByName[p.name]) personByName[p.name]=[];
        personByName[p.name].push(p);
      });
      Object.values(personByName).filter(list=>list.length>1&&!list.every(person=>person.homonymGroupId||/异人|已消歧/.test(person.homonymStatus||''))).forEach(list=>{
        add('warn','人物记','同名人物未显式消歧','「'+list[0].name+'」存在 '+list.length+' 个 personId，但并非每条都标有同名组或消歧说明。',{type:'person',name:list[0].name,personId:list[0].personId});
      });
      // 朝堂：府署入口无显式定义
      const residenceOnlyByPolicy=currentArr.value.filter(node=>node.kind==='office'&&courtResidenceStatus(node)==='府署未建档');
      residenceOnlyByPolicy.forEach(node=>{
        add('info','职官谱','府署入口无显式定义','「'+node.name+'」具备开府或官署可能（'+(courtResidenceReason(node)||'制度关系待核')+'），但无独立府署定义记录；读者视图只显示“府署未建档”，不会进入其他府署。',{type:'node',factionKey:currentFaction.value,treeType:'office',nodeKey:node.key});
      });
      // 正史逐卷覆盖：待复核卷
      (window.SGZ_PERSON_SOURCE_INDEX?.coverage||[]).filter(item=>item.processedStatus==='待复核').forEach(item=>{
        add('warn','人物记','正史卷待复核',(item.work||'')+'卷'+item.volume+' 自动扫描未提取到候选，句式覆盖可能不足，需人工复核。',{type:'volume',work:item.work,volume:item.volume});
      });
      // 跨模块一致性：州镇职任标题在对应官制树中是否有同名节点
      fangzhenRecords.value.forEach(record=>{
        const key=record.polity==='魏'?'wei':record.polity==='汉'?'shu':record.polity==='吴'?'wu':record.polity==='晋'?'jin':'';
        if(!key || !data.trees[key]) return;
        const matched=data.trees[key].office.some(node=>node.kind!=='root' && (
          String(node.name).replace(/[（(].*?[)）]/g,'').trim()===record.title ||
          String(node.aliases||'').split(/[、,，/]/).map(s=>s.trim()).includes(record.title)
        ));
        if(!matched) add('info','州镇表','官制树未见对应官名','「'+record.commander+'」任「'+record.title+'」在'+record.polity+'官制树中未找到同名节点；如为加官、临时称号或异名可忽略。',{type:'fangzhen',record});
      });
      // 别称与正式名重复
      Object.entries(nameIndex).forEach(([key,nodes])=>{
        const allNames=new Set(nodes.filter(n=>n.kind!=='root').map(n=>String(n.name||'').trim()).filter(Boolean));
        nodes.forEach(node=>{
          if(node.kind==='root'||!String(node.aliases||'').trim()) return;
          const dups=String(node.aliases||'').split(/[、,，/]/).map(s=>s.trim()).filter(alias=>alias && alias!==node.name && allNames.has(alias));
          if(dups.length){
            const [factionKey,type]=key.split('_');
            add('warn','职官谱','别称与正式名重复','「'+node.name+'」的别称'+dups.map(d=>'「'+d+'」').join('、')+'同时是本体系正式官名，可能造成检索歧义。',{type:'node',factionKey,treeType:type,nodeKey:node.key});
          }
        });
      });
      // 战事纪：年份与字段完整性
      const battleSeen={};
      battleRecords.battles.forEach(battle=>{
        if(!Number.isFinite(Number(battle.year))) add('error','战事纪','战役缺少年份','「'+battle.name+'」未标注发生年份。',{type:'battle',battle});
        if(!battleSeen[battle.name]) battleSeen[battle.name]=[];
        battleSeen[battle.name].push(battle);
      });
      Object.entries(battleSeen).forEach(([name,list])=>{
        if(list.length>1) add('warn','战事纪','同名战役重复','「'+name+'」存在 '+list.length+' 条记录，请核实是否应合并。',{type:'battle',battle:list[0]});
      });
      battleRecords.battlefields.forEach(field=>{
        if(!Number.isFinite(Number(field.from))||!Number.isFinite(Number(field.to))||Number(field.from)>Number(field.to)){
          add('error','战事纪','战场时间范围错误','「'+field.name+'」的起止年份（'+field.from+'—'+field.to+'）无效。',{type:'battle',battle:field});
        }
      });
      battleRecords.events.forEach(event=>{
        if(!Number.isFinite(Number(event.year))) add('error','战事纪','要事缺少年份','「'+(event.text||'').slice(0,20)+'」未标注年份。',{type:'battle',battle:event});
      });
      auditIssues.value=issues.slice(0,500);
      auditLastRun.value=new Date().toLocaleTimeString('zh-CN',{hour12:false});
      ElementPlus.ElMessage.success('审计完成：发现 '+auditIssues.value.length+' 项问题'+(issues.length>500?'（仅显示前 500 项）':''));
    }
    const auditFiltered = computed(()=>auditIssues.value.filter(issue=>
      (auditFilters.severity==='all'||issue.severity===auditFilters.severity) &&
      (auditFilters.module==='all'||issue.module===auditFilters.module)
    ));
    const auditMetrics = computed(()=>{
      const m={total:auditIssues.value.length,error:0,warn:0,info:0};
      auditIssues.value.forEach(issue=>{ if(m[issue.severity]!==undefined) m[issue.severity]++; });
      return m;
    });
    function auditJump(issue){
      const t=issue&&issue.target; if(!t) return;
      showAuditCenter.value=false;
      if(t.type==='node'){
        jumpToSearchResult({factionKey:t.factionKey,treeType:t.treeType,node:{key:t.nodeKey}});
      }else if(t.type==='nodeList'){
        switchModule('offices');
        currentFaction.value=t.factionKey;
        treeType.value=t.treeType;
        Object.assign(canvasFilters,{query:t.names[0],category:'',rank:'',special:'',showArchived:true,showHidden:true,hideNonCore:false});
        nextTick(()=>rebuildModel(false));
      }else if(t.type==='fangzhen'){
        switchModule('fangzhen');
        selectFangzhenArchive(fangzhenArchiveKeyFor(t.record));
        fangzhenQuery.value=t.record.commander;
      }else if(t.type==='person'){
        switchModule('people');
        peopleQuery.value=t.name;
        nextTick(()=>openPeopleDetail(t.personId||t.name));
      }else if(t.type==='volume'){
        switchModule('people');
        peopleQuery.value='';
        peopleSource.value=t.work==='《三国志》'?'sgz':'jinshu';
        peopleQuery.value='卷'+t.volume;
      }else if(t.type==='battle'){
        switchModule('battle');
        const raw=t.battle||{};
        const kind=(raw.from!==undefined && raw.to!==undefined && raw.year===undefined)?'battlefield':(raw.text&&!raw.name?'event':'battle');
        nextTick(()=>openBattleDetail({...raw,kind}));
      }
    }
    function exportAuditReport(){
      const lines=['# 三国职官谱 · 数据审计报告','生成时间：'+new Date().toLocaleString('zh-CN'),'共 '+auditIssues.value.length+' 项问题',''];
      auditIssues.value.forEach(issue=>lines.push('['+auditSeverityMeta[issue.severity]+']（'+issue.module+'）'+issue.title+'：'+issue.detail));
      downloadBlob(lines.join('\n'),'text/plain;charset=utf-8','三国职官谱_数据审计.txt');
      pushHistory('导出数据审计报告');
    }
    function exportAuditWorkbook(){
      const workbook={
        generatedAt:new Date().toISOString(),
        auditIssues:auditIssues.value,
        v60ResearchLedger:v60Ledger,
        v61EpigraphyResearch:v61Epigraphy,
        pendingVolumes:(window.SGZ_PERSON_SOURCE_INDEX?.coverage||[]).filter(item=>item.processedStatus==='待复核').map(item=>({work:item.work,volume:item.volume,reason:item.exclusionReasons?.join('；')})),
        homonymPending:personRegistry.value.filter(p=>/同名待消歧/.test(p.homonymStatus||'')).map(p=>({name:p.name,personId:p.personId,volumes:p.sourceVolumes,status:p.homonymStatus})),

    function markdownForCurrentTree(){
      const arr=projectForReading(currentArr.value), byParent=new Map();
      arr.forEach(n=>{ const p=n.parent===undefined?'__root__':n.parent; if(!byParent.has(p)) byParent.set(p,[]); byParent.get(p).push(n); });
      const lines=['# '+currentFactionDef.value.name+' · '+(treeType.value==='office'?'官职体系':'爵位体系'),''];
      function walk(node,depth){
        const prefix='  '.repeat(Math.max(0,depth-1))+'- ';
        if(node.kind==='root') lines.push('## '+node.name,'');
        else {
          const attrs=[];
          if(node.category) attrs.push(node.category);
          if(node.rank9) attrs.push(node.rank9);
          if(node.hanRank) attrs.push(node.hanRank);
          if(node.nobleRank) attrs.push(node.nobleRank);
          if(node.yaoling) attrs.push('遥领'); if(node.virtual) attrs.push('虚职'); if(node.kaifu) attrs.push('可开府');
          lines.push(prefix+'**'+node.name+'**'+(attrs.length?'（'+attrs.join(' · ')+'）':''));
          if(node.duty) lines.push('  '.repeat(depth)+'- 职权：'+node.duty);
          if(node.officeStartYear!==null || node.officeEndYear!==null) lines.push('  '.repeat(depth)+'- 沿革：'+(node.officeStartYear??'未详')+'—'+(node.officeEndYear??'存续')+'年'+(node.evolution?'；'+node.evolution:''));
          if((node.figures||[]).length) lines.push('  '.repeat(depth)+'- 人物：'+node.figures.map(f=>f.name).filter(Boolean).join('、'));
          if(node.note) lines.push('  '.repeat(depth)+'- 备注：'+node.note);
        }
        (byParent.get(node.key)||[]).forEach(child=>walk(child,depth+1));
      }
      (byParent.get('__root__')||[]).forEach(root=>walk(root,0));
      return lines.join('\n');
    }

    function combineImportedNodes(importedNodes, mode){
      if(mode==='覆盖') return importedNodes;
      const existing=currentArr.value;
      const root=existing.find(n=>n.kind==='root');
      const incoming=importedNodes.filter(n=>n.kind!=='root');
      const prefix=currentFaction.value+'_'+(treeType.value==='office'?'o':'n')+'_imp';
      const occupied=new Set(existing.map(n=>n.key));
      const existingByName=new Map(existing.filter(n=>n.kind!=='root').map(n=>[n.name,n]));
      const keyMap={};
      incoming.forEach(n=>{
        const match=mode==='合并'?existingByName.get(n.name):null;
        keyMap[n.key]=match?match.key:nextUniqueKey(prefix,occupied);
      });
      const result=cloneJSON(existing);
      const resultByKey=new Map(result.map(n=>[n.key,n]));
      incoming.forEach(n=>{
        const targetKey=keyMap[n.key], match=resultByKey.get(targetKey);
        const mappedParent=keyMap[n.parent] || (root?root.key:undefined);
        if(match){
          const keepKey=match.key, keepParent=match.parent;
          Object.assign(match,cloneJSON(n),{key:keepKey});
          if(mappedParent!==undefined) match.parent=mappedParent; else if(keepParent!==undefined) match.parent=keepParent;
        } else {
          const clone=cloneJSON(n); clone.key=targetKey;
          if(mappedParent!==undefined) clone.parent=mappedParent; else delete clone.parent;
          result.push(clone); resultByKey.set(clone.key,clone);
        }
      });
      return result;
    }

              <span class="person-avatar" :style="portraitStyleFor(p)"><reader-portrait v-if="p.portrait" :src="p.portrait" :alt="p.name+'立绘'"/><span v-else>{{p.name.slice(0,1)}}</span></span>
