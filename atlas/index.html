              <div class="office-compare-line"><span>沿革</span>{{entry.node.officeStartYear||'？'}}—{{entry.node.officeEndYear||'？'}}{{entry.node.evolution?' · '+entry.node.evolution:''}}</div>
              <div class="office-compare-line"><span>人物</span>{{(entry.node.figures||[]).map(f=>f.name).filter(Boolean).join('、')||'—'}}</div>
            </div>
          </div>
        </div>
      </div>
    </el-drawer>



    <el-drawer v-model="showTemplateLibrary" title="官署模板库" size="860px">
      <div class="office-compare-toolbar">
        <el-select v-model="templateLibraryFaction" size="large" style="width:150px;">
          <el-option label="全部势力" value="all" />
          <el-option v-for="f in factions" :key="f.key" :label="f.label||f.short||f.name" :value="f.key" />
        </el-select>
        <el-input v-model="templateLibrarySearch" clearable size="large" prefix-icon="Search" placeholder="检索模板名或官职名…" style="max-width:360px;" />
        <span style="font-size:11px;color:#8A918A;">共 {{filteredTemplateLibrary.length}} 个模板；导入按模板所属势力写入，不污染当前树</span>
      </div>
      <div v-if="!filteredTemplateLibrary.length" class="summary-empty">没有匹配的官署模板。</div>
      <div v-else class="template-library-grid">
        <div v-for="tpl in filteredTemplateLibrary" :key="tpl.id" class="template-card" :style="{'--tpl-color':templateFactionDef(tpl.faction).color}">
          <div class="template-card-head">
            <div>
              <div class="template-card-title">{{tpl.label}}</div>
              <div class="template-card-meta"><span class="fz-polity-badge" :style="{background:templateFactionDef(tpl.faction).color+'1A',color:templateFactionDef(tpl.faction).color}">{{templateFactionDef(tpl.faction).name}}</span> · {{templateYearsLabel(tpl)}} · {{tpl.names.length}} 项</div>
            </div>
            <el-button size="small" type="primary" plain @click="importTemplateToSelected(tpl)">导入</el-button>
          </div>
          <p class="template-card-note">{{tpl.note}}</p>
          <div class="template-card-names"><span v-for="nm in tpl.names" :key="nm" class="person-pill">{{nm}}</span></div>
        </div>
      </div>
    </el-drawer>

    <el-drawer v-model="showPalette" title="势力节点配色" size="340px">
      <div class="summary-head">颜色会自动应用于对应势力全部节点，并随完整 JSON 与多存档保存。</div>
      <div v-for="f in factions" :key="f.key" class="palette-row"><span>{{f.label||f.short||f.name}}</span><el-color-picker v-model="f.color" /></div>
      <el-button size="small" text @click="resetFactionColors">恢复默认配色</el-button>
    </el-drawer>

    <el-dialog v-model="showPersonProfile" :title="'人物履历 · '+activePersonName" width="620px">
      <div style="display:flex;gap:16px;align-items:flex-start">
        <div class="profile-portrait" :style="portraitStyleFor({name:activePersonName,polity:activePersonAppointments.length?activePersonAppointments[0].polity:''})"><img loading="lazy" decoding="async" v-if="activePersonPortrait" :src="activePersonPortrait" :alt="activePersonName+'立绘'"/><span v-else>暂无立绘</span></div>
        <div style="flex:1">
          <div v-if="!activePersonAppointments.length" class="summary-empty">没有找到履历记录。</div>
          <button v-for="item in activePersonAppointments" :key="(item.factionKey||item.polity)+'_'+item.nodeKey+'_'+item.id" type="button" class="search-result" @click="jumpToPersonAppointment(item)">
            <span class="title">{{item.nodeName}}</span><span class="meta">{{item.factionName}} · {{item.treeType==='fangzhen'?'州镇职任':(item.treeType==='office'?'任官':'受爵')}} · {{recordPeriodLabel(item)}} · {{recordYearLabel(item)}}</span><span v-if="item.jurisdiction" class="excerpt">辖区：{{item.jurisdiction}}</span><span v-if="item.note" class="excerpt">{{item.note}}</span>
          </button>
        </div>
      </div>
    </el-dialog>

    <el-drawer v-model="showLog" title="操作日志 · 步骤回滚" size="360px">
      <div v-for="(h,idx) in history.stack" :key="idx" class="log-item" :class="{current: idx===history.index}">
        <div>
          <div>{{ h.label }}</div>
          <div class="t">{{ h.time }}</div>
        </div>
        <el-button size="small" text @click="jumpToHistory(idx)" :disabled="idx===history.index">回退到此步</el-button>
      </div>
    </el-drawer>

    <el-drawer v-model="showAuditCenter" title="审校中心" size="680px" class="audit-center">
      <div class="audit-center-head">
        <span>上次运行：{{auditLastRun||'尚未运行'}} · 仅保留前 500 项</span>
        <div style="display:flex;gap:8px;">
          <el-button size="small" type="primary" plain @click="runDataAudit()">重新审计</el-button>
          <el-button size="small" plain @click="exportAuditReport()">导出报告</el-button>
          <el-button size="small" plain @click="exportAuditWorkbook()">导出复核工作簿</el-button>
        </div>
      </div>
      <section class="v73-status-ledger" aria-label="资料审核状态总览">
        <div class="v73-status-ledger-head"><div><strong>资料状态总览</strong><span>四级状态统一用于人物、任官、州镇与金石</span></div><small>V73</small></div>
        <div class="v73-status-definitions">
          <article v-for="status in reviewStatusDefinitions" :key="status.key" :class="'status-'+status.key"><b>{{reviewStatusTotals[status.key]||0}}</b><strong>{{status.label}}</strong><p>{{status.meaning}}</p></article>
        </div>
        <div class="v73-status-modules">
          <div class="v73-status-row v73-status-row-head"><b>资料模块</b><span>已核</span><span>待补核</span><span>存疑</span><span>已排除</span><span>不计入统计</span></div>
          <div v-for="module in reviewStatusLedger.modules" :key="module.key" class="v73-status-row"><b>{{module.label}}</b><span>{{module.counts.verified}}</span><span>{{module.counts.pending}}</span><span>{{module.counts.disputed}}</span><span>{{module.counts.suppressed}}</span><span>{{module.excludedFromStatistics}}</span></div>
        </div>
        <p class="v73-status-note">“待补核”不是“错误”，而是已有材料尚未满足发布门槛。人物实体已核也不会自动放行任官事实；年代未定记录不会进入任何年份快照。</p>
      </section>
      <section class="v60-audit-summary review-only">
        <div class="v60-audit-summary-head"><strong>V60 待考收口</strong><span>底层证据保留，阅读层不展示</span></div>
        <div class="v60-audit-summary-grid">
          <div v-for="item in v60Ledger.researchQueue" :key="item.id"><b>{{item.count}}</b><span>{{item.domain}}</span><small>{{item.disposition}}</small></div>
        </div>
        <p>金石空释文已检索 {{v61Epigraphy.summary.searchedRecords||0}} 条，实补 {{v61Epigraphy.summary.adoptedTranscriptions||0}} 条，仍空 {{v61Epigraphy.summary.missingAfterResearch||0}} 条；V59 队列已收口 {{v60Ledger.summary.v59ReviewQueueClosed||0}} 条；史书卷次已登记 {{v60Ledger.summary.booksClosed||0}} 卷。</p>
      </section>
      <div class="audit-metrics">
        <div class="audit-metric total"><div class="value">{{auditMetrics.total}}</div><div class="label">问题总数</div></div>
        <div class="audit-metric error"><div class="value">{{auditMetrics.error}}</div><div class="label">错误</div></div>
        <div class="audit-metric warn"><div class="value">{{auditMetrics.warn}}</div><div class="label">待定</div></div>
        <div class="audit-metric info"><div class="value">{{auditMetrics.info}}</div><div class="label">可选</div></div>
      </div>
      <div class="audit-filters">
        <el-select v-model="auditFilters.severity" size="small" style="width:120px;" aria-label="严重度筛选">
          <el-option label="全部严重度" value="all" /><el-option label="错误" value="error" /><el-option label="待定" value="warn" /><el-option label="可选" value="info" />
        </el-select>
        <el-select v-model="auditFilters.module" size="small" style="width:140px;" aria-label="模块筛选">
          <el-option label="全部模块" value="all" />
          <el-option v-for="m in ['职官谱','人物记','州镇表','战事纪','食货志','金石录','形势图']" :key="m" :label="m" :value="m" />
        </el-select>
        <span style="font-size:11px;color:#8A918A;">当前显示 {{auditFiltered.length}} 项</span>
      </div>
      <div v-if="!auditFiltered.length" class="audit-empty">没有符合条件的问题。可点击“重新审计”，或在其他模块录入数据后再次运行。</div>
      <div v-else class="audit-issue-list">
        <article v-for="issue in auditFiltered" :key="issue.id" class="audit-issue" role="button" tabindex="0" @click="auditJump(issue)" @keydown.enter.prevent="auditJump(issue)" @keydown.space.prevent="auditJump(issue)">
          <div class="audit-issue-head">
            <span class="audit-sev" :class="issue.severity">{{auditSeverityMeta[issue.severity]}}</span>
            <span class="audit-module">{{issue.module}}</span>
            <strong>{{issue.title}}</strong>
          </div>
          <p>{{issue.detail}}</p>
          <div class="audit-issue-foot"><span>#{{issue.id.replace('audit_','')}}</span><span style="flex:1"></span><span>点击定位 ›</span></div>
        </article>
      </div>
    </el-drawer>

    <el-drawer v-model="showVersions" title="命名版本 · 回滚" size="360px">
      <div style="margin-bottom:10px;"><el-button size="small" @click="saveVersion">＋ 保存当前为新版本</el-button></div>
      <div v-if="versions.list.length===0" style="color:#6B6255;font-size:12.5px;">尚无已保存的命名版本。</div>
      <div v-for="v in versions.list" :key="v.id" class="log-item">
        <div>
          <div>{{ v.label }}</div>
          <div class="t">{{ v.time }}</div>
        </div>
        <el-button size="small" text @click="rollbackVersion(v)">回滚</el-button>
      </div>
    </el-drawer>

    <el-dialog v-model="fangzhenDialog.visible" :title="fangzhenDialog.mode==='edit'?'编辑州镇职任':'添加州镇职任'" width="760px">
      <el-form :model="fangzhenDialog.form" label-position="top">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <el-form-item label="时期"><el-select v-model="fangzhenDialog.form.eraGroup" style="width:100%"><el-option label="汉末／三国" value="three"/><el-option label="西晋（266—316）" value="jin"/><el-option label="东晋扩展（317年后）" value="eastjin"/></el-select></el-form-item>
          <el-form-item label="档案类别"><el-select v-model="fangzhenDialog.form.recordType" style="width:100%"><el-option label="刺史／州牧" value="cishi"/><el-option label="太守／国相" value="taishou"/><el-option label="都督职任" value="dudu"/><el-option label="都尉职任" value="duwei"/><el-option label="其他军政职任" value="other"/></el-select></el-form-item>
          <el-form-item label="国家／政权">
            <el-select v-model="fangzhenDialog.form.polity" filterable allow-create default-first-option style="width:100%" placeholder="选择或输入政权">
              <el-option label="魏" value="魏"/><el-option label="汉" value="汉"/><el-option label="吴" value="吴"/><el-option label="晋" value="晋"/>
            </el-select>
          </el-form-item>
          <el-form-item label="人物"><el-input v-model="fangzhenDialog.form.commander" placeholder="任职人物姓名"/></el-form-item>
          <el-form-item label="籍贯（可留空）"><el-input v-model="fangzhenDialog.form.birthplace" placeholder="如：蜀郡、襄阳、南阳"/></el-form-item>
          <el-form-item label="官职／职任名"><el-input v-model="fangzhenDialog.form.title" placeholder="如：都督荆州诸军事"/></el-form-item>
          <el-form-item label="委任称号"><el-input v-model="fangzhenDialog.form.commission" placeholder="如：使持节、都督荆州诸军事"/></el-form-item>
          <el-form-item label="任命关系"><el-select v-model="fangzhenDialog.form.relation" filterable allow-create default-first-option style="width:100%"><el-option label="职任记录" value="职任记录"/><el-option label="州级职任" value="州级职任"/><el-option label="郡守职任" value="郡守职任"/><el-option label="郡级军政职任" value="郡级军政职任"/><el-option label="加督职任" value="加督职任"/><el-option label="兼领职任" value="兼领职任"/><el-option label="领州职任" value="领州职任"/></el-select></el-form-item>
          <el-form-item label="授任状态"><el-select v-model="fangzhenDialog.form.appointmentStatus" filterable allow-create default-first-option style="width:100%"><el-option label="实授" value="实授"/><el-option label="领" value="领"/><el-option label="兼领" value="兼领"/><el-option label="遥领" value="遥领"/><el-option label="存疑" value="存疑"/><el-option label="代理" value="代理"/><el-option label="行职" value="行职"/><el-option label="未上任" value="未上任"/></el-select></el-form-item>
          <el-form-item label="辖区"><el-input v-model="fangzhenDialog.form.jurisdiction" placeholder="州、郡或军政区域"/></el-form-item>
          <el-form-item label="治所／驻地"><el-input v-model="fangzhenDialog.form.seat" placeholder="如：襄阳、晋阳"/></el-form-item>
          <el-form-item label="起始年"><el-input-number v-model="fangzhenDialog.form.startYear" :min="180" :max="420" style="width:100%"/></el-form-item>
          <el-form-item label="结束年"><el-input-number v-model="fangzhenDialog.form.endYear" :min="180" :max="420" style="width:100%"/></el-form-item>
          <el-form-item label="任期原文" style="grid-column:1/-1">
            <el-input v-model="fangzhenDialog.form.tenureText" placeholder="如：黄初元年（220年）—太和二年（228年）；可保留“约”“未详”“未到任”等措辞"/>
            <div v-if="fangzhenDialog.form.polity==='吴'" style="font-size:11px;color:#7B827B;line-height:1.5;margin-top:4px;">吴的职任可保留原有年号与不确定措辞。</div>
          </el-form-item>
        </div>
        <el-form-item label="沿革说明"><el-input v-model="fangzhenDialog.form.note" type="textarea" :rows="3" placeholder="记录迁官、改辖、异说或年代未详等情况"/></el-form-item>
      </el-form>
      <template #footer><el-button @click="fangzhenDialog.visible=false">取消</el-button><el-button type="primary" @click="saveFangzhenRecord">保存记录</el-button></template>
    </el-dialog>


  </div>
  `
});

Object.entries(window.SGZ_READER_COMPONENTS||{}).forEach(([name,component])=>app.component(name,component));
app.use(ElementPlus);
app.mount('#app');
}).catch(error=>{
  renderFatalPanel('观史台界面初始化失败',[String(error?.message||error),'请运行项目验证后重试。']);
  console.error(error);
});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootGuanshitaiReader,{once:true});
else bootGuanshitaiReader();
</script>
</body>
</html>
