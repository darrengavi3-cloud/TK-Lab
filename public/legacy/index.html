    function rebuildModel(fitView=true){
      if(!diagram) return;
      const arr = currentArr.value;
      try{ normalizeAndValidateNodes(arr, currentFactionDef.value.name+(treeType.value==='office'?'官职体系':'爵位体系'), currentFaction.value); }
      catch(err){ ElementPlus.ElMessage.error('树数据无效：'+err.message); return; }
      const model = new go.TreeModel();
      model.nodeParentKeyProperty = "parent";
      model.nodeDataArray = visibleNodesForCanvas();
      diagram.model = model;
      applyLayout();
      nextTick(()=>{
        const selected = selectedKey.value ? diagram.findNodeForKey(selectedKey.value) : null;
        if(selected) diagram.select(selected);
        if(fitView){
          requestAnimationFrame(()=>requestAnimationFrame(()=>{
            if(!diagram) return;
            diagram.zoomToFit(); zoomPct.value=Math.round(diagram.scale*100);
          }));
        }else zoomPct.value = Math.round(diagram.scale*100);
      });
    }
    function applyLayout(){
      if(!diagram) return;
      if(viewMode.value === 'tree'){
        diagram.layout = $go(go.TreeLayout, { angle: 90, layerSpacing: 42, nodeSpacing: 14, arrangement: go.TreeLayout.ArrangementVertical });
        diagram.layoutDiagram(true);
      } else if(viewMode.value === 'horizontal'){
        diagram.layout = $go(go.TreeLayout, { angle: 0, layerSpacing: 70, nodeSpacing: 14, arrangement: go.TreeLayout.ArrangementVertical });
        diagram.layoutDiagram(true);
      } else {
        diagram.layout = $go(go.LayeredDigraphLayout, { direction: 90, layerSpacing: 46, columnSpacing: 20 });
        diagram.layoutDiagram(true);
        nextTick(()=>applyRankPositions());
      }
    }

    function applyRankPositions(){
      if(!diagram || viewMode.value!=='rank') return;
      const groups = new Map();
      diagram.nodes.each(node=>{
        let level = 0;
        if(node.data.kind!=='root'){
          const rank = rank9Enabled.value ? (node.data.rank9 || node.data.hanRank) : node.data.hanRank;
          level = rank9Enabled.value ? RANK9_OPTIONS.indexOf(rank) : HAN_RANK_OPTIONS.indexOf(rank);
          if(level<0) level = 18;
          level += 1;
        }
        if(!groups.has(level)) groups.set(level,[]);
        groups.get(level).push(node);
      });
      diagram.startTransaction('品级分层');
      Array.from(groups.keys()).sort((a,b)=>a-b).forEach((level,row)=>{
        groups.get(level).sort((a,b)=>String(a.data.name).localeCompare(String(b.data.name),'zh-CN')).forEach((node,col)=>{
          node.position = new go.Point(col*210,row*105);
        });
      });
      diagram.commitTransaction('品级分层');
    }

    function isDescendant(arr, ancestorKey, node){
      let cur = node;
      const map = {}; arr.forEach(n=>map[n.key]=n);
      let guard = 0;
      while(cur && cur.parent && guard++ < 200){
        if(cur.parent === ancestorKey) return true;
        cur = map[cur.parent];
      }
      return false;
    }

    function topSelectedData(){
      if(!diagram) return [];
      const selected = [];
      diagram.selection.each(part=>{ if(part instanceof go.Node) selected.push(part.data); });
      const keys = new Set(selected.map(n=>n.key));
      const byKey = new Map(currentArr.value.map(n=>[n.key,n]));
      return selected.filter(node=>{
        let cursor=node, guard=0;
        while(cursor && cursor.parent!==undefined && guard++<200){
          if(keys.has(cursor.parent)) return false;
          cursor=byKey.get(cursor.parent);
        }
        return true;
      });
    }
    function previewDropTarget(target,on){
      if(!target || !(target instanceof go.Node)) return;
      const shape=target.findObject('CARD'); if(!shape) return;
      if(!on){ shape.stroke=nodeStroke(target.data); shape.strokeWidth=1.4; shape.fill=nodeFill(target.data); return; }
      const candidates=topSelectedData().filter(n=>n.key!==target.data.key && n.kind!=='root');
      const valid=candidates.length>0 && candidates.every(child=>!isDescendant(currentArr.value,child.key,target.data) && validateReparent(child,target.data).ok);
      shape.stroke=valid?'#B08D3F':'#A54136'; shape.strokeWidth=3; shape.fill=valid?'#FFF3D6':'#F8DDDA';
    }
    function moveSelectionToParent(target){
      if(!target || !(target instanceof go.Node)) return;
      previewDropTarget(target,false);
      const roots=topSelectedData().filter(n=>n.key!==target.data.key && n.kind!=='root');
      if(!roots.length){ diagram.layoutDiagram(true); return; }
      for(const child of roots){
        if(child.locked){ ElementPlus.ElMessage.warning('「'+child.name+'」已锁定，不能调整从属。'); diagram.layoutDiagram(true); return; }
        if(isDescendant(currentArr.value,child.key,target.data)){ ElementPlus.ElMessage.error('不能将节点挂靠到其自身的下级分支。'); diagram.layoutDiagram(true); return; }
        const check=validateReparent(child,target.data);
        if(!check.ok){ ElementPlus.ElMessage.error(check.msg+'（可关闭左侧校验后自由调整）'); diagram.layoutDiagram(true); return; }
      }
      diagram.model.commit(model=>roots.forEach(child=>model.setParentKeyForNodeData(child,target.data.key)),'批量调整从属');
      pushHistory('批量调整从属：'+roots.map(n=>n.name).join('、')+' → '+target.data.name);
      ElementPlus.ElMessage.success('已将 '+roots.length+' 个分支挂靠至「'+target.data.name+'」');
      diagram.layoutDiagram(true);
    }

    function initDiagram(){
      diagram = $go(go.Diagram, "goCanvas", {
        "undoManager.isEnabled": false, // 我们自己管理历史
        allowCopy:false,
        allowDrop:true,
        maxSelectionCount:Infinity,
        "toolManager.hoverDelay": 200,
      });
      buildTemplates();
      diagram.addDiagramListener("ObjectSingleClicked", (e)=>{
        const part = e.subject.part;
        if(part instanceof go.Node){ selectedKey.value = part.data.key; }
      });
      diagram.addDiagramListener("BackgroundSingleClicked", ()=>{ selectedKey.value = null; });
      diagram.addDiagramListener("ChangedSelection", ()=>{
        const keys=[]; diagram.selection.each(part=>{ if(part instanceof go.Node) keys.push(part.data.key); });
        selectedKeys.value=keys;
        if(keys.length && !keys.includes(selectedKey.value)) selectedKey.value=keys[0];
      });
      diagram.addDiagramListener("SelectionMoved", ()=>setTimeout(()=>{ if(diagram) diagram.layoutDiagram(true); },0));
      diagram.addDiagramListener("ViewportBoundsChanged", ()=>{ zoomPct.value = Math.round(diagram.scale*100); });
      rebuildModel();
    }

    /* ---------- 工具栏操作 ---------- */
    function refreshDiagramData(fitView=false){
      // 由于我们直接修改 reactive 数组内对象，GoJS model 数据是同一份引用数组，
      // 结构性变化（增删）需要重建 model；字段编辑可以走 model.set。
      rebuildModel(fitView);
    }

    function addChildNode(){
      const sel = selectedNode.value;
      if(!sel){ ElementPlus.ElMessage.warning('请先在画布中选中一个节点'); return; }
      const prefix = currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const occupied = new Set(currentArr.value.map(n=>n.key));
      const nn = treeType.value==='office'
        ? O(prefix, sel.key, '新设官职', sel.category||'其他', '', '')
        : N(prefix, sel.key, '新设爵位', '');
      if(occupied.has(nn.key)) nn.key = nextUniqueKey(prefix, occupied);
      else occupied.add(nn.key);
      currentArr.value.push(nn);
      pushHistory('新增子节点：'+nn.name);
      selectedKey.value = nn.key;
      refreshDiagramData(true);
    }
    function addSiblingNode(){
      const sel = selectedNode.value;
      if(!sel){ ElementPlus.ElMessage.warning('请先在画布中选中一个节点'); return; }
      if(sel.kind==='root'){ ElementPlus.ElMessage.warning('根节点不可添加同级节点，请添加子节点'); return; }
      const prefix = currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const occupied = new Set(currentArr.value.map(n=>n.key));
      const nn = treeType.value==='office'
        ? O(prefix, sel.parent, '新设官职', sel.category||'其他', '', '')
        : N(prefix, sel.parent, '新设爵位', '');
      if(occupied.has(nn.key)) nn.key = nextUniqueKey(prefix, occupied);
      else occupied.add(nn.key);
      currentArr.value.push(nn);
      pushHistory('新增同级节点：'+nn.name);
      selectedKey.value = nn.key;
      refreshDiagramData(true);
    }
    function duplicateBranch(){
      const sel = selectedNode.value;
      if(!sel){ ElementPlus.ElMessage.warning('请先选中要复制的分支根节点'); return; }
      if(sel.kind==='root'){ ElementPlus.ElMessage.warning('不能复制根节点'); return; }
      const arr = currentArr.value;
      const prefix = currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const keyMap = {};
      const occupied = new Set(arr.map(n=>n.key));
      const subtree = [sel, ...(()=>{ const acc=[]; (function c(k){ arr.filter(n=>n.parent===k).forEach(n=>{acc.push(n); c(n.key);}); })(sel.key); return acc; })()];
      const clones = subtree.map(n=>{
        const clone = JSON.parse(JSON.stringify(n));
        const newKey = nextUniqueKey(prefix, occupied);
        keyMap[n.key] = newKey;
        clone.key = newKey;
        return clone;
      });
      clones.forEach(c=>{ c.parent = (c.key===keyMap[sel.key]) ? sel.parent : (keyMap[c.parent] || c.parent); });
      clones[0].name = clones[0].name + '（副本）';
      arr.push(...clones);
      pushHistory('复制分支：'+sel.name);
      selectedKey.value = clones[0].key;
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已复制整条分支（含 '+clones.length+' 个节点）');
    }
    function collectBranchKeys(roots, arr=currentArr.value){
      const keys=new Set(roots.map(n=>n.key));
      let changed=true;
      while(changed){
        changed=false;
        arr.forEach(n=>{ if(!keys.has(n.key) && keys.has(n.parent)){ keys.add(n.key); changed=true; } });
      }
      return keys;
    }
    function selectedBranchRoots(){
      const roots=topSelectedData().filter(n=>n.kind!=='root');
      if(!roots.length && selectedNode.value && selectedNode.value.kind!=='root') return [selectedNode.value];
      return roots;
    }
    function copyBranches(showMessage=true){
      const roots=selectedBranchRoots();
      if(!roots.length){ ElementPlus.ElMessage.warning('请先选择一个或多个分支'); return false; }
      const keys=collectBranchKeys(roots);
      branchClipboard.value={ mode:'copy', faction:currentFaction.value, treeType:treeType.value,
        roots:roots.map(n=>n.key), nodes:cloneJSON(currentArr.value.filter(n=>keys.has(n.key))) };
      if(showMessage) ElementPlus.ElMessage.success('已复制 '+roots.length+' 组分支，共 '+keys.size+' 个节点');
      return true;
    }
    function cutBranches(){
      const roots=selectedBranchRoots();
      if(!roots.length){ ElementPlus.ElMessage.warning('请先选择一个或多个分支'); return; }
      if(roots.some(n=>n.locked)){ ElementPlus.ElMessage.warning('选择中含已锁定节点，不能剪切'); return; }
      const keys=collectBranchKeys(roots);
      branchClipboard.value={ mode:'cut', faction:currentFaction.value, treeType:treeType.value,
        roots:roots.map(n=>n.key), nodes:cloneJSON(currentArr.value.filter(n=>keys.has(n.key))) };
      data.trees[currentFaction.value][treeType.value]=currentArr.value.filter(n=>!keys.has(n.key));
      selectedKey.value=null; selectedKeys.value=[];
      pushHistory('剪切 '+roots.length+' 组分支（'+keys.size+' 个节点）');
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已剪切分支，请选择目标父节点后粘贴');
    }
    function pasteBranches(){
      const clip=branchClipboard.value;
      if(!clip || !Array.isArray(clip.nodes) || !clip.nodes.length){ ElementPlus.ElMessage.warning('分支剪贴板为空'); return; }
      if(clip.treeType!==treeType.value){ ElementPlus.ElMessage.warning('请切换到'+(clip.treeType==='office'?'官职':'爵位')+'体系后粘贴'); return; }
      const target=(selectedNode.value && selectedNode.value.kind!=='office' && treeType.value==='office') ? null : selectedNode.value;
      const parent=target || currentArr.value.find(n=>n.kind==='root');
      if(!parent){ ElementPlus.ElMessage.error('当前体系缺少根节点，无法粘贴'); return; }
      const rootSet=new Set(clip.roots);
      for(const source of clip.nodes.filter(n=>rootSet.has(n.key))){
        const check=validateReparent(source,parent);
        if(!check.ok){ ElementPlus.ElMessage.error(check.msg+'（可关闭校验后粘贴）'); return; }
      }
      const prefix=currentFaction.value+'_'+(treeType.value==='office'?'o':'n');
      const occupied=new Set(currentArr.value.map(n=>n.key));
      const keyMap={};
      clip.nodes.forEach(n=>{ keyMap[n.key]=nextUniqueKey(prefix,occupied); });
      const clones=clip.nodes.map(n=>{
        const c=cloneJSON(n); c.key=keyMap[n.key];
        c.parent=rootSet.has(n.key) ? parent.key : (keyMap[n.parent] || parent.key);
        if(!RANK9_FACTIONS.includes(currentFaction.value) && c.kind==='office') c.rank9='';
        return c;
      });
      currentArr.value.push(...clones);
      selectedKey.value=clones[0].key;
      pushHistory('粘贴 '+clip.roots.length+' 组分支（'+clones.length+' 个节点）');
      if(clip.mode==='cut') branchClipboard.value=null;
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已粘贴至「'+parent.name+'」下');
    }
    function batchAddTemplate(templateKey){
      const parent=selectedNode.value;
      if(!parent){ ElementPlus.ElMessage.warning('请先选择模板的父节点'); return; }
      if(treeType.value!=='office'){ ElementPlus.ElMessage.warning('批量官属模板仅适用于官职体系'); return; }
      const template=BATCH_TEMPLATES[templateKey]; if(!template) return;
      if(templateKey==='staff' && validationEnabled.value && parent.kind!=='root' && !parent.kaifu){
        ElementPlus.ElMessage.warning('该节点尚未标记“允许开府”；可先开启开府，或关闭校验后生成。'); return;
      }
      const existing=new Set(currentArr.value.filter(n=>n.parent===parent.key).map(n=>n.name));
      const prefix=currentFaction.value+'_o';
      const created=template.names.filter(name=>!existing.has(name)).map(name=>O(prefix,parent.key,name,template.category,'',''));
      if(!created.length){ ElementPlus.ElMessage.info('该模板中的节点均已存在'); return; }
      currentArr.value.push(...created);
      pushHistory('批量新增'+template.label+'（'+created.length+' 项）');
      selectedKey.value=created[0].key;
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已新增 '+created.length+' 个'+template.label+'节点');
    }
    function generateKaifuTemplate(){ batchAddTemplate('staff'); }
    function toggleSelectedBranches(expand){
      if(!diagram) return;
      let count=0;
      const parts=[]; diagram.selection.each(part=>{ if(part instanceof go.Node) parts.push(part); });
      if(!parts.length && selectedKey.value){ const node=diagram.findNodeForKey(selectedKey.value); if(node) parts.push(node); }
      parts.forEach(node=>{ expand ? node.expandTree() : node.collapseTree(); count++; });
      if(!count){ ElementPlus.ElMessage.warning('请先选择要折叠或展开的分支'); return; }
      ElementPlus.ElMessage.success((expand?'已展开 ':'已折叠 ')+count+' 个分支');
    }
    function toggleCategoryBranches(expand){
      if(!batchCategory.value){ ElementPlus.ElMessage.warning('请先选择官职分类'); return; }
      let count=0;
      diagram.nodes.each(node=>{ if(node.data.category===batchCategory.value){ expand?node.expandTree():node.collapseTree(); count++; } });
      ElementPlus.ElMessage.success((expand?'展开':'折叠')+'「'+batchCategory.value+'」分支 '+count+' 处');
    }
    function archiveSelected(){
      const roots=selectedBranchRoots();
      if(!roots.length){ ElementPlus.ElMessage.warning('请先选择要归档的分支'); return; }
      const keys=collectBranchKeys(roots);
      currentArr.value.forEach(n=>{ if(keys.has(n.key)) n.archived=true; });
      pushHistory('归档 '+roots.length+' 组分支（'+keys.size+' 个节点）');
      selectedKey.value=null; selectedKeys.value=[];
      refreshDiagramData(true);
      ElementPlus.ElMessage.success('已归档；可在筛选栏开启“显示归档”查看');
    }
    function standardizeCurrentTree(){
      ElementPlus.ElMessageBox.confirm('将规范当前树中的半角括号、多余空格、重复标签，并为“中护军／护军将军”等别称建立统一归类标签。节点 key 与层级不会改变。','数据标准化',{confirmButtonText:'开始规范',cancelButtonText:'取消',type:'warning'})
        .then(()=>{
          let changed=0;
          currentArr.value.filter(n=>n.kind!=='root').forEach(node=>{
            const before=JSON.stringify([node.name,node.aliases,node.region,node.customTags]);
            node.name=String(node.name||'').trim().replace(/\s+/g,' ').replace(/\(([^()]*)\)/g,'（$1）');
            node.aliases=String(node.aliases||'').trim().replace(/\s*[/／]\s*/g,'／');
            node.region=String(node.region||'').trim().replace(/\s+/g,'');
            node.customTags=Array.from(new Set((node.customTags||[]).map(t=>String(t).trim()).filter(Boolean)));
            if(/中护军|护军将军/.test(node.name+' '+node.aliases)){
              if(!node.customTags.includes('护军官组')) node.customTags.push('护军官组');
              const counterpart=node.name.includes('中护军')?'护军将军':'中护军';
              if(!node.aliases.includes(counterpart)) node.aliases=[node.aliases,counterpart].filter(Boolean).join('／');
            }
            if(before!==JSON.stringify([node.name,node.aliases,node.region,node.customTags])) changed++;
          });
          if(changed){ pushHistory('数据标准化（'+changed+' 个节点）'); refreshDiagramData(false); }
          ElementPlus.ElMessage.success('标准化完成，共调整 '+changed+' 个节点');
        }).catch(()=>{});
    }
    function toggleLock(){
      const nodes=topSelectedData();
      if(!nodes.length && selectedNode.value) nodes.push(selectedNode.value);
      if(!nodes.length){ ElementPlus.ElMessage.warning('请先选中一个或多个节点'); return; }
      const shouldLock=nodes.some(n=>!n.locked);
      nodes.forEach(n=>n.locked=shouldLock);
      pushHistory((shouldLock?'批量锁定：':'批量解锁：')+nodes.map(n=>n.name).join('、'));
      refreshDiagramData(false);
    }

    function bulkEditTargetNodes(){
      const byKey=new Map(currentArr.value.map(n=>[n.key,n]));
      const keys=new Set(selectedKeys.value.length?selectedKeys.value:(selectedNode.value?[selectedNode.value.key]:[]));
      return [...keys].map(k=>byKey.get(k)).filter(Boolean);

    function applyBulkEdit(){
      const nodes=bulkEditTargetNodes().filter(n=>n.kind!=='root');
      if(!nodes.length){ ElementPlus.ElMessage.warning('请先在画布中多选节点，或选中一个节点'); return; }
      const f=bulkEditForm;
      let changed=0;
      nodes.forEach(node=>{
        let before=JSON.stringify([node.category,node.rank9,node.hanRank,node.jie,node.relationType,node.region,node.kaifu,node.yaoling,node.virtual,node.temporary,node.archived,node.hidden,node.customTags]);
        if(node.kind==='office'){
          if(f.category) node.category=f.category;
          if(f.rank9 && RANK9_FACTIONS.includes(currentFaction.value)) node.rank9=f.rank9;
          if(f.hanRank) node.hanRank=f.hanRank;
          if(f.jie) node.jie=f.jie;
          if(f.relationType) node.relationType=f.relationType;
          if(f.region) node.region=f.region;
        }
        ['kaifu','yaoling','virtual','temporary','archived','hidden'].forEach(key=>{
          if(f[key]!==null && node.kind==='office') node[key]=f[key]===true;
        });
        if(Array.isArray(f.customTags) && f.customTags.length){
          const tags=new Set([...(node.customTags||[]),...f.customTags]);
          node.customTags=[...tags];
        }
        let after=JSON.stringify([node.category,node.rank9,node.hanRank,node.jie,node.relationType,node.region,node.kaifu,node.yaoling,node.virtual,node.temporary,node.archived,node.hidden,node.customTags]);
        if(before!==after) changed++;
      });
      if(!changed){ ElementPlus.ElMessage.info('所选字段与当前值相同，无需修改'); return; }

    let editDebounce = null;
    function onFormChangedDebounced(){
      // 注意：<el-form> 上仅绑定原生 change 事件（在字段失焦／选择提交时触发一次），
      // 不再监听 input 事件，避免打字过程中每个字符都弹出校验提示。
      const target = selectedNode.value;
      clearTimeout(editDebounce);
      editDebounce = setTimeout(()=>{
        onFormChanged();
        if(target && target.kind!=='root') nodeDrafts.map[target.key]={savedAt:Date.now(),fields:draftFields(target)};
        pushHistory('编辑节点：'+(target ? target.name : ''));

    /* ---------- 编辑草稿暂存 ---------- */
    function draftFields(node){
      const base={
        name:node.name, aliases:node.aliases||'', category:node.category||'', rank9:node.rank9||'',
        hanRank:node.hanRank||'', duty:node.duty||'', region:node.region||'', regionPath:(node.regionPath||[]).slice(),
        jie:node.jie||'无', relationType:node.relationType||'', directRules:node.directRules||'',
        evolution:node.evolution||'', evolutionEvents:(node.evolutionEvents||[]).map(e=>Object.assign({},e)),
        sources:node.sources||'', note:node.note||'', customTags:(node.customTags||[]).slice(),
        kaifu:Boolean(node.kaifu), yaoling:Boolean(node.yaoling), worldTangBing:Boolean(node.worldTangBing),
        lushangshushi:Boolean(node.lushangshushi), jiaguan:node.jiaguan||'无',
        virtual:Boolean(node.virtual), temporary:Boolean(node.temporary), archived:Boolean(node.archived),
        hidden:Boolean(node.hidden), officeStartYear:normalizeYear(node.officeStartYear), officeEndYear:normalizeYear(node.officeEndYear)
      };
      if(node.kind==='noble') Object.assign(base,{nobleRank:node.nobleRank||'',fief:node.fief||'',inherit:node.inherit||'',actualFief:node.actualFief!==false});
      return base;
    }
    function applyDraftFields(node,draft){
      if(!draft) return;
      ['name','aliases','category','rank9','hanRank','duty','region','jie','relationType','directRules','evolution','sources','note','jiaguan'].forEach(key=>{ if(draft[key]!==undefined) node[key]=draft[key]; });
      if(Array.isArray(draft.regionPath)) node.regionPath=draft.regionPath.slice();
      if(Array.isArray(draft.evolutionEvents)) node.evolutionEvents=draft.evolutionEvents.map(e=>Object.assign({},e));
      if(Array.isArray(draft.customTags)) node.customTags=draft.customTags.slice();
      ['kaifu','yaoling','worldTangBing','lushangshushi','virtual','temporary','archived','hidden'].forEach(key=>{ if(draft[key]!==undefined) node[key]=Boolean(draft[key]); });
      if(draft.officeStartYear!==undefined) node.officeStartYear=normalizeYear(draft.officeStartYear);
      if(draft.officeEndYear!==undefined) node.officeEndYear=normalizeYear(draft.officeEndYear);
      if(node.kind==='noble'){
        ['nobleRank','fief','inherit'].forEach(key=>{ if(draft[key]!==undefined) node[key]=draft[key]; });
        if(draft.actualFief!==undefined) node.actualFief=Boolean(draft.actualFief);
      }
    }
    function saveNodeDraft(){

    /* ---------- 任职人物、立绘与时期汇总 ---------- */
    function periodByKey(key){
      if(!key) return null;
      for(const list of Object.values(PERIODS)){
        const found = list.find(period=>period.key===key);
        if(found) return found;
      }
      return null;
    }
    function recordYearLabel(record){
      const start = normalizeYear(record.startYear);
      const end = normalizeYear(record.endYear);
      if(start===null && end===null) return '年份未标注';
      if(start!==null && end!==null) return start===end ? start+'年' : start+'—'+end+'年';
      return (start!==null ? start+'年起' : '至'+end+'年');
    }
    function recordPeriodLabel(record){
      if(record.treeType==='fangzhen'||record.source==='fangzhen') return (record.polity||'')+' · '+(record.eraGroup==='jin'?'西晋':record.eraGroup==='eastjin'?'东晋扩展':'汉末／三国');
      const period = periodByKey(record.rulerKey);
      return period ? period.name : '未指定君主时期';
    }

    function uploadPortrait(file, record){
      const allowed = ['image/jpeg','image/png','image/webp','image/gif'];
      if(!allowed.includes(file.type)){
        ElementPlus.ElMessage.error('立绘仅支持 JPG、PNG、WebP 或 GIF 图片');
        return false;
      }
      if(file.size > 1024*1024){
        ElementPlus.ElMessage.error('本地立绘请控制在 1MB 以内；较大图片建议填写网络地址');
        return false;
      }
      const reader = new FileReader();
      reader.onload = event=>{
        record.portrait = String(event.target.result || '');
        pushHistory('添加人物立绘：'+(record.name||'未命名人物'));
        ElementPlus.ElMessage.success('立绘已加入当前工程');
      };
      reader.onerror = ()=>ElementPlus.ElMessage.error('立绘读取失败');
      reader.readAsDataURL(file);
      return false;
    }
    function clearPortrait(record){
      if(!record || !record.portrait) return;
      record.portrait = '';

    function recordMatchesPeriod(record, period){
      if(!period) return true;
      if(record.rulerKey) return record.rulerKey===period.key;
      const start = normalizeYear(record.startYear);
      const end = normalizeYear(record.endYear);
      if(start===null && end===null) return false;
      const from = start===null ? end : start;
      const to = end===null ? start : end;
      return from <= period.endYear && to >= period.startYear;
    }

          });
        });

      return records;
    });

        if(!group.portrait && record.portrait) group.portrait = record.portrait;
        group.appointments.push(record);

    function searchSpecialMatch(node,special){ return !special || Boolean(node[special]); }
    const searchResults = computed(()=>{
      const q=searchFilters.query.trim().toLowerCase();
      const results=[];
      factions.forEach(faction=>{
        if(searchFilters.faction!=='all' && searchFilters.faction!==faction.key) return;
        ['office','noble'].forEach(type=>{
          if(searchFilters.treeType!=='all' && searchFilters.treeType!==type) return;
          data.trees[faction.key][type].filter(n=>n.kind!=='root').forEach(node=>{
            if(q && !nodeSearchText(node).includes(q)) return;
            if(searchFilters.year){
              const y=Number(searchFilters.year);
              if(Number.isFinite(y)){
                const start=normalizeYear(node.officeStartYear), end=normalizeYear(node.officeEndYear);
                if((start!==null && y<start) || (end!==null && y>end)) return;
              }
            }
            if(searchFilters.category && node.category!==searchFilters.category) return;
            if(searchFilters.rank && node.rank9!==searchFilters.rank && node.hanRank!==searchFilters.rank && node.nobleRank!==searchFilters.rank) return;
            if(!searchSpecialMatch(node,searchFilters.special)) return;
            results.push({factionKey:faction.key,factionName:faction.name,factionColor:faction.color,treeType:type,node,
              score:q && String(node.name||'').toLowerCase()===q?0:(q && String(node.name||'').toLowerCase().includes(q)?1:2)});
          });
        });
      });
      return results.sort((a,b)=>a.score-b.score || a.factionName.localeCompare(b.factionName,'zh-CN') || String(a.node.name).localeCompare(String(b.node.name),'zh-CN')).slice(0,300);
    });
    const searchGroupedResults = computed(()=>{
      const groups=[];
      const byFaction=new Map();
      searchResults.value.forEach(result=>{
        if(!byFaction.has(result.factionKey)) byFaction.set(result.factionKey,[]);
        byFaction.get(result.factionKey).push(result);
      });
      byFaction.forEach((results,factionKey)=>{
        const faction=factions.find(f=>f.key===factionKey);
        groups.push({factionKey,factionName:faction?faction.name:factionKey,factionColor:faction?faction.color:'#6B6255',results});
      });
      return groups;
    });
    function resultExcerpt(node){
      const text=[node.duty,node.note,node.sources,node.region,(node.evolutionEvents||[]).map(e=>e.year+'年 '+e.type+' '+e.text).join('；'),(node.footnotes||[]).map(f=>f.text).join('；'),(node.figures||[]).map(f=>f.name).join('、')].filter(Boolean).join('；')||'暂无补充说明';
      return String(text).length>90?String(text).slice(0,90)+'…':String(text);
    }

    function personKeyOf(name){ return String(name||'').replace(/[（(].*?[)）]/g,'').trim(); }
    function normalizePersonMeta(raw){
      const out = {};
      if(raw && typeof raw==='object'){
        Object.entries(raw).forEach(([key,item])=>{
          if(!item || typeof item!=='object') return;
          out[String(key).trim()] = {
            name: String(item.name||key||'').trim(),
            zi: String(item.zi||'').trim(),
            birthplace: String(item.birthplace||'').trim(),
            birthYear: normalizeYear(item.birthYear),
            deathYear: normalizeYear(item.deathYear),
            bio: String(item.bio||'').trim(),
            portrait: String(item.portrait||''),
            updatedAt: item.updatedAt || null
          };
        });
      }
      return out;
    }
    function collectPersonAppointments(name){
      const records=[];
      const key=personKeyOf(name);
      factions.forEach(faction=>['office','noble'].forEach(type=>{
        data.trees[faction.key][type].filter(n=>n.kind!=='root').forEach(node=>{
          (node.figures||[]).forEach(f=>{
            if(personKeyOf(f.name)!==key) return;
            records.push({...f,source:'officeTree',factionKey:faction.key,factionName:faction.name,treeType:type,nodeKey:node.key,nodeName:node.name,polity:faction.name});
          });
        });
      }));
      fangzhenRecords.value.forEach(record=>{
        if(personKeyOf(record.commander)!==key) return;
        records.push({...record,source:'fangzhen',factionKey:fangzhenArchiveKeyFor(record),factionName:(record.polity||'')+'州镇录',nodeName:record.title,treeType:'fangzhen',nodeKey:record.id});
      });
      return records.sort((a,b)=>(normalizeYear(a.startYear)??9999)-(normalizeYear(b.startYear)??9999));
    }

    function jumpToPersonAppointment(item){

    const personRegistry = computed(()=>{
      const map = new Map();
      function entry(name){
        const key=personKeyOf(name);
        if(!key) return null;
        if(!map.has(key)) map.set(key,{key,name:key,zi:'',birthplace:'',birthYear:null,deathYear:null,bio:'',portrait:'',politics:[],appointments:[]});
        return map.get(key);
      }
      factions.forEach(faction=>['office','noble'].forEach(type=>{
        data.trees[faction.key][type].filter(n=>n.kind!=='root').forEach(node=>{
          (node.figures||[]).forEach(f=>{
            const e=entry(f.name); if(!e) return;
            e.politics.push(faction.short||faction.name);
            e.appointments.push({...f,source:'officeTree',factionKey:faction.key,factionName:faction.name,treeType:type,nodeKey:node.key,nodeName:node.name,polity:faction.name});
          });
        });
      }));
      fangzhenRecords.value.forEach(record=>{
        const e=entry(record.commander); if(!e) return;
        e.politics.push(record.polity||'');
        e.appointments.push({...record,source:'fangzhen',factionKey:fangzhenArchiveKeyFor(record),factionName:(record.polity||'')+'州镇录',nodeName:record.title,treeType:'fangzhen',nodeKey:record.id});
      });
      Object.entries(personMeta.map).forEach(([key,meta])=>{
        const e=map.get(key)||entry(key); if(!e) return;
        e.zi=e.zi||meta.zi; e.birthplace=e.birthplace||meta.birthplace;
        e.birthYear=e.birthYear??meta.birthYear; e.deathYear=e.deathYear??meta.deathYear;
        e.bio=e.bio||meta.bio; e.portrait=e.portrait||meta.portrait;
      });
      return [...map.values()].map(e=>{
        e.politics=[...new Set(e.politics.filter(Boolean))];
        e.appointmentCount=e.appointments.length;
        const years=e.appointments.map(a=>[normalizeYear(a.startYear),normalizeYear(a.endYear)]).flat().filter(n=>n!==null);
        e.startYear=years.length?Math.min(...years):null;
        e.endYear=years.length?Math.max(...years):null;
        return e;
      }).sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh-CN'));
    });
    const filteredPeople = computed(()=>{
      const q=peopleQuery.value.trim().toLowerCase();
      return personRegistry.value.filter(p=>{
        if(peoplePolity.value!=='all' && !p.politics.includes(peoplePolity.value)) return false;
        if(peopleOnlyPortrait.value && !p.portrait) return false;
        if(peopleKind.value==='office' && !p.appointments.some(a=>a.treeType==='office')) return false;
        if(peopleKind.value==='noble' && !p.appointments.some(a=>a.treeType==='noble')) return false;
        if(peopleKind.value==='fangzhen' && !p.appointments.some(a=>a.treeType==='fangzhen')) return false;
        if(!q) return true;
        const hay=[p.name,p.zi,p.birthplace,p.bio].concat(p.appointments.map(a=>[a.nodeName,a.jurisdiction,a.seat,a.title,a.note,a.sourceTitle,a.polity].join(' '))).join('\n').toLowerCase();
        return hay.includes(q);
      });
    });
    const peopleMetrics = computed(()=>{
      const stats={people:personRegistry.value.length,office:0,noble:0,fangzhen:0,portrait:0};
      personRegistry.value.forEach(p=>{
        if(p.portrait) stats.portrait++;
        p.appointments.forEach(a=>{ if(a.treeType==='office') stats.office++; else if(a.treeType==='noble') stats.noble++; else stats.fangzhen++; });
      });
      return stats;
    });

    function uploadPersonPortrait(file){
      const allowed=['image/jpeg','image/png','image/webp','image/gif'];
      if(!allowed.includes(file.type)){
        ElementPlus.ElMessage.error('立绘仅支持 JPG、PNG、WebP 或 GIF 图片');
        return false;
      }
      if(file.size>1024*1024){
        ElementPlus.ElMessage.error('本地立绘请控制在 1MB 以内；较大图片建议填写网络地址');
        return false;
      }
      const reader=new FileReader();
      reader.onload=event=>{ personMetaDialog.form.portrait=String(event.target.result||''); ElementPlus.ElMessage.success('立绘已加入人物档案'); };
      reader.onerror=()=>ElementPlus.ElMessage.error('立绘读取失败');
      reader.readAsDataURL(file);
      return false;
    }

    /* ---------- 数据审计中心 ---------- */
    function officeNameIndex(){
      const index={};
      factions.forEach(faction=>['office','noble'].forEach(type=>{
        const list=[];
        data.trees[faction.key][type].forEach(node=>{ if(node.kind!=='root') list.push(node); });
        index[faction.key+'_'+type]=list;
      }));
      return index;
    }
    function runDataAudit(){
      const issues=[];
      const add=(severity,module,title,detail,target)=>issues.push({id:'audit_'+issues.length,severity,module,title,detail,target});
      const nameIndex=officeNameIndex();
      // 同名官职／爵位（同势力同体系，忽略归档节点）
      Object.entries(nameIndex).forEach(([key,nodes])=>{
        const seen={};
        nodes.forEach(node=>{
          const nm=String(node.name||'').trim();
          if(!nm) return;
          if(!seen[nm]) seen[nm]=[];
          seen[nm].push(node);
        });
        Object.entries(seen).forEach(([nm,list])=>{
          const active=list.filter(n=>!n.archived);
          if(active.length<2) return;
          const [factionKey,type]=key.split('_');
          add('warn','职官谱','同名'+ (type==='office'?'官职':'爵位') +'「'+nm+'」',active.length+' 个节点同名（共 '+list.length+' 个，含归档）。建议合并，或用时期、别称区分。',{type:'nodeList',factionKey,treeType:type,names:active.map(n=>n.name)});
        });
      });
      // 沿革时间与字段一致性
      factions.forEach(faction=>['office','noble'].forEach(type=>{
        data.trees[faction.key][type].forEach(node=>{
          if(node.kind==='root') return;
          if(node.officeStartYear!==null && node.officeEndYear!==null && node.officeStartYear>node.officeEndYear){
            add('error','职官谱','沿革时间倒置','「'+node.name+'」设立年 '+node.officeStartYear+' 晚于裁撤年 '+node.officeEndYear+'。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
          }
          if(node.kind==='office' && node.yaoling && !String(node.region||'').trim()){
            add('warn','职官谱','遥领官职缺少辖区','「'+node.name+'」标记为遥领，但未填写管辖区域。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
          }
          if(node.kind==='office' && node.officeStartYear===null && node.officeEndYear===null && !String(node.evolution||'').trim()){
            add('info','职官谱','沿革年代待补','「'+node.name+'」未记录设立／裁撤年，也无沿革说明。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
          }
          // 结构化沿革事件与节点沿革年份一致性
          (node.evolutionEvents||[]).forEach(ev=>{
            if(ev.year===null) return;
            if(node.officeStartYear!==null && ev.year<node.officeStartYear && ev.type!=='设立'){
              add('warn','职官谱','沿革事件早于设立年','「'+node.name+'」存在 '+ev.year+' 年'+ev.type+'事件，早于节点设立年 '+node.officeStartYear+'。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
            }
            if(node.officeEndYear!==null && ev.year>node.officeEndYear){
              add('warn','职官谱','沿革事件晚于裁撤年','「'+node.name+'」存在 '+ev.year+' 年'+ev.type+'事件，晚于节点裁撤年 '+node.officeEndYear+'。',{type:'node',factionKey:faction.key,treeType:type,nodeKey:node.key});
            }
          });
        });
      }));
      // V28：无可靠沿革年份的官职统一标注“待考”，汇总为一条待补清单。
      let chronologyPendingCount=0;
      factions.forEach(faction=>{
        data.trees[faction.key].office.forEach(node=>{
          if(node.kind==='root'||node.archived) return;
          if(node.officeStartYear===null && node.officeEndYear===null && String(node.evolution||'').includes('待考')) chronologyPendingCount++;
        });
      });
      if(chronologyPendingCount){
        add('info','职官谱','沿革年代已标注待考',chronologyPendingCount+' 个官职节点无可靠设立／裁撤年，已统一标注“沿革年代待考”，可继续据史料补充。',{type:'summary'});
      }
      // 上下级时期冲突：子节点设立晚于父节点裁撤，或子节点裁撤早于父节点设立
      factions.forEach(faction=>{
        const byKey=new Map(data.trees[faction.key].office.map(n=>[n.key,n]));
        data.trees[faction.key].office.forEach(node=>{
          if(node.kind==='root'||node.parent===undefined) return;
          const parent=byKey.get(node.parent);
          if(!parent) return;
          const cs=normalizeYear(node.officeStartYear), ce=normalizeYear(node.officeEndYear);
          const ps=normalizeYear(parent.officeStartYear), pe=normalizeYear(parent.officeEndYear);
          if(cs!==null && pe!==null && cs>pe){
            add('warn','职官谱','子节点晚于父节点存续','「'+node.name+'」（'+cs+'年设）晚于其上级「'+parent.name+'」裁撤年（'+pe+'年）。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
          }
          if(ce!==null && ps!==null && ce<ps){
            add('warn','职官谱','子节点早于父节点设立','「'+node.name+'」（'+ce+'年裁）早于其上级「'+parent.name+'」设立年（'+ps+'年）。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
          }
        });
      });
      // 势力存续范围：节点沿革年份超出该势力实际存续区间
      const POLITY_RANGES={ han:[168,220], wei:[220,265], shu:[221,263], wu:[222,280], jin:[266,316], tribal:[168,316] };
      factions.forEach(faction=>{
        const range=POLITY_RANGES[faction.key]; if(!range) return;
        data.trees[faction.key].office.forEach(node=>{
          if(node.kind==='root') return;
          const cs=normalizeYear(node.officeStartYear), ce=normalizeYear(node.officeEndYear);
          if(cs!==null && cs<range[0]){
            add('warn','职官谱','设立年早于势力存续','「'+node.name+'」设立年 '+cs+' 早于'+faction.name+'存续起点 '+range[0]+' 年。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
          }
          if(ce!==null && ce>range[1]){
            add('warn','职官谱','裁撤年晚于势力存续','「'+node.name+'」裁撤年 '+ce+' 晚于'+faction.name+'存续终点 '+range[1]+' 年。',{type:'node',factionKey:faction.key,treeType:'office',nodeKey:node.key});
          }
        });
      });
      // 人物记录完整性
      const personNames={};
      factions.forEach(faction=>['office','noble'].forEach(type=>{
        data.trees[faction.key][type].filter(n=>n.kind!=='root').forEach(node=>{
          (node.figures||[]).forEach(f=>{
            const key=personKeyOf(f.name); if(!key) return;
            if(!personNames[key]) personNames[key]={count:0,portrait:false};
            personNames[key].count++;
            if(f.portrait) personNames[key].portrait=true;
          });
        });
      }));
      fangzhenRecords.value.forEach(record=>{
        const key=personKeyOf(record.commander); if(!key) return;
        if(!personNames[key]) personNames[key]={count:0,portrait:false};
        personNames[key].count++;
        if(record.portrait) personNames[key].portrait=true;
      });
      Object.entries(personNames).forEach(([key,info])=>{
        if(!info.portrait) add('info','人物记','立绘待补','人物「'+key+'」有 '+info.count+' 条任职／受爵记录，暂无立绘。',{type:'person',name:key});
      });
      // 州镇录任期与辖区
      const fzIndex={};
      fangzhenRecords.value.forEach(record=>{
        if(record.startYear!==null && record.endYear!==null && record.startYear>record.endYear){
          add('error','州镇录','任期倒置','「'+record.commander+'」的「'+record.title+'」起始年 '+record.startYear+' 晚于结束年 '+record.endYear+'。',{type:'fangzhen',record});
        }
        if(['cishi','cimu','dudu','junshou','taishou','duwei'].includes(record.recordType) && !String(record.jurisdiction||'').trim()){
          add('warn','州镇录','辖区待补','「'+record.commander+'」任「'+record.title+'」未填写辖区。',{type:'fangzhen',record});
        }
        if(!String(record.sourceTitle||'').trim() && !String(record.sourceUrl||'').trim()){
          add('info','州镇录','史料出处待补','「'+record.commander+'」任「'+record.title+'」缺少史料出处。',{type:'fangzhen',record});
        }
        if(!Number.isFinite(record.startYear) && !Number.isFinite(record.endYear) && /[?？]|未详|未知|待考/.test(String(record.tenureText||''))){
          add('info','州镇录','任期待考','「'+record.commander+'」任「'+record.title+'」无可靠年代锚点，任期标注为待考。',{type:'fangzhen',record});
        }
        const overlapKey=record.polity+'|'+record.commander+'|'+record.title+'|'+String(record.jurisdiction||'').trim();
        if(!fzIndex[overlapKey]) fzIndex[overlapKey]=[];
        fzIndex[overlapKey].push(record);
      });
      Object.entries(fzIndex).forEach(([,list])=>{
        if(list.length<2) return;
        for(let i=0;i<list.length;i++){
          for(let j=i+1;j<list.length;j++){
            const a=list[i],b=list[j];
            const as=normalizeYear(a.startYear)??-9999, ae=normalizeYear(a.endYear)??9999;
            const bs=normalizeYear(b.startYear)??-9999, be=normalizeYear(b.endYear)??9999;
            // 同辖区同职任才判重叠；首尾相接的连任（220—226 与 226—231）不视为重叠。
            const overlaps = (as<be && bs<ae) || (as===ae && bs===be && as===bs);
            if(overlaps){
              add('error','州镇录','同期任职重叠','「'+a.commander+'」的「'+a.title+'」存在两段重叠任期（'+recordYearLabel(a)+' 与 '+recordYearLabel(b)+'）。请核对应为兼领还是记录重复。',{type:'fangzhen',record:a});
            }
          }
        }
      });
      // 跨模块一致性：州镇职任标题在对应官制树中是否有同名节点
      fangzhenRecords.value.forEach(record=>{
        const key=record.polity==='魏'?'wei':record.polity==='汉'?'shu':record.polity==='吴'?'wu':record.polity==='西晋'?'jin':'';
        if(!key || !data.trees[key]) return;
        const matched=data.trees[key].office.some(node=>node.kind!=='root' && (
          String(node.name).replace(/[（(].*?[)）]/g,'').trim()===record.title ||
          String(node.aliases||'').split(/[、,，/]/).map(s=>s.trim()).includes(record.title)
        ));
        if(!matched) add('info','州镇录','官制树未见对应官名','「'+record.commander+'」任「'+record.title+'」在'+record.polity+'官制树中未找到同名节点；如为加官、临时称号或异名可忽略。',{type:'fangzhen',record});
      });
      // 别称与正式名重复
      Object.entries(nameIndex).forEach(([key,nodes])=>{
        const allNames=new Set(nodes.filter(n=>n.kind!=='root').map(n=>String(n.name||'').trim()).filter(Boolean));
        nodes.forEach(node=>{
          if(node.kind==='root'||!String(node.aliases||'').trim()) return;
          const dups=String(node.aliases||'').split(/[、,，/]/).map(s=>s.trim()).filter(alias=>alias && alias!==node.name && allNames.has(alias));
          if(dups.length){
            const [factionKey,type]=key.split('_');
            add('warn','职官谱','别称与正式名重复','「'+node.name+'」的别称'+dups.map(d=>'「'+d+'」').join('、')+'同时是本体系正式官名，可能造成检索歧义。',{type:'node',factionKey,treeType:type,nodeKey:node.key});
          }
        });
      });
      // 战事纪：年份与字段完整性
      const battleSeen={};
      battleRecords.battles.forEach(battle=>{
        if(!Number.isFinite(Number(battle.year))) add('error','战事纪','战役缺少年份','「'+battle.name+'」未标注发生年份。',{type:'battle',battle});
        if(!battleSeen[battle.name]) battleSeen[battle.name]=[];
        battleSeen[battle.name].push(battle);
      });
      Object.entries(battleSeen).forEach(([name,list])=>{
        if(list.length>1) add('warn','战事纪','同名战役重复','「'+name+'」存在 '+list.length+' 条记录，请核实是否应合并。',{type:'battle',battle:list[0]});
      });
      battleRecords.battlefields.forEach(field=>{

    function flattenComparison(factionKey){
      const arr=data.trees[factionKey].office;
      const children=new Map(); arr.forEach(n=>{ const p=n.parent===undefined?'__root__':n.parent; if(!children.has(p)) children.set(p,[]); children.get(p).push(n); });
      const out=[];
      function walk(node,depth){
        if(node.kind!=='root') out.push({key:node.key,name:node.name,category:node.category,depth,archived:node.archived});
        (children.get(node.key)||[]).sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh-CN')).forEach(child=>walk(child,depth+1));
      }
      (children.get('__root__')||[]).forEach(root=>walk(root,0));
      return out;
    }

    function officeNameVariants(node){
      const name=String(node.name||'').replace(/[（(].*?[)）]/g,'').trim();
      const variants=[name];
      if(name) variants.push(name);
      if(String(node.aliases||'').trim()) variants.push(...String(node.aliases).split(/[、,，/]/).map(s=>s.trim()).filter(Boolean));
      return [...new Set(variants.filter(Boolean))];
    }
    function officeCompareDiff(entries,key){
      const values=entries.map(e=>String(e[key]||'')).filter(v=>v!=='');
      return values.length>1 && new Set(values).size>1;
    }
    const officeCompareGroups = computed(()=>{
      const index=new Map();
      factions.forEach(faction=>{
        (data.trees[faction.key].office||[]).filter(n=>n.kind!=='root').forEach(node=>{
          officeNameVariants(node).forEach(variant=>{
            const v=variant.toLowerCase();
            if(!index.has(v)) index.set(v,[]);
            const list=index.get(v);
            if(!list.some(e=>e.factionKey===faction.key&&e.nodeKey===node.key)) list.push({factionKey:faction.key,factionName:faction.name,factionColor:faction.color,nodeKey:node.key,node});
          });
        });
      });
      const q=officeCompareQuery.value.trim().toLowerCase();
      const groups=[];
      index.forEach((entries,variant)=>{
        const primary=entries[0]&&entries[0].node;
        if(!primary) return;
        if(q && !variant.includes(q) && !String(primary.name||'').toLowerCase().includes(q)) return;
        groups.push({
          name:variant,
          entries:entries.sort((a,b)=>a.factionName.localeCompare(b.factionName,'zh-CN')),
          count:entries.length,
          diff:{ rank:officeCompareDiff(entries,'rank9'), han:officeCompareDiff(entries,'hanRank'), duty:officeCompareDiff(entries,'duty') }
        });
      });
      groups.sort((a,b)=>b.count-a.count || a.name.localeCompare(b.name,'zh-CN'));
      return q ? groups : groups.filter(g=>g.count>=2).slice(0,80);

    function exportImage(){
      const baseImg = diagram.makeImageData({ background:'#EDE6D6', scale:2 });
      const notes = footnoteIndex.value.flat;
      if(!notes.length){
        const a = document.createElement('a');
        a.href = baseImg; a.download = '三国职官谱_'+currentFaction.value+'.png'; a.click();
        pushHistory('导出画布图片');
        return;
      }
      // 附带脚注：在画布图片下方拼接一段脚注／参考文献区块，编号与画布中标注一致
      const img = new Image();
      img.onload = ()=>{
        const padding = 28, lineH = 20, fontSize = 14;
        const maxWidth = img.width - padding*2;
        const ctx0 = document.createElement('canvas').getContext('2d');
        ctx0.font = fontSize+'px sans-serif';
        function wrapLines(text){
          const words = text.split('');
          let line='', lines=[];
          words.forEach(ch=>{
            if(ctx0.measureText(line+ch).width > maxWidth){ lines.push(line); line=ch; } else { line+=ch; }
          });
          if(line) lines.push(line);
          return lines;
        }
        const allLines = [];
        notes.forEach(f=>{ wrapLines('['+f.num+'] '+f.nodeName+'·'+f.field+'：'+f.text).forEach(l=>allLines.push(l)); });
        const footH = padding*2 + 26 + allLines.length*lineH;
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height + footH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#EDE6D6'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0);
        ctx.strokeStyle = '#C9BFA5'; ctx.beginPath(); ctx.moveTo(padding,img.height+padding*0.6); ctx.lineTo(canvas.width-padding,img.height+padding*0.6); ctx.stroke();
        ctx.fillStyle = '#2B2622'; ctx.font = 'bold 16px sans-serif';
        ctx.fillText('脚注 · 参考文献', padding, img.height+padding+18);
        ctx.font = fontSize+'px sans-serif'; ctx.fillStyle = '#3A342D';
        allLines.forEach((line,i)=>{ ctx.fillText(line, padding, img.height+padding+52+i*lineH); });
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png'); a.download = '三国职官谱_'+currentFaction.value+'.png'; a.click();
        pushHistory('导出画布图片（含脚注）');
      };
      img.src = baseImg;
    }

    function markdownForCurrentTree(){
      const arr=currentArr.value, byParent=new Map();
      arr.forEach(n=>{ const p=n.parent===undefined?'__root__':n.parent; if(!byParent.has(p)) byParent.set(p,[]); byParent.get(p).push(n); });
      const lines=['# '+currentFactionDef.value.name+' · '+(treeType.value==='office'?'官职体系':'爵位体系'),''];
      function walk(node,depth){
        const prefix='  '.repeat(Math.max(0,depth-1))+'- ';
        if(node.kind==='root') lines.push('## '+node.name,'');
        else {
          const attrs=[];
          if(node.category) attrs.push(node.category);
          if(node.rank9) attrs.push(node.rank9);
          if(node.hanRank) attrs.push(node.hanRank);
          if(node.nobleRank) attrs.push(node.nobleRank);
          if(node.yaoling) attrs.push('遥领'); if(node.virtual) attrs.push('虚职'); if(node.kaifu) attrs.push('可开府');
          lines.push(prefix+'**'+node.name+'**'+(attrs.length?'（'+attrs.join(' · ')+'）':''));
          if(node.duty) lines.push('  '.repeat(depth)+'- 职权：'+node.duty);
          if(node.officeStartYear!==null || node.officeEndYear!==null) lines.push('  '.repeat(depth)+'- 沿革：'+(node.officeStartYear??'待考')+'—'+(node.officeEndYear??'存续')+'年'+(node.evolution?'；'+node.evolution:''));
          if(node.sources) lines.push('  '.repeat(depth)+'- 出处：'+node.sources);
          if((node.figures||[]).length) lines.push('  '.repeat(depth)+'- 人物：'+node.figures.map(f=>f.name).filter(Boolean).join('、'));
          if(node.note) lines.push('  '.repeat(depth)+'- 备注：'+node.note);
        }
        (byParent.get(node.key)||[]).forEach(child=>walk(child,depth+1));
      }
      (byParent.get('__root__')||[]).forEach(root=>walk(root,0));
      if(footnoteIndex.value.flat.length){
        lines.push('','---','### 脚注 · 参考文献','');
        footnoteIndex.value.flat.forEach(f=>{ lines.push('['+f.num+'] '+f.nodeName+'·'+f.field+'：'+f.text); });
      }
      return lines.join('\n');
    }

    function downloadBlob(content, type, filename){

      const a = document.createElement('a');
      a.href=url; a.download=filename; a.style.display='none';
      document.body.appendChild(a); a.click(); a.remove();
      // 延后释放，避免部分浏览器在下载真正开始前就使 blob URL 失效。
      setTimeout(()=>URL.revokeObjectURL(url), 0);
    }

    function combineImportedNodes(importedNodes, mode){
      if(mode==='覆盖') return importedNodes;
      const existing=currentArr.value;
      const root=existing.find(n=>n.kind==='root');
      const incoming=importedNodes.filter(n=>n.kind!=='root');
      const prefix=currentFaction.value+'_'+(treeType.value==='office'?'o':'n')+'_imp';
      const occupied=new Set(existing.map(n=>n.key));
      const existingByName=new Map(existing.filter(n=>n.kind!=='root').map(n=>[n.name,n]));
      const keyMap={};
      incoming.forEach(n=>{
        const match=mode==='合并'?existingByName.get(n.name):null;
        keyMap[n.key]=match?match.key:nextUniqueKey(prefix,occupied);
      });
      const result=cloneJSON(existing);
      const resultByKey=new Map(result.map(n=>[n.key,n]));
      incoming.forEach(n=>{
        const targetKey=keyMap[n.key], match=resultByKey.get(targetKey);
        const mappedParent=keyMap[n.parent] || (root?root.key:undefined);
        if(match){
          const keepKey=match.key, keepParent=match.parent;
          Object.assign(match,cloneJSON(n),{key:keepKey});
          if(mappedParent!==undefined) match.parent=mappedParent; else if(keepParent!==undefined) match.parent=keepParent;
        } else {
          const clone=cloneJSON(n); clone.key=targetKey;
          if(mappedParent!==undefined) clone.parent=mappedParent; else delete clone.parent;
          result.push(clone); resultByKey.set(clone.key,clone);
        }
      });
      return result;
    }

                  officeStartYear:row['设立年']||null, officeEndYear:row['裁撤年']||null, sources:row['史料出处']||'',
                  customTags:String(row['自定义标签']||'').split(/[、,，]/).filter(Boolean), note:row['备注']||'', figures:readFigures(row)

            if(byName[name]) duplicateNames.add(name);
            else byName[name] = n;
            n._parentName = row['上级']||row['上级名称']||row['parent']||'';

          });
          nodes.forEach(n=>{

    function hashPayload(text){
      let h=5381;
      const str=String(text||'');
      for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; }
      return 'h'+h.toString(36);
    }
    function ackRecovery(hash){

    function saveLocal(silent=false){
      if(typeof silent!=='boolean') silent=false;
      try{
        const payload=projectPayload();
        const json=JSON.stringify(payload);
        const hash=hashPayload(json);
        const prev=localStorage.getItem(AUTOSAVE_KEY);
        if(prev && prev!==json){
          try{ localStorage.setItem(SNAPSHOT_KEY,JSON.stringify({savedAt:Date.now(),hash:hashPayload(prev),payload:prev})); }catch(_){}
        }
        localStorage.setItem(AUTOSAVE_KEY,json);
        try{
          const ring=JSON.parse(localStorage.getItem(SAVE_RING_KEY)||'[]');
          ring.unshift({savedAt:payload.savedAt,hash,source:silent?'自动':'手动'});
          localStorage.setItem(SAVE_RING_KEY,JSON.stringify(ring.slice(0,20)));
        }catch(_){}
        autosaveStatus.value='已缓存 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
        if(!silent){ ackRecovery(hash); ElementPlus.ElMessage.success('已缓存到浏览器本地'); pushHistory('保存工程到本地缓存'); }

          const target=factions.find(f=>f.key===saved.key); if(target && saved.color) target.color=saved.color;
        });
        if(parsed.periodSelections && typeof parsed.periodSelections==='object'){
          Object.keys(periodSelections).forEach(key=>{
            if(typeof parsed.periodSelections[key]==='string') periodSelections[key]=parsed.periodSelections[key];
          });
        }

        rebuildModel();
        if(hash) ackRecovery(hash);

          <el-form-item label="授任状态"><el-select v-model="fangzhenDialog.form.appointmentStatus" filterable allow-create default-first-option style="width:100%"><el-option label="实授" value="实授"/><el-option label="领" value="领"/><el-option label="兼领" value="兼领"/><el-option label="遥领" value="遥领"/><el-option label="存疑" value="存疑"/><el-option label="代理" value="代理"/><el-option label="行职" value="行职"/><el-option label="未上任" value="未上任"/></el-select></el-form-item>
          <el-form-item label="辖区"><el-input v-model="fangzhenDialog.form.jurisdiction" placeholder="州、郡或军政区域"/></el-form-item>
          <el-form-item label="治所／驻地"><el-input v-model="fangzhenDialog.form.seat" placeholder="如：襄阳、晋阳"/></el-form-item>
          <el-form-item label="起始年"><el-input-number v-model="fangzhenDialog.form.startYear" :min="180" :max="420" style="width:100%"/></el-form-item>
          <el-form-item label="结束年"><el-input-number v-model="fangzhenDialog.form.endYear" :min="180" :max="420" style="width:100%"/></el-form-item>
          <el-form-item label="任期原文" style="grid-column:1/-1">
            <el-input v-model="fangzhenDialog.form.tenureText" :placeholder="fangzhenDialog.form.polity==='吴'?'仅填写年份区间，如 222—228；年号原文保存在“原始任期”':'如：黄初元年（220年）—太和二年（228年）；可保留“约”“未详”等措辞'"/>
            <div v-if="fangzhenDialog.form.polity==='吴'" style="font-size:11px;color:#7B827B;line-height:1.5;margin-top:4px;">吴州镇档案按规范只填写时间年份；原始年号与考据措辞如需保留，请写入“史料摘录”或“沿革与考据备注”。</div>
          </el-form-item>
          <el-form-item label="来源层级"><el-select v-model="fangzhenDialog.form.sourceLevel" style="width:100%"><el-option label="一手史料" value="一手史料"/><el-option label="文档考据" value="文档考据"/><el-option label="二手索引" value="二手索引"/><el-option label="待核" value="待核"/></el-select></el-form-item>
          <el-form-item label="置信度"><el-select v-model="fangzhenDialog.form.confidence" style="width:100%"><el-option label="高" value="高"/><el-option label="较高" value="较高"/><el-option label="中" value="中"/><el-option label="低" value="低"/><el-option label="待考" value="待考"/></el-select></el-form-item>
          <el-form-item label="来源名称"><el-input v-model="fangzhenDialog.form.sourceTitle" placeholder="如：维基百科：羊祜"/></el-form-item>
          <el-form-item label="来源链接"><el-input v-model="fangzhenDialog.form.sourceUrl" placeholder="https://…"/></el-form-item>
          <el-form-item label="来源定位" style="grid-column:1/-1"><el-input v-model="fangzhenDialog.form.sourceLocator" placeholder="如：章节、段落或卷次"/></el-form-item>
        </div>
        <el-form-item label="史料摘录"><el-input v-model="fangzhenDialog.form.sourceExcerpt" type="textarea" :rows="4" placeholder="保留文档原文与史料引文，便于回查"/></el-form-item>
        <el-form-item label="沿革与考据备注"><el-input v-model="fangzhenDialog.form.note" type="textarea" :rows="3" placeholder="记录迁官、改辖、资料分歧或待考内容"/></el-form-item>
      </el-form>
      <template #footer><el-button @click="fangzhenDialog.visible=false">取消</el-button><el-button type="primary" @click="saveFangzhenRecord">保存记录</el-button></template>
    </el-dialog>

    <el-dialog v-model="footnoteDialog.visible" title="添加脚注（录入史料原文出处）" width="480px">
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">挂载字段：{{footnoteDialog.fieldLabel}}</div>
      <el-input v-model="footnoteDialog.text" type="textarea" :rows="4" placeholder="如：《三国志·蜀书·诸葛亮传》：「亮以丞相录尚书事，假节。」" />
      <template #footer>
        <el-button @click="footnoteDialog.visible=false">取消</el-button>
        <el-button type="primary" @click="confirmFootnote">保存脚注</el-button>
      </template>
    </el-dialog>

    <el-dialog v-model="showTongdian" title="官品体系（据《通典》卷三十六魏官品·卷三十七晋泰始官品整理）" width="760px">
      <div class="tongdian-note">下表为对《通典》卷三十六（魏官品）、卷三十七（晋官品）内容的简编整理，非原文逐句迻录，仅供品级比对参考；具体条目请以原书及《太平御览》等互见材料核校。</div>
      <el-table :data="TONGDIAN_TABLE" border size="small">
        <el-table-column prop="rank" label="品级" width="70" />
        <el-table-column prop="wei" label="曹魏官品（通典卷三十六）" />
        <el-table-column prop="jin" label="晋官品（通典卷三十七）" />
      </el-table>
    </el-dialog>
  </div>
  `
});

app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
