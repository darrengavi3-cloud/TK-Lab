<title>职官谱 · 三国官职爵位管理系统</title>

<script src="./assets/vendor/vue/vue.global.min.js"></script>
<script src="./assets/vendor/element-plus/index.full.min.js"></script>

<script src="./assets/vendor/xlsx/xlsx.full.min.js"></script>

<script src="./data/wu-fangzhen-records.js"></script>
<script src="./data/shu-fangzhen-records.js"></script>
<script src="./data/fangzhen-term-supplement.js"></script>

<style>
@font-face { font-family: 'sys-serif'; src: local('Noto Serif SC'), local('Songti SC'), local('SimSun'); }

:root{
  --paper:#EDE6D6;
  --card:#F6F1E4;
  --ink:#2B2622;
  --ink-soft:#6B6255;
  --rule:#C9BFA5;
  --seal:#9C3B2E;
  --gold:#B08D3F;
  --wei:#376B9E;
  --shu:#A54136;
  --wu:#3F7652;
  --han:#77736B;
  --tribal:#7A5230;
}
*{box-sizing:border-box;}
html,body,#app{height:100%;margin:0;}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--paper);
  color:var(--ink);
}
.serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;}

/* ---------- layout shell ---------- */
.shell{display:flex;flex-direction:column;height:100vh;}
.topbar{
  height:56px;flex:0 0 auto;display:flex;align-items:center;gap:18px;
  padding:0 16px;background:var(--card);border-bottom:1px solid var(--rule);
  box-shadow:0 1px 0 rgba(43,38,34,.03);
}
.seal-mark{
  width:34px;height:34px;border-radius:4px;background:var(--seal);color:#F6F1E4;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
  font-family:'Noto Serif SC',serif; flex:0 0 auto; letter-spacing:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:10px;}
.brand .t1{font-size:16px;font-weight:700;font-family:'Noto Serif SC',serif;letter-spacing:1px;}
.brand .t2{font-size:11px;color:var(--ink-soft);letter-spacing:.5px;}

.faction-tabs{display:flex;gap:6px;flex:1 1 auto;overflow-x:auto;}
.faction-tab{
  padding:6px 14px;border-radius:3px;font-size:13px;cursor:pointer;white-space:nowrap;
  border:1px solid transparent; color:var(--ink-soft); transition:all .15s;
}
.faction-tab:hover{background:rgba(43,38,34,.05);}
.faction-tab.active{color:#F6F1E4;font-weight:600;}
.faction-short{display:none;}

.topbar-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto;}

.body-row{flex:1 1 auto;display:flex;min-height:0;}

.left-toolbar{
  width:56px;flex:0 0 auto;background:var(--card);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;overflow-y:auto;position:relative;
}
.tool-btn{
  width:38px;height:38px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;color:var(--ink);background:transparent;border:1px solid transparent;
  transition:all .12s;position:relative;
}
.tool-btn:hover{background:rgba(43,38,34,.06);border-color:var(--rule);}
.tool-btn.disabled{opacity:.3;cursor:not-allowed;}
.tool-btn.disabled:hover{background:transparent;border-color:transparent;}
.tool-sep{width:28px;height:1px;background:var(--rule);margin:4px 0;}
.tool-hint-bubble{
  position:fixed;left:62px;z-index:3000;pointer-events:none;white-space:nowrap;
  padding:5px 9px;border-radius:4px;background:var(--ink);color:#F6F1E4;
  font-size:12px;line-height:1;box-shadow:0 3px 10px rgba(43,38,34,.2);
}

.canvas-wrap{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:
  radial-gradient(circle at 1px 1px, rgba(43,38,34,.06) 1px, transparent 0) 0 0/22px 22px, var(--paper);
}
.canvas-tabs{
  display:flex;align-items:center;gap:4px;padding:8px 14px;border-bottom:1px solid var(--rule);
  background:rgba(246,241,228,.6);
}
.mini-tab{
  padding:4px 12px;border-radius:14px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);
  border:1px solid var(--rule);
}
.mini-tab.active{background:var(--ink);color:#F6F1E4;border-color:var(--ink);}
.canvas-tabs .spacer{flex:1;}
.canvas-tabs .hint{font-size:12px;color:var(--ink-soft);}
.period-select{width:210px;flex:0 0 auto;}
.period-summary-btn{margin-left:4px;}

#goCanvas{flex:1 1 auto;background:transparent;}

.right-panel{
  width:340px;flex:0 0 auto;background:var(--card);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;min-height:0;
}
.panel-head{
  padding:14px 16px 10px;border-bottom:1px solid var(--rule);
}
.panel-head .name{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:700;}
.panel-head .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.panel-body{flex:1 1 auto;overflow-y:auto;padding:12px 16px 30px;}
.panel-empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}
.panel-empty .glyph{font-size:34px;margin-bottom:10px;font-family:'Noto Serif SC',serif;color:var(--rule);}

.statusbar{
  height:28px;flex:0 0 auto;background:var(--ink);color:#EDE6D6;font-size:11.5px;
  display:flex;align-items:center;padding:0 14px;gap:18px;
}
.statusbar .item{opacity:.85;}
.statusbar .spacer{flex:1;}

.field-group-title{
  font-size:12px;color:var(--ink-soft);margin:14px 0 6px;letter-spacing:1px;
  border-bottom:1px dashed var(--rule);padding-bottom:4px;
}
.field-group-title:first-child{margin-top:0;}

.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.mini-badge{
  font-size:11px;padding:2px 7px;border-radius:3px;background:rgba(43,38,34,.06);color:var(--ink-soft);
}

.el-drawer__header{margin-bottom:8px !important;font-family:'Noto Serif SC',serif;}
.log-item{padding:8px 10px;border-bottom:1px solid var(--rule);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.log-item .t{color:var(--ink-soft);font-size:11px;}
.log-item.current{background:rgba(155,59,46,.07);}

.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;}
.stat-row .label{width:96px;flex:0 0 auto;color:var(--ink-soft);}
.stat-row .bar-bg{flex:1;height:8px;background:rgba(43,38,34,.08);border-radius:4px;overflow:hidden;}
.stat-row .bar{height:100%;background:var(--seal);}
.stat-row .num{width:28px;text-align:right;flex:0 0 auto;font-family:'Noto Serif SC',serif;}

.icon-picker{display:flex;flex-wrap:wrap;gap:6px;}
.icon-picker .opt{
  width:32px;height:32px;border:1px solid var(--rule);border-radius:4px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;font-size:16px;background:#fff;
}
.icon-picker .opt.sel{border-color:var(--seal);background:rgba(155,59,46,.08);}

.footnote-badges{display:flex;flex-direction:column;gap:4px;margin:-4px 0 10px;}
.footnote-badge{
  font-size:11.5px;color:var(--ink-soft);background:rgba(43,38,34,.05);border-radius:3px;
  padding:4px 8px;display:flex;gap:4px;align-items:flex-start;line-height:1.4;
}
.footnote-badge sup{color:var(--seal);font-weight:700;margin-right:1px;}
.footnote-badge .fn-del{margin-left:auto;color:var(--ink-soft);cursor:pointer;opacity:.6;flex:0 0 auto;}
.footnote-badge .fn-del:hover{opacity:1;color:var(--seal);}
.tongdian-note{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.archive-cat-row{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.gis-stub{
  border:1px dashed var(--rule);border-radius:4px;padding:8px 10px;font-size:11.5px;color:var(--ink-soft);
  margin-top:6px;
}
.rank-notice{
  border-left:3px solid var(--shu);background:rgba(75,107,75,.08);padding:8px 10px;
  margin:6px 0 10px;font-size:12px;line-height:1.55;color:var(--ink-soft);
}
.person-toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0;}
.person-toolbar .tip{font-size:11px;color:var(--ink-soft);}
.person-card{
  border:1px solid var(--rule);border-radius:6px;background:rgba(255,255,255,.46);
  padding:10px;margin-bottom:10px;
}
.person-card-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.portrait-box{
  width:64px;height:82px;flex:0 0 auto;border:1px solid var(--rule);border-radius:4px;
  background:#EEE7D6;overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);font-size:11px;text-align:center;
}
.portrait-box img{width:100%;height:100%;object-fit:cover;display:block;}
.person-card-title{flex:1;min-width:0;}
.person-card-actions{display:flex;gap:4px;align-items:center;margin-top:6px;}
.year-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.portrait-source{font-size:10.5px;color:var(--ink-soft);line-height:1.45;margin-top:5px;}
.summary-head{
  padding:10px 12px;margin-bottom:12px;background:rgba(43,38,34,.05);border-radius:5px;
  font-size:12px;color:var(--ink-soft);line-height:1.6;
}
.official-card{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--rule);}
.official-portrait{
  width:70px;height:92px;flex:0 0 auto;border-radius:5px;overflow:hidden;background:#E7DFCD;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;text-align:center;
}
.official-portrait img{width:100%;height:100%;object-fit:cover;}
.official-info{flex:1;min-width:0;}
.official-name{font:700 16px 'Noto Serif SC','Songti SC',serif;margin-bottom:5px;}
.appointment-line{font-size:12px;line-height:1.55;margin-bottom:4px;}
.appointment-line .office{font-weight:600;color:var(--seal);}
.appointment-line .period{color:var(--ink-soft);}
.summary-empty{padding:50px 20px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.7;}
.filter-bar{
  display:flex;align-items:center;gap:7px;padding:7px 12px;border-bottom:1px solid var(--rule);
  background:rgba(246,241,228,.88);flex-wrap:wrap;
}
.filter-bar .search-box{width:220px;}
.filter-bar .compact-select{width:128px;}
.filter-tag{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.timeline-bar{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  padding:4px 16px;background:rgba(43,38,34,.035);border-bottom:1px dashed var(--rule);font-size:12px;
}
.timeline-bar .el-slider{margin:0 8px;}
.search-summary{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
.search-result{
  padding:10px 12px;margin-bottom:7px;border:1px solid var(--rule);border-radius:5px;
  background:rgba(255,255,255,.48);cursor:pointer;transition:.12s;
}
.search-result:hover{border-color:var(--seal);transform:translateY(-1px);}
.search-result .title{font:700 14px 'Noto Serif SC','Songti SC',serif;display:flex;align-items:center;gap:7px;}
.search-result .meta{font-size:11px;color:var(--ink-soft);margin-top:4px;}
.search-result .excerpt{font-size:12px;line-height:1.5;margin-top:5px;overflow-wrap:anywhere;}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.metric-card{border:1px solid var(--rule);border-radius:5px;padding:9px;background:rgba(255,255,255,.48);}
.metric-card .value{font:700 20px 'Noto Serif SC','Songti SC',serif;color:var(--seal);}
.metric-card .label{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.batch-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;height:calc(100vh - 120px);}
.compare-column{border:1px solid var(--rule);border-radius:6px;overflow:auto;background:rgba(255,255,255,.42);}
.compare-head{position:sticky;top:0;z-index:1;padding:10px 12px;color:white;font:700 15px 'Noto Serif SC',serif;}
.compare-node{font-size:12px;line-height:1.65;border-bottom:1px dashed rgba(43,38,34,.08);padding-right:8px;}
.archive-row{padding:10px 0;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px;}
.archive-info{flex:1;min-width:0;}
.archive-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.archive-time{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.form-inline-note{font-size:11px;color:var(--ink-soft);line-height:1.55;margin-top:5px;}
.warning-inline{padding:7px 9px;border-left:3px solid var(--gold);background:rgba(176,141,63,.09);font-size:11.5px;line-height:1.5;margin:6px 0;}
.toolbar-count{font-size:10px;line-height:16px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--seal);color:white;text-align:center;position:absolute;margin:0 0 24px 24px;}
.palette-row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;}
.person-link{cursor:pointer;color:var(--seal);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
.profile-portrait{width:100px;height:132px;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:#E7DFCD;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;}
.profile-portrait img{width:100%;height:100%;object-fit:cover;}

/* ---------- 2026 简约模块化界面 ---------- */
:root{
  --paper:#F4F3EF;
  --card:#FFFFFF;
  --ink:#202420;
  --ink-soft:#6F756F;
  --rule:#E2E4DF;
  --seal:#8D3D32;
  --gold:#A78345;
}
body{background:#F4F3EF;}
.topbar{
  height:68px;padding:0 18px;gap:14px;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--rule);box-shadow:0 4px 18px rgba(25,32,25,.035);
}
.seal-mark{width:36px;height:36px;border-radius:10px;box-shadow:none;}
.brand{min-width:138px;margin-right:2px;}
.brand .t1{font-size:17px;letter-spacing:2px;}
.brand .t2{font-size:10.5px;letter-spacing:.2px;}
.module-nav{display:flex;align-items:center;gap:5px;padding:4px;background:#F2F3F0;border-radius:11px;flex:0 0 auto;}
.module-tab{height:42px;min-width:82px;padding:4px 12px;border:0;border-radius:8px;background:transparent;color:var(--ink-soft);cursor:pointer;transition:.16s;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.05;}
.module-tab strong{font-size:13px;font-weight:650;letter-spacing:.6px;}
.module-tab small{font-size:9px;margin-top:4px;color:#979D97;letter-spacing:.3px;}
.module-tab:hover{color:var(--ink);background:rgba(255,255,255,.6);}
.module-tab.active{color:var(--ink);background:#fff;box-shadow:0 1px 5px rgba(27,34,27,.08);font-weight:600;}
.module-tab.active small{color:var(--seal);}
.module-tab.pending{color:#A3A8A2;}
.module-dot{display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:#B8BCB7;vertical-align:1px;}
.module-context{flex:1;min-width:0;color:var(--ink-soft);font-size:12px;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.faction-tabs{gap:4px;padding-left:4px;}
.faction-tab{padding:6px 11px;border-radius:8px;}
.topbar-actions{gap:6px;}
.left-toolbar{width:54px;background:#FAFAF8;border-right:1px solid var(--rule);padding:9px 0;gap:4px;}
.tool-btn{width:36px;height:36px;border-radius:9px;font-size:15px;color:#555C55;}
.tool-btn:hover{background:#ECEEEA;border-color:transparent;}
.canvas-wrap{background:radial-gradient(circle at 1px 1px,rgba(32,36,32,.055) 1px,transparent 0) 0 0/24px 24px,#F5F4F1;}
.canvas-tabs,.filter-bar{background:rgba(255,255,255,.9);}
.canvas-tabs{min-height:46px;padding:7px 14px;gap:7px;overflow-x:auto;scrollbar-width:thin;white-space:nowrap;}
.mini-tab{padding:5px 11px;border-radius:8px;border:1px solid transparent;background:#F1F2EF;}
.mini-tab:hover{color:var(--ink);}
.mini-tab.active{background:#262B26;color:white;border-color:#262B26;}
.filter-bar{padding:8px 14px;}
.timeline-bar{background:rgba(255,255,255,.72);border-bottom:1px solid var(--rule);padding:5px 16px;}
.right-panel{width:360px;background:#FFFFFF;border-left:1px solid var(--rule);}
.panel-head{padding:16px 18px 12px;}
.panel-body{padding:14px 18px 30px;}
.statusbar{height:30px;background:#292E29;}
.classification-strip{display:flex;flex-direction:column;gap:7px;padding:9px 14px 10px;border-bottom:1px solid var(--rule);background:#FBFBF9;}
.office-group-nav{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:thin;}
.group-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--rule);border-radius:999px;background:#fff;color:#596059;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap;}
.group-pill:hover{border-color:#B9BDB7;color:var(--ink);}
.group-pill.active{color:#fff;box-shadow:0 3px 10px rgba(30,37,30,.10);}
.group-pill b{font-size:10px;font-weight:600;opacity:.85;margin-left:1px;}
.group-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.office-sub-nav{display:flex;align-items:center;gap:6px;padding-left:2px;overflow-x:auto;scrollbar-width:thin;}
.sub-pill{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px;border:1px solid #E2E4DF;border-radius:8px;background:#FAFAF8;color:#707870;font-size:11px;cursor:pointer;transition:.14s;white-space:nowrap;}
.sub-pill:hover{background:#F1F3EF;color:#333D35;}
.sub-pill.active{background:#262B26;border-color:#262B26;color:#fff;font-weight:600;}
.sub-pill b{font-size:9.5px;font-weight:600;opacity:.8;}
.seg-tabs{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;}
.tab-sep{width:1px;height:22px;background:var(--rule);margin:0 7px;flex:0 0 auto;}
.view-tools{flex:0 0 auto;}
.class-label{font-size:11px;color:var(--ink-soft);white-space:nowrap;margin-right:2px;}
.class-chip{border:1px solid var(--rule);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;color:#596059;cursor:pointer;white-space:nowrap;transition:.15s;}
.class-chip:hover{border-color:#B9BDB7;color:var(--ink);}
.class-chip.active{background:#E9EEE9;border-color:#879687;color:#334033;font-weight:600;}
.class-chip b{font-size:10px;margin-left:5px;color:#8A918A;font-weight:500;}
.office-table-wrap{flex:1;min-height:0;padding:14px;background:#F5F4F1;overflow:auto;}
.office-table-card{height:100%;background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(30,37,30,.035);}
.office-table-card .el-table{height:100%;--el-table-header-bg-color:#F7F8F5;--el-table-row-hover-bg-color:#F2F5F1;}
.scope-pill{display:inline-flex;align-items:center;border-radius:7px;padding:3px 7px;font-size:11px;background:#EDF1ED;color:#4D5E4D;}
.scope-pill.local{background:#F2ECE5;color:#795A3A;}
.catalog-workbench{flex:1;min-height:0;display:grid;grid-template-columns:286px minmax(0,1fr);background:#F5F4F1;overflow:hidden;}
.catalog-hierarchy{min-height:0;display:flex;flex-direction:column;background:#FBFBF9;border-right:1px solid var(--rule);}
.catalog-hierarchy-head{padding:16px 16px 12px;border-bottom:1px solid var(--rule);}
.catalog-hierarchy-head strong{display:block;font:700 16px 'Noto Serif SC','Songti SC',serif;color:#303630;}
.catalog-hierarchy-head span{display:block;margin-top:4px;font-size:11px;color:var(--ink-soft);line-height:1.5;}
.catalog-tree-scroll{flex:1;min-height:0;overflow:auto;padding:9px 8px 18px;}
.catalog-tree-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;min-height:36px;margin:2px 0;padding:4px 7px 4px calc(7px + var(--depth,0)*15px);border:1px solid transparent;border-radius:9px;color:#525A52;cursor:pointer;transition:.14s;}
.catalog-tree-row:hover{background:#F0F2EE;color:#2D352E;}
.catalog-tree-row.active{background:#E7ECE6;border-color:#B7C2B5;color:#263226;box-shadow:inset 3px 0 #6E806C;}
.catalog-tree-toggle{width:20px;height:20px;display:grid;place-items:center;border:0;background:transparent;color:#8A918A;cursor:pointer;border-radius:5px;font-size:12px;}
.catalog-tree-toggle:hover{background:#fff;color:#394239;}
.catalog-tree-toggle.empty{visibility:hidden;}
.catalog-tree-name{min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.catalog-tree-row.root .catalog-tree-name{font-family:'Noto Serif SC','Songti SC',serif;font-weight:700;letter-spacing:.5px;}
.catalog-tree-count{min-width:22px;padding:2px 6px;border-radius:10px;background:#EEF0ED;color:#858C85;font-size:10px;text-align:center;}
.catalog-content{min-width:0;min-height:0;overflow:auto;padding:20px 22px 34px;background:linear-gradient(180deg,#F9F8F5 0,#F3F2EE 100%);}
.catalog-content-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:15px;padding-bottom:13px;border-bottom:1px solid var(--rule);}
.catalog-breadcrumb{font-size:10.5px;color:#8A918A;letter-spacing:.4px;margin-bottom:5px;}
.catalog-content-head h2{margin:0;font:700 22px 'Noto Serif SC','Songti SC',serif;color:#2D342E;letter-spacing:1px;}
.catalog-content-head p{margin:5px 0 0;font-size:12px;color:var(--ink-soft);}
.catalog-count-seal{flex:0 0 auto;min-width:58px;height:58px;border:1px solid #C9BFA5;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#6E756E;box-shadow:0 4px 14px rgba(30,37,30,.045);}
.catalog-count-seal strong{font:700 18px 'Noto Serif SC','Songti SC',serif;line-height:1;}
.catalog-count-seal span{margin-top:4px;font-size:9px;letter-spacing:1px;}
.catalog-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px;align-items:start;}
.catalog-card{position:relative;min-height:154px;padding:16px;border:1px solid #D7D9D3;border-radius:13px;background:rgba(255,255,255,.94);box-shadow:0 7px 22px rgba(31,38,31,.035);cursor:pointer;transition:.16s;overflow:hidden;}
.catalog-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--catalog-accent,#687568);opacity:.78;}
.catalog-card:hover{transform:translateY(-2px);border-color:#B9C0B7;box-shadow:0 12px 25px rgba(31,38,31,.075);}
.catalog-card.selected{border-color:var(--catalog-accent,#687568);box-shadow:inset 0 0 0 1px var(--catalog-accent,#687568),0 10px 24px rgba(31,38,31,.065);}
.catalog-card-top{display:flex;align-items:flex-start;gap:10px;}
.catalog-card-icon{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px;background:color-mix(in srgb,var(--catalog-accent,#687568) 10%,#fff);color:var(--catalog-accent,#687568);font:700 13px 'Noto Serif SC','Songti SC',serif;}
.catalog-card-title{min-width:0;flex:1;}
.catalog-card-title h3{margin:0;font:700 16px 'Noto Serif SC','Songti SC',serif;color:#2E352F;line-height:1.35;overflow-wrap:anywhere;}
.catalog-card-title p{margin:4px 0 0;font-size:10.5px;color:#8A918A;line-height:1.45;}
.catalog-group-pill{flex:0 0 auto;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:650;white-space:nowrap;}
.catalog-card-badges{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 9px;}
.catalog-card-badge{padding:3px 7px;border-radius:7px;background:#F0F2EF;color:#697169;font-size:10.5px;}
.catalog-card-badge.special{background:#F5EEE6;color:#85613C;}
.catalog-card-duty{min-height:34px;margin:0 0 10px;font-size:11.5px;line-height:1.55;color:#656C65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.catalog-people{display:flex;flex-wrap:wrap;gap:6px;padding-top:9px;border-top:1px dashed #D9DBD6;}
.catalog-person-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:4px 8px 4px 5px;border:1px solid #E1E3DE;border-radius:14px;background:#FAFBF9;color:#4D564D;font-size:10.5px;cursor:pointer;}
.catalog-person-chip:hover{border-color:#AEB8AC;color:#2F3C30;background:#F0F4EF;}
.catalog-person-avatar{width:18px;height:18px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#E6EAE4;color:#667066;font:700 9px 'Noto Serif SC','Songti SC',serif;}
.catalog-person-avatar img{width:100%;height:100%;object-fit:cover;}
.catalog-no-people{font-size:10.5px;color:#A0A59F;}
.catalog-empty{grid-column:1/-1;padding:65px 20px;text-align:center;color:#8A918A;font-size:12.5px;line-height:1.7;}
.module-page{flex:1;min-height:0;overflow:auto;padding:24px 28px 34px;background:#F4F3EF;}
.module-page-inner{max-width:1380px;margin:0 auto;}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px;}
.page-kicker{font-size:11px;color:#8A918A;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:6px;}
.page-heading h1{font:700 25px 'Noto Serif SC','Songti SC',serif;margin:0;color:var(--ink);letter-spacing:1px;}
.page-heading p{margin:7px 0 0;color:var(--ink-soft);font-size:13px;}
.fangzhen-toolbar{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding:12px;background:#fff;border:1px solid var(--rule);border-radius:12px;}
.period-switch{display:flex;gap:4px;padding:3px;background:#F1F2EF;border-radius:9px;}
.period-switch button{border:0;background:transparent;padding:7px 13px;border-radius:7px;color:var(--ink-soft);cursor:pointer;}
.period-switch button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(30,37,30,.08);}
.fangzhen-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;}
.fz-metric{background:#fff;border:1px solid var(--rule);border-radius:11px;padding:13px 15px;}
.fz-metric strong{display:block;font:700 22px 'Noto Serif SC','Songti SC',serif;color:#394239;}
.fz-metric span{font-size:11px;color:var(--ink-soft);}
.fangzhen-table-card{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(30,37,30,.035);}
.fz-person{font-weight:650;color:#303630;}
.fz-title{font-size:12px;color:#687068;margin-top:3px;}
.source-link{color:#5E735E;text-decoration:none;border-bottom:1px dotted #8E9C8E;}
.source-link:hover{color:#2E4D2E;}
.history-map-page{padding:16px 20px 20px;display:flex;flex-direction:column;overflow:hidden;background:#F4F3EF;}
.battle-timebar{flex:0 0 auto;background:#fff;border:1px solid var(--rule);border-radius:13px;padding:11px 13px 10px;margin-bottom:12px;box-shadow:0 6px 22px rgba(30,37,30,.035);}
.battle-time-head{display:flex;align-items:center;gap:12px;margin-bottom:9px;}
.battle-time-title{min-width:220px;display:flex;align-items:baseline;gap:10px;}
.battle-time-title .eyebrow{font-size:10.5px;color:#8A918A;letter-spacing:1px;}
.battle-time-title strong{font:700 18px 'Noto Serif SC','Songti SC',serif;color:var(--ink);}
.battle-time-title span{font-size:12px;color:var(--seal);font-weight:600;}
.battle-time-summary{flex:1;min-width:0;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.map-play-controls{display:flex;gap:5px;}
.map-play-btn{width:32px;height:30px;border:1px solid var(--rule);border-radius:8px;background:#F7F8F5;color:#4F564F;cursor:pointer;display:grid;place-items:center;}
.map-play-btn:hover{background:#ECEFEA;color:var(--ink);}
.map-play-btn.playing{background:#8D3D32;color:white;border-color:#8D3D32;}
.battle-timeline-scroll{overflow-x:auto;padding-bottom:1px;}
.battle-era-track{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:6px;min-width:0;margin-bottom:6px;}
.battle-era-segment{height:24px;border:0;border-radius:7px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--era-color) 10%,#fff);color:var(--era-color);font-size:10.5px;letter-spacing:1px;cursor:pointer;box-shadow:inset 0 -1px color-mix(in srgb,var(--era-color) 28%,transparent);}
.battle-era-segment strong{font:650 11.5px 'Noto Serif SC','Songti SC',serif;}
.battle-era-segment span{opacity:.72;letter-spacing:0;}
.battle-era-segment.active{background:var(--era-color);color:#fff;box-shadow:0 2px 7px color-mix(in srgb,var(--era-color) 23%,transparent);}
.battle-period-track{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:6px;min-width:0;}
.battle-period{position:relative;border:1px solid var(--rule);border-radius:9px;background:#FAFAF8;padding:7px 9px;text-align:left;cursor:pointer;color:#626862;min-width:0;transition:.15s;}
.battle-period:hover{border-color:#AEB5AD;background:#F4F6F2;}
.battle-period.active{background:#EFF3EE;border-color:#809080;color:#2F3D2F;box-shadow:inset 0 0 0 1px #A9B5A8;}
.battle-period.past:before{content:'';position:absolute;left:9px;right:9px;top:-1px;height:2px;background:#A78345;}
.battle-period b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.battle-period span{display:block;font-size:10.5px;color:#8B918B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.history-map-stage{position:relative;flex:1;min-height:0;border:1px solid var(--rule);border-radius:13px;overflow:hidden;background:#E8E3D7;box-shadow:0 10px 28px rgba(30,37,30,.06);}
.history-map-frame{display:block;width:100%;height:100%;border:0;background:#E8E3D7;}
.map-loading{position:absolute;inset:0;display:grid;place-items:center;background:#F2F1ED;color:#858B85;font-size:13px;letter-spacing:1px;z-index:2;}
.map-link-card{position:absolute;left:50%;bottom:16px;z-index:4;width:min(620px,calc(100% - 390px));transform:translateX(-50%);padding:12px 14px;border:1px solid rgba(126,133,125,.45);border-radius:12px;background:rgba(255,255,255,.96);box-shadow:0 10px 28px rgba(30,37,30,.16);backdrop-filter:blur(8px);}
.map-link-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;}.map-link-head strong{font:700 16px 'Noto Serif SC','Songti SC',serif;color:#2E352F;}.map-link-head span{font-size:11px;color:#8A918A;}.map-link-head button{margin-left:auto;border:0;background:transparent;color:#8A918A;cursor:pointer;font-size:18px;}
.map-link-records{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0;}.map-link-person{display:inline-flex;gap:5px;align-items:center;padding:4px 8px;border:1px solid #DDE1DB;border-radius:999px;background:#F7F8F5;color:#485148;font-size:11px;cursor:pointer;}.map-link-person:hover{border-color:#9EAA9C;background:#EFF3EE;}
.map-link-actions{display:flex;align-items:center;gap:7px;}.map-link-empty{font-size:11.5px;color:#858B85;line-height:1.55;}
.research-status{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#F4EFE4;color:#785D2F;font-size:10.5px;}.research-status.certain{background:#EAF3EC;color:#386046;}.research-status.doubt{background:#F7EDEA;color:#8A443A;}
.evidence-card{padding:15px;border:1px solid var(--rule);border-radius:11px;background:#FAFAF8;}.evidence-title{font:700 17px 'Noto Serif SC','Songti SC',serif;color:#303630;}.evidence-meta{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 13px;color:#737A73;font-size:11px;}.evidence-excerpt{padding:12px;border-left:3px solid #A78345;border-radius:5px;background:#F6F1E7;color:#544F47;font:13px/1.8 'Noto Serif SC','Songti SC',serif;white-space:pre-wrap;}.evidence-note{margin-top:12px;color:#6C736C;font-size:12px;line-height:1.7;}
.map-audit-btn{border:1px solid #D7DCD6;border-radius:999px;background:#F7F8F5;color:#536153;padding:5px 10px;font-size:11px;cursor:pointer;white-space:nowrap;}.map-audit-btn:hover{border-color:#9EAA9C;background:#EFF3EE;color:#304A35;}
.audit-drawer{color:#4D554D;font-size:12px;line-height:1.65;}.audit-focus{padding:12px 13px;margin-bottom:14px;border:1px solid #D7DCD6;border-radius:11px;background:#F7F8F5;}.audit-focus-title{display:flex;align-items:center;gap:8px;font:700 16px 'Noto Serif SC','Songti SC',serif;color:#303A31;}.audit-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px;}.audit-metric{padding:9px 8px;border:1px solid #E1E4DE;border-radius:9px;background:#FAFBF9;}.audit-metric .value{font:700 17px 'Noto Serif SC','Songti SC',serif;color:#303A31;}.audit-metric .label{font-size:10.5px;color:#858D85;margin-top:2px;}.audit-claim{padding:10px 11px;margin-bottom:8px;border:1px solid #E3E5E0;border-radius:9px;background:#FFF;}.audit-claim-head{display:flex;align-items:center;gap:7px;margin-bottom:4px;}.audit-claim-head strong{font-family:'Noto Serif SC','Songti SC',serif;color:#3B463C;}.audit-claim p{margin:0;color:#5B645B;}.audit-source-list{display:flex;flex-direction:column;gap:6px;}.audit-source-row{padding:8px 9px;border:1px solid #E3E5E0;border-radius:8px;background:#FAFAF8;}.audit-source-row b{color:#4B5D4B;}.audit-source-row small{display:block;color:#8A918A;margin-top:1px;}.audit-note{padding:10px 11px;border-left:3px solid #A78345;border-radius:5px;background:#F6F1E7;color:#6A6459;margin-top:12px;}
.research-note{font-size:11.5px;color:var(--ink-soft);padding:10px 13px;border-top:1px solid var(--rule);background:#FAFAF8;}
.fangzhen-workbench{--fz-accent:#59635B;--fz-pale:#EEF1EE;--fz-deep:#29322B;background:linear-gradient(180deg,var(--fz-pale) 0,#F4F3EF 300px);transition:background .2s;}
.fangzhen-archive-tabs{display:grid;grid-template-columns:repeat(6,minmax(145px,1fr));gap:9px;margin-bottom:14px;}
.fz-archive-button{--archive-color:#59635B;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;min-height:66px;padding:10px 11px;border:1px solid var(--rule);border-radius:12px;background:#fff;color:#596059;text-align:left;cursor:pointer;transition:.16s;box-shadow:0 4px 14px rgba(30,37,30,.025);}
.fz-archive-button:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--archive-color) 42%,#fff);box-shadow:0 8px 18px rgba(30,37,30,.055);}
.fz-archive-button.active{border-color:var(--archive-color);box-shadow:inset 0 0 0 1px var(--archive-color),0 8px 18px rgba(30,37,30,.07);}
.fz-archive-seal{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--archive-color) 11%,#fff);color:var(--archive-color);font:700 17px 'Noto Serif SC','Songti SC',serif;}
.fz-archive-button.active .fz-archive-seal{background:var(--archive-color);color:#fff;}
.fz-archive-copy{min-width:0;}
.fz-archive-copy strong{display:block;color:#333A34;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fz-archive-copy small{display:block;margin-top:3px;color:#8B918B;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fz-archive-count{min-width:27px;height:22px;padding:0 7px;border-radius:11px;display:grid;place-items:center;background:#F0F2EF;color:#737A73;font-size:10.5px;}
.fz-archive-button.active .fz-archive-count{background:color-mix(in srgb,var(--archive-color) 13%,#fff);color:var(--archive-color);font-weight:700;}
.fangzhen-workbench .page-heading h1,.fangzhen-workbench .fz-metric strong{color:var(--fz-deep);}
.fangzhen-workbench .page-kicker{color:var(--fz-accent);}
.fangzhen-workbench .fz-metric{border-top:2px solid color-mix(in srgb,var(--fz-accent) 58%,#fff);}
.fangzhen-workbench .fangzhen-toolbar,.fangzhen-workbench .fangzhen-table-card{border-color:color-mix(in srgb,var(--fz-accent) 20%,var(--rule));}
.fangzhen-workbench .fangzhen-table-card .el-table{--el-table-header-bg-color:var(--fz-pale);--el-table-row-hover-bg-color:var(--fz-pale);}
.fangzhen-workbench .page-heading .el-button--primary{--el-button-bg-color:var(--fz-accent);--el-button-border-color:var(--fz-accent);--el-button-hover-bg-color:color-mix(in srgb,var(--fz-accent) 86%,#fff);--el-button-hover-border-color:var(--fz-accent);}
.fangzhen-context{display:flex;align-items:center;gap:9px;margin-bottom:13px;padding:10px 13px;border-left:3px solid var(--fz-accent);border-radius:8px;background:var(--fz-pale);color:#657067;font-size:11.5px;}
.fangzhen-context strong{color:var(--fz-deep);font-size:12.5px;}
.fz-type-pill{display:inline-flex;align-items:center;padding:3px 7px;border-radius:7px;background:var(--fz-pale);color:var(--fz-accent);font-size:10.5px;font-weight:650;white-space:nowrap;}
.fz-polity-badge{display:inline-flex;min-width:38px;justify-content:center;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:650;}
.fz-polity-wei{background:#EAF2F8;color:#315F8D}.fz-polity-shu{background:#F8ECE9;color:#91372E}.fz-polity-wu{background:#EAF3ED;color:#356A49}.fz-polity-jin{background:#F0ECF7;color:#604C8D}
.fangzhen-table-card .el-table__row.fz-row-wei:hover>td.el-table__cell{background:#F2F7FB!important;}
.fangzhen-table-card .el-table__row.fz-row-shu:hover>td.el-table__cell{background:#FCF5F3!important;}
.fangzhen-table-card .el-table__row.fz-row-wu:hover>td.el-table__cell{background:#F2F8F4!important;}
.fangzhen-table-card .el-table__row.fz-row-jin:hover>td.el-table__cell{background:#F7F4FB!important;}
/* ---------- 人物志 ---------- */
.people-workbench{--people-accent:#8D3D32;--people-pale:#F7F0EA;--people-deep:#5F2E26;background:linear-gradient(180deg,var(--people-pale) 0,#F4F3EF 320px);}
.people-workbench .page-heading h1{color:var(--people-deep);}
.people-workbench .page-kicker{color:var(--people-accent);}
.people-toolbar{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding:12px;background:#fff;border:1px solid var(--rule);border-radius:12px;flex-wrap:wrap;}
.people-toolbar .el-input{max-width:360px;}
.people-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px;}
.people-metric{background:#fff;border:1px solid var(--rule);border-top:2px solid color-mix(in srgb,var(--people-accent) 55%,#fff);border-radius:11px;padding:13px 15px;}
.people-metric strong{display:block;font:700 22px 'Noto Serif SC','Songti SC',serif;color:var(--people-deep);}
.people-metric span{font-size:11px;color:var(--ink-soft);}
.person-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;}
.person-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--rule);border-radius:12px;background:#fff;cursor:pointer;transition:.16s;box-shadow:0 5px 16px rgba(30,37,30,.03);}
.person-card:hover{transform:translateY(-2px);border-color:#C9B39F;box-shadow:0 10px 22px rgba(30,37,30,.07);}
.person-avatar{width:58px;height:74px;flex:0 0 auto;border:1px solid #D8D4CA;border-radius:7px;overflow:hidden;background:#EDE4D4;display:grid;place-items:center;color:#A29A89;font:700 18px 'Noto Serif SC','Songti SC',serif;}
.person-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.person-card-body{min-width:0;flex:1;}
.person-card-name{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
.person-card-name strong{font:700 16px 'Noto Serif SC','Songti SC',serif;color:#2D342E;}
.person-card-name span{font-size:11px;color:#8A918A;}
.person-card-badges,.people-detail-tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0;}
.person-pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:7px;background:#F1F2EF;color:#606960;font-size:10px;white-space:nowrap;}
.person-pill.office{background:#EAF2F8;color:#315F8D;}
.person-pill.noble{background:#F6EFE3;color:#8A6B35;}
.person-pill.fangzhen{background:#EAF3ED;color:#356A49;}
.person-pill.han{background:#F8ECE9;color:#91372E;}
.person-pill.wei{background:#EAF2F8;color:#315F8D;}
.person-pill.wu{background:#EAF3ED;color:#356A49;}
.person-pill.jin{background:#F0ECF7;color:#604C8D;}
.person-pill.tribal{background:#EFF0EA;color:#6B6F5B;}
.person-card-meta{font-size:10.5px;color:#8A918A;line-height:1.55;}
.person-card-meta b{color:#5E665E;font-weight:650;}

function buildWeiArchiveRecords(type, groups){
  const sourceUrl = type==='cishi' ? WEI_CISHI_SOURCE : WEI_DUDU_SOURCE;
  const sourceTitle = type==='cishi' ? '维基百科：曹魏刺史列表' : '维基百科：曹魏都督列表';
  const rows=[];
  groups.forEach((group,groupIndex)=>{
    group.entries.forEach((entry,entryIndex)=>{
      const years=(String(entry[1]||'').match(/(?:1|2)\d{2}(?=年)/g)||[]).map(Number);
      rows.push({
        id:'wei_'+type+'_'+groupIndex+'_'+entryIndex,
        type, region:group.region, office:group.office,
        name:entry[0], tenure:entry[1], note:entry[2]||'',
        startYear:years.length?years[0]:null,
        endYear:years.length?years[years.length-1]:null,
        sourceTitle, sourceUrl,
      });
    });
  });
  return rows;
}

    for(var i=1;i<points.length-1;i+=1){

      var dx=point[0]-previous[0];
      var dy=point[1]-previous[1];
      if(dx*dx+dy*dy>=sqTolerance){

        previous=point;
      }

    result.push(points[points.length-1]);

    }
    return {type:'MultiPolygon',coordinates:geometry.coordinates.map(function(polygon){

     * 郡界必须保留底稿中的共享顶点，才能在合并后真正消除内部线。
     * 先做 6km 简化会让相邻多边形各自丢掉不同顶点，导致共享边无法配对；

<script>
/* 州、郡同国同系分色；两套郡界互斥，避免跨时期切换时残留叠线。 */
(function(){
  var TONES=['#F2E6D2','#DCE7DF','#E5E0ED','#ECDDD8','#DFE5CF','#D9E6EA','#EADFC8'];
  function rgb(hex){
    var value=String(hex||'#6c675e').replace('#','');
    if(value.length===3) value=value.split('').map(function(c){return c+c;}).join('');
    return [parseInt(value.slice(0,2),16),parseInt(value.slice(2,4),16),parseInt(value.slice(4,6),16)];
  }
  function mix(a,b,ratio){
    var one=rgb(a),two=rgb(b);
    var out=one.map(function(value,index){return Math.round(value*(1-ratio)+two[index]*ratio);});
    return '#'+out.map(function(value){return value.toString(16).padStart(2,'0');}).join('');
  }
  function hash(value){
    return Array.from(String(value||'')).reduce(function(total,char){return (total*31+char.charCodeAt(0))>>>0;},7);
  }
  function historicalColor(feature,factionId,level){
    var faction=FACTIONS[factionId]||FACTIONS[feature.kingdom]||{color:'#746c60'};
    if(window.__provinceTintEnabled===false) return faction.color;
    var rawKey=String(feature.key||'').replace(/_(wei|wu)$/,'');
    var stateKeys={'司隶':'sili','司州':'sili','并州':'bingzhou','冀州':'jizhou','兖州':'yanzhou','豫州':'yuzhou','青州':'qingzhou','徐州':'xuzhou','扬州':'yangzhou','荆州':'jingzhou','益州':'yizhou','梁州':'liang_state','凉州':'liangzhou','雍州':'yongzhou','秦州':'qinzhou','幽州':'youzhou','平州':'pingzhou','交州':'jiaozhou','广州':'guangzhou','宁州':'ningzhou'};
    var stateKey=level==='commandery'?(stateKeys[feature.state]||rawKey):(rawKey==='jing'?'jingzhou':rawKey==='yang'?'yangzhou':rawKey);
    var stateTone=(window.PROVINCE_COLOR_PALETTE||{})[stateKey]||TONES[hash(feature.state||feature.key)%TONES.length];
    var color=level==='province'?mix(stateTone,faction.color,.58):mix(stateTone,faction.color,.68);
    if(level==='commandery'){
      color=mix(color,TONES[hash(feature.key)%TONES.length],.04);
    }
    return color;
  }
  var labelLayoutTimer=0;
  function overlaps(a,b,padding){
    return !(a.right+padding<b.left||a.left-padding>b.right||a.bottom+padding<b.top||a.top-padding>b.bottom);
  }
  function declutterLabels(){
    var countries=Array.from(document.querySelectorAll('.faction-label'));
    var provinces=Array.from(document.querySelectorAll('.province-label'));
    var commanderies=Array.from(document.querySelectorAll('.cmd-label'));
    var app=document.getElementById('app');
    var compact=!!(app&&app.classList.contains('zoom-lte-5'));
    var tiny=!!(app&&app.classList.contains('zoom-lte-4'));
    var all=countries.concat(provinces,commanderies);
    all.forEach(function(label){label.style.visibility='visible';});
    var accepted=[];
    // 先固定州名，再让势力大字与郡名避开，避免国号压住行政信息。
    provinces.forEach(function(label){
      var rect=label.getBoundingClientRect();
      if(rect.width&&rect.height) accepted.push(rect);
    });
    countries.forEach(function(label){
      var span=label.querySelector('span');
      if(!span) return;
      span.style.setProperty('--cmd-shift-y','0px');
      var base=span.getBoundingClientRect();
      var candidates=[0,-38,38,-76,76,-114,114];
      var selected=0;
      for(var i=0;i<candidates.length;i++){
        var shift=candidates[i];
        var candidate={left:base.left,right:base.right,top:base.top+shift,bottom:base.bottom+shift};
        if(!accepted.some(function(rect){return overlaps(candidate,rect,4);})){selected=shift;break;}
      }
      span.style.setProperty('--cmd-shift-y',selected+'px');
      var chosen=span.getBoundingClientRect();
      accepted.push(chosen);
    });
    // V10：郡名是行政信息本身，不再用碰撞避让把它隐藏。
    // 缩略视图只对文字做有限的上下错位，保留每一个郡块的名称，同时避免
    // 河内—魏郡、巴—巴西等相邻小郡的文字完全叠成一团。
    var visibleCommanderies=commanderies.filter(function(label){
      var rect=label.getBoundingClientRect();
      return rect.width&&rect.height;
    }).sort(function(a,b){
      var ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
      return ar.top-br.top||ar.left-br.left;
    });
    visibleCommanderies.forEach(function(label){
      var span=label.querySelector('span');
      if(!span) return;
      label.classList.toggle('cmd-label-compact',compact);
      label.classList.toggle('cmd-label-tiny',tiny);
      label.style.visibility='visible';
      label.style.zIndex=compact?'640':'650';
      span.style.setProperty('--cmd-shift-y','0px');
      var base=span.getBoundingClientRect();
      var candidates=compact?[0,-8,8,-16,16,-24,24,-34,34]:[0,-10,10,-20,20,-32,32,-46,46];
      var selected=0;
      for(var i=0;i<candidates.length;i++){
        var shift=candidates[i];
        var candidate={left:base.left,right:base.right,top:base.top+shift,bottom:base.bottom+shift};
        if(!accepted.some(function(rect){return overlaps(candidate,rect,tiny?1:2);})){selected=shift;break;}
      }
      span.style.setProperty('--cmd-shift-y',selected+'px');
      var chosen=span.getBoundingClientRect();
      accepted.push(chosen);
    });
  }
  function scheduleLabelLayout(){
    clearTimeout(labelLayoutTimer);
    labelLayoutTimer=setTimeout(declutterLabels,90);
  }
  window.addEventListener('resize',scheduleLabelLayout);
  var mapApp=document.getElementById('app');
  if(mapApp && typeof mapApp.nodeType==='number'){
    new MutationObserver(scheduleLabelLayout).observe(mapApp,{attributes:true,attributeFilter:['class']});
  }
  var renderTerritories=Territories.render;
  Territories.render=function(map,features,mapping,opts){
    var result=renderTerritories.apply(Territories,arguments);
    requestAnimationFrame(function(){
      var all=Array.from(document.querySelectorAll('.territory'));
      var current=all.slice(-features.length);
      current.forEach(function(path,index){
        var feature=features[index];
        var factionId=(mapping&&mapping[feature.key])||feature.kingdom;
        path.style.setProperty('fill',historicalColor(feature,factionId,'province'),'important');
      });
      scheduleLabelLayout();
    });
    return result;
  };
  var renderWu=WuCommanderies.render;
  var renderGeneral=Commanderies.render;
  WuCommanderies.render=function(map,opts){
    Commanderies.hide();
    window.GEO_WU_COMMANDERIES_263=(window.GEO_WU_COMMANDERIES_263||[]).map(function(feature){
      return Object.assign({},feature,{color:historicalColor(feature,feature.kingdom,'commandery')});
    });
    var result=renderWu.call(WuCommanderies,map,opts);
    scheduleLabelLayout();
    return result;
  };
  Commanderies.render=function(map,data,opts){
    WuCommanderies.hide();
    var colored=(data||[]).map(function(feature){
      return Object.assign({},feature,{color:historicalColor(feature,feature.kingdom,'commandery')});
    });
    var result=renderGeneral.call(Commanderies,map,colored,opts);
    scheduleLabelLayout();
    return result;
  };
})();

      (confidenceLabels[confidenceLevel]||'待审')+'</span><span>政权 '+(confidenceLabels[confidence.polity]||'—')+

  { id:'sh_280_hu', year:280, polity:'西晋', category:'赋役制度', title:'户调式', detail:'户调按丁男之户岁输绢三匹、绵三斤，女子及次丁男减半；并定诸王公侯食邑。', sourceTitle:'《晋书》卷二十六·食货志', confidence:'确定' },
  { id:'sh_157_hukou', year:157, polity:'东汉', category:'户口与人口', title:'永寿户口', detail:'汉桓帝永寿三年，天下户 10,677,960，口 56,486,856，为汉末战乱前户口基准。', sourceTitle:'《晋书·地理志》《通典·食货典》《通志·食货志》', confidence:'确定' },
  { id:'sh_221_hukou', year:221, polity:'汉', category:'户口与人口', title:'章武户口', detail:'汉昭烈帝章武元年，蜀汉约 200,000 户、900,000 口。', sourceTitle:'《晋书·地理志》《通典·食货典》', confidence:'确定' },
  { id:'sh_242_hukou', year:242, polity:'吴', category:'户口与人口', title:'赤乌户口', detail:'吴大帝赤乌五年，孙吴约 523,000 户、2,400,000 口。', sourceTitle:'《晋书·地理志》', confidence:'确定' },
  { id:'sh_263_hukou_wei', year:263, polity:'魏', category:'户口与人口', title:'景元户口', detail:'魏陈留王景元四年，曹魏约 663,423 户、4,432,881 口（以《通典》数减蜀汉吴数推算）。', sourceTitle:'《通典·食货典》', confidence:'较高' },
  { id:'sh_263_hukou_shu', year:263, polity:'汉', category:'户口与人口', title:'炎兴户口', detail:'汉后主炎兴元年，蜀汉 280,000 户、940,000 口，为亡国时见存户口。', sourceTitle:'《通典·食货典》推算', confidence:'较高' },
  { id:'sh_263_hukou_wu', year:263, polity:'吴', category:'户口与人口', title:'永安户口', detail:'吴景帝永安六年，孙吴 530,000 户、3,240,000 口。', sourceTitle:'《通典·食货典》推算', confidence:'较高' },
  { id:'sh_280_hukou', year:280, polity:'西晋', category:'户口与人口', title:'太康户口', detail:'晋武帝太康元年，天下 2,459,804 户、16,163,863 口；《晋书》作 2,459,840 户。', sourceTitle:'《通典·食货典》《晋书·地理志》', confidence:'确定' },
  { id:'sh_190_hukou_shuai', year:190, polity:'汉', category:'户口与人口', title:'户口减耗总论', detail:'中国户口减耗盖在三国初期（汉献帝 189—220），主因杀戮、饥饿、瘟疫；北部减少率较高，南部及东北部较低。', sourceTitle:'《三国志札记》据《魏志》《晋书》汇证', confidence:'较高' },
  { id:'sh_205_zhangxiu', year:205, polity:'魏', category:'户口与人口', title:'张绣增邑', detail:'建安十年张绣复增邑凡二千户，诸将封千户者而绣特多，可见战乱后封户之少。', sourceTitle:'《魏志·张绣传》', confidence:'确定' },
  { id:'sh_195_caocao', year:195, polity:'魏', category:'户口与人口', title:'泗水之屠', detail:'兴平二年曹操坑杀男女数万口于泗水，又攻取虑、睢陵、夏丘诸县皆屠之，徐州户口大损。', sourceTitle:'《魏志·荀彧传》注引《曹瞒传》', confidence:'确定' },
  { id:'sh_217_dayi', year:217, polity:'魏', category:'户口与人口', title:'建安大疫', detail:'建安二十二年居巢大疫，司马朗遇疫卒，徐干、陈琳、刘桢一时俱逝；建安末人口因瘟疫再减。', sourceTitle:'《魏志·司马朗传》《魏志·王粲传》', confidence:'确定' },
  { id:'sh_231_shibing', year:231, polity:'汉', category:'劳动与役制', title:'蜀汉将士规模', detail:'建兴九年诸葛亮在祁山者八万人，合留守者不下十万人。', sourceTitle:'《蜀志·诸葛亮传》注引郭冲五事', confidence:'较高' },
  { id:'sh_253_wu_bing', year:253, polity:'吴', category:'劳动与役制', title:'吴发兵二十万', detail:'建兴二年合肥新城之战发兵二十万人，合留守者不下三十万人，民力负担极重。', sourceTitle:'《吴志·诸葛恪传》', confidence:'确定' },
  { id:'sh_257_wei_bing', year:257, polity:'魏', category:'劳动与役制', title:'诸葛诞可发五十万', detail:'甘露二年诸葛诞作乱时魏国可发兵五十万人，合其余将士不下六七十万。', sourceTitle:'《晋书·文帝纪》', confidence:'较高' },
  { id:'sh_263_shu_bing', year:263, polity:'汉', category:'劳动与役制', title:'炎兴兵额', detail:'汉后主炎兴元年，蜀汉见兵 102,000 人。', sourceTitle:'《蜀志·后主传》注引王隐《蜀记》', confidence:'确定' },
  { id:'sh_280_wu_bing', year:280, polity:'吴', category:'劳动与役制', title:'天纪兵额', detail:'吴末帝天纪四年，孙吴见兵 230,000 人。', sourceTitle:'《吴志·孙皓传》注引《晋阳秋》', confidence:'确定' },
  { id:'sh_235_shijia', year:235, polity:'魏', category:'劳动与役制', title:'士家制度', detail:'魏士家世为兵，士女必嫁士家，诸士女嫁非士者录夺配战士；士家常被迁徙实边。', sourceTitle:'《魏志·明帝纪》青龙三年注引《魏略》', confidence:'确定' },
  { id:'sh_263_shu_li', year:263, polity:'汉', category:'劳动与役制', title:'蜀汉吏额', detail:'汉后主炎兴元年，蜀汉吏 40,000 人。', sourceTitle:'《蜀志·后主传》注引王隐《蜀记》', confidence:'确定' },
  { id:'sh_280_wu_li', year:280, polity:'吴', category:'劳动与役制', title:'吴吏额', detail:'吴末帝天纪四年，孙吴吏 32,000 人；吴文武众职数拟魏晋。', sourceTitle:'《吴志·孙皓传》注引《晋阳秋》《晋书·刘颂传》', confidence:'确定' },
  { id:'sh_196_nubi', year:196, polity:'汉', category:'劳动与役制', title:'奴客制度', detail:'建安元年糜竺有奴客二千，客以家计，世代为客；吴以复客制赐臣下（潘璋妻复客五十家、陈武子复客二百家）。', sourceTitle:'《蜀志·糜竺传》《吴志·潘璋传》《吴志·陈武传》', confidence:'确定' },
  { id:'sh_221_shengkou', year:221, polity:'魏', category:'劳动与役制', title:'生口与俘虏', detail:'黄初二年曹真破叛胡获生口十万、羊百一十万、牛八万，生口地位略同牲口；政府没入罪人妻子为官奴婢并斥卖于市。', sourceTitle:'《魏志·文帝纪》注引《魏书》《魏志·三少帝纪》', confidence:'确定' },
  { id:'sh_146_kentian', year:146, polity:'东汉', category:'土地与屯田', title:'本初垦田', detail:'汉质帝本初元年垦田 6,930,123 顷 38 亩，为东汉垦田面积基准；三国时垦田远不及此。', sourceTitle:'《续汉书·郡国志》注引伏无忌记', confidence:'确定' },
  { id:'sh_227_cangci', year:227, polity:'魏', category:'土地与屯田', title:'敦煌割田与民', detail:'仓慈太和中任敦煌太守，割大姓田地以赋与小民，魏对既存地主阶级显加压迫。', sourceTitle:'《魏志·仓慈传》', confidence:'确定' },
  { id:'sh_214_zhaoyun', year:214, polity:'汉', category:'土地与屯田', title:'蜀不夺民田', detail:'刘备定益州，时议以民田分赐将士，赵云以为不可，刘备从之，蜀地田业多仍归原主。', sourceTitle:'《蜀志·赵云传》注引《赵云别传》', confidence:'确定' },
  { id:'sh_264_ba_diannong', year:264, polity:'魏', category:'土地与屯田', title:'罢典农官', detail:'咸熙元年诏罢屯田官以均政役，诸典农皆为太守、都尉皆为令长，民屯制度结束。', sourceTitle:'《晋书·宣帝纪》《魏志·三少帝纪》', confidence:'确定' },
  { id:'sh_233_chengguoqu', year:233, polity:'魏', category:'农业水利', title:'成国渠与临晋陂', detail:'青龙元年修成国渠自陈仓至槐里，溉田三千余顷；又引汧洛溉舄卤之地三千余顷。', sourceTitle:'《晋书·宣帝纪》《晋书·食货志》', confidence:'确定' },
  { id:'sh_243_dengai_qu', year:243, polity:'魏', category:'农业水利', title:'淮阳百尺渠', detail:'正始四年邓艾开淮阳渠、百尺渠及颍水南北诸陂，配合淮上屯田。', sourceTitle:'《晋书·宣帝纪》', confidence:'确定' },
  { id:'sh_250_lulingye', year:250, polity:'魏', category:'农业水利', title:'戾陵堨车箱渠', detail:'嘉平二年丁鸿导高粱河修戾陵堨、车箱渠，灌田岁二千顷，所润合四五百里、灌田万余顷。', sourceTitle:'《水经·鲍丘水注》载《刘靖碑文》', confidence:'较高' },
  { id:'sh_260_pulitang', year:260, polity:'吴', category:'农业水利', title:'浦里塘', detail:'永安三年都尉严密建丹阳湖田作浦里塘，毫无功绩而功佣之费不可胜数，士卒死亡百姓大怨。', sourceTitle:'《吴志·濮阳兴传》《吴志·陆凯传》', confidence:'确定' },
  { id:'sh_234_dengai_tuntian', year:234, polity:'魏', category:'农业水利', title:'淮上屯田规模', detail:'邓艾淮上屯田田兵五万人（淮北二万、淮南三万，二成轮休），垦田二万至三万顷，岁完收五百万斛，六七年可积三千万斛。', sourceTitle:'《魏志·邓艾传》', confidence:'确定' },
  { id:'sh_277_duyu_po', year:277, polity:'西晋', category:'农业水利', title:'杜预论陂害', detail:'咸宁三年杜预疏论诸陂之害：修治弗坚常虞溃决，积水封掩广土，良田变生蒲苇，水陆失业。', sourceTitle:'《晋书·食货志》', confidence:'确定' },
  { id:'sh_214_zhizhi', year:214, polity:'汉', category:'货币', title:'直百五铢铸造', detail:'建安十九年刘备在益州复铸直百钱，径一寸一分、重八铢；犍为郡所铸背有“为”字。', sourceTitle:'《蜀志·刘巴传》注引《零陵先贤传》《三国志旁证》', confidence:'确定' },
  { id:'sh_221_wei_wubi', year:221, polity:'魏', category:'货币', title:'黄初二币', detail:'黄初二年春三月魏复五铢钱，冬十月以谷贵复罢五铢，使民以谷帛为市。', sourceTitle:'《魏志·文帝纪》《晋书·食货志》', confidence:'确定' },
  { id:'sh_236_daquan', year:236, polity:'吴', category:'货币', title:'大泉五百', detail:'嘉禾五年春吴铸大钱一当五百，文曰“大泉五百”，径一寸三分、重十二铢。', sourceTitle:'《吴志·孙权传》《通典·食货志》', confidence:'确定' },
  { id:'sh_238_daquan', year:238, polity:'吴', category:'货币', title:'大泉当千', detail:'赤乌元年春吴复铸当千大钱“大泉当千”，径一寸四分、重十六铢，另有当两千、当五千钱。', sourceTitle:'《吴志·孙权传》《通典·食货志》', confidence:'确定' },
  { id:'sh_246_ba_daqian', year:246, polity:'吴', category:'货币', title:'罢大钱', detail:'赤乌九年吴以民多不以大钱为便，下诏罢大钱；然孙氏旧钱至东晋元帝时尚被通用。', sourceTitle:'《吴志·孙权传》注引《江表传》《晋书·食货志》', confidence:'确定' },
  { id:'sh_190_dongzhuo_qian', year:190, polity:'汉', category:'货币', title:'董卓小钱', detail:'初平元年董卓坏五铢更铸小钱（径约二寸三分、重约八铢？原注径2.3厘米重1.8克），钱品恶劣，谷一斛至数十万，钱货不行。', sourceTitle:'《后汉书·孝献帝纪》《魏志·董卓传》', confidence:'确定' },
  { id:'sh_208_caocao_qian', year:208, polity:'魏', category:'货币', title:'建安罢小钱', detail:'建安十三年曹操为相，罢小钱还用五铢，惟少所增铸，仍不足济用，谷贱无已，疑后更废。', sourceTitle:'《晋书·食货志》', confidence:'确定' },
  { id:'sh_272_wu_juan', year:272, polity:'吴', category:'物价', title:'吴物价', detail:'凤皇元年一犬至值数千匹绢，御犬率具缨值钱一万；谷帛绢布为日常交换媒介。', sourceTitle:'《吴志·孙皓传》注引《江表传》', confidence:'确定' },
  { id:'sh_194_jia', year:194, polity:'汉', category:'物价', title:'兴平谷价', detail:'兴平元年谷一斛五十万钱，豆麦一斛二十万钱；幽州谷一石十万钱。', sourceTitle:'《后汉书·献帝纪》《魏志·武帝纪》', confidence:'确定' },
  { id:'sh_221_wu_jiaoyi', year:221, polity:'魏', category:'交通与都市', title:'魏吴互市', detail:'黄初二年魏文帝遣使向孙权求雀头香、大贝、明珠、象牙等物；嘉禾四年魏以马求吴珠玑、翡翠、玳瑁。', sourceTitle:'《吴志·孙权传》注引《江表传》', confidence:'确定' },
  { id:'sh_230_yizhou', year:230, polity:'吴', category:'交通与都市', title:'夷洲远征', detail:'黄龙二年孙权遣卫温、诸葛直将兵万人浮海求夷洲、亶洲，得夷洲数千人还，海上交通迈轶东汉。', sourceTitle:'《吴志·孙权传》', confidence:'确定' },
  { id:'sh_245_pogandu', year:245, polity:'吴', category:'交通与都市', title:'破岗渎', detail:'赤乌八年校尉陈勋作屯田，发屯兵三万人凿句容中道，自小其至云阳西城通会市、作邸阁，以通吴会船舰。', sourceTitle:'《吴志·孙权传》', confidence:'确定' },
  { id:'sh_206_pingluqu', year:206, polity:'魏', category:'交通与都市', title:'平虏泉州渠', detail:'建安十一年董昭建平虏渠（自呼沲入泒水）与泉州渠（自泃河口入潞河），后晋宣帝更修治。', sourceTitle:'《魏志·武帝纪》《魏志·董昭传》《水经注》', confidence:'确定' },
  { id:'sh_231_muniu', year:231, polity:'汉', category:'交通与都市', title:'木牛流马', detail:'建兴九年诸葛亮第四次北伐以木牛运；十年休士劝农于黄沙作流马；十二年第五次北伐以流马运。', sourceTitle:'《蜀志·后主传》《蜀志·诸葛亮传》', confidence:'确定' },
  { id:'sh_263_shu_fukong', year:263, polity:'汉', category:'工商业', title:'蜀府库锦帛', detail:'蜀汉亡时府库藏锦、绮、彩、绢各二十万匹，金银各二千斤，米四十万斛以上。', sourceTitle:'《蜀志·后主传》注引王隐《蜀记》', confidence:'确定' },
  { id:'sh_280_wu_chuan', year:280, polity:'吴', category:'工商业', title:'吴官船五千艘', detail:'吴亡时官有舟船五千余艘；建安郡有大船厂，罪人辄谪至建安造船。', sourceTitle:'《吴志·孙皓传》注引《晋阳秋》', confidence:'确定' },
  { id:'sh_211_yan', year:211, polity:'魏', category:'盐铁官营', title:'盐专卖', detail:'魏、蜀、吴皆置盐官，以专卖盐为主；蜀井盐、魏解池盐、沿海海盐各有特产。', sourceTitle:'《魏志·卫觊传》《蜀志·王连传》《蜀志·吕乂传》《吴志·孙休传》', confidence:'确定' },
  { id:'sh_245_wu_zhu', year:245, polity:'吴', category:'工商业', title:'吴珠禁', detail:'合浦百姓唯以采珠为业，吴珠禁甚严；陶璜请上珠三分输二、次珠输一、粗者蠲除。', sourceTitle:'《晋书·陶璜传》', confidence:'确定' },
  { id:'sh_204_hu_diao', year:204, polity:'魏', category:'财政收支', title:'田租户调令', detail:'建安九年曹操定田租亩四升、户出绢二匹绵二斤，罢汉算赋口钱；另有关税、罚金等收入。', sourceTitle:'《魏志·武帝纪》注引《魏书》《魏志·赵俨传》《魏志·何夔传》', confidence:'确定' },
  { id:'sh_220_jin_ci', year:220, polity:'魏', category:'财政收支', title:'延康复除', detail:'延康元年以谯为曹氏祖籍，复谯租税二年；景元四年特赦益州士民复除租税之半五年。', sourceTitle:'《魏志·文帝纪》注引《魏书》《魏志·三少帝纪》', confidence:'确定' },

function normalizeYear(value){
  if(value === '' || value === null || value === undefined) return null;
  const n = Number(value);
  return Number.isFinite(n) ? Math.trunc(n) : null;
}

function makeFigureRecord(source){
  const raw = source || {};
  return {
    id: raw.id || figureKey(),
    name: String(raw.name || raw.person || '').trim(),
    portrait: typeof (raw.portrait || raw.image) === 'string' ? (raw.portrait || raw.image) : '',
    rulerKey: String(raw.rulerKey || raw.periodKey || ''),
    startYear: normalizeYear(raw.startYear),
    endYear: normalizeYear(raw.endYear),
    note: String(raw.note || ''),
  };
}

function normalizeFigures(rawFigures, factionKey){
  if(!Array.isArray(rawFigures)) return [];
  const records = [];
  rawFigures.forEach(raw=>{
    if(typeof raw === 'string'){
      const defaults = LEGACY_FIGURE_DEFAULTS[factionKey] && LEGACY_FIGURE_DEFAULTS[factionKey][raw];
      (defaults || [{name:raw}]).forEach(item=>records.push(makeFigureRecord(item)));
    } else if(raw && typeof raw === 'object') records.push(makeFigureRecord(raw));
  });
  const ids = new Set();
  records.forEach(record=>{
    if(ids.has(record.id)) record.id = figureKey();
    ids.add(record.id);
  });
  return records;
}

function nextUniqueKey(prefix, occupied){
  let key;
  do { key = nk(prefix); } while(occupied.has(key));
  occupied.add(key);
  return key;
}

  if(parent !== null && parent !== undefined && parent !== '') node.parent = parent;

}

function buildLocalRegionTree(prefix, parentKey, preset, attach){
  const nodes=[];
  attach = attach || {};
  const root=O(prefix,parentKey,'地方政区总览（州—郡国—县邑）','州牧刺史','','',{
    relationType:'视图分组（非直属）',
    duty:'按政区层级展开：州→郡国→县邑',
    sources:'《后汉书》志·百官志五；《晋书》卷二十四·职官志',
    note:'郡国与县邑为制度层级示意；具体辖区、沿革与职任以州镇录和形势图为准。',
    evolution:'州—郡国—县邑政区层级随本势力存续而存在；具体分置、省并与治所沿革以形势图与沿革时间轴为准。'
  });
  nodes.push(root);
  const staffGroups=[
    ['州级属官（总纲）','province','州府属吏。别驾、治中、簿曹、兵曹、部郡国从事、主簿、门亭长、书佐等见于百官志。'],
    ['郡国属官（总纲）','commandery','郡国属吏；郡丞秩六百石，边郡都尉、长史依建置而设。'],
    ['县邑属官（总纲）','county','县邑属吏及乡亭之制：县置丞、尉、主簿、诸曹掾史；乡置啬夫、游徼；十里一亭，置亭长。']
  ];
  staffGroups.forEach(function(group){
    const groupNode=O(prefix,root.key,group[0],'州郡属官','','',{
      sources:'《后汉书》志·百官志五；《晋书》卷二十四·职官志',
      note:group[2],
      evolution:'州郡县属吏随政区存续而设，员额依户数多寡而有差。'
    });
    nodes.push(groupNode);
    BAIGUANZHI_STAFF[group[1]].forEach(nm=>{
      nodes.push(O(prefix,groupNode.key,nm,'州郡属官','','',{
        sources:'《后汉书》志·百官志五；《晋书》卷二十四·职官志',
        note:group[2],
        evolution:'随所属州郡县存续而设，员额与品秩按时期、政区核校。'
      }));
    });
  });
  preset.forEach((state)=>{
    const stateNode=O(prefix,root.key,state.office||(state.state+'刺史'),'州牧刺史','','',{
      region:state.state, relationType:'视图分组（非直属）',
      duty:'州级长官；西汉部刺史秩六百石，东汉末州牧、领兵刺史秩位不一，须按具体任命核定',
      sources:'《后汉书》志·百官志五；《晋书》卷二十四·职官志',
      evolution:'州级政区随本势力存续而存在；领兵刺史、州牧为特殊任命，沿革以形势图与州镇录为准。'
    });
    nodes.push(stateNode);
    (state.commanderies||[]).forEach((item)=>{
      const cmdName=Array.isArray(item)?item[0]:item;
      const seat=Array.isArray(item)?(item[1]||''):'';
      const cmdNode=O(prefix,stateNode.key,cmdName,'郡国守相','','',{
        region:state.state+'·'+cmdName, relationType:'视图分组（非直属）',
        duty:'郡国长官，秩二千石；国相职同太守，边郡或置都尉',
        sources:'《后汉书》志·百官志五；《晋书》卷二十四·职官志',
        evolution:'郡国沿革以形势图与沿革时间轴为准；此处为制度层级示意。'
      });
      nodes.push(cmdNode);
      const countyNode=O(prefix,cmdNode.key,seat?(seat+'令／长'):'县邑令长（诸县）','县邑令长','','',{
        region:state.state+'·'+cmdName, relationType:'视图分组（非直属）',
        duty:'万户以上置令，减万户为长；秩千石至三百石不等',
        sources:'《后汉书》志·百官志五；《晋书》卷二十四·职官志',
        evolution:'县邑置废与升县为郡、升郡为州等沿革，以形势图与沿革时间轴为准。'
      });
      nodes.push(countyNode);
      (attach[cmdName]||[]).forEach(function(item){
        const attached=O(prefix,cmdNode.key,item[0],item[1]||'县邑令长',item[2]||'',item[3]||'',item[4]||{});
        nodes.push(attached);
      });
    });
  });
  return nodes;
}

function mergePresetSupplement(targetTrees){
  const preset=buildPresets();
  ['han','wei','shu','wu','jin','tribal'].forEach(fk=>{
    const saved=targetTrees[fk] && targetTrees[fk].office;
    if(!saved) return;
    const savedNames=new Set(saved.filter(n=>n.kind!=='root').map(n=>String(n.name).replace(/[（(].*?[)）]/g,'').trim()));
    const occupied=new Set(saved.map(n=>n.key));
    (preset[fk]?.office||[]).filter(n=>n.kind!=='root' && Array.isArray(n.customTags) && n.customTags.includes('维基补充')).forEach(pn=>{
      const nm=String(pn.name).replace(/[（(].*?[)）]/g,'').trim();
      if(savedNames.has(nm)) return;
      const parent=saved.find(n=>String(n.name).trim()===String(pn._presetParentName||''));
      const parentNode=parent || saved.find(n=>n.kind==='root');
      if(!parentNode) return;
      const prefix=fk+'_o';
      const node=O(prefix, parentNode.key, pn.name, pn.category||'其他', pn.rank9||'', pn.hanRank||'', {
        duty:pn.duty||'', note:pn.note||'', sources:pn.sources||'', sourceLevel:'二手索引', confidence:'待核',
        officeStartYear:normalizeYear(pn.officeStartYear), officeEndYear:normalizeYear(pn.officeEndYear),
        customTags:Array.isArray(pn.customTags)?pn.customTags.slice():[]
      });
      if(occupied.has(node.key)) node.key=nextUniqueKey(prefix, occupied);
      occupied.add(node.key);
      saved.push(node);
      savedNames.add(nm);
    });
  });
  return targetTrees;
}


function cloneJSON(value){ return JSON.parse(JSON.stringify(value)); }
function normalizeFangzhenRecords(rows){
  return cloneJSON(Array.isArray(rows)?rows:[]).map((record,index)=>{
    if(record.polity==='季汉'||record.polity==='蜀汉') record.polity='汉';
    ['note','title','jurisdiction'].forEach(field=>{
      if(typeof record[field]==='string') record[field]=record[field].replace(/蜀汉|季汉/g,'汉');
    });
    if(record.polity==='东晋' && record.eraGroup==='jin' && Number(record.endYear)>=317) record.eraGroup='eastjin';
    record.archiveScope=record.archiveScope || (record.eraGroup==='eastjin'?'东晋扩展':'核心：汉末—西晋');
    record.commission=String(record.commission||record.title||'');
    record.relation=String(record.relation||'职任记录');
    record.appointmentStatus=String(record.appointmentStatus||(
      /未上任/.test(record.note||'')?'未上任':(/代理/.test((record.tenureText||'')+(record.note||''))?'代理':'实授')
    ));
    record.sourceLevel=String(record.sourceLevel||(
      /wikipedia\.org/.test(record.sourceUrl||'')?'二手索引':'待核'
    ));
    record.confidence=String(record.confidence||(
      /未详|约/.test(record.tenureText||'')?'待考':'中'
    ));
    record.sourceTenureText=String(record.sourceTenureText||record.tenureText||'');
    // 吴州镇档案任期只保留年份区间，年号原文存入 sourceTenureText 备查。
    if(record.polity==='吴' && !/[?？]|未详|待考|未知/.test(String(record.tenureText||''))){
      const start=Number(record.startYear), end=Number(record.endYear);
      const validStart=Number.isFinite(start)&&start>0;
      const validEnd=Number.isFinite(end)&&end>0;
      if(validStart&&validEnd){
        record.tenureText= start===end ? String(start) : (start+'—'+end);
      }else if(validStart){
        record.tenureText=String(start)+'—';
      }
    }
    return window.SGZResearchModel.normalizeFangzhen(record,index);
  });
}

function normalizeAndValidateNodes(nodes, label, factionKey){
  if(!Array.isArray(nodes)) throw new Error(label+'必须是节点数组');
  const keys = new Set();
  nodes.forEach((node, idx)=>{
    if(!node || typeof node!=='object' || Array.isArray(node)) throw new Error(label+'第 '+(idx+1)+' 条不是有效节点');
    if(!['string','number'].includes(typeof node.key) || String(node.key).trim()==='') throw new Error(label+'第 '+(idx+1)+' 条缺少有效 key');
    if(keys.has(node.key)) throw new Error(label+'存在重复 key：'+node.key);
    keys.add(node.key);
    if(node.parent === null || node.parent === undefined || node.parent === '') delete node.parent;
    else if(!['string','number'].includes(typeof node.parent)) throw new Error('节点「'+(node.name||node.key)+'」的 parent 必须是字符串或数字');
    Object.assign(node,window.SGZResearchModel.normalizeNode(node,factionKey,node.kind==='noble'?'noble':'office'));
    node.figures = normalizeFigures(node.figures, factionKey);
    node.regionPath = Array.isArray(node.regionPath) ? node.regionPath.map(String) : [];
    node.customTags = Array.isArray(node.customTags) ? node.customTags.map(String).filter(Boolean) : [];
    node.officeStartYear = normalizeYear(node.officeStartYear ?? node.establishedYear);
    node.officeEndYear = normalizeYear(node.officeEndYear ?? node.abolishedYear);
    node.archived = Boolean(node.archived);
    node.hidden = Boolean(node.hidden);
    node.locked = Boolean(node.locked);
    node.sources = String(node.sources || node.source || '');
    node.polity = String(node.polity || node.country || node.tribe || '');
    node.footnotes = Array.isArray(node.footnotes) ? node.footnotes.filter(f=>f && f.text).map(f=>({
      id: f.id || ('fn_'+Math.random().toString(36).slice(2)), field: String(f.field||'备注'), text: String(f.text||'')
    })) : [];
    node.evolutionEvents = Array.isArray(node.evolutionEvents) ? node.evolutionEvents.map(e=>e&&typeof e==='object' ? {
      id: e.id || ('evn_'+Math.random().toString(36).slice(2)),
      year: normalizeYear(e.year),
      type: EVOLUTION_TYPES.includes(String(e.type)) ? String(e.type) : '待考',
      text: String(e.text||''),
      source: String(e.source||'')
    } : null).filter(Boolean) : [];
    if(node.kind==='office'){
      node.category = String(node.category || '其他');
      if(node.category==='临时考据') node.category='其他';
      node.duty = String(node.duty || '');
      node.region = String(node.region || '');
      node.jie = String(node.jie || '无');
      node.kaifu = Boolean(node.kaifu);
      node.yaoling = Boolean(node.yaoling);
      node.worldTangBing = Boolean(node.worldTangBing);
      node.lushangshushi = Boolean(node.lushangshushi);
      node.jiaguan = String(node.jiaguan || '无');
      node.virtual = Boolean(node.virtual);
      node.temporary = Boolean(node.temporary);
      node.aliases = String(node.aliases || '');
      node.evolution = String(node.evolution || '');
      node.relationType = String(node.relationType || '');
      node.directRules = String(node.directRules || '');
      node.sourceLevel = String(node.sourceLevel || '');
      node.confidence = String(node.confidence || '');
      node.historicalStatus = String(node.historicalStatus || '有效');
      // V28：无可靠设立／裁撤年且无沿革说明的官职，统一标注“待考”，不臆造年份。
      if(!node.archived && node.officeStartYear===null && node.officeEndYear===null && !String(node.evolution||'').trim()){
        node.evolution = '沿革年代待考';
        node.confidence = node.confidence || '待考';
      }
    } else if(node.kind==='noble'){
      node.actualFief = node.actualFief !== false;
    }
    if(['han','shu','tribal'].includes(factionKey) && node.kind==='office') node.rank9 = '';
    if(factionKey==='shu' && node.kind==='root'){
      if(node.name==='蜀汉官制'||node.name==='季汉官制') node.name='汉官制';
      if(node.name==='蜀汉爵制'||node.name==='季汉爵制') node.name='汉爵制';
    }
    if(factionKey==='tribal' && node.kind==='root'){
      if(node.name==='边疆异族官制') node.name='异族官制';
      if(node.name==='边疆封授爵位') node.name='异族封授爵位';
    }
    // 兼容旧版工程：不删除用户节点，把已证实的时代错置项归档并写明去向。
    if(factionKey==='wei' && node.name==='刑部尚书'){
      node.name='刑部尚书（时代错置，已归档）'; node.archived=true; node.historicalStatus='纠误归档';
      node.note=[node.note,'曹魏尚书诸曹不使用后世“刑部尚书”名目；旧节点为保护用户数据而归档。'].filter(Boolean).join('；');
    }
    if(factionKey==='wei' && node.name==='邺郡太守') node.name='魏郡太守／魏尹';
    if(factionKey==='wei' && node.name==='许县令') node.name='许昌县令';
    if(factionKey==='wei' && node.category==='都督军事' && /^都督(中外|河北|幽州|雍凉|陇右|关中|荆扬益|南方|荆豫|荆州|江北|江南|豫州|扬州|淮北|青徐|青州|徐州|兖州)/.test(node.name)){
      node.archived=true; node.historicalStatus='转入州镇录';
      node.note=[node.note,'该都督辖区属于随人随时变化的职任，已转入州镇录；旧节点保留为归档。'].filter(Boolean).join('；');
    }
    if(factionKey==='wu' && /^(大都督|左都护|右都护|右部督|左部督|偏将督)/.test(node.name)){
      node.archived=true; node.historicalStatus='转入州镇录';
      node.note=[node.note,'此项不宜构成固定上下级官署树，旧节点保留归档；具体职任请录入州镇录。'].filter(Boolean).join('；');
    }
    if(factionKey==='jin' && node.name==='建康令'){
      node.name='建康令（317年后，东晋扩展）'; node.archived=true; node.historicalStatus='超出核心时段';
      node.note=[node.note,'建康之名用于313年以后；西晋核心树改列秣陵令／建邺令。'].filter(Boolean).join('；');
    }
    if(factionKey==='tribal' && /^(大都护（西域）|仟长（部落军事编制）|什长)$/.test(node.name)){
      node.archived=true; node.historicalStatus='纠误归档';
      node.note=[node.note,'该项不应作为异族内部世袭官爵；旧数据为兼容导入而归档。'].filter(Boolean).join('；');
    }
  });

  const byKey = new Map(nodes.map(node=>[node.key, node]));
  nodes.forEach(node=>{
    if(node.parent !== undefined && !byKey.has(node.parent)) throw new Error('节点「'+(node.name||node.key)+'」引用了不存在的上级 key：'+node.parent);
    const chain = new Set();
    let cursor = node;
    while(cursor && cursor.parent !== undefined){
      if(chain.has(cursor.key)) throw new Error('节点「'+(node.name||node.key)+'」的上级关系形成循环');
      chain.add(cursor.key);
      cursor = byKey.get(cursor.parent);
    }
  });
  return nodes;
}

function normalizeAndValidateTrees(rawTrees){
  if(!rawTrees || typeof rawTrees!=='object' || Array.isArray(rawTrees)) throw new Error('trees 必须是对象');
  const trees = cloneJSON(rawTrees);
  let fallback = null;
  FACTIONS.forEach(faction=>{
    let group = trees[faction.key];
    if(!group || typeof group!=='object'){
      // 兼容旧版工程（如缺少后续新增的“西晋官制”）：自动补入该势力的默认预设模板
      if(!fallback) fallback = buildPresets();
      group = cloneJSON(fallback[faction.key]) || { office:[], noble:[] };
      trees[faction.key] = group;
    }
    group.office = normalizeAndValidateNodes(group.office||[], faction.name+'官职体系', faction.key);
    group.noble = normalizeAndValidateNodes(group.noble||[], faction.name+'爵位体系', faction.key);
  });
  return trees;
}

    const catalogTreeRows = computed(()=>{
      const nodes=currentArr.value;
      const byKey=new Map(nodes.map(node=>[node.key,node]));
      const allowed=new Set();
      nodes.filter(catalogNodeMatches).forEach(node=>{
        let cursor=node, guard=0;
        while(cursor && guard++<100){
          allowed.add(cursor.key);
          cursor=cursor.parent!==undefined ? byKey.get(cursor.parent) : null;
        }
      });
      const children=new Map();
      nodes.forEach(node=>{
        if(!allowed.has(node.key)) return;
        const parentKey=node.parent===undefined?null:node.parent;
        if(!children.has(parentKey)) children.set(parentKey,[]);
        children.get(parentKey).push(node);
      });
      const roots=children.get(null)||nodes.filter(node=>node.parent===undefined&&allowed.has(node.key));
      const rows=[];
      function walk(node,depth){
        const childNodes=children.get(node.key)||[];
        rows.push({node,depth,childCount:childNodes.length});
        const expanded=catalogHasActiveFilter.value || catalogExpanded[node.key]!==false && (catalogExpanded[node.key]===true || depth<2);
        if(expanded) childNodes.forEach(child=>walk(child,depth+1));
      }
      roots.forEach(root=>walk(root,0));

    /* ---------- 撤销/重做 + 操作日志 + 命名版本 ---------- */
    const history = reactive({ stack: [], index: -1 });
    const versions = reactive({ list: [] });

    function snapshotAll(){ return {trees:cloneJSON(data.trees),fangzhenRecords:cloneJSON(fangzhenRecords.value)}; }
    function pushHistory(label){
      history.stack = history.stack.slice(0, history.index+1);
      history.stack.push({ label, time: nowStr(), snap: snapshotAll() });
      history.index = history.stack.length - 1;
      if(history.stack.length > 60){ history.stack.shift(); history.index--; }
    }
    function nowStr(){
      const d = new Date();
      return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0');
    }
    function applySnapshot(snap){
      const treeSnap=snap && snap.trees ? snap.trees : snap;
      data.trees = normalizeAndValidateTrees(treeSnap);
      if(snap && Array.isArray(snap.fangzhenRecords)) fangzhenRecords.value=normalizeFangzhenRecords(snap.fangzhenRecords);
      selectedKey.value = null;
      rebuildModel();
    }
    function undo(){
      if(history.index <= 0){ ElementPlus.ElMessage.info('已到最早状态'); return; }
      history.index--;
      applySnapshot(history.stack[history.index].snap);
    }
    function redo(){
      if(history.index >= history.stack.length-1){ ElementPlus.ElMessage.info('已到最新状态'); return; }
      history.index++;
      applySnapshot(history.stack[history.index].snap);
    }

      if(!validationEnabled.value) return { ok:true };
      if(!child || !newParent) return { ok:false, msg:'缺少拖拽节点或目标节点。' };
      if(child.kind==='root') return { ok:false, msg:'根节点不能改挂到其他节点。' };
      if(newParent.kind!=='root' && child.kind!==newParent.kind) return { ok:false, msg:'官职与爵位属于不同体系，不能跨体系直接挂靠。' };
      if(child.kind==='office' && newParent.kind==='office'){
        const allowedParents = CATEGORY_PARENT_RULES[child.category];
        if(allowedParents && !allowedParents.includes(newParent.category)){
          return { ok:false, msg:'体系校验未通过：「'+child.category+'」不可归入「'+newParent.category+'」分支。' };
        }
        if(rank9Enabled.value && child.rank9 && newParent.rank9 && rankIdx(child.rank9) < rankIdx(newParent.rank9)){
          return { ok:false, msg:'官品校验未通过：下级官职（'+child.name+'，'+child.rank9+'）品级高于拟挂靠的上级（'+newParent.name+'，'+newParent.rank9+'）。' };

      const rgb=[0,2,4].map(i=>parseInt(clean.slice(i,i+2),16));

    function visibleNodesForCanvas(){
      const arr = currentArr.value;
      const query = canvasFilters.query.trim().toLowerCase();
      const hasFacet = Boolean(query || canvasFilters.category || canvasFilters.rank || canvasFilters.special || canvasFilters.hideNonCore || timelineEnabled.value || officeGroup.value!=='all' || officeSub.value!=='all' || officeSub2.value!=='all');
      const wanted = new Set();
      arr.forEach(node=>{
        if(node.kind==='root'){ wanted.add(node.key); return; }
        if(node.archived && !canvasFilters.showArchived) return;
        if(node.hidden && !canvasFilters.showHidden) return;
        if(node.kind==='office' && !officeClassMatches(node)) return;
        if(canvasFilters.hideNonCore && node.kind==='office' && !CORE_CATEGORIES.includes(node.category)) return;
        if(timelineEnabled.value){
          const start = normalizeYear(node.officeStartYear), end = normalizeYear(node.officeEndYear);
          if(start!==null && timelineYear.value<start) return;
          if(end!==null && timelineYear.value>end) return;
        }
        if(canvasFilters.category && node.category!==canvasFilters.category) return;
        if(canvasFilters.rank && node.rank9!==canvasFilters.rank && node.hanRank!==canvasFilters.rank) return;
        if(canvasFilters.special && !node[canvasFilters.special]) return;
        if(query && !nodeSearchText(node).includes(query)) return;
        wanted.add(node.key);
      });
      // 筛选结果必须补齐祖先链，避免 TreeModel 出现悬空 parent。
      const byKey = new Map(arr.map(n=>[n.key,n]));
      Array.from(wanted).forEach(key=>{
        let cursor=byKey.get(key), guard=0;
        while(cursor && cursor.parent!==undefined && guard++<200){
          wanted.add(cursor.parent);
          cursor=byKey.get(cursor.parent);
        }
      });
      if(!hasFacet) return arr.filter(n=>wanted.has(n.key));
      return arr.filter(n=>wanted.has(n.key));
    }
