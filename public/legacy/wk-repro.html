.leaflet-top.leaflet-left{margin-top:10px;margin-left:10px}

.panel-body{padding:18px 20px 30px}
.pv-head{border-bottom:1px solid #e2e4df}
.pv-title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;color:#202420}
.pv-year,.pv-label{color:#8d3d32}

.pv-tag,.pv-kind,.pv-hint{color:#6f756f}
.pv-source-note{margin-top:14px;padding:10px 11px;border-left:3px solid #a78345;border-radius:5px;background:#f7f3ea;color:#6c675e;font-size:11px;line-height:1.65}.pv-roster{display:flex;flex-direction:column;gap:8px}.roster-group{padding:7px 8px;background:rgba(255,252,244,.48);border-left:2px solid rgba(141,61,50,.38)}.roster-group>b{display:block;margin-bottom:5px;color:#8d3d32;font-size:11px;letter-spacing:1px}.roster-group>div{display:flex;flex-wrap:wrap;gap:5px 8px}.roster-item{display:inline-flex;align-items:baseline;gap:4px;max-width:100%;font-size:11.5px;color:#6c675e;line-height:1.55}.roster-meta{color:#a39b8c;font-size:9.5px;white-space:nowrap}.roster-item strong{color:#202420;font-weight:600}.roster-item small{color:#9a9489;font-size:10.5px}.roster-status{display:inline-block;margin-left:2px;padding:1px 4px;border-radius:3px;font-style:normal;font-size:9px;font-weight:700;color:#6b5530;background:#f7f1e4}.roster-status.s-tuiding{color:#356044;background:#edf4ee}.roster-status.s-cunyi{color:#8b4338;background:#f7ece9}.roster-status.s-daikao{color:#5f584e;background:#efebe1}

<div id="app">
  <div id="map"></div>
  <div class="mount-frame" aria-hidden="true"></div>
  <div id="sidebox">
    <button class="panel-collapse" id="sidebox-collapse" title="收起图层" aria-label="收起图层">‹</button>
    <div class="sb-section"><div class="sb-title">图 例</div>
      <div class="lg-group"><div class="lg-group-title">势力归属</div><div id="legend-factions"></div></div>
      <div class="lg-group"><div class="lg-group-title">政区图层</div>
        <div class="lg-item lg-layer-row"><span class="lg-swatch lg-admin-swatch"></span>国家／势力归属</div>
        <div class="lg-item lg-layer-row"><span class="lg-swatch lg-state-swatch"></span>州级行政色</div>
        <div class="lg-item lg-layer-row"><span class="lg-swatch lg-commandery-swatch"></span>郡级淡色层</div>
        <div class="lg-item lg-layer-row"><span class="lg-county-swatch"></span>县政区（郡县点）</div>
      </div>
      <div class="lg-group"><div class="lg-group-title">符号与范围</div>
        <div class="lg-item lg-layer-row"><span class="lg-route lg-influence-line"></span>军势／争议范围</div>
        <div class="lg-item"><span class="lg-dot city"></span>城池</div>
        <div class="lg-item"><span class="lg-dot battle"></span>战役</div>
        <div class="lg-item"><span class="lg-route"></span>进军路线</div>
      </div>
      <span class="lg-hint">点击势力名称可聚焦；放大至 7 级以上显示县政区点。</span>
    </div>
    <div class="sb-section"><div class="sb-title">显示模式</div>
      <label><input name="map-display-mode" value="research" type="radio" checked> 研究示意</label>
      <label><input name="map-display-mode" value="administrative" type="radio"> 行政层</label>
      <div id="map-filter-status" class="map-filter-status">研究示意 · 全部势力 · 全部州</div>
    </div>
    <div class="sb-section"><div class="sb-title">聚焦范围</div>
      <select id="map-state-filter" aria-label="按州聚焦"><option value="all">全部州</option></select>
      <button type="button" id="map-clear-filter" class="map-clear-filter">清除聚焦</button>
    </div>
    <div class="sb-section"><div class="sb-title">底 图</div>
      <label><input id="bm-terrain" name="basemap" value="terrain" type="radio" checked> 素色地形</label>
      <label><input id="bm-topo" name="basemap" value="topo" type="radio"> 地形图</label>
      <label><input id="bm-osm" name="basemap" value="osm" type="radio"> 现代地图</label>
    </div>
    <div class="sb-section"><div class="sb-title">图 层</div>
      <label><input id="lyr-terr" type="checkbox" checked> 国家与州界色块</label>
      <label><input id="lyr-province-tint" type="checkbox" checked> 州郡分色</label>
      <label><input id="lyr-wu-cmd" type="checkbox" checked> 郡界淡色块</label>
      <label><input id="lyr-cmd-label" type="checkbox" checked> 郡名标签</label>
      <label><input id="lyr-county" type="checkbox" checked> 县政区（郡县点）</label>
      <label><input id="lyr-route" type="checkbox" checked> 进军路线</label>
      <label><input id="lyr-frontier-route" type="checkbox" checked> 边界通道</label>
      <label><input id="lyr-btl" type="checkbox" checked> 战役地点</label>
      <label><input id="lyr-battlefield" type="checkbox" checked> 重要战场</label>
      <label><input id="lyr-minorities" type="checkbox" checked> 周边族群范围</label>
      <label><input id="lyr-city" type="checkbox" checked> 重要城池</label>
      <label><input id="lyr-water" type="checkbox" checked> 河湖水系</label>
      <label><input id="lyr-tint" type="checkbox" checked> 古韵纸色</label>
    </div>
  </div>
  <aside id="info-panel">
    <button class="panel-collapse" id="info-collapse" title="收起详情" aria-label="收起详情">›</button>
    <div class="scroll-roller top"><i></i></div><div class="panel-body"><div class="pv-hint">正在载入州郡边界资料…</div></div><div class="scroll-roller bottom"><i></i></div>
  </aside>
  <div id="timeline" aria-hidden="true">
    <div class="tl-controls"><button id="tl-prev">‹</button><button id="tl-play">▶</button><button id="tl-next">›</button></div>
    <div id="tl-current"></div><div id="tl-track"></div>
  </div>
</div>

(function(){
  var GEO_SOURCE='data/All_Provinces.json';
  var EARTH_RADIUS=6378137;

    'Bingzhou':'bingzhou','Jiaozhou':'jiaozhou','Jingzhou (Wei)':'jing_wei',

    'Qingzhou':'qingzhou','Sili':'sili','Xuzhou':'xuzhou',
    'Yangzhou (Wei)':'yang_wei','Yangzhou (Wu)':'yang_wu','Yanzhou':'yanzhou',
    'Yizhou (North)':'yizhou','Yizhou (South)':'yizhou','Yongzhou':'yongzhou',
    'Youzhou':'youzhou','Yuzhou':'yuzhou'

  function lonLat(point){
    var lon=point[0]/EARTH_RADIUS*180/Math.PI;
    var lat=(2*Math.atan(Math.exp(point[1]/EARTH_RADIUS))-Math.PI/2)*180/Math.PI;
    return [Number(lon.toFixed(5)),Number(lat.toFixed(5))];

  function simplifyRing(points){
    if(!points||points.length<=4) return points||[];

    var sqTolerance=tolerance*tolerance;

    for(var i=1;i<points.length-1;i+=1){
      var point=points[i];
      var dx=point[0]-previous[0];
      var dy=point[1]-previous[1];
      if(dx*dx+dy*dy>=sqTolerance){
        result.push(point);
        previous=point;
      }
    }
    result.push(points[points.length-1]);

  }

        return simplifyRing(ring).map(lonLat);

    }
    return {type:'MultiPolygon',coordinates:geometry.coordinates.map(function(polygon){
      return polygon.map(function(ring){return simplifyRing(ring).map(lonLat);});
    })};

  function convertGeometryExact(geometry){

     * 郡界必须保留底稿中的共享顶点，才能在合并后真正消除内部线。
     * 先做 6km 简化会让相邻多边形各自丢掉不同顶点，导致共享边无法配对；
     * 州级展示仍使用 convertGeometry 的轻量简化，郡级展示改用此精确转换。
     */
    if(geometry.type==='Polygon'){
      return {type:'Polygon',coordinates:geometry.coordinates.map(function(ring){
        return ring.map(lonLat);

    return geometry.type==='Polygon'?[geometry.coordinates]:geometry.coordinates;

  function dissolvePolygonParts(parts){
    /*
     * 后期底稿把一个早期母郡切成多个相邻多边形。仅合并成 MultiPolygon
     * 仍会把共享边描出来，因此这里按共享线段做轻量边界溶解：成对抵消
     * 内部边，再沿剩余边重建外轮廓。遇到无法闭合的复杂环时回退原几何，
     * 保证地图宁可保留细线，也不会因几何修复而出现空白。
     */
    if(!Array.isArray(parts)||parts.length<2) return parts||[];

    remaining.forEach(function(edge){(outgoing[edge.aKey]||(outgoing[edge.aKey]=[])).push(edge);});

  function hanStateInfo(feature){

    if(province==='Yongzhou'){
      if(['Jingzhao','Fufeng','Pingyi'].indexOf(sourceName)!==-1) return {key:'sili',name:'司州',kingdom:kingdom};
      if(periodKey==='three220'&&['Longxi','Tianshui',"Nan'an",'Guangwei'].indexOf(sourceName)!==-1){
        return {key:'qinzhou',name:'秦州',kingdom:kingdom};
      }
      return {key:'yongzhou',name:'雍州',kingdom:kingdom};
    }
    var names={Bingzhou:'并州',Jiaozhou:'交州',Jizhou:'冀州',Liangzhou:'凉州',Qingzhou:'青州',Sili:'司州',Xuzhou:'徐州',Yanzhou:'兖州',Youzhou:'幽州',Yuzhou:'豫州'};
    var keys={Bingzhou:'bingzhou',Jiaozhou:'jiaozhou',Jizhou:'jizhou',Liangzhou:'liangzhou',Qingzhou:'qingzhou',Sili:'sili',Xuzhou:'xuzhou',Yanzhou:'yanzhou',Youzhou:'youzhou',Yuzhou:'yuzhou'};
    return {key:keys[province]||String(province).toLowerCase(),name:names[province]||feature.state,kingdom:kingdom};
  }
  var POST_HAN_LIANG_STATE_NAMES=['Hanzhong','Zitong','Ba','Badong','Baxi','Fuling','Weixing','Shangyong','Xincheng'];
  function postHanStateInfo(feature,nonWuKingdom){
    var province=feature.sourceProvince;
    var sourceName=feature.sourceName;
    var kingdom=feature.kingdom==='wu'?'wu':nonWuKingdom;
    if(province==='Jiaozhou'){
      var guang=['Nanhai','Cangwu','Yulin','Gaoliang','Hepu'];
      return guang.indexOf(sourceName)!==-1
        ?{key:'guangzhou',name:'广州',kingdom:'wu'}
        :{key:'jiaozhou',name:'交州',kingdom:'wu'};
    }
    /* 梁州：咸熙元年（264）分益州巴、汉七郡置，辖汉中、魏兴、上庸、新城、梓潼及巴系诸郡。 */
    if(POST_HAN_LIANG_STATE_NAMES.indexOf(sourceName)!==-1) return {key:'liang_state',name:'梁州',kingdom:kingdom};
    if(province==='Jingzhou (Wei)') return {key:'jing_wei',name:'荆州',kingdom:kingdom};
    if(province==='Jingzhou (Wu)') return {key:'jing_wu',name:'荆州',kingdom:'wu'};
    if(province==='Yangzhou (Wei)') return {key:'yang_wei',name:'扬州',kingdom:kingdom};
    if(province==='Yangzhou (Wu)') return {key:'yang_wu',name:'扬州',kingdom:'wu'};
    if(province.indexOf('Yizhou')===0) return {key:'yizhou',name:'益州',kingdom:kingdom};
    if(province==='Yongzhou'){
      if(['Jingzhao','Fufeng','Pingyi'].indexOf(sourceName)!==-1) return {key:'sili',name:'司州',kingdom:kingdom};
      return {key:'yongzhou',name:'雍州',kingdom:kingdom};
    }
    var names={
      'Bingzhou':'并州','Jizhou':'冀州','Liangzhou':'凉州','Qingzhou':'青州',
      'Sili':'司州','Xuzhou':'徐州','Yanzhou':'兖州','Yongzhou':'雍州',
      'Youzhou':'幽州','Yuzhou':'豫州'
    };
    var keys={
      'Bingzhou':'bingzhou','Jizhou':'jizhou','Liangzhou':'liangzhou',
      'Qingzhou':'qingzhou','Sili':'sili','Xuzhou':'xuzhou','Yanzhou':'yanzhou',
      'Yongzhou':'yongzhou','Youzhou':'youzhou','Yuzhou':'yuzhou'
    };
    return {key:keys[province]||String(province).toLowerCase(),name:names[province]||feature.state,kingdom:kingdom};
  }
  function jin280StateInfo(feature){
    var province=feature.sourceProvince;
    var sourceName=feature.sourceName;
    if(province==='Jiaozhou'){
      return ['Nanhai','Cangwu','Yulin','Gaoliang','Hepu'].indexOf(sourceName)!==-1
        ?{key:'guangzhou',name:'广州',kingdom:'jin'}
        :{key:'jiaozhou',name:'交州',kingdom:'jin'};
    }
    if(province==='Youzhou'){
      return ['Changli','Liaodong','Xuantu','Daifang','Lelang'].indexOf(sourceName)!==-1
        ?{key:'pingzhou',name:'平州',kingdom:'jin'}
        :{key:'youzhou',name:'幽州',kingdom:'jin'};
    }
    if(province==='Yongzhou'){
      return ['Longxi',"Nan'an",'Tianshui','Guangwei'].indexOf(sourceName)!==-1
        ?{key:'qinzhou',name:'秦州',kingdom:'jin'}
        :{key:'yongzhou',name:'雍州',kingdom:'jin'};
    }
    if(province==='Liangzhou'){
      return sourceName==='Jincheng'
        ?{key:'qinzhou',name:'秦州',kingdom:'jin'}
        :{key:'liangzhou',name:'凉州',kingdom:'jin'};
    }
    if(province==='Yizhou (North)'){
      if(['Wudu','Yinping'].indexOf(sourceName)!==-1) return {key:'qinzhou',name:'秦州',kingdom:'jin'};
      if(['Hanzhong','Zitong','Guanghan','Dongguanghan','Fuling','Ba','Baxi','Badong'].indexOf(sourceName)!==-1){
        return {key:'liang_state',name:'梁州',kingdom:'jin'};
      }
      return {key:'yizhou',name:'益州',kingdom:'jin'};
    }
    if(province==='Yizhou (South)'){
      return ['Yongchang','Xinggu','Jianning','Yunnan'].indexOf(sourceName)!==-1
        ?{key:'ningzhou',name:'宁州',kingdom:'jin'}
        :{key:'yizhou',name:'益州',kingdom:'jin'};
    }
    if(province.indexOf('Jingzhou')===0) return {key:'jingzhou',name:'荆州',kingdom:'jin'};
    if(province.indexOf('Yangzhou')===0) return {key:'yangzhou',name:'扬州',kingdom:'jin'};
    var names={
      'Bingzhou':'并州','Jizhou':'冀州','Qingzhou':'青州','Sili':'司州',
      'Xuzhou':'徐州','Yanzhou':'兖州','Yuzhou':'豫州'
    };
    var keys={
      'Bingzhou':'bingzhou','Jizhou':'jizhou','Qingzhou':'qingzhou',
      'Sili':'sili','Xuzhou':'xuzhou','Yanzhou':'yanzhou','Yuzhou':'yuzhou'
    };
    return {key:keys[province]||String(province).toLowerCase(),name:names[province]||feature.state,kingdom:'jin'};
  }
  function buildHistoricalProvinces(commanderies,infoFor){
    var groups={};
    commanderies.forEach(function(feature){
      var info=infoFor(feature);
      if(!groups[info.key]) groups[info.key]={info:info,members:[]};
      groups[info.key].members.push(feature);
    });
    return Object.keys(groups).map(function(key){
      var group=groups[key];
      var parts=[];
      group.members.forEach(function(feature){parts=parts.concat(polygonParts(feature.geometry));});
      var combined={type:'MultiPolygon',coordinates:dissolvePolygonParts(parts)};
      return {
        key:key,name:group.info.name,kingdom:group.info.kingdom,
        label:geometryLabelWgs(combined),geometry:combined
      };
    });
  }
  function buildHan184Commanderies(commanderies,periodKey){
    var merges=(window.ADMINISTRATIVE_COMMANDERY_MERGES||{})[periodKey||'han184']||{};
    var bySource={};
    commanderies.forEach(function(feature){bySource[feature.sourceName]=feature;});
    var normalized=commanderies.map(function(feature){
      var target=feature.sourceName;
      var seen={};
      while(merges[target]&&merges[target]!==target&&!seen[target]){
        seen[target]=true;
        target=merges[target];
      }
      var targetFeature=bySource[target];
      var staged=Object.assign({},feature,{sourceName:target,name:HAN_NAME_184[target]||(targetFeature&&targetFeature.name)||feature.name});
      var info=hanStateInfo(staged);
      return Object.assign(staged,{state:info.name,kingdom:'han'});
    });
    var groups={};
    normalized.forEach(function(feature){
      var key=feature.state+'|'+feature.name;
      if(!groups[key]) groups[key]={first:feature,parts:[]};
      groups[key].parts=groups[key].parts.concat(polygonParts(feature.geometry));
    });
    return Object.keys(groups).map(function(key){
      var group=groups[key];
      var geometry={type:'MultiPolygon',coordinates:dissolvePolygonParts(group.parts)};
      return Object.assign({},group.first,{geometry:geometry,label:geometryLabelWgs(geometry)});
    });
  }
  function buildPeriodCommanderies(commanderies,periodKey){
    if(periodKey==='han184'||periodKey==='han189'||periodKey==='han190') return buildHan184Commanderies(commanderies,periodKey);
    var merges=(window.ADMINISTRATIVE_COMMANDERY_MERGES||{})[periodKey]||{};
    var names=window.ADMINISTRATIVE_NAME_OVERRIDES||{};
    var periodNames=(window.ADMINISTRATIVE_PERIOD_NAME_OVERRIDES||{})[periodKey]||{};
    var bySource={};
    commanderies.forEach(function(feature){bySource[feature.sourceName]=feature;});
    var normalized=commanderies.map(function(feature){
      var target=feature.sourceName;
      var seen={};
      while(merges[target]&&merges[target]!==target&&!seen[target]){
        seen[target]=true;
        target=merges[target];
      }
      var targetFeature=bySource[target];
      var renamed=periodNames[target]||names[target]||(targetFeature&&targetFeature.name)||feature.name;
      var staged=Object.assign({},feature,{sourceName:target,name:renamed});
      var info=threeKingdomsStateInfo(staged,periodKey);
      return Object.assign(staged,{state:info.name,kingdom:periodKey.indexOf('han')===0?'han':feature.kingdom});
    });
    return mergeNamedCommanderies(normalized);
  }
  function buildPostHanCommanderies(commanderies,periodKey,infoFor){
    var merges=(window.ADMINISTRATIVE_COMMANDERY_MERGES||{})[periodKey]||{};
    var bySource={};
    commanderies.forEach(function(feature){bySource[feature.sourceName]=feature;});
    var normalized=commanderies.map(function(feature){
      var target=feature.sourceName;
      var seen={};
      while(merges[target]&&merges[target]!==target&&!seen[target]){
        seen[target]=true;
        target=merges[target];
      }
      var targetFeature=bySource[target];
      var staged=Object.assign({},feature,{sourceName:target,name:(targetFeature&&targetFeature.name)||feature.name});
      var info=infoFor(staged);
      return Object.assign(staged,{state:info.name,kingdom:info.kingdom});
    });
    return mergeNamedCommanderies(normalized);
  }
  function mergeNamedCommanderies(commanderies){
    var groups={};
    commanderies.forEach(function(feature){
      var key=feature.kingdom+'|'+feature.state+'|'+feature.name;
      if(!groups[key]) groups[key]={first:feature,parts:[]};
      groups[key].parts=groups[key].parts.concat(polygonParts(feature.geometry));
    });
    return Object.keys(groups).map(function(key){
      var group=groups[key];
      var geometry={type:'MultiPolygon',coordinates:dissolvePolygonParts(group.parts)};
      return Object.assign({},group.first,{geometry:geometry,label:geometryLabelWgs(geometry)});
    });
  }
  function applyPeriodLabelOverrides(features,periodId){
    var overrides=(window.ADMINISTRATIVE_PERIOD_LABEL_OVERRIDES||{})[periodId]||{};
    return features.map(function(feature){
      var label=overrides[feature.sourceName];
      return label ? Object.assign({},feature,{label:label}) : feature;
    });
  }
  function prepareGeoData(payload){
    var source=payload.features||[];
    var commanderies=mergeNamedCommanderies(buildCommanderies(source));
    var han184=buildHan184Commanderies(commanderies,'han184');
    var han189=buildHan184Commanderies(commanderies,'han189');
    var han190=buildPeriodCommanderies(commanderies,'han190');
    var han194=buildPeriodCommanderies(commanderies,'han194');
    var han199=buildPeriodCommanderies(commanderies,'han199');
    var han200=buildPeriodCommanderies(commanderies,'han200');
    var han208=buildPeriodCommanderies(commanderies,'han208');
    var han219=buildPeriodCommanderies(commanderies,'han219');
    var three220=buildPeriodCommanderies(commanderies,'three220');
    var three228=buildPeriodCommanderies(commanderies,'three228');
    var jin266=buildPostHanCommanderies(commanderies,'jin266',function(feature){return postHanStateInfo(feature,'jin');});
    var jin290=buildPostHanCommanderies(commanderies,'jin290',function(feature){return jin280StateInfo(feature);});
    var jin311=buildPostHanCommanderies(commanderies,'jin311',function(feature){return jin280StateInfo(feature);});
    var three263=commanderies.map(function(feature){
      return Object.assign({},feature,{
        state:feature.sourceProvince==='Sili'?'司州':feature.state
      });
    });
    var wei264=buildPostHanCommanderies(commanderies,'wei264',function(feature){return postHanStateInfo(feature,'wei');});
    var jin280=mergeNamedCommanderies(commanderies.map(function(feature){
      var info=jin280StateInfo(feature);
      var correctedName=feature.sourceName==='Guangwei'?'略阳郡'
        :(feature.sourceName==='Dongguanghan'?'新都郡':feature.name);
      return Object.assign({},feature,{name:correctedName,state:info.name,kingdom:'jin'});
    }));
    return {
      provinces:{
        early:buildProvinces(source,'early'),
        han184:buildHistoricalProvinces(commanderies,hanStateInfo),
        han194:buildHistoricalProvinces(han194,function(feature){return threeKingdomsStateInfo(feature,'han194');}),
        han199:buildHistoricalProvinces(han199,function(feature){return threeKingdomsStateInfo(feature,'han199');}),
        han200:buildHistoricalProvinces(han200,function(feature){return threeKingdomsStateInfo(feature,'han200');}),
        han208:buildHistoricalProvinces(han208,function(feature){return threeKingdomsStateInfo(feature,'han208');}),
        han219:buildHistoricalProvinces(han219,function(feature){return threeKingdomsStateInfo(feature,'han219');}),
        three220:buildHistoricalProvinces(three220,function(feature){return threeKingdomsStateInfo(feature,'three220');}),
        three228:buildHistoricalProvinces(three228,function(feature){return threeKingdomsStateInfo(feature,'three228');}),
        late:buildProvinces(source,'late'),
        wei264:buildHistoricalProvinces(wei264,function(feature){return postHanStateInfo(feature,'wei');}),
        jin266:buildHistoricalProvinces(jin266,function(feature){return postHanStateInfo(feature,'jin');}),
        jin290:buildHistoricalProvinces(jin290,function(feature){return jin280StateInfo(feature);}),
        jin311:buildHistoricalProvinces(jin311,function(feature){return jin280StateInfo(feature);}),
        jin:buildHistoricalProvinces(jin280,jin280StateInfo)
      },
      commanderies:han184,
      shu:commanderies,
      wu:wei264,
      jin:jin280,
      jin290:jin290,
      jin311:jin311,
      three263:three263,
      wei263:three263,
      wei264:wei264,
      jin266:jin266,
      commanderyByPeriod:{
        huangjin:han184,shaodi:han189,dongzhuo:han190,xingping:applyPeriodLabelOverrides(han194,'xingping'),jianbing:applyPeriodLabelOverrides(han199,'jianbing'),
        guandu:han200,chibi:han208,xiangfan:applyPeriodLabelOverrides(han219,'xiangfan'),
        sanguo:three220,beifa:three228,guijin:applyPeriodLabelOverrides(three263,'guijin'),
        hanwang:applyPeriodLabelOverrides(wei264,'hanwang'),jinchu:applyPeriodLabelOverrides(jin266,'jinchu'),taikang:applyPeriodLabelOverrides(jin280,'taikang'),
        hui_di:applyPeriodLabelOverrides(jin290,'hui_di'),yongjia:applyPeriodLabelOverrides(jin311,'yongjia')
      }
    };
  }
  function getJson(url){
    return fetch(url,{mode:'cors'}).then(function(response){
      if(!response.ok) throw new Error('HTTP '+response.status);
      return response.json();
    });
  }
  var geoInput=window.ALL_PROVINCES_LOCAL
    ? Promise.resolve(window.ALL_PROVINCES_LOCAL)
    : getJson(GEO_SOURCE);
  var geoReady=geoInput.then(prepareGeoData).then(function(data){
    window.__HISTORY_GEO_DATA=data;
    return data;
  });
  window.__historyMapGeoReady=geoReady;

  var nativeAppend=document.head.appendChild.bind(document.head);
  document.head.appendChild=function(node){
    var src=node&&node.tagName==='SCRIPT'?String(node.getAttribute('src')||''):'';
    var provinceMatch=src.match(/data\/geo-provinces-(early|late|jin|jin290|jin311|han184|han194|han199|han200|han208|han219|three220|three228|jin266|wei264)\.js$/);
    var isGeoScript=provinceMatch||
      /data\/geo-wu-commanderies-263\.js$/.test(src)||
      /data\/geo-commanderies-jin\.js$/.test(src)||
      /data\/geo-shu-commanderies\.js$/.test(src)||
      /data\/geo-commanderies\.js$/.test(src);
    if(!isGeoScript) return nativeAppend(node);
    geoReady.then(function(data){
      if(provinceMatch) window.GEO_PROVINCES=data.provinces[provinceMatch[1]];
      else if(/geo-wu-commanderies-263\.js$/.test(src)){
        var activeVariant=window.__activeMapVariant==='jin266'?'jin266':'wei263';
        window.GEO_WU_COMMANDERIES_263=data[activeVariant];
      }
      else if(/geo-commanderies-jin\.js$/.test(src)) window.GEO_COMMANDERIES_JIN=data.jin;
      else if(/geo-shu-commanderies\.js$/.test(src)) window.GEO_SHU_COMMANDERIES=data.shu;
      else window.GEO_COMMANDERIES=data.commanderies;
      if(typeof node.onload==='function') node.onload();
    }).catch(function(error){
      console.error('州郡边界资料载入失败：',error);
      var body=document.querySelector('#info-panel .panel-body');
      if(body) body.innerHTML='<div class="pv-head"><h2 class="pv-title">地图资料载入失败</h2></div><p class="pv-summary">请确认 assets/map/data 目录完整，并运行项目验证脚本检查本地资源。</p>';
      if(typeof node.onerror==='function') node.onerror(error);
    });
    return node;
  };
})();
</script>

<script>
/* 州、郡同国同系分色；两套郡界互斥，避免跨时期切换时残留叠线。 */
(function(){
  var TONES=['#F2E6D2','#DCE7DF','#E5E0ED','#ECDDD8','#DFE5CF','#D9E6EA','#EADFC8'];
  function rgb(hex){
    var value=String(hex||'#6c675e').replace('#','');
    if(value.length===3) value=value.split('').map(function(c){return c+c;}).join('');
    return [parseInt(value.slice(0,2),16),parseInt(value.slice(2,4),16),parseInt(value.slice(4,6),16)];
  }
  function mix(a,b,ratio){
    var one=rgb(a),two=rgb(b);
    var out=one.map(function(value,index){return Math.round(value*(1-ratio)+two[index]*ratio);});
    return '#'+out.map(function(value){return value.toString(16).padStart(2,'0');}).join('');
  }
  function hash(value){
    return Array.from(String(value||'')).reduce(function(total,char){return (total*31+char.charCodeAt(0))>>>0;},7);
  }
  function historicalColor(feature,factionId,level){
    var faction=FACTIONS[factionId]||FACTIONS[feature.kingdom]||{color:'#746c60'};
    if(window.__provinceTintEnabled===false) return faction.color;
    var rawKey=String(feature.key||'').replace(/_(wei|wu)$/,'');
    var stateKeys={'司隶':'sili','司州':'sili','并州':'bingzhou','冀州':'jizhou','兖州':'yanzhou','豫州':'yuzhou','青州':'qingzhou','徐州':'xuzhou','扬州':'yangzhou','荆州':'jingzhou','益州':'yizhou','梁州':'liang_state','凉州':'liangzhou','雍州':'yongzhou','秦州':'qinzhou','幽州':'youzhou','平州':'pingzhou','交州':'jiaozhou','广州':'guangzhou','宁州':'ningzhou'};
    var stateKey=level==='commandery'?(stateKeys[feature.state]||rawKey):(rawKey==='jing'?'jingzhou':rawKey==='yang'?'yangzhou':rawKey);
    var stateTone=(window.PROVINCE_COLOR_PALETTE||{})[stateKey]||TONES[hash(feature.state||feature.key)%TONES.length];
    var color=level==='province'?mix(stateTone,faction.color,.58):mix(stateTone,faction.color,.68);
    if(level==='commandery'){
      color=mix(color,TONES[hash(feature.key)%TONES.length],.04);
    }
    return color;
  }
  var labelLayoutTimer=0;
  function overlaps(a,b,padding){
    return !(a.right+padding<b.left||a.left-padding>b.right||a.bottom+padding<b.top||a.top-padding>b.bottom);
  }
  function declutterLabels(){
    var countries=Array.from(document.querySelectorAll('.faction-label'));
    var provinces=Array.from(document.querySelectorAll('.province-label'));
    var commanderies=Array.from(document.querySelectorAll('.cmd-label'));
    var app=document.getElementById('app');
    var compact=!!(app&&app.classList.contains('zoom-lte-5'));
    var tiny=!!(app&&app.classList.contains('zoom-lte-4'));
    var all=countries.concat(provinces,commanderies);
    all.forEach(function(label){label.style.visibility='visible';});
    var accepted=[];
    // 先固定州名，再让势力大字与郡名避开，避免国号压住行政信息。
    provinces.forEach(function(label){
      var rect=label.getBoundingClientRect();
      if(rect.width&&rect.height) accepted.push(rect);
    });
    countries.forEach(function(label){
      var span=label.querySelector('span');
      if(!span) return;
      span.style.setProperty('--cmd-shift-y','0px');
      var base=span.getBoundingClientRect();
      var candidates=[0,-38,38,-76,76,-114,114];
      var selected=0;
      for(var i=0;i<candidates.length;i++){
        var shift=candidates[i];
        var candidate={left:base.left,right:base.right,top:base.top+shift,bottom:base.bottom+shift};
        if(!accepted.some(function(rect){return overlaps(candidate,rect,4);})){selected=shift;break;}
      }
      span.style.setProperty('--cmd-shift-y',selected+'px');
      var chosen=span.getBoundingClientRect();
      accepted.push(chosen);
    });
    // V10：郡名是行政信息本身，不再用碰撞避让把它隐藏。
    // 缩略视图只对文字做有限的上下错位，保留每一个郡块的名称，同时避免
    // 河内—魏郡、巴—巴西等相邻小郡的文字完全叠成一团。
    var visibleCommanderies=commanderies.filter(function(label){
      var rect=label.getBoundingClientRect();
      return rect.width&&rect.height;
    }).sort(function(a,b){
      var ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
      return ar.top-br.top||ar.left-br.left;
    });
    visibleCommanderies.forEach(function(label){
      var span=label.querySelector('span');
      if(!span) return;
      label.classList.toggle('cmd-label-compact',compact);
      label.classList.toggle('cmd-label-tiny',tiny);
      label.style.visibility='visible';
      label.style.zIndex=compact?'640':'650';
      span.style.setProperty('--cmd-shift-y','0px');
      var base=span.getBoundingClientRect();
      var candidates=compact?[0,-8,8,-16,16,-24,24,-34,34]:[0,-10,10,-20,20,-32,32,-46,46];
      var selected=0;
      for(var i=0;i<candidates.length;i++){
        var shift=candidates[i];
        var candidate={left:base.left,right:base.right,top:base.top+shift,bottom:base.bottom+shift};
        if(!accepted.some(function(rect){return overlaps(candidate,rect,tiny?1:2);})){selected=shift;break;}
      }
      span.style.setProperty('--cmd-shift-y',selected+'px');
      var chosen=span.getBoundingClientRect();
      accepted.push(chosen);
    });
  }
  function scheduleLabelLayout(){
    clearTimeout(labelLayoutTimer);
    labelLayoutTimer=setTimeout(declutterLabels,90);
  }
  window.addEventListener('resize',scheduleLabelLayout);
  var mapApp=document.getElementById('app');
  if(mapApp){
    new MutationObserver(scheduleLabelLayout).observe(mapApp,{attributes:true,attributeFilter:['class']});
  }
  var renderTerritories=Territories.render;
  Territories.render=function(map,features,mapping,opts){
    var result=renderTerritories.apply(Territories,arguments);
    requestAnimationFrame(function(){
      var all=Array.from(document.querySelectorAll('.territory'));
      var current=all.slice(-features.length);
      current.forEach(function(path,index){
        var feature=features[index];
        var factionId=(mapping&&mapping[feature.key])||feature.kingdom;
        path.style.setProperty('fill',historicalColor(feature,factionId,'province'),'important');
      });
      scheduleLabelLayout();
    });
    return result;
  };
  var renderWu=WuCommanderies.render;
  var renderGeneral=Commanderies.render;
  WuCommanderies.render=function(map,opts){
    Commanderies.hide();
    window.GEO_WU_COMMANDERIES_263=(window.GEO_WU_COMMANDERIES_263||[]).map(function(feature){
      return Object.assign({},feature,{color:historicalColor(feature,feature.kingdom,'commandery')});
    });
    var result=renderWu.call(WuCommanderies,map,opts);
    scheduleLabelLayout();
    return result;
  };
  Commanderies.render=function(map,data,opts){
    WuCommanderies.hide();
    var colored=(data||[]).map(function(feature){
      return Object.assign({},feature,{color:historicalColor(feature,feature.kingdom,'commandery')});
    });
    var result=renderGeneral.call(Commanderies,map,colored,opts);
    scheduleLabelLayout();
    return result;
  };
})();
</script>

<script>
(function(){
  function factionsFor(periodId){
    var def=PROVINCE_PERIODS[periodId]||{};
    var map=def.provinces||{};
    var ids=Array.from(new Set(Object.values(map)));
    var audited=(window.POLITICAL_SNAPSHOT_AUDIT||{})[periodId]||{};
    Object.values(audited.commanderyFactions||{}).forEach(function(id){if(ids.indexOf(id)===-1)ids.push(id);});
    (audited.annotations||[]).forEach(function(item){if(ids.indexOf(item.faction)===-1)ids.push(item.faction);});
    (audited.expected||[]).forEach(function(id){if(ids.indexOf(id)===-1)ids.push(id);});
    var order=['han','huangjin','dongzhuo','liguo','hanfu','yuan_shao','kongzhou','liudai','zhangmiao','qiaomao','baoxin','wangkuang','zhangchao','yuanyi','lianjun','lubu','caocao','liubiao','liuzhang','liubei','sunquan','gongsunzan','gongsundu','liangzhou','hansui','mateng','shikie','wei','shu','wu','jin','hantuo','shile','sunce'];
    return order.filter(function(id){return ids.indexOf(id)!==-1&&FACTIONS[id];}).map(function(id){return FACTIONS[id];});
  }
  Panel.periodView=function(p){
    var periodLabel=p.range?('公元 '+p.range+' 年'):((p.year||'')+' 年');
    var events=(p.events||[]).map(function(e){
      return '<li><span class="ev-year">'+e.year+'</span><span class="ev-text"><span class="ev-era">'+(e.era||'')+'</span><span class="ev-emperor">'+(e.emperor?' · '+e.emperor:'')+'</span><span class="ev-desc">'+e.text+'</span></span></li>';
    }).join('');
    var reigns=(p.reigns||[]).map(function(r){
      return '<div class="reign-row"><span class="reign-era">'+r.era+'</span><span class="reign-emp">'+r.emperor+'</span><span class="reign-yr">'+(r.years||'')+'</span></div>';
    }).join('');
    var rosterGroups={};
    (p.officialRoster||[]).forEach(function(item){(rosterGroups[item.group]||(rosterGroups[item.group]=[])).push(item);});
    var statusClass={推定:'s-tuiding',存疑:'s-cunyi',待考:'s-daikao'};
    var roster=Object.keys(rosterGroups).map(function(group){
      return '<div class="roster-group"><b>'+group+'</b><div>'+rosterGroups[group].map(function(item){
        var status=item.status||'推定';
        return '<span class="roster-item"><span class="roster-meta">'+(item.period||'')+(item.section?' · '+item.section:'')+'</span><strong>'+item.name+'</strong><small>'+item.office+'</small><em class="roster-status '+(statusClass[status]||'s-tuiding')+'">'+status+'</em></span>';
      }).join('')+'</div></div>';
    }).join('');
    var rosterHtml=roster?'<div class="pv-section"><div class="pv-label">中央与州郡长吏</div><div class="pv-roster">'+roster+'</div><div class="pv-source-note">名录据不可户说《汉少帝、献帝之际中央百官、州郡长吏名录》（知乎）整理；存疑与待考条目保留原表状态，不视为确定实授。</div></div>':'';
    var terr=factionsFor(p.id).map(function(f){
      return '<span class="chip" style="--c:'+f.color+'">'+f.name+'</span>';
    }).join('');
    var confidenceLabels={high:'高',medium:'中',low:'低'};
    var confidence=p.confidence||{};
    var confidenceLevel=confidence.overall||'medium';
    var confidenceHtml='<div class="pv-confidence"><span>史实可信度</span><span class="pv-confidence-badge '+confidenceLevel+'">'+
      (confidenceLabels[confidenceLevel]||'待审')+'</span><span>政权 '+(confidenceLabels[confidence.polity]||'—')+
      ' · 州制 '+(confidenceLabels[confidence.provinceRoster]||'—')+' · 边界 '+(confidenceLabels[confidence.geometry]||'—')+'</span></div>';
    var panel=document.getElementById('info-panel');
    panel.querySelector('.panel-body').innerHTML=
      '<div class="pv-head"><div class="pv-year">'+periodLabel+'</div><h2 class="pv-title">'+p.name+
      '</h2><div class="pv-tag">'+p.tagline+'</div></div>'+confidenceHtml+'<p class="pv-summary">'+p.summary+
      '</p><div class="pv-section"><div class="pv-label">国家与政权</div><div class="pv-chips">'+terr+
      '</div></div><div class="pv-section"><div class="pv-label">年号与皇帝</div><div class="pv-reigns">'+reigns+
      '</div></div>'+rosterHtml+'<div class="pv-section"><div class="pv-label">编年要事</div><ul class="ev-list">'+events+
      '</ul></div><div class="pv-hint">点击地图上的城池、战役或州郡，以观其详。</div>';
    panel.classList.add('is-open');
  };
  document.addEventListener('DOMContentLoaded',function(){
    if(window.innerWidth<=760){
      document.getElementById('sidebox')?.classList.add('is-collapsed');
      document.getElementById('info-panel')?.classList.add('is-collapsed');
    }
  });
})();
</script>
<script src="js/timeline.js"></script>
<script>
(function(){
  Object.keys(FACTIONS).forEach(function(id){FACTIONS[id].__baseName=FACTIONS[id].name;});
  var originalInit=Timeline.init.bind(Timeline);
  Timeline.init=function(periods,onChange){
    return originalInit(periods,function(index,opts){
      var period=periods[index]||{};
      Object.keys(FACTIONS).forEach(function(id){FACTIONS[id].name=FACTIONS[id].__baseName;});
      var politicalSnapshot=(window.POLITICAL_SNAPSHOT_AUDIT||{})[period.id]||{};
      Object.keys(politicalSnapshot.displayNames||{}).forEach(function(id){if(FACTIONS[id])FACTIONS[id].name=politicalSnapshot.displayNames[id];});
      var variant=period.mapVariant;
      if(variant&&window.HISTORY_PROVINCE_VARIANTS[variant]){
        window.__activeMapVariant=variant;
        PROVINCE_PERIODS[period.id]=Object.assign({},PROVINCE_PERIODS[period.id]||PROVINCE_PERIODS.guijin,window.HISTORY_PROVINCE_VARIANTS[variant]);
        var geo=window.__HISTORY_GEO_DATA;
        if(geo&&geo[variant]) window.GEO_WU_COMMANDERIES_263=geo[variant];
      }
      return onChange(index,opts);
    });
  };
  window.HistoryMapTimeline=Timeline;
})();
</script>
